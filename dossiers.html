errace of this monastery was among the most beautiful in the world — you could see Samos, Ikaria, Lipsi, Anatolia, the Arki archipelago, and many other fantastic islands, all in 360 degrees. Now this sacred Orthodox site has been turned into a monastery for monks only. Rather than a UNESCO World Heritage Site, it should be labeled \"the private heritage of the friars.\" I don't understand why we allowed this, stripping away the extraordinary views this building offers. Restricted museum visiting hours and an excessively ecclesiastical atmosphere have turned Patmos into a dying island, with questionable prices and non-existent social life. What a shame! An even greater shame because the museum and library sections are unparalleled.","codes":{"tourist_mode":"tourist_consumer","elevation_mention":1,"topography_quoted_phrase":"view from the terrace of this monastery was among the most beautiful in the world","religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_active_institution":1,"recognizes_heritage_protection":1,"facility_complaints":["area_access","access_hours","prices"],"tone_toward_constraints":"dismissive","worth_assessment":"not_worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'private heritage of the friars' — UNESCO-aware consumer-frustrated","view_centrality":"central"}},"778":{"id":778,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Cappella Sistina nell'Egeo? \n The Sistine Chapel of the Aegean? — A truly magical place, full of mystical atmosphere — even for a committed non-believer like me! I recommend visiting early in the morning when there's no one around (opens 8–1) and you can take it all in at your leisure.","codes":{"religious_register":["mystical"],"religious_self_id":"spiritual_not_religious","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'committed non-believer' — borderline (held to spiritual_not_religious, not atheist)"}},"780":{"id":780,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Exceptional \n Exceptional You can't leave Patmos without seeing the Monastery! \nIt dates from the 12th century and I dedicated to St. John (the cave where he wrote the Apocalypse) is further down the hill.\n\nThere's a museum (€2) that has great relics and amazing artifacts!\n\nParking is available on the road at the entrance of Chora (the town at the top of the hill)","codes":{"ascent_mode":"motorized","elevation_mention":1,"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"782":{"id":782,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Υπέροχη Μονή-Κάστρο \n A Wonderful Monastery-Fortress — You absolutely must visit the incredible fortress-monastery of Saint John the Theologian if you find yourself on Patmos. The climb may be a little tiring, but the view both from inside the monastery and toward the harbor and surrounding area is incredible. It is well worth attending the free guided tour of the monastery, which takes place at regular intervals.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"the climb may be a little tiring, but the view... is incredible","religious_register":["conventional"],"effort_valence":"ambivalent","enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"sensory_modalities":["embodied"],"view_centrality":"mentioned"}},"783":{"id":783,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Ci sono monasteri migliori \n There Are Better Monasteries — The Monastery of Saint John is really small. If you have limited time, I recommend prioritizing a visit to the Cave of the Apocalypse — it is far more evocative. That said, the monastery does offer a beautiful view.","codes":{"religious_register":["conventional"],"worth_assessment":"mixed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"784":{"id":784,"site":"monastery","plat":"tripadvisor","rating":"4","text":"A 'must' experience of Patmos \n A 'must' experience of Patmos Whether charged with religious zeal or not a visit to this monastery and museum are well worth while. The views - stunning & the library collection -outstanding. If you feel like a pilgrim or wish to share their experience, try approaching up the cobbled pedestrian avenue from Skala, camera in hand.","codes":{"visit_season":"peak_may_aug","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"approaching up the cobbled pedestrian avenue from __SKALA__","religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'camera in hand' pilgrim advice = relayed mimetic","view_centrality":"central"}},"785":{"id":785,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A pass to the holy past \n A pass to the holy past You can feel the holiness all around the castle monastery. Just let your spirit to fly over the Aegean Sea, to chase the sun, to touch the hot stones, to get the vibes from historical people and facts.","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["touch_temperature"],"enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"energy_register":1,"view_centrality":"mentioned"}},"786":{"id":786,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Ένα όμορφο κ γραφικό μοναστήρι \n A Beautiful and Picturesque Monastery — A beautiful and picturesque monastery with an incredible view.\nThe only difficulty is the uphill climb!\nAdmission to the museum is €2 per person.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"Only difficulty is the uphill climb!","effort_valence":"negative","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"787":{"id":787,"site":"monastery","plat":"tripadvisor","rating":"5","text":"ΑΞΙΖΕΙ ΝΑ ΠΑΤΕ! \n WORTH A VISIT! — A very beautiful place with an incredible view and a gorgeous building. Unfortunately, the hours when it is open to visitors fall during daytime only. Despite this, a very good experience. Ideal for photos.","codes":{"religious_register":["conventional"],"facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"central"}},"788":{"id":788,"site":"monastery","plat":"tripadvisor","rating":"4","text":"local muito bonito \n A Very Beautiful Place — The Monastery of Saint John is very beautiful and has a spectacular view. A tour guide is recommended to explain the site. On the same outing, we then went to the Cave of the Apocalypse, where, for those who have faith, Saint John wrote the Book of Revelation.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"exposed","review_is_useful":1,"coding_notes":"'for those who have faith' — addressing-the-reader hedge, not first-person disavowal","topography_register":1,"view_centrality":"mentioned"}},"791":{"id":791,"site":"monastery","plat":"tripadvisor","rating":"5","text":"mooi klooster \n Beautiful Monastery — The monastery is located in Chora. It is more than worth a visit, with its relics and its stunning view of Skala and the surrounding area.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"mentioned"}},"792":{"id":792,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Magnifique \n Magnificent — Intensely calm, impressive and sublime! An almost mystical atmosphere, superb icons, and a fervor that goes straight to the heart. There, time stands still... a must-see!!!","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"atmospheric_register":1}},"793":{"id":793,"site":"monastery","plat":"tripadvisor","rating":"4","text":"монастырь Святого Иоанна Богослова \n Monastery of Saint John the Theologian — This typically Greek monastery is visible from any part of the island, located high on a hill above Chora, the island's capital. It is famous for its magnificent frescoes and is fortified with high, thick walls, towers, and ramparts. In the inner courtyard there is a very interesting well with holy water. The surroundings are simply breathtaking and peaceful — a true holy place. Getting there is not difficult: you can walk from the main street of the capital, which takes about 40 minutes, though you will be going uphill — or you can take the bus directly to the monastery.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"located high on a hill above Chora","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"795":{"id":795,"site":"monastery","plat":"tripadvisor","rating":"5","text":"spiritualità \n Spirituality — Patmos is one of the most spiritual of the Greek islands — quiet, relaxing — and it has what is said to be the home of Saint John, where he retreated to write the Book of Revelation!","codes":{"religious_register":["doctrinal","mystical"],"mediation":"relays","sensory_modalities":["sound"],"review_is_useful":1}},"796":{"id":796,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Museum and monastery at one shot \n Museum and monastery at one shot It was a nice place with great views. I liked the architecture and the aura of the place very much. Its a bit dark but very quiet and peaceful. \nMuseum was not great but it was a good experience and they had various artifacts from different places.","codes":{"religious_register":["mystical"],"sensory_modalities":["vision","sound"],"review_is_useful":1,"view_centrality":"mentioned"}},"797":{"id":797,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Exceptional Holy visit \n Exceptional Holy visit Anyone who visit Patmos island MUST visit this Holy place! Patmos is well known for this specific Holy monastery. Serenity and highly respected religious relics. I'm sure you will feel the \"energy\" of this Holy place.","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1,"energy_register":1}},"798":{"id":798,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Interesting \n Interesting You can still feel the atmosphere of the past.  the place is located in hora appx 4 to 5 km up to the hills. You can have a taxi which costs 7 to 9 eur or you can waut for the bus which will be 1.5 eur. A must see in patmos beside beaches.","codes":{"ascent_mode":"motorized","elevation_mention":1,"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"799":{"id":799,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Impresionante monasterio ortodoxo \n Impressive Orthodox Monastery — Erected as an impregnable-looking fortress above the village of Chora. Its interior houses a museum with valuable manuscripts, ancient sacred ornaments, and paintings. Its layout is labyrinthine, centered around two small and beautiful courtyards.","codes":{"elevation_mention":1,"religious_register":["doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","review_is_useful":1,"acknowledges_historical_cultural":1}},"800":{"id":800,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Rimanda ad altri tempi \n It Takes You Back in Time — It has existed since 1088. Hugely popular. Worth the cruise ship stop at Patmos. You relive the entire history from the time of the first fortified monasteries of the early first millennium.","codes":{"trip_mode":"cruise_excursion","visit_season":"peak_may_aug","religious_register":["conventional"],"worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1}},"802":{"id":802,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Fortaleza \n Fortress — When you arrive at the port, it seems like you'll never make it to the top of the fortress, but the effort is worth it. You'll find a beautiful Orthodox church and a museum with unique pieces.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"When you arrive at the port, it seems like you'll never make it to the top","religious_register":["doctrinal"],"effort_valence":"ambivalent","worth_assessment":"worth_it","review_is_useful":1}},"804":{"id":804,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Pretty cool \n Pretty cool Slightly creepy but meat to see the cave where church tradition says John wrote Revelation. Weird that no pictures are allowed but still worth going to see!!","codes":{"religious_register":["doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"frustrated","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"site=monastery but text describes the cave","topography_register":1}},"805":{"id":805,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Step back in time \n Step back in time So glad chose to visit the monastery. One can't help but be in awe of the significance of this holy place surrounded by a quaint village. The museum inside holds priceless artifacts. The entrance cost is minimal - 4 euros. Cats roam the streets. There are a couple cafes and shops within the monastery walls to explore. We took the local bus from the port which costs 3 euros each and caught a taxi back down for 10 euros.","codes":{"ascent_mode":"motorized","religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"nature_mention":1,"nature_sub_codes":["flora_fauna"],"descent_mode":"motorized"}},"807":{"id":807,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Atmospheric \n Atmospheric You should make it your goal to visit this monastery...  It is very informative and calming experience that you'll always remember...","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"808":{"id":808,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Interesting monastery \n Interesting monastery We went here a few times during our stay.  Great views from the top over Scala. Lots of little shops and a good few wee tavernas there. Great lunch spot and dinner at sunset looking out to the windmills and sun setting. Easy to get taxi there and back as they are parked at bottom of monastery  . We enjoyed our meal at sunset and would return again.","codes":{"ascent_mode":"motorized","elevation_mention":1,"town_hill_contrast":1,"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"central","descent_mode":"motorized"}},"812":{"id":812,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Plenty to see in the monastery and museum \n Plenty to see in the monastery and museum Our visit was an excursion from a cruise ship which had several busloads of people converging on the monastery.  But even with the crowd, it was well worth it to see the monastery and spend time in the museum which had excellent exhibits. As a bonus, we arrived late afternoon and the sunset views from the monastery/hilltop were so spectacular. Some uphill walking is required to get there.","codes":{"trip_mode":"cruise_excursion","ascent_mode":"walked","elevation_mention":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"814":{"id":814,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Medieval monastery \n Medieval monastery Back in time, you are feeling yourself like back in a times of Templiers. Amazing building on the top of the hill , where you can see the sea.","codes":{"elevation_mention":1,"religious_register":["conventional"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"817":{"id":817,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μοναδικό! \n Unique! — A unique monastery. Superb location and architecture. Deeply devotional. The abbot and the monks are extremely approachable, sociable, and welcoming. An unforgettable Easter.","codes":{"religious_register":["mystical","conventional"],"recognizes_active_institution":1,"motivation_religious":1,"review_is_useful":1}},"819":{"id":819,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Stunning view \n Stunning view There is something special about this island. Loved the stay there. A trip to the Monastery is well worth it. The view over Patmos is stunning and the museum is a nice place to visit with a interesting Saga.","codes":{"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"820":{"id":820,"site":"monastery","plat":"tripadvisor","rating":"2","text":"Fridfullt \n Peaceful — A peaceful island with few tourists. The island itself is charming and free from tourist vendors. Great for those who want to discover authentic Greece. The Monastery of Saint John is a must-visit when you're on Patmos. Though don't expect any miracles.","codes":{"visit_season":"peak_may_aug","religious_register":["conventional"],"mediation":"doubts","worth_assessment":"worth_it","motivation_authentic_greek":1,"review_is_useful":1,"coding_notes":"'don't expect any miracles' → mediation doubts"}},"821":{"id":821,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Un Monasterio Fortaleza impresionante clásico  de la  época  de las cruzadas \n An Impressive Classic Fortress Monastery from the Crusades Era — We visited on a late summer day... A truly impressive piece of Templar fortress architecture... very well preserved, where the mark of time is not as harsh as in other places. A spectacular view over the small town, its beautiful marina... its harbor and the charm of its bay. It brings back the most wonderful memories and nostalgia, and an overwhelming desire to return... to enjoy Patmos for several days, since in the time we had, so many beautiful things were left undiscovered. HIGHLY RECOMMENDED......!!!!","codes":{"time_pressure":1,"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"central"}},"822":{"id":822,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Excelente experiencia \n Excellent experience It combines history, religion, and a wonderful landscape. I went on a cruise and from there you can take a taxi (more economical than booking the shore excursion on board).","codes":{"trip_mode":"cruise_excursion","ascent_mode":"motorized","religious_register":["conventional"],"motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"mentioned"}},"823":{"id":823,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A visita a gruta onde João Evangelista escreveu o Apocalipse já vale o passeio. \n The visit to the cave where John the Evangelist wrote the Book of Revelation is worth the trip on its own. One of the most beautiful excursions on the island of Patmos....many stairs, but worth it for the scenery, and arriving at the cave where John the Evangelist wrote the Book of Revelation is moving. You can see the mark of his head on the stone where he spent most of his time lying down as he dictated the Book of Revelation to a scribe. John was arrested and taken to Patmos after the death of the Virgin Mary. \nIt's also worth visiting the Chapel of the Holy Cross!","codes":{"elevation_mention":1,"topography_quoted_phrase":"many stairs, but worth it for the scenery","religious_register":["conventional","doctrinal"],"mediation":"endorses","effort_valence":"ambivalent","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"coding_notes":"site=monastery but text covers cave (head-mark) too; multi-site","topography_register":1,"view_centrality":"mentioned","on_site_movement":["stairs_down"]}},"824":{"id":824,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Mystisch... \n Mystical... A stop during a cruise,\na must-see attraction, impressive and informative, steeped in history and a destination for many pilgrims.\nBreathtaking view over the island and the sea, very crowded,","codes":{"trip_mode":"cruise_excursion","religious_register":["mystical","conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["crowding"],"motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"mentioned"}},"825":{"id":825,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Molto bello \n Very beautiful A gorgeous monastery on a hill overlooking the island. Enchanting in the hours before sunset, with a priceless view.","codes":{"elevation_mention":1,"topography_quoted_phrase":"on a hill overlooking the island","enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"central"}},"830":{"id":830,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Church service and patmos island \n Church service and patmos island I was lucky enough to take part in a church service in September 2015 and it was the most amazing experience of my life. I am greek orthodox so that helps obviously. Some of the rooms kept private from the masses were very special to see with my own eyes. During that particular service we arrived at 7am in the morning and were greeted by 4 monks hitting a very long plank of wood that was used to denote the start of the liturgy and to summons people to prayer (I snapped a picture). A beautiful practice to experience.","codes":{"religious_register":["conventional"],"religious_self_id":"orthodox","sensory_modalities":["sound"],"recognizes_active_institution":1,"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"devotional_participation":1}},"831":{"id":831,"site":"monastery","plat":"tripadvisor","rating":"2","text":"Disappointed \n Disappointed Religious through n through Were is the Christian element its very hidden I feel this place is nice over the top & has a great view Go to the Cave 100 times better Not worth it in our opinion","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","doctrinal"],"worth_assessment":"not_worth_it","enclosure_exposure":"exposed","tone_toward_constraints":"dismissive","review_is_useful":1,"coding_notes":"wants more visible Christian element; institutional-aware religious-frame disappointment","view_centrality":"mentioned"}},"832":{"id":832,"site":"monastery","plat":"tripadvisor","rating":"3","text":"丘の上の世界遺産 \n A World Heritage Site on a Hill I stopped by since our cruise made a port call here. It's located on a hill above the town of Chora. Walking up would be tough, so I think taking a taxi is the practical choice. Hmm, to be honest, if you're not a Christian, I felt like you don't really need to make a special trip to Patmos just to visit this monastery (since the only other sight on the island is the cave where Saint John lived).","codes":{"trip_mode":"cruise_excursion","ascent_mode":"motorized","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"on a hill above the town of Chora","religious_register":["doctrinal"],"effort_valence":"negative","worth_assessment":"mixed","recognizes_heritage_protection":1,"motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'if you're not a Christian' addresses reader, not 1st-person disavowal; held unspecified per v1.1","acknowledges_historical_cultural":1,"topography_register":1}},"833":{"id":833,"site":"monastery","plat":"tripadvisor","rating":"5","text":"If you go to Patmos you can't miss this! \n If you go to Patmos you can't miss this! A beautiful place even if you are not into history and/ or religion. The view alone, makes this place worth while. We took a taxi from the port taxi rank - takes around 5-10 minutes to drive up - then walked up a short narrow street to the monastery. Not extremely steep and quite short, but definitely not a stroll - would be a big struggle if you have mobility problems. \n\nNice little shops around, also a cafe with an amazing view. \n\nIn terms of the monastery, it takes around 1 hour to look around. There are outside spaces and also the inside museum part. All very fascinating. A working monastery, closed in the afternoon. Check opening times before you go.","codes":{"ascent_mode":"mixed","elevation_mention":1,"topography_quoted_phrase":"walked up a short narrow street to the monastery","religious_register":["conventional"],"effort_valence":"ambivalent","worth_assessment":"worth_it","enclosure_exposure":"exposed","recognizes_active_institution":1,"review_is_useful":1,"topography_register":1,"view_centrality":"central","on_site_movement":["walking_around"]}},"835":{"id":835,"site":"monastery","plat":"tripadvisor","rating":"5","text":"So worth it for the spiritually inclined. \n So worth it for the spiritually inclined. It's been more than a few years since I've been to the Monastery of St. John but looking back it's definitely been one of the most memorable experiences on the islands. \n\nBesides delicious food and heartfelt people...and the water of course....when traveling to Greece you must visit the churches. There are so many you can't help but continually stumble into one. But this...you can absolutely feel the weight of the place. It demands respect and awareness, you can't help but feel otherwise while here. \n\nI would definitely make the trip again.","codes":{"religious_register":["mystical","conventional"],"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"atmospheric_register":1}},"836":{"id":836,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μοναδική εμπειρία \n Unique experience At the Monastery of the Apocalypse, the visitor closes their eyes and travels back to the years of Christ's earthly life. The atmosphere is deeply devotional; here, faith rediscovers its meaning in the words of John.","codes":{"religious_register":["mystical","conventional","doctrinal"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"imaginative time-travel framed via 3rd-person 'the visitor'; held relayed (not enacted) under v1.1 1st-person discipline","atmospheric_register":1}},"837":{"id":837,"site":"monastery","plat":"tripadvisor","rating":"4","text":"とても趣のある修道院 \n A Very Charming Monastery This would be the Monastery of Saint John the Theologian. Since it sits on a hill overlooking the town of Patmos, you walk up a steep slope from the parking lot to get there. The interior is cozy — when a tour group arrives it fills up quickly, and you have to wait in line to enter. You can see paintings (frescoes, etc.) depicting Saint John in various places; every one shows him with a long, slender face, and I thought to myself that he must have really looked like that. We toured the main chapel, the former storeroom, the museum, and more. From an open terrace-like area you can see a beautiful bell. In the courtyard, a monastery cat was taking a rest.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"walk up a steep slope from the parking lot","religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"both","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"nature_mention":1,"nature_sub_codes":["flora_fauna"],"topography_register":1,"on_site_movement":["walking_around"]}},"840":{"id":840,"site":"monastery","plat":"tripadvisor","rating":"5","text":"présence divine... \n divine presence... A very beautiful place that inspires transcendence... a shame indeed that you can't access the library and the refectory... the whole place nonetheless offers enough to satisfy one's need for quiet contemplation!","codes":{"religious_register":["mystical"],"facility_complaints":["area_access"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"atmospheric_register":1}},"844":{"id":844,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Worth the Visit \n Worth the Visit The monastery is dedicated to Apostle John who wrote the Book of Revelation. \nThere's a church and a museum. It's located in the town of Chora (Hora) which is very picturesque and worth spending a least a few hours to roam around its narrow cobble stoned streets.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"on_site_movement":["walking_around"]}},"845":{"id":845,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Late season visit \n Late season visit Understand that this attractioncan be very busy in the summer, but could soak in the atmosphere on a visit in mid-October with only one other couple there at the same time.\nImpressive collection of ancient manuscripts and othe ecclesiastical treasures on display, and a few chapels possible to see, highly decorated with frescos of variable age. The building dominates the old town with a castle-like structure, but is interesting and quirky architecturally on the inside. Think they could have had more information on the monastic life that continues inside, but a must visit when in Patmos.","codes":{"religious_register":["conventional"],"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"building dominates the old town with a castle-like structure","sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_active_institution":1,"worth_assessment":"worth_it","facility_complaints":["signage"],"tone_toward_constraints":"frustrated","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"846":{"id":846,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Truly an unforgettable experience \n Truly an unforgettable experience This is one of those very special places where your mind needs to capture all the images set before you since no photography is allowed in the chapel. The chapel could only hold about a dozen and a half people and was a very intimate space but just as majestic as the Vatican. I will always remember the details of the carvings; the dark ceilings stained by centuries of incense and the paintings depicting scenes from the Bible. It was definitely a high point of our trip to the Aegean and the island of Patmos","codes":{"religious_register":["conventional","doctrinal"],"sensory_modalities":["vision","smell"],"enclosure_exposure":"enclosed","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1}},"848":{"id":848,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Excelente visita \n Excellent visit We arrived in Patmos on a cruise ship and took the tour offered by the ship, since the time was very tight.\nA very beautiful monastery and meaningful for Christians like me, \nGorgeous frescoes, the visit is short and there are many tourists.\nThere are a lot of steps going up and down.","codes":{"trip_mode":"cruise_excursion","religious_register":["conventional"],"religious_self_id":"christian_general","elevation_mention":1,"time_pressure":1,"sensory_modalities":["vision"],"facility_complaints":["crowding"],"tone_toward_constraints":"accepting","motivation_religious":1,"motivation_cruise_thing_to_see":1,"review_is_useful":1,"on_site_movement":["stairs_down","stairs_up"]}},"849":{"id":849,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Monastery is a go but Cave is for super-devout only \n Monastery is a go but Cave is for super-devout only We rented a car at the place suggested by the cruise ship.\nKeep your eyes open because it's easy to miss the turn toward the \nmonastery.  Parking can be a challenge.\n\nWe made the Trek to the Cave but I have to say it was a mistake...\nmaybe half a mile down steps (and remember, you have to come back up!)\n\nFrom the Monastery we went onto a pleasant lunch in Grikos.","codes":{"trip_mode":"cruise_excursion","ascent_mode":"motorized","elevation_mention":1,"topography_quoted_phrase":"half a mile down steps... you have to come back up","effort_valence":"negative","worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"monastery worth_it; cave 'Trek was a mistake' (super-devout only) — borderline for spiritual_not_religious self-ID but no first-person disavowal","topography_register":1,"descent_mode":"motorized"}},"852":{"id":852,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Increíbles frescos! \n Incredible frescoes! We arrived on a cruise ship and walked up to it. The monastery is incredible — they gave us skirts because we were wearing shorts, and we went in. The place is incredible, the frescoes you can appreciate are divine. I loved visiting it.","codes":{"trip_mode":"cruise_excursion","ascent_mode":"walked","elevation_mention":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"facility_complaints":["dress_code"],"tone_toward_constraints":"accepting","motivation_cruise_thing_to_see":1,"review_is_useful":1}},"853":{"id":853,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Magníficas vistas... \n Magnificent views... There isn't much to see in Patmos and these are probably the best views on the island.\n\nA taxi from the port charges around €40 to take you to see the Monastery and the Cave of the Apocalypse — a bit pricey, but it's the only option available and they're very clear about that; you can't bargain.\n\nThe museum has some interesting pieces, though I have to admit it's really for lovers of antiquities.","codes":{"ascent_mode":"motorized","enclosure_exposure":"exposed","austerity_register":"negative","facility_complaints":["prices"],"tone_toward_constraints":"frustrated","review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"central","descent_mode":"motorized"}},"855":{"id":855,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Een geweldig mooi klooster dat hoog boven het havenstadje Skala ligt \n A wonderfully beautiful monastery that sits high above the harbor town of Skala The location of the monastery is stunning — it lies in the old capital of Chora on Patmos, offering a magnificent view of the harbor town of Skala.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"sits high above the harbor town of Skala","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"856":{"id":856,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Incontournable à Patmos \n A must-see in Patmos Of course, a visit to Patmos cannot be complete without touring the monastery that dominates the island. Nevertheless, we were a little disappointed by the fact that we couldn't see either the refectory or the library. Granted, the church and the museum are worth a visit, but we would have liked to see a little more. Also, there are no descriptions in French.","codes":{"religious_register":["conventional"],"elevation_mention":1,"topography_quoted_phrase":"monastery that dominates the island","worth_assessment":"worth_it","facility_complaints":["area_access","signage"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"857":{"id":857,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Na parte mais alta da cidade \n In the highest part of town The monastery is an intricate complex of rooms at the top of a mountain. It's worth it for the symbolism it holds for Western religions. At the front, you get a beautiful view of the town of Chora.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"an intricate complex of rooms at the top of a mountain","religious_register":["doctrinal"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"858":{"id":858,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Bonito, mas de difícil acesso \n Beautiful, but hard to reach Beautiful architecture. There are several rooms with art and a library, but the walk to the place is worth it more for the view you get from above the port of Skala. Admission is 4 euros. A taxi to the place is 30 euros, round trip.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"the view you get from above the port of Skala","effort_valence":"ambivalent","worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"859":{"id":859,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Vale pela vista da cidade \n Worth it for the view of the town The excursion is worth it for the view from up top; the monastery doesn't have that much to see (admission is 4 euros)","codes":{"elevation_mention":1,"topography_quoted_phrase":"the view from up top","enclosure_exposure":"exposed","austerity_register":"negative","worth_assessment":"mixed","review_is_useful":1,"view_centrality":"central"}},"860":{"id":860,"site":"monastery","plat":"tripadvisor","rating":"4","text":"bello \n Beautiful Too bad we couldn't see all of it. Anyway I recommend it, especially for anyone who goes during the day — you simply can't not go in, even just to light a candle.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","facility_complaints":["area_access"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'even just to light a candle' addresses reader, not 1st-person devotional contact"}},"861":{"id":861,"site":"monastery","plat":"tripadvisor","rating":"4","text":"The crown of the jewel. \n The crown of the jewel. Monastery of Saint John the Divine, sits on the hilltop above Skala harbor in the town called Chora(Khora) as a crown on the beautiful island of Patmos. It is a Greek Orthodox monastery founded in 1088, and is a \"must\" if you are on the island. It is listed on UNESCO`s World Heritage list and has a spectacular collection of icons and costly items. It is supposed to have a pact of defense with Katharina the Great of Russia. The monastery has, among its relics, the skull of Saint Thomas the Apostle, something I personally find strange, since he probably died in southern parts of India. But a visit is of great interest for people looking for more than just a leisure holliday.","codes":{"religious_register":["conventional","doctrinal"],"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"sits on the hilltop above Skala harbor","mediation":"doubts","sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_heritage_protection":1,"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"doubts skull-of-Saint-Thomas relic ('I personally find strange'); 'crown of the jewel' framing","acknowledges_historical_cultural":1,"topography_register":1}},"862":{"id":862,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Hilltop views over Patmos. \n Hilltop views over Patmos. Arrived at Patmos from a cruise ship tender to the island and what a lovely setting the surrounding countryside has with coastal seashore and crystal clear waters and high hills upon which the monastery of St. John stands overlooking the town. We decided to try the local bus up to the monastery and this allowed us enough time to wander through the backstreet shops and parts of the town to get a feel for the place. Now if you try and get a bus in Greece then you will be aware that you don't tend to queue  and rather push your way on and once the bus is full you go even ahead of schedule.\nThe cost per person is around 2 euros one way and takes about 25 minutes or so to drop you adjacent to the monastery / village around it and be sure to find out when the buses return. A steep climb is required through winding streets with cafes and little shops to reach the monastery but there is a reasonable amount of shade to be had from the buildings, although the streets are uneven underfoot. The monastery is well preserved and looked after and is free to visit but certain areas are not allowing photography at all. The views from both the monastery and certain viewpoints are stunning and a little cafe/restaurant we went to for a thirst quenching beer on our exit had as nice a panorama from  it's terrace as you are likely to encounter. Worth a visit then and don't forget some walked up to the monastery from the town but in 32c we took the bus.","codes":{"trip_mode":"cruise_excursion","ascent_mode":"mixed","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"high hills upon which the monastery of __SAINT_JOHN__ stands overlooking the town","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","nature_mention":1,"nature_sub_codes":["natural_beauty_praise","seascape"],"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","weather_complaints":["heat"],"motivation_cruise_thing_to_see":1,"review_is_useful":1,"topography_register":1,"view_centrality":"central","descent_mode":"motorized","on_site_movement":["walking_around"]}},"863":{"id":863,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Worth a visit \n Worth a visit Part of a cruise package and is a must for all visitors to Patmos.Excellent views and a good ambience in the village.","codes":{"trip_mode":"cruise_excursion","worth_assessment":"worth_it","enclosure_exposure":"exposed","motivation_cruise_thing_to_see":1,"review_is_useful":1,"view_centrality":"mentioned"}},"864":{"id":864,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Impressive fortress \n Impressive fortress The Monastery is a huge complex but only a small portion is open for viewing.   No photos inside the church.  You can only enter one of the 10 chapels.  Many of the frescos are in poor shape but they are still a beautiful sight.   Mostly, it is wandering through the open courtyards and admiring the architecture and the views of the island. There is a gift store.  There is an entrance fee of a couple Euros.  Dress appropriately or borrow the clothing from the hangers.  You can take a taxi to Chora or a tour package.You have to walk from the dropoff point to the MOnastery which includes many steps.  You wander through the town of Chora to get to the Monastery and there are numerous shops/restaurants along the way. We walked from the town of Skala some of which was on the road and some on a cobbled path.  The path takes you also to the cave of the apocalypse.","codes":{"ascent_mode":"walked","elevation_mention":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["area_access","photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"865":{"id":865,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Hermosa fortaleza con linda vista \n Beautiful fortress with a lovely view You can visit the monastery after the Cave of the Apocalypse — it's an enormous fortress and you can take lovely photos, there are gorgeous views, you can tour the Byzantine church, there are important frescoes from different periods and beautiful mosaics.","codes":{"religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"866":{"id":866,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Suggestivo \n Evocative If you come to Patmos, you simply have to see the Monastery. I recommend spending some time inside the church in silence and looking carefully at the walls...you can feel the sanctity. Very moving.  \nAlso visit the museum — very well-kept. Beautiful books. \nDon't miss a lovely stroll inside Chora","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","sensory_modalities":["sound"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"silence + 'feel the sanctity. Very moving' — quotable mystical","atmospheric_register":1,"on_site_movement":["posture_pause","walking_around"]}},"867":{"id":867,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Great feeling!! \n Great feeling!! We dont have words to describe this wonderful atmosphere this monastery has. Its unbelievable, we will definitely go back!","codes":{"religious_register":["mystical"],"review_is_useful":1}},"869":{"id":869,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Interesante \n Interesting Even though we don't follow any religious creed, we respect those of others. Visiting an Orthodox church, which tends to be small, dark, and richly storied, is quite an experience.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","religious_self_id":"spiritual_not_religious","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'we don't follow any religious creed' first-person disavowal; 'small, dark, richly storied'"}},"870":{"id":870,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Da visitare, ....ma l'ortodossia non é applicata all'abbigliamento! \n Worth visiting, ....but Orthodoxy is not applied to the dress code! If you've made it to Patmos, the Monastery is a must-visit! The church with its frescoes is interesting (they could use some restoration): I recommend not rushing through it, but coming with at least a little background knowledge. If you understand English, ask the guard at the entrance to give you some explanation; he was very kind to us and in the end even took a few souvenir photos of us at the portal. The museum is interesting for its kind. Various exterior views worth photographing. Photography is not permitted inside, especially in the museum.\nCritique: despite the relentless heat, we showed up properly \"covered up\", in strict observance of the sign posted at the entrance, only to discover that the dress code was being applied in a rather \"flexible\" way. Apparently times are changing even for the Orthodox... Plan accordingly (obviously don't come in swimwear!).","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","facility_complaints":["dress_code","photography_restrictions"],"weather_complaints":["heat"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"dress_code complaint inverted — they followed it but others did not","view_centrality":"mentioned"}},"871":{"id":871,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Patmos, mooi eiland \n Patmos, beautiful island If you're into culture, it's ideal. Without the guidance of a guide, you still come to learn quite a lot about Orthodox history. While you're there, you should also visit the holy cave. Definitely worth it.","codes":{"religious_register":["conventional","doctrinal"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"872":{"id":872,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Yes another Must! \n Yes another Must! See and feel where St John wrote the book of Revelations. This island itself offers beautiful views, but the monastery is a must. \nThis is a hefty hike and can not be done by everyone. If you have bad knees or feet you can make the hike it will just take you some time.","codes":{"elevation_mention":1,"topography_quoted_phrase":"hefty hike and can not be done by everyone","religious_register":["conventional","doctrinal"],"mediation":"endorses","effort_valence":"negative","worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"quotable_for_chapter":1,"view_centrality":"mentioned"}},"874":{"id":874,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Great views \n Great views We cycled from town to the monastery and we were unprepared for the steep climb to the top. After recovering we enjoyed the spectacular views towards the coast and then the nice roll back to the town. Worth a visit if you are in Patmos","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"steep climb to the top","effort_valence":"negative","worth_assessment":"worth_it","sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","review_is_useful":1,"coding_notes":"cycled — non-motorized, non-walked; ascent_mode unspecified","topography_register":1,"view_centrality":"central","descent_mode":"motorized"}},"875":{"id":875,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Η Ιερουσαλήμ του Αιγαίου χωρίς ... θρησκευτικότητα. \n The Jerusalem of the Aegean without ... religiosity. Impressive with superb murals. The ecclesiastical museum is interesting. The Cave of the Apocalypse inspires awe. There is no strong presence of priests and monks, something I had expected.","codes":{"religious_register":["conventional","doctrinal","mystical"],"sensory_modalities":["vision"],"review_is_useful":1,"coding_notes":"'no strong presence of priests/monks' — observed absence, not active institution","topography_register":1}},"876":{"id":876,"site":"monastery","plat":"tripadvisor","rating":"4","text":"vista mozzafiato \n breathtaking view fortress monastery, with a panoramic view of the entire island and the nearby islands as well, worth the trip,","codes":{"elevation_mention":1,"topography_quoted_phrase":"panoramic view of the entire island","sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"topography_register":1,"view_centrality":"central"}},"877":{"id":877,"site":"monastery","plat":"tripadvisor","rating":"5","text":"absolute orthodox religion!!!!! \n absolute orthodox religion!!!!! It is the place where, according to the orthodox religion, God inspired St. John to write the Apocalypse...No words can tell...","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"relays","review_is_useful":1}},"878":{"id":878,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Nice place to visit \n Nice place to visit Impressive from the outside but not a lot to see once inside. A few nice photos to take and if you are religious the few areas of the monastery devoted to religion are ok","codes":{"religious_register":["conventional"],"tourist_mode":"tourist_consumer","worth_assessment":"mixed","review_is_useful":1,"coding_notes":"'if you are religious' addresses reader — not self-ID"}},"879":{"id":879,"site":"monastery","plat":"tripadvisor","rating":"3","text":"great to look at \n great to look at impressive to look at from outside but once inside although theres some good historical bits theres not too much to do. was a bit disappointed by the inside. still is a must see. as a working monastery you can understand why only few bits are open","codes":{"religious_register":["conventional"],"tourist_mode":"tourist_consumer","worth_assessment":"mixed","recognizes_active_institution":1,"facility_complaints":["area_access"],"tone_toward_constraints":"accepting","review_is_useful":1}},"881":{"id":881,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Top of the town \n Top of the town We took the bus up from the town and wandered up through the Chora until we reached the Monastery. On arrival a few people were sitting waiting and we discovered it didn't reopen until 1600hrs. Do check times if you are planning a visit. We are not particularly religious but we could appreciate the wonderful history of the monastery and the ornate chapel with the icons and artefacts. We also wandered through the museum which added to the sense of history.\nWorth a visit and combine with a walk through the old streets and lanes of the Chora.","codes":{"ascent_mode":"mixed","elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"religious_self_id":"spiritual_not_religious","facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'We are not particularly religious' first-person disavowal","acknowledges_historical_cultural":1,"on_site_movement":["walking_around"]}},"885":{"id":885,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Καλοκαίρι 2015 \n Summer 2015. I was disappointed — for purely spiritual reasons. I was probably expecting to see something that would fill me with awe.","codes":{"religious_register":["mystical"],"worth_assessment":"not_worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'disappointed for purely spiritual reasons' — clean spiritual disappointment"}},"886":{"id":886,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Nice one \n Nice one We went to this place on our cruise tour to greece and turkey.Cabs are available from base to cave and here combined.You have to claimd difficult steps before reaching here.May be tiring for people.Great views from top.Museum also has lot of collections","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","elevation_mention":1,"topography_quoted_phrase":"difficult steps before reaching here","effort_valence":"negative","sensory_modalities":["vision"],"enclosure_exposure":"exposed","motivation_cruise_thing_to_see":1,"review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"motorized"}},"887":{"id":887,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Impressive \n Impressive The monastery is a must see in Patmos. It is a holy place for Greeks that visit it all year around. Even if you are not very religious or Christian it is still interesting. While chatting with a shopkeeper (outside of the monastery) I was informed that many people from other religions are also visiting the place. The view from the monastery is breathtaking. Apart from the momastery itself, i found the museum very interesting. Try to go early in the morning to avoid the crowds and heat.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","facility_complaints":["crowding"],"weather_complaints":["heat"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'even if you are not religious' addresses reader, not self-ID","view_centrality":"mentioned"}},"888":{"id":888,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Merita una visita \n Worth a visit. It is definitely worth visiting this monastery, which from below looks more like a fortress. Very well preserved — walking within its walls, you breathe an air of peace and serenity.\nI recommend visiting it in the morning right when it opens, to avoid the heat of the midday sun, but above all to enjoy the tranquility before too many people arrive.\nThe museum is interesting.\nOn the same road from Skala to Chora you can also find the Cave of the Apocalypse.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"from below looks more like a fortress","religious_register":["mystical"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"weather_complaints":["heat"],"tone_toward_constraints":"accepting","review_is_useful":1,"atmospheric_register":1,"topography_register":1,"on_site_movement":["walking_around"]}},"889":{"id":889,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Mistik \n Mystical. You feel like you are in a completely different world. Tall and majestic. The clergy converse with you. There is a museum inside. Very old handwritten books. The bell towers in particular are quite lovely. When entering, they give you long robes and you pay a fee.","codes":{"elevation_mention":1,"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'clergy converse with you' — active institution"}},"890":{"id":890,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Ιερος χωρος!!! \n Sacred place!!! A beautiful monastery, it offers tranquility and a magnificent view!! It has set hours, and it would be good to go in the morning so the heat doesn't get to you!!","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","weather_complaints":["heat"],"review_is_useful":1,"atmospheric_register":1,"view_centrality":"mentioned"}},"891":{"id":891,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Emozione ⛪️ \n Emotion ⛪️ After visiting the cave of Saint John we moved on to the Monastery...another visit that deserves an hour of your time! Inside these great walls of the monastery, unimaginable wonders are preserved! Everything is jealously kept in an exemplary, if not unique, way — it is difficult to describe in words what the eyes and the soul can see!","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"review_is_useful":1,"topography_register":1}},"892":{"id":892,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Stunning Monastery and views \n Stunning Monastery and views I have been going to this Monastery since July 2014. Well worth visiting. A, \"Do not miss \" if you're in Patmos. The ticket is only 4 Euros, this includes visit to Museum. Please respect proper attire when visiting and no photographs only in the courtyard or the roof, the Greeks are very touchy about this and quiet right. Apart from the flashes damaging ancient art work, it's a holy place in fact, Patmos, once an island of exile is now a Holy Island. Lovely little shops to buy souvenirs, lots of interesting things to look at. Don't miss the wooden tub where the Monks made bread! \nOne good piece of advice: stay well clear of the place on Tuesday, Thursday, Saturday. Cruise liner ships come in at 4pm with tourists from all over the world to be taken see the Cave of the Revelations and Monastery. You won't see much it gets very crowded and if you light a candle when you're not looking a monk will put it off. Mornings are best for both places. Dedicate each some time as they are unique!!","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","recognizes_active_institution":1,"facility_complaints":["crowding","photography_restrictions","dress_code"],"tone_toward_constraints":"accepting","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"monk-extinguishes-candle anecdote; cruise-crowding observation; 'island of exile is now a Holy Island'","acknowledges_historical_cultural":1,"topography_register":1}},"895":{"id":895,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Monastero/fortezza miracolosamente conservato \n Monastery/fortress miraculously preserved. A visit to the monastery/fortress in the Chora of Patmos is a must, especially to admire the impressive exterior and interior architecture and the church with its icons and frescoes; the museum is quite interesting.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"897":{"id":897,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Αρχιτεκτονικο θαύμα ! \n Architectural marvel! I was awestruck by this monastery-castle — a must-visit, not only for pilgrimage but also for studying the site.","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"898":{"id":898,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Another beautiful church with great views, but -- \n Another beautiful church with great views, but -- I visited mainly for the supposed historical significance and the beauty of the art and architecture, not  the association with St. John the Evangelist.  Unfortunately, our guide was rabid on the subject.  This site and St. John's cave will be most interesting to those who think of the visit as a pilgrimage.  On the up side, there are some decent shops on the climb up hill.","codes":{"elevation_mention":1,"religious_register":["doctrinal"],"mediation":"hedges","tourist_mode":"tourist_consumer","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'supposed historical significance' + 'guide was rabid' — distancing-from-religion tourist frame","motivation_historical_cultural":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"899":{"id":899,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Calme et beauté maîtrisée \n Calm and masterful beauty. To be discovered in the morning light... a wonderful place to take the time to feel the presence of a spiritual world always in the making...","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"review_is_useful":1,"atmospheric_register":1}},"900":{"id":900,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A ne pas manquer ! \n Not to be missed! The tranquility of the place is disturbed by the influx of tourists, but it's a place not to be missed: very beautiful frescoes, and a museum with remarkable pieces. Make sure to check the opening hours.","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"atmospheric_register":1}},"902":{"id":902,"site":"monastery","plat":"tripadvisor","rating":"2","text":"Ακρως εμπορικο \n Extremely commercial. After climbing to the Chora and entering the castle, you pass through the gate of the monastery. Tourism at its finest. The guards are extremely rude. Women are not allowed to enter the church unless they are wearing a jacket and their shoulders are covered.\nPhotography inside the church is prohibited, even without a flash. The museum has noteworthy exhibits. The painting by Domenikos Theotokopoulos (El Greco) stands out.","codes":{"ascent_mode":"walked","elevation_mention":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"tourist_mode":"tourist_consumer","worth_assessment":"not_worth_it","facility_complaints":["amenities","dress_code","photography_restrictions","commerce"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Tourism at its finest' (sarcastic) + 'extremely rude guards' — clear consumer/dismissive","topography_register":1}},"903":{"id":903,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Monastery in a quaint town \n Monastery in a quaint town I could see the monastery when our ferry was approaching the island. Make sure to obtain a map of the island even though it's not that big. The monastery is in the Hora area of the island and at the top of the hill. As you ascend the stairs that leads to the entrace, someone will take your picture which you may purchase for 4 euros after yours visit. A 4.00 euro entry fee will let you into the monastery with a museum. The inside of the church is quite ornate and filled with wall murals of religious figures and scenes. To me, it is all very gaudy. The museum is full of religious icons, gospels, some marble fragments, etc. It's worth a visit, as it's a UNESCO site. If you don't have the proper attire, there are shawls available to cover up. Parking is a bit tight, so may be go there in early morning. Check opening hours as they may be closed in some afternoons. Plenty of restaurants and souvenirs close by.","codes":{"trip_mode":"day_trip_ferry","elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","recognizes_heritage_protection":1,"review_is_useful":1,"coding_notes":"'all very gaudy' — anti-austerity but no austerity vocab to code","acknowledges_historical_cultural":1,"topography_register":1}},"907":{"id":907,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Une visite à ne pas manquer \n A visit not to be missed. Great beauty of the place and the objects found there. A place for quiet reflection. A breathtaking view.","codes":{"religious_register":["mystical"],"sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","review_is_useful":1,"atmospheric_register":1,"view_centrality":"mentioned"}},"912":{"id":912,"site":"monastery","plat":"tripadvisor","rating":"5","text":"El Monasterio domina toda la ciudad de Skala. Es necesario algún transporte para llegar a él. Vale la pena. \n The monastery dominates the entire city of Skala. Some form of transportation is needed to get there. It's worth it. A monumental Byzantine construction of enormous dimensions. The fortress is very impressive and visiting it is a constant pleasure. It has magnificent views and inside there is a library-museum worth visiting. Walking through the streets of this beautiful city, somewhat spoiled by tourism with its many shops of all kinds, is very pleasant as it takes us back to the heart of Greece.\nAs with any visit to the Greek islands, you have to take it slow and enjoy each spot, view, small restaurant, or café.","codes":{"ascent_mode":"motorized","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"monastery dominates the entire city of Skala","religious_register":["doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","motivation_authentic_greek":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'takes us back to the heart of Greece' authentic-Greek motivation","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"914":{"id":914,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Wonderful building on the top of the Chora \n Wonderful building on the top of the Chora Wonderful old monastery with treasures not only in icons and religious objects but also in old books. Apart from the churches the museum is a must to see. And the views are amazing! In the right side of the main church is the Chapel of Virgin Mary. Look for the icon on the temple \"%*& THE LADY OF THE ANGELS %*&\". And enjoy the architecture and frescoes of the monastery. For Greek people the entrance is free, the museum has an entrance ticket of EUR2.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"916":{"id":916,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Η έδρα της ορθοδοξιας \n The seat of Orthodoxy. A place of Orthodox Christian worship and where its spread throughout the country — and beyond — began. Saint John the Theologian, the third in \"hierarchy\" after Christ and the Virgin Mary, fills you with absolute admiration and chills when you consider his work and everything he did in his life!","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'third in hierarchy after Christ and the Virgin Mary' Orthodox-internal theological framing; chills (embodied)"}},"917":{"id":917,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Etkileyici \n Impressive. Although it may not be significant to us Turks, it is truly an impressive monastery worth seeing. The views are particularly beautiful — you can see all sides of the island and even the surrounding islands. Ideal for taking photos.","codes":{"elevation_mention":1,"topography_quoted_phrase":"all sides of the island","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'us Turks' = national-not-religious framing; held to unspecified self-ID","view_centrality":"central"}},"918":{"id":918,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Mosteiro dedicado a São João, autor do Apocalipse. \n Monastery dedicated to Saint John, author of the Book of Revelation. The monastery is dedicated to Saint John the Evangelist, author of the Book of Revelation. The building is very beautiful and sits atop a hill from which you have a wonderful view of part of the island of Patmos. Inside there is a church and a museum, but a guide is needed for visitors to understand a little about the place.","codes":{"elevation_mention":1,"topography_quoted_phrase":"sits atop a hill","religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"920":{"id":920,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Incredible! You must see it to believe it! \n Incredible! You must see it to believe it! I always wonder how they built these huge churches and monasteries so many years ago, and this one is amazing! Check the times before traveling up to the monastery, since the hours change, but this is a must-see on this beautiful island!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"921":{"id":921,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Un Monastero ricco di simbologie \n A monastery rich in symbolism. This magnificent monastery, built in honor of Saint John the Theologian, dominates the entire island of Patmos from above. I recommend reaching it by the public bus that departs on a set schedule from the port of Skala, as the road is long and particularly steep. If you love art, I suggest visiting with the monastery's guide, as the interior is particularly dark and many details could be missed; moreover, the frescoes that completely cover the walls require detailed explanations for the many symbols they conceal.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"dominates the entire island of Patmos from above","religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"review_is_useful":1,"topography_register":1}},"922":{"id":922,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Da vedere \n Worth seeing. The complex is beautiful — the church with its frescoes and all its details, the cloister, the museum, and the panoramic view — only 4 euros to enter. I recommend it.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"mentioned"}},"923":{"id":923,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Non potete lasciare Patmos senza far visita al monastero \n You cannot leave Patmos without visiting the monastery. The museum inside the monastery is remarkable, and not visiting it is truly a missed opportunity. Furthermore, from the monastery you can enjoy an enchanting view of the island and its surroundings. It is definitely worth it.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"mentioned"}},"924":{"id":924,"site":"monastery","plat":"tripadvisor","rating":"5","text":"magnifico \n Magnificent. If you are in Patmos, you cannot not go. A beautiful example of an ancient fortified Orthodox monastery. In addition to the beautiful interior structure, sacred paintings, and an interesting museum.","codes":{"religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"925":{"id":925,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Even if you don't like monasteries . . . \n Even if you don't like monasteries . . . This one is worth the trip.  Wonderful location with fabulous views.  Still a working monastery.  Historical rooms in the museum, plus a nice collection of treasures.  It is a steep walk, with a few nice shops on the road up.  Worth the climb, but go early in the day to avoid the heat.","codes":{"ascent_mode":"walked","elevation_mention":1,"religious_register":["conventional"],"effort_valence":"positive","worth_assessment":"worth_it","recognizes_active_institution":1,"weather_complaints":["heat"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"926":{"id":926,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Best Monastery ever \n Best Monastery ever The view is unbelievable.  You really feel the how sacred this place is once you are there. I can't really describe that this island has something to do with God even if you don't believe in christianity!  Everyone must visit the monastery in their life!","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1,"atmospheric_register":1,"view_centrality":"central"}},"927":{"id":927,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Mäktigt \n Magnificent! The monastery sits on a hilltop and it is truly magnificent to enter through the walls and then see Skala below with ferries coming and going.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"sits on a hilltop","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"929":{"id":929,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Cave of John \n Cave of John Anyone who is a Bible Scholar or wants to have a tangible experience with the Beloved Disciple, you can't pass up this experience","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"relayed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"title 'Cave of John' on monastery row; site/text mismatch"}},"931":{"id":931,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Historia \n History! Impressive building. Very beautiful historic jewelry, icons, and old manuscripts. An incredibly lovely tranquility and a fantastic view over Patmos.","codes":{"religious_register":["conventional","doctrinal","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"932":{"id":932,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Auf den Spuren des heiligen Johannes - abolutes \"Gänsehaut-Feeling\" - das muss man erlebt haben! \n Following in the footsteps of Saint John — an absolute goosebump-inducing experience — you simply have to experience it! We took the hydrofoil from Kos Island over to Patmos. The crossing was a bit rough, but the impressions of the island were absolutely magnificent.","codes":{"trip_mode":"day_trip_ferry","religious_register":["conventional","mystical"],"mimetic":1,"mimetic_engagement":"relayed","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'goosebump-inducing... following in footsteps'; hydrofoil from Kos"}},"933":{"id":933,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Εμβληματικό και μοναδικό χριστιανικό μνημείο \n An iconic and unique Christian monument. There is no way you can visit Patmos without climbing up to the Monastery. Beyond its location at the highest point within the castle's fortifications, the visit to the museum is worthwhile, even though not all collections are accessible to the general public...\nYou can certainly notice the commercialization of the monument with the icons, etc., but the matter of religiosity is personal, so if someone visits during Easter they will be able to feel the solemnity of the monastery.","codes":{"ascent_mode":"walked","tourist_mode":"institutional_aware","elevation_mention":1,"topography_quoted_phrase":"climbing up to the Monastery","religious_register":["conventional","doctrinal"],"worth_assessment":"worth_it","recognizes_active_institution":1,"facility_complaints":["area_access","commerce"],"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"934":{"id":934,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Leuk om bezocht te hebben. van daaruit een heel mooi uitzicht \n Nice to have visited. From there, a very beautiful view. Nice to have visited and to hear the stories from the guide. A beautiful spot for taking photos with a view over the island. You can also walk up via the \"donkey path.\" Quite a climb though!","codes":{"elevation_mention":1,"religious_register":["conventional"],"effort_valence":"negative","review_is_useful":1,"view_centrality":"central"}},"935":{"id":935,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Patrimonio dell'umanità \n World Heritage Site. One of the most important monasteries of Orthodoxy. Placed under the jurisdiction of the Ecumenical Patriarchate. Pay attention to your clothing — you must be covered. Great charm both in the complex itself, the magnificent church, and the museum with its priceless treasures of icons and goldwork. Recommended to visit right when it opens, at eight, when it is still semi-deserted and not crowded with tourists. On the way down toward Skala, it is worth stopping at the Cave of the Apocalypse. UNESCO World Heritage Site.","codes":{"religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","recognizes_active_institution":1,"recognizes_heritage_protection":1,"facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"936":{"id":936,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Worth a visit... \n Worth a visit... You cannot miss this monastery high on the hill overlooking Skala. It still has monks there but it is interesting having a look around and particularly going into the sm
