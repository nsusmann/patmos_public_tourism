re_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"2578":{"id":2578,"site":"cave","plat":"gmaps","rating":"5","text":"An exciting experience for every Christian to be in the God-Walking Cave of the Apocalypse!","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'God-Walking Cave of the Apocalypse' — striking phrase","topography_register":1}},"2582":{"id":2582,"site":"cave","plat":"gmaps","rating":"5","text":"If possible speak to tour guide before going to make sure there is no mass, otherwise you will have to wait outside","codes":{"religious_register":["conventional"],"facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1}},"2583":{"id":2583,"site":"cave","plat":"gmaps","rating":"5","text":"The Apostle St. John was exiled to Patmos Island, where he wrote the last book of the New Testament, the Book of Revelation, in the Revelation Cave on the mountainside. The original Greek title means \"to open the lid,\" and its Latin translation is Apokalypsis. The lighting inside was poor, so the photos are not clear. Remember to come and experience this truly memorable place in person.","codes":{"elevation_mention":1,"topography_quoted_phrase":"cave on the mountainside","religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"etymological framing: 'to open the lid' / Apokalypsis + cave-on-mountainside","acknowledges_historical_cultural":1,"topography_register":1}},"2586":{"id":2586,"site":"cave","plat":"gmaps","rating":"5","text":"A sacred place for our Orthodoxy.","codes":{"religious_register":["conventional","doctrinal"],"religious_self_id":"orthodox","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'for our Orthodoxy' — first-person plural Orthodox self-ID (cf. 461, 1067)"}},"2589":{"id":2589,"site":"cave","plat":"gmaps","rating":"5","text":"Due to mass being held it was a very quick glimpse around grotto, very atmospheric","codes":{"tourist_mode":"institutional_aware","time_pressure":1,"religious_register":["conventional","mystical"],"enclosure_exposure":"enclosed","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"mass-being-held + 'very quick glimpse' + atmospheric","topography_register":1}},"2592":{"id":2592,"site":"cave","plat":"gmaps","rating":"5","text":"A sacred place that must be visited by anyone on the island","codes":{"religious_register":["conventional"],"review_is_useful":1}},"2595":{"id":2595,"site":"cave","plat":"gmaps","rating":"5","text":"Impressive sacred/holy cave which over the centuries became enclosed in the church of St Anna. 6 euro admission fee. Arrived early to avoid crowds, however a morning service was in progress, which was a bonus to witness and attend","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"morning service in progress; 6 euro fee","devotional_participation":1,"acknowledges_historical_cultural":1,"topography_register":1}},"2600":{"id":2600,"site":"monastery","plat":"gmaps","rating":"5","text":"What can I say, there are no words, you have to go to understand...it's an amazing experience...perfect museum and church inside the castle","codes":{"religious_register":["conventional"],"review_is_useful":1,"topography_register":1}},"2607":{"id":2607,"site":"monastery","plat":"gmaps","rating":"5","text":"Pure magic every day and nighttime","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2618":{"id":2618,"site":"monastery","plat":"gmaps","rating":"5","text":"Amazing view","codes":{"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"2619":{"id":2619,"site":"monastery","plat":"gmaps","rating":"5","text":"Magnificent citadel that encloses a monastery. Everything inside is breathtaking and the view of Skala Bay is breathtaking. It is simply forbidden to take photos in the church and the monastery. A must-see. Entrance fee: 2 euros.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","elevation_mention":1,"town_hill_contrast":1,"review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"2643":{"id":2643,"site":"cave","plat":"gmaps","rating":"5","text":"The Holiest spot in Greece. It is said that St John while exiled on the island heard God speaking to him and he then wrote the Book of the Apocalypse. The monks here do a great job explaining the cave's rich history to all the faithful visitors. The Cave was added to the UNESCO World Heritage List in 1999.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","recognizes_active_institution":1,"recognizes_heritage_protection":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Holiest spot in Greece'; 'It is said'; UNESCO 1999","acknowledges_historical_cultural":1,"topography_register":1}},"2646":{"id":2646,"site":"cave","plat":"gmaps","rating":"5","text":"Holy place. The Holy Places of Greece. A very good pilgrimage but it must be done with great reverence. The only minus I found, after 30 years of coming, is the overtourism and especially with foreign tourists, most of whom do not understand the sacredness of the place and the monastery.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"30-year pilgrim laments overtourism; foreign tourists 'do not understand the sacredness'"}},"2657":{"id":2657,"site":"monastery","plat":"gmaps","rating":"5","text":"It's definitely worth a visit. Combined with the village of Hora and the Cave of the Apocalypse, it makes the half-day visit a good dose of mysticism...if you can avoid the throngs of tourists, of course.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'good dose of mysticism' + 'throngs of tourists'"}},"2666":{"id":2666,"site":"monastery","plat":"gmaps","rating":"5","text":"A beautiful monastery, traditional, so fortified that it looks like a castle. There are many old manuscripts and amongst its relics you can see the skull of Saint Thomas the Apostle. Creepy and it makes you cringe. But all in all an absolute must see.","codes":{"religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"review_is_useful":1,"coding_notes":"skull of Saint Thomas — 'creepy and makes you cringe'","acknowledges_historical_cultural":1,"topography_register":1}},"2672":{"id":2672,"site":"monastery","plat":"gmaps","rating":"5","text":"Great tour that's gives insight on some of Saint John's activities and places of being. Plenty to see and experience. I would recommend.","codes":{"religious_register":["doctrinal"],"mediation":"relays","review_is_useful":1,"coding_notes":"tour relays Saint John's activities"}},"2674":{"id":2674,"site":"monastery","plat":"gmaps","rating":"5","text":"Spectacular, located at the top of Hora with views of the entire island. It's the jewel of Patmos.\nEasy bus connections from Skala","codes":{"ascent_mode":"motorized","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"located at the top of Hora with views of the entire island","review_is_useful":1,"view_centrality":"mentioned"}},"2689":{"id":2689,"site":"monastery","plat":"gmaps","rating":"5","text":"Magnificent monastery at the top of the island... the view is 360' and dominates everything... there is a very interesting museum inside... I recommend it...\nOpen in the mornings...","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","elevation_mention":1,"topography_quoted_phrase":"view is 360 and dominates everything","review_is_useful":1,"view_centrality":"central"}},"2694":{"id":2694,"site":"monastery","plat":"gmaps","rating":"5","text":"Important from a religious rather than a historical point of view","codes":{"religious_register":["conventional"],"review_is_useful":1}},"2699":{"id":2699,"site":"cave","plat":"gmaps","rating":"5","text":"Clean space, quiet and peaceful, paintings with all the historical and religious references and information and a guided tour of the cave by a priest. Quite far from the monastery (about 2.5 km, downhill), we took a taxi.","codes":{"ascent_mode":"motorized","religious_register":["conventional"],"mediation":"relays","sensory_modalities":["vision","sound"],"enclosure_exposure":"enclosed","elevation_mention":1,"topography_quoted_phrase":"Quite far from the monastery (about 2.5 km, downhill)","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"guided tour by priest; 'quiet and peaceful'; taxi","acknowledges_historical_cultural":1,"topography_register":1}},"2701":{"id":2701,"site":"cave","plat":"gmaps","rating":"3","text":"Free. Please note that ticket sales are actually a donation to the church.","codes":{"religious_register":["conventional"],"review_is_useful":1,"coding_notes":"free entry; ticket sales = donation to church"}},"2702":{"id":2702,"site":"cave","plat":"gmaps","rating":"5","text":"At the supreme Greek theovadist point, where the Lord dictated the Revelation to his servant John, the main emotion is awe and humility!!!!","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","elevation_mention":1,"topography_quoted_phrase":"supreme Greek theovadist point","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'supreme... point' = elevation; awe+humility=mystical/embodied"}},"2708":{"id":2708,"site":"cave","plat":"gmaps","rating":"4","text":"A cave around which the monastery was built. The unique rock formation that forms the cave's ceiling has something mystical about it, a must-see for both the faithful and the general public... the visit lasts 15 minutes.","codes":{"religious_register":["conventional","mystical"],"enclosure_exposure":"enclosed","sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'unique rock formation that forms the cave's ceiling' = specific vision","topography_register":1}},"2718":{"id":2718,"site":"monastery","plat":"gmaps","rating":"5","text":"A very special visit, overwhelming. It was a blessing to be able to see this monastery.","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["embodied"],"review_is_useful":1}},"2731":{"id":2731,"site":"monastery","plat":"gmaps","rating":"5","text":"Truly religious feeling\nAnytime visit to the museum with important exhibits","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2735":{"id":2735,"site":"monastery","plat":"gmaps","rating":"5","text":"Stunning view, very pleasant place and a must-see when in Mykonos","codes":{"enclosure_exposure":"exposed","sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"reviewer mislabels Patmos as Mykonos","view_centrality":"central"}},"2743":{"id":2743,"site":"cave","plat":"gmaps","rating":"5","text":"Sacred, you feel the veneration of the place","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"2745":{"id":2745,"site":"cave","plat":"gmaps","rating":"5","text":"This place is worth visiting not only for its religious significance but also for its natural beauty,","codes":{"religious_register":["conventional"],"nature_mention":1,"nature_sub_codes":["natural_beauty_praise"],"worth_assessment":"worth_it","review_is_useful":1}},"2750":{"id":2750,"site":"cave","plat":"gmaps","rating":"5","text":"Inspirational! Those who read the book of Revelation in the Bible may not leave the cave quickly. Inspirational! Those who read the book of Revelation in the Bible may not leave the cave quickly.","codes":{"religious_register":["doctrinal"],"enclosure_exposure":"enclosed","review_is_useful":1,"topography_register":1}},"2754":{"id":2754,"site":"cave","plat":"gmaps","rating":"5","text":"Very important and interesting religious site.","codes":{"religious_register":["conventional"],"review_is_useful":0}},"2755":{"id":2755,"site":"cave","plat":"gmaps","rating":"5","text":"Simply........respect.....Another feeling.....humility for the greatness of the soul.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2765":{"id":2765,"site":"monastery","plat":"gmaps","rating":"4","text":"The monastery is located on a hilltop, and accessing it requires considerable effort and is not easy if you have difficulty walking. The site is not very large, but it holds great religious significance; it's a must-see on this island! Photography is prohibited inside the church, and respect is requested. Just outside, there are souvenir shops and cafes; a Greek coffee is highly recommended!","codes":{"elevation_mention":1,"topography_quoted_phrase":"located on a hilltop, accessing it requires considerable effort","religious_register":["conventional"],"effort_valence":"negative","worth_assessment":"worth_it","tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1,"on_site_movement":["accessibility_concern"]}},"2768":{"id":2768,"site":"monastery","plat":"gmaps","rating":"5","text":"The only monastery of Patmos built in the 11th century.\nBeautiful, standing proudly on the top of the hill.\nWith a long history, a symbol of Christianity.\nWith a magnificent view of the Aegean.","codes":{"religious_register":["conventional","doctrinal"],"elevation_mention":1,"topography_quoted_phrase":"standing proudly on the top of the hill","enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"2774":{"id":2774,"site":"monastery","plat":"gmaps","rating":"5","text":"Wonderful blessed atmosphere!!! ⛪","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"2780":{"id":2780,"site":"cave","plat":"gmaps","rating":"5","text":"The awe that grips you when you enter cannot be described in words. A destination that every believer must visit!","codes":{"religious_register":["conventional","mystical"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1}},"2782":{"id":2782,"site":"cave","plat":"gmaps","rating":"5","text":"The sensations of the past are still present.\nWonderful.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2785":{"id":2785,"site":"cave","plat":"gmaps","rating":"5","text":"Very beautiful.  Very holy.","codes":{"religious_register":["conventional"],"review_is_useful":0}},"2786":{"id":2786,"site":"cave","plat":"gmaps","rating":"5","text":"a must if you are on Patmos:the cave where St. John saw the vision of the Apocalypse and wrote the Book of the Apocalypse.. Really spiritual place, peaceful. Walked up there from Skala, the port, feels like a pilgrimage. t","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"Walked up there from Skala, the port","religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"walking up from Skala 'feels like a pilgrimage' = enacted mimetic","topography_register":1}},"2790":{"id":2790,"site":"cave","plat":"gmaps","rating":"4","text":"Historical site where the Apostle John supposedly received the revelation from Jesus Christ","codes":{"religious_register":["doctrinal"],"mediation":"hedges","review_is_useful":1,"coding_notes":"'supposedly received the revelation' = hedges","acknowledges_historical_cultural":1}},"2793":{"id":2793,"site":"cave","plat":"gmaps","rating":"5","text":"Beautiful and devout","codes":{"religious_register":["conventional"],"review_is_useful":0}},"2794":{"id":2794,"site":"cave","plat":"gmaps","rating":"5","text":"You can feel something special such as very calm, divine and apocalyptic environment.  Before going there , please check the closing time for each day. You can see port side as well from the window of the bulidning connected with the cave","codes":{"religious_register":["mystical","doctrinal"],"sensory_modalities":["vision"],"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"see port side as well from the window","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"2795":{"id":2795,"site":"cave","plat":"gmaps","rating":"5","text":"John the Apostle, who went into exile by Roman Emperor Domition and lived in this cave for 2 years, was haunted by disturbing revelations: Angel Michael slayed dragons and he was haunted by more disturbing revelations about future events.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"2801":{"id":2801,"site":"monastery","plat":"gmaps","rating":"5","text":"An incredibly beautiful monastery with a wonderful view of Patmos from above. The cave of the revelation is terrible and the icon of the Virgin Mary is miraculous. Help to all Christians.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","elevation_mention":1,"enclosure_exposure":"exposed","sensory_modalities":["vision"],"review_is_useful":1,"coding_notes":"'icon of the Virgin Mary is miraculous' endorses; 'view from above'","topography_register":1,"view_centrality":"mentioned"}},"2810":{"id":2810,"site":"monastery","plat":"gmaps","rating":"5","text":"Beautiful island and holy place.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"2833":{"id":2833,"site":"monastery","plat":"gmaps","rating":"5","text":"Incredible aura, wonderful monastery","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2835":{"id":2835,"site":"monastery","plat":"gmaps","rating":"5","text":"It is worth going and seeing the cave of the revelation that you will encounter just before reaching Agios Ioannis, but also walking through the narrow streets of the town. It goes without saying that the monastery is beautiful. Beautiful colors, peace and unlimited views of the island.","codes":{"religious_register":["doctrinal","mystical"],"mediation":"relays","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"2840":{"id":2840,"site":"cave","plat":"gmaps","rating":"5","text":"The Cave of the Apocalypse is one of the main reasons for coming to Patmos. The bus going from Skala to Chora stops at the Cave 1.80 euro). On foot, it's only a 15 minute walk from Skala on a rocky path. On a Tuesday morning in April there were only 3-4 people attending mass at the Cave. Just a fraction of the complex composed of 3-4 chapels is currently open to the public: the cave itself, and the adjacent chapel of Ste Anne. The entrance is free. The views toward Skala are beautiful.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"15 minute walk from Skala on a rocky path","religious_register":["conventional"],"visit_season":"shoulder_apr_sep_oct","sensory_modalities":["vision"],"facility_complaints":["area_access"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"2842":{"id":2842,"site":"cave","plat":"gmaps","rating":"5","text":"Mystical place where John wrote the Book of Revelation, you can feel a great, beautiful energy.","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","review_is_useful":1,"acknowledges_historical_cultural":1,"energy_register":1}},"2845":{"id":2845,"site":"cave","plat":"gmaps","rating":"5","text":"An incredible place, good for reflection, contemplation, and prayer. I highly recommend it.","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"2846":{"id":2846,"site":"cave","plat":"gmaps","rating":"5","text":"Interesting to see the cave where John the Evangelist is said to have spent his exile time on Patmos. They must have been tough in those days! The monastery has provided easy access for most people these days.","codes":{"religious_register":["doctrinal"],"mediation":"relays","effort_valence":"positive","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"2851":{"id":2851,"site":"cave","plat":"gmaps","rating":"5","text":"Cruise excursion very informative!","codes":{"trip_mode":"cruise_excursion","motivation_cruise_thing_to_see":1,"review_is_useful":1}},"2852":{"id":2852,"site":"cave","plat":"gmaps","rating":"5","text":"A very beautiful cave. There is a strong sense of good feeling. I felt inspired. Friendly staff.","codes":{"religious_register":["mystical"],"enclosure_exposure":"enclosed","review_is_useful":1,"topography_register":1}},"2856":{"id":2856,"site":"monastery","plat":"gmaps","rating":"5","text":"Devotional environment, peace and tranquility, even though it was crowded. The view was incredible, magical like in every Greek monastery. Wonderful!!!!","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"view_centrality":"mentioned"}},"2863":{"id":2863,"site":"monastery","plat":"gmaps","rating":"5","text":"Magical, devout, with a view that takes your breath away...","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"2874":{"id":2874,"site":"monastery","plat":"gmaps","rating":"5","text":"We are on the enchanting island of Patmos. By renting a scooter, you can visit the Monastery where the Apocalypse was written during the day, enjoying a breathtaking view. It became a UNESCO World Heritage Site in 1999. You can see the most beautiful sunsets, and in the evening, the nearby bars, with their lights and music, dress up to create a magical and romantic atmosphere. It is said that many marriage proposals are made here... I haven't even found Prince Charming, but I want to believe it.","codes":{"ascent_mode":"motorized","religious_register":["doctrinal"],"mediation":"endorses","sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","nature_mention":1,"nature_sub_codes":["natural_beauty_praise"],"recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"central"}},"2876":{"id":2876,"site":"monastery","plat":"gmaps","rating":"5","text":"Extremely peaceful place","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2877":{"id":2877,"site":"monastery","plat":"gmaps","rating":"5","text":"Wonderful view","codes":{"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"2898":{"id":2898,"site":"cave","plat":"gmaps","rating":"5","text":"A very holy place where St. John wrote the book of revelations. 3€ entry, which is fair. Small but very spiritual! A must see.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","enclosure_exposure":"enclosed","review_is_useful":1,"acknowledges_historical_cultural":1}},"2905":{"id":2905,"site":"cave","plat":"gmaps","rating":"4","text":"On the hillside is the \"Revelation Cave\". In 95 AD, St. John, who was exiled to the island, received divine revelation in this cave and wrote the Book of Revelation. Later, this place was registered as a World Heritage Site, and thus became an increasingly popular tourist destination!","codes":{"elevation_mention":1,"topography_quoted_phrase":"On the hillside is the Revelation Cave","religious_register":["doctrinal"],"mediation":"endorses","recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"2908":{"id":2908,"site":"cave","plat":"gmaps","rating":"5","text":"I went there in winter, and I was truly alone, and I enjoyed the visit very peacefully. It's a must-see for us Christians.","codes":{"religious_register":["conventional"],"religious_self_id":"christian_general","worth_assessment":"worth_it","visit_season":"off_peak_nov_mar","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'must-see for us Christians' - first-person plural Christian self-ID"}},"2924":{"id":2924,"site":"monastery","plat":"gmaps","rating":"5","text":"A magnificent monastery, unfortunately I was unable to attend the Divine Liturgy.","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"2935":{"id":2935,"site":"monastery","plat":"gmaps","rating":"5","text":"Spiritual site.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2937":{"id":2937,"site":"monastery","plat":"gmaps","rating":"5","text":"Words are too few to describe the devotion you feel in this place. Tip: Bring a bottle with you to put holy water.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1,"devotional_participation":1}},"2944":{"id":2944,"site":"monastery","plat":"gmaps","rating":"4","text":"Theological place of interest with history and great view all over island of Patmos","codes":{"elevation_mention":1,"topography_quoted_phrase":"great view all over island of Patmos","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"central"}},"2948":{"id":2948,"site":"monastery","plat":"gmaps","rating":"5","text":"Awe and peace!!!","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2966":{"id":2966,"site":"monastery","plat":"gmaps","rating":"5","text":"No. 1 pilgrimage for the Orthodox! The museum is excellent!","codes":{"religious_register":["conventional"],"review_is_useful":1,"coding_notes":"'No.1 pilgrimage for the Orthodox' addresses-third-party, no first-person self-ID"}},"2975":{"id":2975,"site":"monastery","plat":"gmaps","rating":"5","text":"A beautiful monastery, a must-see when in Patmos. It's still a place of worship for the faithful, but tourists are equally enchanted. The museum (included in the price of the admission ticket) is truly fascinating and interesting.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1}},"2982":{"id":2982,"site":"cave","plat":"gmaps","rating":"3","text":"It was cool but I was hoping for\nmore on John: how he lived, how he got there, how he left. The different theories on who wrote Revelations. How was this place discovered. You left Patmos with no more understanding than when you arrived.  Patmos on the other hand was fantastic. What a treasure.","codes":{"tourist_mode":"tourist_consumer","religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"mixed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'left Patmos with no more understanding'; wanted history of John, theories of authorship","motivation_historical_cultural":1,"acknowledges_historical_cultural":1}},"2983":{"id":2983,"site":"cave","plat":"gmaps","rating":"5","text":"Thank God. The place is really worth visiting if you can. A great place of worship","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1}},"2986":{"id":2986,"site":"cave","plat":"gmaps","rating":"3","text":"The Cave of the Apocalypse (%*& Holy Cave of the Apocalypse %*&) is a cave located halfway up the mountain between the villages of Skala (%*& Skala %*&) and Chora (%*& Chora %*&). For religious purposes, the cave was converted into a church dedicated to St. Anne (%*& Saint Anne %*&) in the 17th century.\nAccording to legend, it was here that St. John, under God's dictation, wrote the Book of Revelation and perhaps his Gospel.\nThis site, along with the Monastery of St. John the Theologian, was added to the UNESCO World Heritage List in 1999.\nAs far as I'm concerned, you can visit it by walking down from the monastery, as it's on the way, but if I had to go there specifically, I'd probably skip it.","codes":{"elevation_mention":1,"topography_quoted_phrase":"halfway up the mountain between the villages","religious_register":["conventional","doctrinal"],"mediation":"hedges","worth_assessment":"mixed","recognizes_heritage_protection":1,"review_is_useful":1,"coding_notes":"'according to legend' hedges; encyclopedic tone","acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"walked"}},"2991":{"id":2991,"site":"cave","plat":"gmaps","rating":"5","text":"Hearing the Cherubikon during the divine liturgy inside the Cave where the Apocalypse was revealed to Saint John the Theologian was an experience out of this world!","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["sound"],"enclosure_exposure":"enclosed","recognizes_active_institution":1,"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Cherubikon during divine liturgy inside Cave - sound modality","devotional_participation":1,"acknowledges_historical_cultural":1,"topography_register":1}},"2992":{"id":2992,"site":"cave","plat":"gmaps","rating":"5","text":"Particularly intense SACRED spiritual space\nthat exudes SACRED energy (positive).\nIdeal for prayer and inner reflection.\nYou come close to GOD.","codes":{"religious_register":["conventional","mystical"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"capitalized SACRED energy + 'come close to GOD'","energy_register":1}},"2995":{"id":2995,"site":"cave","plat":"gmaps","rating":"2","text":"Honestly I enjoyed only a beautiful view from the garden, I payed 3 pounds for 1 minutes, I was just curious as my friend said \"everybody come here to see that place! You should go!\"  I Don't think I would trust him anymore .","codes":{"tourist_mode":"tourist_consumer","worth_assessment":"not_worth_it","enclosure_exposure":"exposed","facility_complaints":["prices"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'3 pounds for 1 minutes'; trust friend no more","view_centrality":"central"}},"3023":{"id":3023,"site":"monastery","plat":"gmaps","rating":"5","text":"What an island to discover. A place worth visiting, to combine your vacation and your faith at the same time","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'combine your vacation and your faith' - addresses-reader, no first-person self-ID"}},"3025":{"id":3025,"site":"monastery","plat":"gmaps","rating":"5","text":"The Monastery of Saint John the Theologian, or Agios Ioannis Monastery, as it is named by the locals, is one of the most beautiful and unique monasteries in the Dodecanese islands of Greece.\n\nThe monastery, that is located on the top of a hill in the center of the town of Patmos - Chora, is protected all around, by an impressive wall\nthat gives the feeling of a Byzantine castle that dominates the whole island.\n\nIt was founded in 1088 and in 1999 it was declared a \"World Heritage Site\" by UNESCO.\nThe roots of the name of the monastery are found in another holy site, the \"Cave of The Revelation\" (or the Holy Cave of the Apocalypse), located 700 m north of the monastery.\nThis cave was the shelter of the beloved disciple of Jesus, John, in 95 AD and there he wrote the Book of Revelation (the New Testament) and the Apocalypse.\nBottom line - a must see site for everyone who visits this magical island!!!","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"located on the top of a hill in the center of the town","religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_heritage_protection":1,"review_is_useful":1,"coding_notes":"encyclopedic descriptive review; UNESCO 1999","acknowledges_historical_cultural":1,"topography_register":1}},"3026":{"id":3026,"site":"monastery","plat":"gmaps","rating":"5","text":"The mystery and sacredness of the place captivates you... The view captivates you... It remains indelible in my memory forever... Just like Patmos with its kind and hospitable people!!!","codes":{"religious_register":["conventional","mystical"],"enclosure_exposure":"exposed","review_is_useful":1,"coding_notes":"'mystery and sacredness... captivates'","view_centrality":"central"}},"3032":{"id":3032,"site":"monastery","plat":"gmaps","rating":"5","text":"Nice view!","codes":{"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"3033":{"id":3033,"site":"monastery","plat":"gmaps","rating":"4","text":"Amazing views, nice old church, but the staff at the entrance of the museum, not so friendly... hence -1 star","codes":{"elevation_mention":1,"enclosure_exposure":"exposed","tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"staff-friendliness gripe (-1 star); not in facility_complaints enum","acknowledges_historical_cultural":1,"view_centrality":"central"}},"3037":{"id":3037,"site":"monastery","plat":"gmaps","rating":"5","text":"Exceptional, \"Jerusalem\" of the Aegean Sea!","codes":{"religious_register":["conventional"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Jerusalem of the Aegean Sea'"}},"3039":{"id":3039,"site":"monastery","plat":"gmaps","rating":"5","text":"Calm your soul first and then your body, a destination you must visit when you come to Patmos","codes":{"religious_register":["mystical"],"review_is_useful":1,"coding_notes":"'calm your soul first and then your body'"}},"3049":{"id":3049,"site":"monastery","plat":"gmaps","rating":"5","text":"A peaceful and welcoming religious place","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"3062":{"id":3062,"site":"monastery","plat":"gmaps","rating":"5","text":"holy place","codes":{"religious_register":["conventional"],"review_is_useful":1}},"3072":{"id":3072,"site":"monastery","plat":"gmaps","rating":"5","text":"What can we say about the revelation of Saint John the Theologian on Patmos? There are no words!!!!","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","review_is_useful":1}},"3075":{"id":3075,"site":"monastery","plat":"gmaps","rating":"4","text":"Beautiful place, on the magnificent island of Patmos.\nIt's a shame that tourists struggle to respect the sacred nature of this place.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'tourists struggle to respect the sacred nature' — reverence-violation framing"}},"3095":{"id":3095,"site":"monastery","plat":"gmaps","rating":"5","text":"One of the most sacred places in Greece....","codes":{"religious_register":["conventional"],"review_is_useful":1}},"3096":{"id":3096,"site":"cave","plat":"gmaps","rating":"5","text":"I came to Patmos specifically to visit this cave. The cave is very clean. An incredible, magical place; it instantly brings you peace. You can see the place where the Apostle John sat while the angel of God visited him, as well as the fracture in the rock pierced by the intensity of God's voice. It's a shame that the Orthodox Popes don't explain to visitors what's going on; they're still available.","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","facility_complaints":["signage"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'I came to Patmos specifically to visit this cave' — non-cruise sought-pilgrimage","topography_register":1}},"3097":{"id":3097,"site":"cave","plat":"gmaps","rating":"5","text":"Outer space!!! Anyone with a passion for religion or mysticism simply must visit this place.\n\nThe cave itself is quite small, but it's still worth it, as it really lets your imagination run wild. An added bonus is the beautiful views from the windows, offering panoramic views of the entire island.\n\nBe careful with the opening hours; it closes quite early.\n\nYou can walk to the site along a trail starting in Skala.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"trail starting in Skala","religious_register":["mystical"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"both","facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"3098":{"id":3098,"site":"cave","plat":"gmaps","rating":"5","text":"Very small orthodox cave church where the Apocalypses was written","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"topography_register":1}},"3099":{"id":3099,"site":"cave","plat":"gmaps","rating":"5","text":"We been a blessing to participate on the Divine Liturgy ;Saturday 10.09-end Sunday 11.09 .2022,","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional"],"motivation_religious":1,"review_is_useful":1,"devotional_participation":1}},"3100":{"id":3100,"site":"cave","plat":"gmaps","rating":"5","text":"Sacred place! Worth visiting!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"3104":{"id":3104,"site":"cave","plat":"gmaps","rating":"5","text":"An iconic place where you can see the cave where St. John had his visions. A UNESCO World Heritage site.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"3108":{"id":3108,"site":"cave","plat":"gmaps","rating":"4","text":"Cave where St. John dictated the Apocalypse. St. John himself writes of having been to Patmos. A place of great mysticism that draws large numbers of faithful during Easter. Tourist information needs to be improved.","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","facility_complaints":["signage"],"tone_toward_constraints":"frustrated","review_is_useful":1,"topography_register":1}},"3109":{"id":3109,"site":"cave","plat":"gmaps","rating":"5","text":"Symbol of Orthodoxy!! Easy access, as long as you choose a day when no groups go.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"3111":{"id":3111,"site":"cave","plat":"gmaps","rating":"5","text":"Fantastic place that inspires you with awe. You see the cave in which John wrote the Apocalypse!!! If you happen to visit Patmos it is a must destination. Quiet place, beautiful view. Also before the entrance there is a stall where many different icons, prayer beads, amulets, crosses, incense and much more are sold!!!","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","sensory_modalities":["sound"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"3112":{"id":3112,"site":"cave","plat":"gmaps","rating":"5","text":"Beautiful, beautiful!  Our tour guide indicated that it's one of the 100 places to see before you leave this earth!  Hollywood movers and shakers are here for a visit.  It is a small and quiet island and not many people bypass Patmos as it's not a party crazy town like Santorini. I personally love this place, great view for pictures and so peaceful. Be sure to visit to apostle John's cave where he wrote the book of Revelation last chapter of the Bible.","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","motivation_authentic_greek":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'not a party crazy town like Santorini' → authentic_greek contrast","topography_register":1,"view_centrality":"mentioned"}},"3114":{"id":3114,"site":"cave","plat":"gmaps","rating":"3","text":"A mythological cave that takes a maximum of 10 minutes to visit. The presentation is given by an Orthodox priest, but only in Greek... not much valued despite the obvious effort.","codes":{"time_pressure":1,"religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","facility_complaints":["signage"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'mythological cave' → hedges; '10 minutes max' → time_pressure; Greek-only narration","topography_register":1}},"3116":{"id":3116,"site":"monastery","plat":"gmaps","rating":"5","text":"Very beautiful. You really feel awe and peace of mind. Also, the modernization is very good, especially the access, now people with mobility problems can more easily go to worship without any difficulty.","codes":{"religious_register":["mystical"],"recognizes_active_institution":1,"review_is_useful":1}},"3139":{"id":3139,"site":"monastery","plat":"gmaps","rating":"5","text":"It is worth visiting for its sacredness and uniqueness!!! Chora is every step a revelation!!!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"3154":{"id":3154,"site":"monastery","plat":"gmaps","rating":"5","text":"A sacred place that you should visit at some point..","codes":{"religious_register":["conventional"],"review_is_useful":1}},"3172":{"id":3172,"site":"monastery","plat":"gmaps","rating":"5","text":"I feel fine and divine.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3173":{"id":3173,"site":"monastery","plat":"gmaps","rating":"5","text":"The holiest place on the island of Patmos along with the sacred cave of the revelation.","codes":{"religious_register":["conventional","doctrinal"],"review_is_useful":1,"topography_register":1}},"3176":{"id":3176,"site":"monastery","plat":"gmaps","rating":"1","text":"You sit outside..at the entrance...& listen to the shopkeeper who sells church items...talking on the phone about the shares of the Stock Exchange !!","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"facility_complaints":["commerce"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"shopkeeper-on-phone-about-Stock-Exchange irony at monastery entrance","on_site_movement":["posture_pause"]}},"3177":{"id":3177,"site":"monastery","plat":"gmaps","rating":"5","text":"A blessed place and a place very much worth visiting","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"3195":{"id":3195,"site":"monastery","plat":"gmaps","rating":"5","text":"A spiritual place not to be missed","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"3203":{"id":3203,"site":"cave","plat":"gmaps","rating":"3","text":"There is no archaeological confirmation that this is the cave where John wrote the Book of Revelation.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'no archaeological confirmation' — single-sentence skeptical hedge","topography_register":1}},"3213":{"id":3213,"site":"cave","plat":"gmaps","rating":"5","text":"Incredible devotion and high-voltage holiness, in one of the most emblematic locations of our religion","codes":{"religious_register":["conventional"],"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'high-voltage holiness'; 'our religion' held to unspecified per v1.1 — no religion named"}},"3217":{"id":3217,"site":"monastery","plat":"gmaps","rating":"5","text":"Mystical place","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3218":{"id":3218,"site":"monastery","plat":"gmaps","rating":"5","text":"There are no words to describe what you feel in this place.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3221":{"id":3221,"site":"monastery","plat":"gmaps","rating":"5","text":"A THEOBADISTO PLACE... EXCEPTIONAL MONASTERY...!!!","codes":{"religious_register":["conventional"],"review_is_useful":1,"coding_notes":"'theobadisto' (trodden-by-God) — Greek monastic epithet"}},"3234":{"id":3234,"site":"monastery","plat":"gmaps","rating":"5","text":"Sacred place","codes":{"religious_register":["conventional"],"review_is_useful":1}},"3238":{"id":3238,"site":"monastery","plat":"gmaps","rating":"5","text":"One of the holiest monasteries in Greece","codes":{"religious_register":["conventional"],"review_is_useful":1}},"3240":{"id":3240,"site":"monastery","plat":"gmaps","rating":"5","text":"A sacred religious site, beautiful, excellent view.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"3247":{"id":3247,"site":"monastery","plat":"gmaps","rating":"5","text":"Very beautiful sacred place","codes":{"religious_register":["conventional"],"review_is_useful":1}},"3252":{"id":3252,"site":"monastery","plat":"gmaps","rating":"5","text":"This is where the book of Revelation was written. Wow.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"site/text-mismatch (Revelation claim on metadata=monastery row)"}},"3258":{"id":3258,"site":"monastery","plat":"gmaps","rating":"5","text":"A sacred pilgrimage site. Worth a visit.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"3269":{"id":3269,"site":"monastery","plat":"gmaps","rating":"4","text":"Very spiritual place,try to feeling One!","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3280":{"id":3280,"site":"monastery","plat":"gmaps","rating":"4","text":"A well-kept old monastery, located high up, so take a bus or taxi. The area has a great view of the island. Nice boutiques and a terrace restaurant along the way. Not recommended for people with bad feet, lots of stairs and uphill climbing.\nEntrance fee 10/2019 €4/person. The fee also includes museum admission. The museum has wonderful insignia, brocade, jewelry and headdresses worn by spiritual leaders. Bible pages written on silk.\nNote: On some days the monastery closes at 1:30 PM, so check the opening hours. On the same days the Cave of Revelation also closes at 1:15 PM.","codes":{"ascent_mode":"motorized","visit_season":"shoulder_apr_sep_oct","elevation_mention":1,"topography_quoted_phrase":"located high up, so take a bus or taxi","religious_register":["conventional"],"effort_valence":"negative","sensory_modalities":["vision"],"enclosure_exposure":"exposed","tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"10/2019 visit; museum description rich-visual (insignia/brocade/Bible-on-silk)","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["accessibility_concern"]}},"3281":{"id":3281,"site":"monastery","plat":"gmaps","rating":"5","text":"A fantastic place of religious worship","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"3293":{"id":3293,"site":"monastery","plat":"gmaps","rating":"5","text":"You feel the sacredness of the space.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"3296":{"id":3296,"site":"cave","plat":"gmaps","rating":"4","text":"A sacred place for believers. Before visiting, find information about this place online. The Church of St. Anne, located above the cave, was closed.","codes":{"religious_register":["conventional"],"facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"St. Anne above the cave was closed","topography_register":1}},"3301":{"id":3301,"site":"cave","plat":"gmaps","rating":"5","text":"Very beautiful experience, it would be nice if there was a monk or layperson who could share the history of the Holy Cave in English so that foreign visitors could understand (unless it happened that day).","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","recognizes_active_institution":1,"facility_complaints":["amenities"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1}},"3303":{"id":3303,"site":"cave","plat":"gmaps","rating":"5","text":"The sacredness of the place touches you from the first moment. Go but with devotion and not as ordinary tourists. Then it will be worth more!","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"worth_assessment":"worth_it","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1}},"3306":{"id":3306,"site":"cave","plat":"gmaps","rating":"5","text":"As for those who do ecclesiastical tourism, you mean that they should visit it. It is also worth visiting, as is the monastery where you find yourself at the top of the castle.","codes":{"elevation_mention":1,"topography_quoted_phrase":"you find yourself at the top of the castle","religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"3309":{"id":3309,"site":"cave","plat":"gmaps","rating":"5","text":"Mysticism that can be felt","codes":{"religious_register":["mystical"],"enclosure_exposure":"enclosed","review_is_useful":1}},"3311":{"id":3311,"site":"cave","plat":"gmaps","rating":"5","text":"The energy of this sacred place exceeds all expectations. I recommend stepping barefoot into the cave. I felt something insurmountable.","codes":{"religious_register":["conventional","mystical"],"enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"barefoot recommended to others, not first-person — devotional_contact not fired","energy_register":1,"topography_register":1}},"3314":{"id":3314,"site":"cave","plat":"gmaps","rating":"5","text":"A spiritually powerful place","codes":{"religious_register":["mystical"],"enclosure_exposure":"enclosed","review_is_useful":1}},"3315":{"id":3315,"site":"cave","plat":"gmaps","rating":"5","text":"Place of Worship and Religious Center of Christianity\nThe Father spoke to us with enthusiasm and explained its Importance","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"mediation":"relays","recognizes_active_institution":1,"review_is_useful":1}},"3325":{"id":3325,"site":"monastery","plat":"gmaps","rating":"5","text":"It was wonderful and peaceful!","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3329":{"id":3329,"site":"monastery","plat":"gmaps","rating":"5","text":"To see once in your life... impressively grandiose (pilgrims come from very far away","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"3336":{"id":3336,"site":"monastery","plat":"gmaps","rating":"5","text":"Let's have his blessing, it was wonderful.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"3348":{"id":3348,"site":"monastery","plat":"gmaps","rating":"5","text":"Blessed place!!","codes":{"religious_register":["conventional"],"review_is_useful":1}},"3358":{"id":3358,"site":"monastery","plat":"gmaps","rating":"5","text":"The Jerusalem of Greece is very sacred.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Jerusalem-of-Greece superlative; joins 1920 'Jerusalem of Mediterranean' cluster"}},"3364":{"id":3364,"site":"monastery","plat":"gmaps","rating":"5","text":"Awe, religiosity and peace of mind....","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"3366":{"id":3366,"site":"monastery","plat":"gmaps","rating":"5","text":"A charming fortress-monastery perched atop Chora, with beautiful Orthodox chapels and delightful internal courtyards. An oasis of spirituality in a city that, especially in the evenings in its center, is otherwise known for its social life.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"fortress-monastery perched atop Chora","religious_register":["conventional"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"oasis-of-spirituality vs city-social-life contrast","topography_register":1}},"3368":{"id":3368,"site":"monastery","plat":"gmaps","rating":"5","text":"beautiful and humbling","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3371":{"id":3371,"site":"monastery","plat":"gmaps","rating":"5","text":"Spiritual, wonderfull and magical place..","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3378":{"id":3378,"site":"cave","plat":"gmaps","rating":"5","text":"The right place for prayer and the elevation of religious sentiment","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","review_is_useful":1}},"3380":{"id":3380,"site":"cave","plat":"gmaps","rating":"5","text":"The place where God revealed John","codes":{"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1}},"3384":{"id":3384,"site":"cave","plat":"gmaps","rating":"5","text":"Love, a life dedicated to spreading the gospel, and persecution by the state—that was the life of the apostle.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"review-as-hagiographic-tribute form; joins 1138/1278/1294/1375/1426/1920 review-as-text cluster"}},"3385":{"id":3385,"site":"cave","plat":"gmaps","rating":"5","text":"Unfortunately, it is built up.","codes":{"austerity_register":"appreciative","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"terse loss-of-austerity complaint; austerity_register implicit"}},"3388":{"id":3388,"site":"cave","plat":"gmaps","rating":"5","text":"Visit the cave St. John spent his exile in dictating the book of revelation. The new approach to enter is much easier than the old set of stairs. It is a spiritually moving place to spend a little time as you visit the islands.","codes":{"elevation_mention":1,"topography_quoted_phrase":"the new approach to enter is much easier than the old set of stairs","religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","effort_valence":"positive","enclosure_exposure":"enclosed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"3390":{"id":3390,"site":"cave","plat":"gmaps","rating":"5","text":"We were lucky enough during our visit to meet the father and take a wonderful tour!!!!\nWe were truly captivated by his words.\nA space carefully and lovingly cared for.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"3392":{"id":3392,"site":"cave","plat":"gmaps","rating":"5","text":"You feel a sense of awe\nSit in the cave alone if you can to feel the true value of the cave","codes":{"religious_register":["mystical"],"enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"alone-in-cave instruction joins solitary-cave cluster","topography_register":1,"on_site_movement":["posture_pause"]}},"3400":{"id":3400,"site":"monastery","plat":"gmaps","rating":"5","text":"Holy place on the hills of Patmos island. We have guided tour by bus from the port, it was faboulous!","codes":{"ascent_mode":"motorized","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"Holy place on the hills of Patmos island","religious_register":["conventional"],"effort_valence":"positive","review_is_useful":1,"topography_register":1}},"3429":{"id":3429,"site":"monastery","plat":"gmaps","rating":"5","text":"The most beautiful view of Patmos.","codes":{"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"3430":{"id":3430,"site":"monastery","plat":"gmaps","rating":"5","text":"The most important monastery in Greece. Definitely worth a visit!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"3458":{"id":3458,"site":"cave","plat":"gmaps","rating":"3","text":"Cave of the Apocalypse. Legend says that the last book of the Bible was written here, and that the apostle John took refuge here for many years. There's a church, and the place is very small and somewhat remote; it's best to go by taxi or some other form of transportation. The prices in the souvenir shop are very expensive, and taking photos in the church is prohibited (I took some photos without knowing; the security guard told me off ). The church there is Orthodox, so you have to be respectful and quiet, and contrary to what it might seem, it's not a very crowded place.","codes":{"ascent_mode":"motorized","tourist_mode":"mixed","religious_register":["conventional","doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","facility_complaints":["commerce","prices","photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"3463":{"id":3463,"site":"cave","plat":"gmaps","rating":"5","text":"They say that if you go to Patmos, it's like you've been to half of the Holy Lands of Jerusalem. God made me worthy to go 13-14 years ago.\nWhat I felt when I saw the split rock was awe and shiver.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"relays","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"topography_register":1}},"3467":{"id":3467,"site":"cave","plat":"gmaps","rating":"5","text":"Superb place, we were even able to attend the liturgy","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1}},"3471":{"id":3471,"site":"cave","plat":"gmaps","rating":"5","text":"The 2nd centre of the world after Jerusalem","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1}},"3473":{"id":3473,"site":"cave","plat":"gmaps","rating":"5","text":"Definitely a must-see on Patmos. At the end of September, we didn't pay the entrance fee. It's a good idea to do some reading yourself to understand the importance of this place for the island and thus the essential history of Patmos. A stay of 30-45 minutes should be planned if you don't want to linger longer in the \"cave\" (it has now been converted into a chapel).","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"3498":{"id":3498,"site":"monastery","plat":"gmaps","rating":"4","text":"One of the main places of worship, visited by both the faithful and tourists. A mighty walled structure on the highest point of the island, both the convent and the adjoining monastery are worth a visit.","codes":{"elevation_mention":1,"topography_quoted_phrase":"highest point of the island","religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"3501":{"id":3501,"site":"monastery","plat":"gmaps","rating":"3","text":"Beautiful and evocative, but be careful when you buy packages from travel agencies because you still have to pay the entrance fee on site.","codes":{"tourist_mode":"mixed","religious_register":["mystical"],"facility_complaints":["prices"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"3511":{"id":3511,"site":"monastery","plat":"gmaps","rating":"5","text":"At one of the highest points of the island, you can enjoy a splendid view, further down the cave of the Apocalypse","codes":{"elevation_mention":1,"topography_quoted_phrase":"one of the highest points of the island","religious_register":["doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"3518":{"id":3518,"site":"cave","plat":"gmaps","rating":"4","text":"A beautiful cave with a unique religious story! It is a small tour not something very special for us.","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"mediation":"relays","enclosure_exposure":"enclosed","worth_assessment":"mixed","review_is_useful":1,"topography_register":1}},"3519":{"id":3519,"site":"cave","plat":"gmaps","rating":"5","text":"A place of special holiness. An opportunity for a few minutes of prayer, peace! Definitely worth a visit. Ask the priest there or a tour guide for information!","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1}},"3523":{"id":3523,"site":"cave","plat":"gmaps","rating":"5","text":"Only awe for the place where 2000 years ago the revelation was written by Saint John the Theologian. The small hole in the rock that served as a Proskephalos is preserved. The cross-shaped tear in the rock on the ceiling is still visible today.","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"topography_register":1}},"3524":{"id":3524,"site":"cave","plat":"gmaps","rating":"5","text":"Impressive and deeply religious place, carefully conserved","codes":{"religious_register":["conventional"],"recognizes_heritage_protection":1,"review_is_useful":1}},"3527":{"id":3527,"site":"cave","plat":"gmaps","rating":"5","text":"Amazing space with great energy, a place that anyone visiting Patmos should visit.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1,"energy_register":1}},"3530":{"id":3530,"site":"cave","plat":"gmaps","rating":"1","text":"I was expecting something much more impressive since we hear so much about religious tourism in Patmos because of this \"Cave\".","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"review_is_useful":1,"quotable_for_chapter":1}},"3560":{"id":3560,"site":"monastery","plat":"gmaps","rating":"5","text":"Because I saw and experienced something moving that I had never experienced before..","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3567":{"id":3567,"site":"monastery","plat":"gmaps","rating":"3","text":"Small monastery with a wonderful church and an interesting museum. Breathtaking views over the island.\nAlthough I am not very religious, I found it charming.","codes":{"elevation_mention":1,"topography_quoted_phrase":"Breathtaking views over the island","sensory_modalities":["vision"],"enclosure_exposure":"exposed","religious_self_id":"spiritual_not_religious","review_is_useful":1,"quotable_for_chapter":1,"view_centrality":"mentioned"}},"3570":{"id":3570,"site":"monastery","plat":"gmaps","rating":"5","text":"The scenery is very beautiful from a high point","codes":{"elevation_mention":1,"topography_quoted_phrase":"very beautiful from a high point","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"3572":{"id":3572,"site":"monastery","plat":"gmaps","rating":"4","text":"It's small and there are too many steps for me. Its religious aspect is worthwhile.","codes":{"elevation_mention":1,"topography_quoted_phrase":"too many steps for me","religious_register":["conventional"],"effort_valence":"negative","worth_assessment":"worth_it","review_is_useful":1,"sensory_modalities":["embodied"],"on_site_movement":["accessibility_concern"]}},"3599":{"id":3599,"site":"cave","plat":"gmaps","rating":"5","text":"Creepy place. (In a good way). If you are looking for peace, you should visit it.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3601":{"id":3601,"site":"cave","plat":"gmaps","rating":"5","text":"A divine place! Something that all Christians must see. One of the most famous caves in the world is the Cave of the Apocalypse, located between the villages of Chora and Skala. According to tradition, it was in this cave that Saint John, who was exiled to the island of Patmos by the Roman emperor Domitian in 95 AD, wrote the Apocalypse.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"3604":{"id":3604,"site":"cave","plat":"gmaps","rating":"4","text":"A very beautiful place from a religious perspective, but it could be better managed, for example with multilingual guides explaining the quarry. The ticket costs €3 per person and is well worth it.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","facility_complaints":["amenities"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"3610":{"id":3610,"site":"cave","plat":"gmaps","rating":"1","text":"One of the holiest destinations of Greek Orthodoxy, and it works with store hours while it should be open all day for pilgrims. You spend a small fortune to come more relaxed for a one-day trip by catamaran and you realize that because it's Monday they have closed since 1 pm and they don't reopen.. Shame on the island, guys.. You have turned our holy places into places for collecting money and interests..","codes":{"trip_mode":"day_trip_ferry","tourist_mode":"institutional_aware","religious_register":["conventional","doctrinal"],"mediation":"endorses","facility_complaints":["access_hours","commerce"],"tone_toward_constraints":"dismissive","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'our holy places into places for collecting money'; 'our' plural held to unspecified self-ID per v1.1"}},"3614":{"id":3614,"site":"cave","plat":"gmaps","rating":"5","text":"Magnificent spiritual place. Very happy to have been able to receive communion at the Divine Liturgy. A big drawback was the parade of tourists during services.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"recognizes_active_institution":1,"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"devotional_participation":1,"on_site_movement":["posture_pause"]}},"3635":{"id":3635,"site":"monastery","plat":"gmaps","rating":"5","text":"The entire island of Patmos, thanks to the monastery of St. John the Theologian, exudes a unique peace and holiness. Everyone deserves to visit it, and not just once!!!","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1,"atmospheric_register":1}},"3656":{"id":3656,"site":"monastery","plat":"gmaps","rating":"5","text":"It is one of the few castles in Orodoxia in continuous operation since 1088.","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"3679":{"id":3679,"site":"cave","plat":"gmaps","rating":"5","text":"We had the opportunity to witness the entire baptism ceremony of a baby girl, like everyone else that day. The family wanted us to have a memento of that moment at the end of the ceremony. It was a very emotionally moving experience.","codes":{"religious_register":["conventional","mystical"],"recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"devotional_participation":1,"on_site_movement":["posture_pause"]}},"3685":{"id":3685,"site":"cave","plat":"gmaps","rating":"5","text":"Spiritual site. If you visit Patmos you have to take the journey up the mountain to the Cave. It is beautiful.","codes":{"religious_register":["mystical"],"elevation_mention":1,"topography_quoted_phrase":"the journey up the mountain to the Cave","review_is_useful":1,"topography_register":1}},"3686":{"id":3686,"site":"cave","plat":"gmaps","rating":"5","text":"A history of over 1900 years. Anyone visiting Patmos of independent faith must visit the cave where Saint John the Theologian wrote the Apocalypse.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"3688":{"id":3688,"site":"cave","plat":"gmaps","rating":"5","text":"The sacred cave of the revelation that you should definitely visit during your stay in Patmos. It is worth the walk from Chora to the cave and from there down to Skala.\nThe surrounding area of ​​the cave has been completely renovated, the cave maintains its mysterious atmosphere if you are lucky enough to visit it without many people.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"from Chora to the cave and from there down to Skala","religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","effort_valence":"positive","worth_assessment":"worth_it","review_is_useful":1,"topography_register":1,"descent_mode":"walked"}},"3693":{"id":3693,"site":"cave","plat":"gmaps","rating":"5","text":"Magical spot. You get goosebumps with the story of the miracle of the Apocalypse.","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","sensory_modalities":["embodied"],"review_is_useful":1}},"3698":{"id":3698,"site":"monastery","plat":"gmaps","rating":"5","text":"I'm not a huge fan of religion in general however,  I do appreciate the time is which these frescos & items where done. The precision,  beauty & specific handcrafted items are just simply stunning.  The architecture is also impressive & majestically crafted. Though pictures are not allowed, I managed to snap some.","codes":{"sensory_modalities":["vision"],"religious_self_id":"spiritual_not_religious","facility_complaints":["photography_restrictions"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"v1.1 disavowal: 'not a huge fan of religion in general'","acknowledges_historical_cultural":1}},"3731":{"id":3731,"site":"monastery","plat":"gmaps","rating":"5","text":"absolutely gorgeous monastery. Plan to spend at least a few hours here. Then you can walk down to the cave of Revelation. This is a must for anyone traveling to patmos.","codes":{"elevation_mention":1,"topography_quoted_phrase":"walk down to the cave of Revelation","religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"topography_register":1,"descent_mode":"walked"}},"3755":{"id":3755,"site":"monastery","plat":"gmaps","rating":"5","text":"Patmos is a blessed island. You can understand this from a visit to the Monastery..","codes":{"religious_register":["conventional"],"review_is_useful":1}},"3761":{"id":3761,"site":"monastery","plat":"gmaps","rating":"3","text":"The island is great with fantastic views, the excursion is boring. If you like, the icons are stunning but you better do it on your own.","codes":{"trip_mode":"cruise_excursion","tourist_mode":"tourist_consumer","worth_assessment":"mixed","sensory_modalities":["vision"],"enclosure_exposure":"exposed","motivation_cruise_thing_to_see":1,"review_is_useful":1,"view_centrality":"mentioned"}},"3779":{"id":3779,"site":"cave","plat":"gmaps","rating":"5","text":"The place where Saint John the Theologian wrote his Revelation of the Apocalypse. A very interesting and mystical place. Full of some supernatural energy that makes you shiver and give you goosebumps.","codes":{"religious_register":["doctrinal","mystical"],"mediation":"endorses","sensory_modalities":["embodied"],"review_is_useful":1,"quotable_for_chapter":1,"energy_register":1}},"3788":{"id":3788,"site":"cave","plat":"gmaps","rating":"1","text":"Unacceptable behavior of the priest, who did not allow us to visit the sacred place, without any excuse. Day & time of our visit 19/6/2021, Saturday, 17:45 and opening hours, Saturday afternoon, of the sacred cave 17:00-20:00.","codes":{"tourist_mode":"institutional_aware","visit_season":"peak_may_aug","religious_register":["conventional"],"recognizes_active_institution":1,"facility_complaints":["access_hours"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Date 19/6/2021 in text; 1-star denial-of-entry by priest"}},"3792":{"id":3792,"site":"cave","plat":"gmaps","rating":"5","text":"Located on the hill between Skala and Chora, the Holy Cave of the Apocalypse is one of the landmarks not only of Patmos, but of Christianity worldwide. This cave was the refuge of the Beloved Disciple of Jesus John in 95 AD, when the Emperor Domitian exiled him to Patmos, punishing him for preaching the word of God in Ephesus. However, as John himself testifies, he does not arrive in Patmos as a defeated exile or a political prisoner in troubled times, but as an exile \"on a spiritual mission\", continuing to transmit the Word and the Essence of God.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"Located on the hill between Skala and Chora","religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Encyclopedic third-person form; joins 1138/1278/1294/1375/1426/1916/1920","acknowledges_historical_cultural":1,"topography_register":1}},"3793":{"id":3793,"site":"cave","plat":"gmaps","rating":"5","text":"A divine place! A must-see for Christians. One of the most famous caves in the world is the Cave of the Apocalypse, located midway between the villages of Chora and Skala. According to legend, Saint John, exiled to the island of Patmos by the Roman Emperor Domitian in 95 AD, wrote the Apocalypse (Revelation) in this cave. Before entering the cave, descend a few steps to the Church of Saint Anna (Agia Anna). It was restored in the 17th century. Today, the church is surrounded by a monastery complex (the Monastery of the Apocalypse), with flower-filled gardens, cloisters, and chapels. Steps carved into the rock lead to the entrance.","codes":{"elevation_mention":1,"topography_quoted_phrase":"descend a few steps to the Church of Saint Anna","religious_register":["conventional","doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","nature_mention":1,"nature_sub_codes":["flora_fauna"],"recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["stairs_down"]}},"3794":{"id":3794,"site":"cave","plat":"gmaps","rating":"5","text":"In the Cave of the Apocalypse, Saint John the Theologian wrote the Apocalypse, the last book of the New Testament. The Monastery of Saint John the Theologian is dedicated to the \"beloved disciple of Jesus\" and was founded in 1088. The settlement of Chora is one of the few settlements in Greece with continuous development from the 12th century AD to the present day. It is one of the few areas in the world where religious ceremonies that began in the early Christian years are performed unchanged to this day. UNESCO has designated the Cave of the Apocalypse, the Monastery of Saint John the Theologian and Chora as World Heritage Sites.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","recognizes_active_institution":1,"recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"3820":{"id":3820,"site":"monastery","plat":"gmaps","rating":"4","text":"Excited by what I felt and saw in terms of my faith.\nBut dissatisfied, because they have made everything commercial. And there no one cares to say a word to you.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Pilgrim-frame commerce complaint; 'my faith' generic possessive → self-ID unspecified per v1.1"}},"3827":{"id":3827,"site":"monastery","plat":"gmaps","rating":"5","text":"Perfect awe and reverence help us","codes":{"review_is_useful":0,"atmospheric_register":1}},"3830":{"id":3830,"site":"monastery","plat":"gmaps","rating":"5","text":"Love it.. Calm, relaxing but arrive before 11.00 to avoid cars and groups of tourists...","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3831":{"id":3831,"site":"monastery","plat":"gmaps","rating":"5","text":"Monument of Christianity.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1}},"3833":{"id":3833,"site":"monastery","plat":"gmaps","rating":"5","text":"It is worth going up and visiting Chora and the monastery of John the Theologian. Very well preserved. Incredible views. The spectacular Orthodox church.","codes":{"elevation_mention":1,"topography_quoted_phrase":"going up and visiting Chora and the monastery","religious_register":["conventional"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"3840":{"id":3840,"site":"monastery","plat":"gmaps","rating":"5","text":"Great history. Stunning views","codes":{"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"central"}},"3852":{"id":3852,"site":"monastery","plat":"gmaps","rating":"5","text":"Fantastic Divine......","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3855":{"id":3855,"site":"monastery","plat":"gmaps","rating":"5","text":"Great view","codes":{"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"3859":{"id":3859,"site":"cave","plat":"gmaps","rating":"5","text":"It is the first choice you should make, you will find peace and tranquility walking inside the sacred cave of Saint John the Theologian.","codes":{"religious_register":["conventional","mystical"],"enclosure_exposure":"enclosed","review_is_useful":1,"topography_register":1,"on_site_movement":["walking_around"]}},"3860":{"id":3860,"site":"cave","plat":"gmaps","rating":"5","text":"Place of transforma
