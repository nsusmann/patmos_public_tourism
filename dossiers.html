ous ,and his ears are open to their prayer . But the face of the Lord is against those who do evil.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1}},"1573":{"id":1573,"site":"cave","plat":"gmaps","rating":"5","text":"Devotional atmosphere. Unique spiritual experience... You are filled with spiritual joy.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"1574":{"id":1574,"site":"cave","plat":"gmaps","rating":"5","text":"The Cave is located halfway between the port and the castle, where the Holy Monastery is located. A visit to the Cave is definitely an integral part of your tour of the island. It is located in a spot with a great view and is awe-inspiring when you enter.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"halfway between the port and the castle","religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"both","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"1575":{"id":1575,"site":"cave","plat":"gmaps","rating":"5","text":"It's the place where Saint john 'Jesus's beloved disciple ' was  exiled to and narrated the revelations. He stayed 2-3 years.\nPresently, the cave has been modernized as a tourist attraction. It's very friendly to all, especially to the LGBT community. Feel free to converse with the monk there.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","tourist_mode":"mixed","recognizes_active_institution":1,"review_is_useful":1,"topography_register":1}},"1578":{"id":1578,"site":"monastery","plat":"gmaps","rating":"5","text":"A very interesting convent… a very moving experience to visit at Easter… the ceremonies are very touching.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","mystical"],"recognizes_active_institution":1,"review_is_useful":1}},"1583":{"id":1583,"site":"monastery","plat":"gmaps","rating":"5","text":"Fantastic place, spotlessly clean with a wonderful museum. The church is small but remarkable. You can see bones from some Apostles and St. Christodoulou who built the church. Wonderful view. You will need at least two or three hours. Free entrance and 2 euros for adults","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1,"view_centrality":"mentioned"}},"1586":{"id":1586,"site":"monastery","plat":"gmaps","rating":"5","text":"There used to be a Christian shrine on this small island.\nIf you have the time and energy, you can walk up from the harbor. Along the way, I met friendly, welcoming locals.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"walk up from the harbor","religious_register":["conventional"],"review_is_useful":1}},"1589":{"id":1589,"site":"monastery","plat":"gmaps","rating":"5","text":"All-consuming is the only one. A unique experience, in combination with the beautiful alleys of the country.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1594":{"id":1594,"site":"monastery","plat":"gmaps","rating":"5","text":"Wonderful place!!! Combined with the rest of the place and the atmosphere it looks wonderful and at the same time peaceful","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1599":{"id":1599,"site":"monastery","plat":"gmaps","rating":"5","text":"I was there today with my imagination... Eagles, you know, they are free. \nThe love of God be with the Saints.\nThe love of God be with you also who seek the truth.\n\nJesus Christ is coming soon!✝️","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1}},"1600":{"id":1600,"site":"monastery","plat":"gmaps","rating":"5","text":"Working for a season in Patmos, I found a diamond, a warmth in this monastery. You are enchanted by the images and the divine atmosphere. If I have to say something negative, it is the photographer in charge, Alekos Stavros, who left cigarettes on the steps, trash, spoke badly and mistreated his employees in front of the world. The Monastery should know this since his business is housed in the monastery grounds.","codes":{"trip_mode":"extended_stay","religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"1613":{"id":1613,"site":"monastery","plat":"gmaps","rating":"5","text":"Very interesting Christian history place. Very good divine energy for those who know how to receive it.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1,"acknowledges_historical_cultural":1,"energy_register":1}},"1616":{"id":1616,"site":"cave","plat":"gmaps","rating":"5","text":"You can feel the spirit of John the Evangelist.\nNo photos, just meditation.\nI bought a beautiful icon.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"coding_notes":"you-can-feel addresses reader; icon-purchase noted but no first-person devotional anchor","devotional_participation":1}},"1621":{"id":1621,"site":"cave","plat":"gmaps","rating":"5","text":"Placing my hand in the same place St. John had his hand while praying was a moving experience.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"enacted","devotional_contact":1,"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"hand-on-the-spot: clean enacted-mimetic + devotional_contact co-firing","on_site_movement":["posture_pause"]}},"1622":{"id":1622,"site":"cave","plat":"gmaps","rating":"5","text":"A sacred space, the atmosphere during the morning service on Holy Thursday was particularly devout!","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","mystical"],"mediation":"endorses","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"Holy Thursday → shoulder season (April)","devotional_participation":1}},"1623":{"id":1623,"site":"cave","plat":"gmaps","rating":"5","text":"Religious place, one of the most important!!!","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1624":{"id":1624,"site":"cave","plat":"gmaps","rating":"5","text":"One of the greatest monuments of Orthodoxy!!!! It is definitely worth a visit to where John the Theologian wrote the Apocalypse. You will see the rock that split in three and a flash blinded Saint John who then asked his student Prochorus to write what he would dictate to him. Although we went on a day with many groups, we were able to worship without much of a wait.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"rock split / flash blinded relayed-but-endorsed; 'able to worship' enacted","devotional_participation":1,"topography_register":1}},"1627":{"id":1627,"site":"cave","plat":"gmaps","rating":"5","text":"There are no words to describe such a place. Simply holy. ✝️","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"1640":{"id":1640,"site":"monastery","plat":"gmaps","rating":"5","text":"Outside the tourist season, July and August are even more enjoyable on Patmos. The island is a monument around the monastery that stands high on the peak and often, as a symbol of a divine encounter with the sky, touches the clouds and its blue!","codes":{"elevation_mention":1,"topography_quoted_phrase":"stands high on the peak... touches the clouds","religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"topography_register":1}},"1641":{"id":1641,"site":"monastery","plat":"gmaps","rating":"5","text":"A hospitable, prayerful place. If you go with a spiritual attitude and good intentions, you will leave greatly benefited.","codes":{"religious_register":["conventional","mystical"],"recognizes_active_institution":1,"review_is_useful":1}},"1665":{"id":1665,"site":"cave","plat":"gmaps","rating":"5","text":"Fantastic church especially if there is a service","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"1667":{"id":1667,"site":"cave","plat":"gmaps","rating":"5","text":"Mystical place.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1671":{"id":1671,"site":"cave","plat":"gmaps","rating":"5","text":"Very impressive, the second holiest place in the world after Jerusalem.","codes":{"religious_register":["conventional"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'second holiest place in the world after Jerusalem' — distinctive doctrinal ranking"}},"1680":{"id":1680,"site":"monastery","plat":"gmaps","rating":"5","text":"This was part of a half day tour. The views are beautiful. Church is beautiful. You have an opportunity to light a candle and say a prayer. You will need to get the candle when exiting the church and there is an area to light and say a prayer behind you after exiting. Lots of history. We did with a guide and she kept us informed of the history and such.","codes":{"religious_register":["conventional"],"mediation":"relays","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"devotional_contact":1,"devotional_participation":1,"acknowledges_historical_cultural":1,"view_centrality":"mentioned"}},"1685":{"id":1685,"site":"monastery","plat":"gmaps","rating":"5","text":"It's a beautiful, peaceful and prayerful place. I recommend a visit if you are looking for spiritual rejuvenation.","codes":{"religious_register":["conventional","mystical"],"recognizes_active_institution":1,"review_is_useful":1}},"1688":{"id":1688,"site":"monastery","plat":"gmaps","rating":"5","text":"Peace and tranquility!\nHoly Apostle John, pray for us sinners!","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"review-as-prayer form (cf. 1138, 1278, 1462); 'us sinners' held to unspecified self-ID per v1.1 anti-inference"}},"1699":{"id":1699,"site":"monastery","plat":"gmaps","rating":"5","text":"What can I say about this monastery? It just awes you. Wonderful, wonderful, wonderful. And the museum too.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1704":{"id":1704,"site":"monastery","plat":"gmaps","rating":"5","text":"A SACRED PLACE OF RELIGIOUSNESS AND PRAYER. IT IS WORTH VISITTING THE MUSEUM THAT EXISTS. TAKE TIME TO TOUR THE AREAS OF THE MONASTERY TO CALM YOUR MENTAL STATE. PREFER DAYS WHEN THERE ARE NO TOURIST GROUPS ON THE CRUISES.","codes":{"religious_register":["conventional","mystical"],"tourist_mode":"institutional_aware","worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"all-caps; advice to avoid cruise-tour-group days"}},"1714":{"id":1714,"site":"monastery","plat":"gmaps","rating":"5","text":"A wonderful place. It creates incredible peace and awe. It is where Saint John wrote the Apocalypse.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"site=monastery but text places writing of Apocalypse here — joins geographic-mistake cluster (cf. 561-611, 667, 770, 872)"}},"1723":{"id":1723,"site":"cave","plat":"gmaps","rating":"5","text":"A mystical and beautiful place worth visiting.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"1727":{"id":1727,"site":"cave","plat":"gmaps","rating":"5","text":"This is an absolute must see and feel the presence in a Christian walk of faith.","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'Christian walk of faith' borderline self-ID; held to unspecified per v1.1 anti-inference (addressing reader, not first-person)"}},"1729":{"id":1729,"site":"cave","plat":"gmaps","rating":"5","text":"One of the most spiritual places on earth.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1730":{"id":1730,"site":"cave","plat":"gmaps","rating":"5","text":"There's a strange feeling... but it's absolutely beautiful. Unmissable.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"1731":{"id":1731,"site":"cave","plat":"gmaps","rating":"5","text":"We went on a Saturday afternoon in mid-May, and there were incredibly many groups of foreigners! The wait was long, fortunately because we were a couple and Greeks, they told us to go ahead otherwise we would still be there. In the cave you will see the spot where Saint John the Theologian rested his head and where he supported himself with his hand to get up. Parking will be quite difficult, especially during peak hours. Photos are not allowed inside the sacred cave.","codes":{"ascent_mode":"motorized","visit_season":"peak_may_aug","religious_register":["conventional","doctrinal"],"mediation":"endorses","facility_complaints":["crowding","amenities"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1}},"1734":{"id":1734,"site":"cave","plat":"gmaps","rating":"5","text":"A place filled with spirituality. A place of pilgrimage.","codes":{"religious_register":["mystical","conventional"],"review_is_useful":1}},"1735":{"id":1735,"site":"cave","plat":"gmaps","rating":"5","text":"Awe","codes":{"religious_register":["mystical"],"review_is_useful":1,"coding_notes":"single-word but mystical-register affect token"}},"1743":{"id":1743,"site":"monastery","plat":"gmaps","rating":"4","text":"Quite difficult to access. Has many steps. Interesting place for pilgrimage.","codes":{"elevation_mention":1,"topography_quoted_phrase":"Has many steps","religious_register":["conventional"],"effort_valence":"negative","review_is_useful":1,"on_site_movement":["accessibility_concern"]}},"1751":{"id":1751,"site":"monastery","plat":"gmaps","rating":"5","text":"Unique in beauty and devotion","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1755":{"id":1755,"site":"monastery","plat":"gmaps","rating":"5","text":"A great blessing for anyone who claims the saint to be in this place...","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1762":{"id":1762,"site":"monastery","plat":"gmaps","rating":"5","text":"A beautiful place and an ideal destination for Orthodox Christians.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1769":{"id":1769,"site":"monastery","plat":"gmaps","rating":"5","text":"Sacred pilgrimages of this magnitude do not need ratings.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1775":{"id":1775,"site":"monastery","plat":"gmaps","rating":"1","text":"This is a great castle that you can see everything from  it IF you are a priest, all places that had a view were inaccessible to the public I got the feeling I saw 1/10 of the monastery\n\nStay away if you think you’ll see a  castle like monastery or a view.\n\nOne star goes to the Museum which was good","codes":{"worth_assessment":"not_worth_it","tone_toward_constraints":"frustrated","tourist_mode":"tourist_consumer","facility_complaints":["area_access"],"review_is_useful":1,"coding_notes":"'all places that had a view were inaccessible to the public' = area_access (v1.1)","view_centrality":"central"}},"1798":{"id":1798,"site":"cave","plat":"gmaps","rating":"5","text":"It's really worth visiting every time I'm in the area and even though I know the history, as soon as I touch the rock a shiver runs through me and a nice feeling is a reason why it's worth going to the island","codes":{"religious_register":["mystical"],"sensory_modalities":["touch_temperature"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","devotional_contact":1,"review_is_useful":1,"quotable_for_chapter":1,"topography_register":1}},"1806":{"id":1806,"site":"cave","plat":"gmaps","rating":"5","text":"Only with the light of candles, without electricity, all the lamps were lit, the priest sang calmly and the congregation understood all the words of the gospel. Wonderful experience.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision","sound"],"austerity_register":"appreciative","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"candlelit liturgy, no electricity — appreciative austerity","devotional_participation":1}},"1809":{"id":1809,"site":"cave","plat":"gmaps","rating":"5","text":"I visited the cave years ago without taking any photos inside because I already had a fever of 40 and throughout the tour I was very dizzy, but I didn't want this to hinder this visit. I'm glad for the videos and photos of others. The experience inside is shocking both for the cracks in the rock and the place where John placed his head to rest. If you visit the cave you will feel awe and that yes, the Revelation is sacred and true.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision","embodied"],"enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Revelation is sacred and true' endorses; cracks in rock = vision; fever/awe embodied","topography_register":1}},"1810":{"id":1810,"site":"cave","plat":"gmaps","rating":"5","text":"The Cave of the Apocalypse is a sacred place that you should definitely visit.\nThe place has a unique energy that is difficult to describe.\nImpressive.","codes":{"religious_register":["mystical","conventional"],"worth_assessment":"worth_it","review_is_useful":1,"energy_register":1,"topography_register":1}},"1815":{"id":1815,"site":"cave","plat":"gmaps","rating":"5","text":"It is a very important place for Christians, especially Orthodox Christians.\n\nIt is believed that John, one of Jesus' 12 disciples, spoke with God in this cave and wrote the final book of the Bible here.\n\nIt is the last of the four gospels of the New Testament.\n\nIn John's gospel, he speaks of salvation through Christ on the Day of Judgment.","codes":{"religious_register":["doctrinal","conventional"],"mediation":"relays","review_is_useful":1,"coding_notes":"conflates Revelation with John's Gospel/four gospels","topography_register":1}},"1820":{"id":1820,"site":"monastery","plat":"gmaps","rating":"5","text":"A very beautiful museum inside the monastery.\n\nA stunning view and a great atmosphere.","codes":{"elevation_mention":1,"religious_register":["mystical"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"1823":{"id":1823,"site":"monastery","plat":"gmaps","rating":"1","text":"We visited the monastery and the museum but unfortunately the view is not possible to see as the priests have closed the access around it. So if you want to see the view from here, don't come.","codes":{"tourist_mode":"tourist_consumer","elevation_mention":1,"worth_assessment":"not_worth_it","recognizes_active_institution":1,"facility_complaints":["area_access"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"v1.1 area_access — priests closed view areas; tourist_consumer (came for view)","view_centrality":"central"}},"1837":{"id":1837,"site":"monastery","plat":"gmaps","rating":"5","text":"What can one say!\nThe pilgrimage is shocking.","codes":{"religious_register":["mystical"],"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'the pilgrimage is shocking' - pilgrim framing"}},"1842":{"id":1842,"site":"monastery","plat":"gmaps","rating":"4","text":"Stunning place and structure.  The experience would have been more meaningful if a guide, explaining some basic landmarks, was available.  Study up before you go to maximize your experience! Also, although signs regarding appropriate dress code were posted, nobody was there enforcing this rule. As Greeks, we were prepared, but it was annoying to see people inappropriately dressed in a holy place.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"religious_self_id":"orthodox","facility_complaints":["dress_code"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"v1.1 'we Greeks/Orthodox' rule — first-person Greek + reverent stance"}},"1849":{"id":1849,"site":"monastery","plat":"gmaps","rating":"1","text":"Extremely rude and unprofessional ticket guy, we had a strong argument due to his manner and we left we didn't want to go in anymore. And how lovely when you're not greek you have to pay to see the \"house of god\" , we have our money to a homeless man and walked away.","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"worth_assessment":"not_worth_it","facility_complaints":["prices"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"free-for-Greeks pricing complaint; gave money to homeless instead"}},"1868":{"id":1868,"site":"cave","plat":"gmaps","rating":"5","text":"You feel an awe, a wonderful place to pray where the revelation was written","codes":{"religious_register":["mystical","conventional","doctrinal"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1}},"1871":{"id":1871,"site":"cave","plat":"gmaps","rating":"5","text":"As a Christian, visiting the Grotto of St. John is a pleasure and the discovery of a wonderful historical place.","codes":{"religious_register":["conventional"],"religious_self_id":"christian_general","motivation_religious":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1898":{"id":1898,"site":"monastery","plat":"gmaps","rating":"5","text":"Interesting architecture. It's not just the religious aspect that's impressive.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1910":{"id":1910,"site":"monastery","plat":"gmaps","rating":"5","text":"A remarkable place to visit. Of course first you have to visit the cave of the Apocalypse!!!","codes":{"religious_register":["doctrinal"],"review_is_useful":1}},"1912":{"id":1912,"site":"monastery","plat":"gmaps","rating":"5","text":"It's an important monastery and museum, definitely worth seeing.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"1916":{"id":1916,"site":"cave","plat":"gmaps","rating":"5","text":"The Cave of Apocalypse, located on the Greek island of Patmos, is a significant religious site for Christians, particularly for the Orthodox Church. It is believed to be the place where the Apostle John received the visions that inspired the writing of the Book of Revelation.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","review_is_useful":1,"topography_register":1}},"1923":{"id":1923,"site":"cave","plat":"gmaps","rating":"3","text":"Not really spectacular,\n€3 entrance fee, lit candles are rudely and disrespectfully blown out and thrown away once you leave the cave.","codes":{"religious_register":["conventional"],"tourist_mode":"mixed","tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Complains candles 'rudely and disrespectfully blown out'; reverence-violation framing."}},"1926":{"id":1926,"site":"cave","plat":"gmaps","rating":"5","text":"Peace and tranquility","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1927":{"id":1927,"site":"cave","plat":"gmaps","rating":"5","text":"A must-see. Here, according to tradition, St. John received the Book of Revelation by revelation.\nA mystical place to be experienced in silence and contemplation.","codes":{"religious_register":["mystical","doctrinal"],"mediation":"relays","sensory_modalities":["sound"],"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'according to tradition' + 'mystical place... silence and contemplation'.","acknowledges_historical_cultural":1,"atmospheric_register":1}},"1936":{"id":1936,"site":"monastery","plat":"gmaps","rating":"5","text":"Tranquility place...","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1942":{"id":1942,"site":"monastery","plat":"gmaps","rating":"5","text":"Beautiful place. Full of peace, tranquility, blessing.","codes":{"religious_register":["mystical","conventional"],"review_is_useful":1}},"1946":{"id":1946,"site":"monastery","plat":"gmaps","rating":"5","text":"If you pass through Patmos you must visit it. Orthodoxy, peace, tranquility, respect. A place of prayer and devotion.","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"1952":{"id":1952,"site":"monastery","plat":"gmaps","rating":"5","text":"Impressive and fascinating, especially during the Easter period","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1958":{"id":1958,"site":"monastery","plat":"gmaps","rating":"5","text":"Excellent, sacred place!!! It is worth someone taking the time to visit it!!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"1977":{"id":1977,"site":"cave","plat":"gmaps","rating":"5","text":"What can you say about the place where God spoke….","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'the place where God spoke' — endorsement of revelation narrative."}},"1983":{"id":1983,"site":"cave","plat":"gmaps","rating":"5","text":"Sacred place! You get a different energy!","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1,"energy_register":1}},"1986":{"id":1986,"site":"cave","plat":"gmaps","rating":"5","text":"The place exudes peace!","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1996":{"id":1996,"site":"monastery","plat":"gmaps","rating":"5","text":"I visited it on a cruise stop on the Greek island of Patmos. A very interesting visit.","codes":{"trip_mode":"cruise_excursion","motivation_cruise_thing_to_see":1,"review_is_useful":1}},"1999":{"id":1999,"site":"monastery","plat":"gmaps","rating":"5","text":"Amazing temple inside a castle-monastery. There is a museum on site. Be careful with the opening hours because in the winter I went it opened with the cruise ships.","codes":{"visit_season":"off_peak_nov_mar","religious_register":["conventional"],"facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"Advisory tone re: winter hours opening only with cruise ships."}},"2021":{"id":2021,"site":"monastery","plat":"gmaps","rating":"5","text":"As soon as you arrive you feel a sense of awe and tranquility.\nThe whole place is wonderful.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2033":{"id":2033,"site":"monastery","plat":"gmaps","rating":"5","text":"5* Beauty\n5* Medieval Atmosphere\n5* View\n#NoAccessibility though\n\nAmazingly beautiful and very well preserved castle and monastery with a fantastic view over Patmos town and harbour. To get here you have to cross the winding narrow streets of Chora town, sometimes with stairs. The final path to the monastery is made of stairs, and inside the monastery there are mainly small stairs to get around.\nIf you have a chance to walk around outside the walls of the monastery, you will feel the power of huge stones from which the castle is built, its height and majesty!","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"the final path to the monastery is made of stairs","sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_heritage_protection":1,"facility_complaints":["amenities"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"#NoAccessibility → amenities; 'well preserved' → heritage_protection","acknowledges_historical_cultural":1,"view_centrality":"central","on_site_movement":["accessibility_concern","walking_around"]}},"2035":{"id":2035,"site":"monastery","plat":"gmaps","rating":"5","text":"The monastery itself isn't much to see. It's easy to walk from the port, taking about 40 minutes. There's a small museum inside, and they charge a €6 donation per person.\nThe views are truly stunning, like all the Greek islands: whitewashed houses, incredible vistas, and endless Mediterranean beaches. In summer, it's the best.","codes":{"ascent_mode":"walked","tourist_mode":"tourist_consumer","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"easy to walk from the port, taking about 40 minutes","effort_valence":"positive","worth_assessment":"mixed","sensory_modalities":["vision"],"enclosure_exposure":"exposed","nature_mention":1,"nature_sub_codes":["seascape"],"review_is_useful":1,"coding_notes":"'monastery itself isn't much to see' → consumer; views save it","view_centrality":"central"}},"2037":{"id":2037,"site":"cave","plat":"gmaps","rating":"5","text":"Very beautiful place, worship in the temple, very kind people, there are visiting hours, beautiful view","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"review_is_useful":1,"view_centrality":"mentioned"}},"2039":{"id":2039,"site":"cave","plat":"gmaps","rating":"5","text":"They should improve the signage indicating the location of the cave. It is very well organized. A place of spirituality that makes us reflect on life.","codes":{"religious_register":["mystical"],"facility_complaints":["signage"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"2043":{"id":2043,"site":"cave","plat":"gmaps","rating":"4","text":"A church for a fee :)","codes":{"religious_register":["conventional"],"facility_complaints":["prices"],"review_is_useful":1,"coding_notes":"'A church for a fee :)' — playful price complaint"}},"2046":{"id":2046,"site":"cave","plat":"gmaps","rating":"5","text":"We were there on a Sunday and were fortunate enough to attend the service. We felt in God's hands.","codes":{"religious_register":["conventional","mystical"],"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'attended the service' + 'felt in God's hands' → mystical+religious motivation","devotional_participation":1}},"2064":{"id":2064,"site":"monastery","plat":"gmaps","rating":"5","text":"A place of immense peace, where you feel the divine presence at all times.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'feel the divine presence at all times' — succinct mystical statement"}},"2071":{"id":2071,"site":"monastery","plat":"gmaps","rating":"4","text":"Such an interesting place to visit but so busy with guided tours, which I was one of.  Not really able to soak up the atmosphere.","codes":{"religious_register":["mystical"],"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'soak up the atmosphere' → mystical register"}},"2082":{"id":2082,"site":"monastery","plat":"gmaps","rating":"4","text":"Amazing feat that they built this way up on top of the rocky mountain. Very peaceful and quiet up here for meditation.","codes":{"religious_register":["mystical"],"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"built this way up on top of the rocky mountain","sensory_modalities":["sound"],"enclosure_exposure":"exposed","review_is_useful":1,"coding_notes":"'peaceful and quiet up here for meditation' → mystical+sound","topography_register":1}},"2087":{"id":2087,"site":"monastery","plat":"gmaps","rating":"5","text":"It is very interesting, beautiful and beneficial for the soul to visit such unusual places!","codes":{"religious_register":["mystical"],"review_is_useful":1,"coding_notes":"'beneficial for the soul' → mystical"}},"2091":{"id":2091,"site":"monastery","plat":"gmaps","rating":"5","text":"Very privileged to have visited the Monestary, very peaceful and educational.  Views overlooking Patmos are stunning. Thank you.","codes":{"religious_register":["mystical"],"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"Views overlooking Patmos are stunning","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"2093":{"id":2093,"site":"monastery","plat":"gmaps","rating":"5","text":"The most serene place, if you are religious or not, it is a must to visit.\nI lit a candle for my dad here, it was a very peaceful place, where you can contemplate and just be in the moment ❤","codes":{"religious_register":["conventional","mystical"],"devotional_contact":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'if you are religious or not' (addresses reader, not self-ID); 'lit a candle for my dad' → devotional_contact","devotional_participation":1}},"2096":{"id":2096,"site":"cave","plat":"gmaps","rating":"5","text":"The cave where one of Jesus' apostles is believed to have written the final chapter of the Gospel, the Apocalypse (Revelations), is located on a hill between Skala and Hora.","codes":{"religious_register":["doctrinal"],"mediation":"relays","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"located on a hill between Skala and Hora","review_is_useful":1,"coding_notes":"'is believed to have written' → relays","acknowledges_historical_cultural":1,"topography_register":1}},"2111":{"id":2111,"site":"cave","plat":"gmaps","rating":"5","text":"Very special and moving","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2118":{"id":2118,"site":"monastery","plat":"gmaps","rating":"5","text":"Entrance to the monastery and its museum costs 5 euros. Once inside, you can enjoy a spectacular view of Skala. The monastery is fascinating, and the museum is well-maintained. The atmosphere is peaceful. Please note that opening hours vary depending on the day of the week.","codes":{"religious_register":["mystical"],"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"spectacular view of Skala","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"2121":{"id":2121,"site":"monastery","plat":"gmaps","rating":"5","text":"Very moving experience...beautiful island!","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2131":{"id":2131,"site":"monastery","plat":"gmaps","rating":"5","text":"Amazing religious attraction\nWorth going","codes":{"religious_register":["conventional"],"tourist_mode":"tourist_consumer","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'religious attraction' — consumer frame"}},"2132":{"id":2132,"site":"monastery","plat":"gmaps","rating":"5","text":"You are awed by the beauty of nature, the imposingness of the buildings, but most of all by the soul and the","codes":{"religious_register":["mystical"],"nature_mention":1,"nature_sub_codes":["natural_beauty_praise"],"review_is_useful":1,"coding_notes":"'awed by the beauty of nature... by the soul' (text truncated)"}},"2135":{"id":2135,"site":"monastery","plat":"gmaps","rating":"5","text":"Visiting the Apocalypse Cave was a very magical moment, because reading the Bible and being able to visit this historic and important place for us Christians I have no words to describe!  I recommend visiting this place and experiencing this unique experience!","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","religious_self_id":"christian_general","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'for us Christians' — first-person plural Christian self-ID (parallel to 'for us Catholics' nms_id=89)","acknowledges_historical_cultural":1}},"2145":{"id":2145,"site":"monastery","plat":"gmaps","rating":"4","text":"Excellent church, with numerous sacred relics,etc,","codes":{"religious_register":["conventional"],"review_is_useful":1}},"2146":{"id":2146,"site":"monastery","plat":"gmaps","rating":"5","text":"An absolutely fascinating place. Anyone who visits Patmos and hasn't seen this monastery complex hasn't truly experienced it.\n\nThis UNESCO World Heritage Site not only houses a captivating museum, where you can see important archaeological finds from ancient Patmos and, above all, sacred art from the many centuries of the monastery's history, but also countless narrow passageways, monastic rooms (including a bakery), courtyards, a magnificent church overflowing with gold and countless holy images (icons) and relics, and terraces offering breathtaking views of the entire island and as far as Asia Minor (Ephesus).\n\nDuring my last visit, the atmosphere was serene and perfectly suited to the sacred nature of the place. A delicate scent of incense permeated the rooms, and the quiet conversations of the visitors were only interrupted by the gentle ringing of the tinny bells.","codes":{"religious_register":["conventional","mystical","doctrinal"],"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"terraces offering breathtaking views of the entire island","worth_assessment":"worth_it","sensory_modalities":["vision","smell","sound","embodied"],"enclosure_exposure":"both","recognizes_heritage_protection":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"incense scent + tinny bells + serene atmosphere — full sensory stack; UNESCO heritage","acknowledges_historical_cultural":1,"atmospheric_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"2147":{"id":2147,"site":"monastery","plat":"gmaps","rating":"5","text":"The whole essence of Christianity is here in Patmos, at the monastery of Agios Ioannis Theologos. From where the overpriced taxi drops you off, it takes about 10 minutes of uphill but pleasant ride to the monastery. The view is amazing as well as the shops in the village that is right there. Very nice, picturesque cafes with a lot of people.","codes":{"ascent_mode":"motorized","religious_register":["conventional","doctrinal"],"mediation":"endorses","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"10 minutes of uphill but pleasant ride to the monastery","effort_valence":"positive","facility_complaints":["prices"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'whole essence of Christianity is here' → endorses; 'overpriced taxi' → prices","view_centrality":"mentioned"}},"2167":{"id":2167,"site":"monastery","plat":"gmaps","rating":"5","text":"Blessed place...","codes":{"religious_register":["conventional"],"review_is_useful":1}},"2169":{"id":2169,"site":"monastery","plat":"gmaps","rating":"5","text":"The reason someone visits the island of the Apocalypse is precisely this monastery. Because its beaches did not impress us.","codes":{"religious_register":["doctrinal"],"review_is_useful":1,"nature_mention":1,"nature_sub_codes":["seascape"]}},"2178":{"id":2178,"site":"monastery","plat":"gmaps","rating":"5","text":"Without being religious, you really feel the story alive.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2191":{"id":2191,"site":"monastery","plat":"gmaps","rating":"5","text":"entering the monastery it feels like being in the novel In the Name of the Rose","codes":{"religious_register":["mystical"],"enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Likens entering monastery to 'In the Name of the Rose'"}},"2197":{"id":2197,"site":"cave","plat":"gmaps","rating":"1","text":"Just a little church. Nothing more.","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"worth_assessment":"not_worth_it","tone_toward_constraints":"dismissive","review_is_useful":1}},"2199":{"id":2199,"site":"cave","plat":"gmaps","rating":"5","text":"It's awe-inspiring just to be in this place. A huge blessing.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"2203":{"id":2203,"site":"cave","plat":"gmaps","rating":"5","text":"You can only feel awe and devotion in such a unique place, where the voice of the Lord was heard and the Revelation was written.\nBlessed place!!!","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1}},"2204":{"id":2204,"site":"cave","plat":"gmaps","rating":"1","text":"A small cave where John the Baptist supposedly lived and/or wrote. Very crowded and little to see. Not recommended.","codes":{"tourist_mode":"tourist_consumer","religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"not_worth_it","enclosure_exposure":"enclosed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"Calls site 'John the Baptist' rather than John the Theologian","acknowledges_historical_cultural":1,"topography_register":1}},"2209":{"id":2209,"site":"cave","plat":"gmaps","rating":"5","text":"It is worth going and watching the whole service.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1}},"2216":{"id":2216,"site":"monastery","plat":"gmaps","rating":"5","text":"This monastery is of particular beauty and religious value. At the end of the visit you feel moved and awestruck.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"2241":{"id":2241,"site":"monastery","plat":"gmaps","rating":"5","text":"The monastery of Agios Ioannis Theologos in Patmos is a place that for me everyone should visit once in their life! It dominates with majesty in the center of the island's Chora, giving a devout atmosphere for believers and non-believers! Access is by car up to a point and then there are large steps up to the entrance. The staff and the monks are very hospitable, the space and the view are breathtaking. This and the cave of the Apocalypse are the two places that anyone should visit when coming to the island!","codes":{"ascent_mode":"motorized","elevation_mention":1,"topography_quoted_phrase":"It dominates with majesty in the center of the island's Chora","religious_register":["conventional","mystical"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"sensory_modalities":["embodied"],"topography_register":1,"view_centrality":"mentioned","on_site_movement":["stairs_up"]}},"2255":{"id":2255,"site":"monastery","plat":"gmaps","rating":"5","text":"WOW WOW and WOW! This is a MUST for ALL!! I'm not by any means a religious person, HOWEVER this monastery was AWESOME!!The history, the museum location will take your breath away","codes":{"religious_self_id":"spiritual_not_religious","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"sensory_modalities":["embodied"],"acknowledges_historical_cultural":1}},"2260":{"id":2260,"site":"monastery","plat":"gmaps","rating":"5","text":"Words are unnecessary. Awe...","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2262":{"id":2262,"site":"monastery","plat":"gmaps","rating":"5","text":"Religious heritage","codes":{"religious_register":["conventional"],"review_is_useful":1}},"2267":{"id":2267,"site":"monastery","plat":"gmaps","rating":"5","text":"It's my favourite Greek island.  The most precious and friendly people    Loved the Christian experience of the book of Revelations.  A dream come true.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'A dream come true' + 'Loved the Christian experience' = sought-pilgrimage anchor (non-cruise)"}},"2278":{"id":2278,"site":"cave","plat":"gmaps","rating":"2","text":"Very small and geared towards tourists.\n\nFor devout believers, it might be a place of pilgrimage. But please only visit when there are no cruise ships in port…","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","tourist_mode":"tourist_consumer","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"Reviewer frames site as 'geared towards tourists'; recommends avoiding cruise crowds"}},"2280":{"id":2280,"site":"cave","plat":"gmaps","rating":"5","text":"Wonderful place, the only place on earth where Christ set foot besides Jerusalem.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"Confuses John with Christ ('only place on earth where Christ set foot besides Jerusalem') — common lay conflation"}},"2284":{"id":2284,"site":"cave","plat":"gmaps","rating":"3","text":"The grotto is beautiful, its value is primarily historical and religious. Admission is only €3, it's very nice, and the view from there is beautiful.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"2285":{"id":2285,"site":"cave","plat":"gmaps","rating":"5","text":"Many tourists I went by myself listened to the talks and remained afterwards to take in this experience and ambience","codes":{"religious_register":["mystical"],"review_is_useful":1,"on_site_movement":["posture_pause"]}},"2286":{"id":2286,"site":"cave","plat":"gmaps","rating":"5","text":"It was our first time visiting the island and I am glad that we had the opportunity to visit this sacred place, where we felt a very strong energy. I recommend it to everyone who has the opportunity to visit it!","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1,"energy_register":1}},"2289":{"id":2289,"site":"cave","plat":"gmaps","rating":"5","text":"Very beautiful and an amazing holy site. ***Cash only entrance*** I recommend going in the evening if you want less people inside the cave.","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","review_is_useful":1,"topography_register":1}},"2296":{"id":2296,"site":"monastery","plat":"gmaps","rating":"5","text":"An unparalleled mystical experience, the photo helps to understand the emotion of the place","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2300":{"id":2300,"site":"monastery","plat":"gmaps","rating":"5","text":"A very pleasant and interesting discovery of the Monastery of Saint John the Theologian on the island of Patmos in the southern Aegean Sea!\nIt was in the 11th century that Christodulus had the monastery built in honor of Saint John the Theologian: this medieval fortress, with its series of staircases, vaulted passages, and paved courtyards, preserves chapels with incredible Baroque decoration and covered in frescoes. The museum houses a wealth of icons from the Cretan school, ancient parchments such as the fragment of the Gospel according to Saint Mark, and also a work by El Greco (Christ Led to the Crucifixion).","codes":{"religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Rich heritage/museum vision: frescoes, Cretan icons, El Greco, parchments","acknowledges_historical_cultural":1,"topography_register":1}},"2311":{"id":2311,"site":"monastery","plat":"gmaps","rating":"4","text":"A place to visit and not only for religious reasons","codes":{"religious_register":["conventional"],"review_is_useful":1}},"2316":{"id":2316,"site":"monastery","plat":"gmaps","rating":"5","text":"Incredible place, definitely worth visiting, a unique religious destination","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"2319":{"id":2319,"site":"monastery","plat":"gmaps","rating":"5","text":"A magnificent monastery built in 1088 sits high upon the hill overlooking Patmos.  The museum is the best place to understand its history.  The cave of St. John is not far and is the place where he wrote the book of revelations.  Photos are not allowed in the cave.","codes":{"elevation_mention":1,"topography_quoted_phrase":"high upon the hill overlooking Patmos","religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"2321":{"id":2321,"site":"monastery","plat":"gmaps","rating":"5","text":"Here is also the coffin of the Apostle Thomas and the relics of Saint Pachomius!!","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1}},"2329":{"id":2329,"site":"monastery","plat":"gmaps","rating":"5","text":"Spiritual site","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2330":{"id":2330,"site":"monastery","plat":"gmaps","rating":"5","text":"The most important building on the island, the construction dates back to the 11th century and has been remodeled several times. Surrounded by mighty defensive walls, it is located at the summit of Chora, and the monastery commands a panoramic view of the entire island. Inside the church, two chapels contain beautiful 12th-century Byzantine frescoes.","codes":{"elevation_mention":1,"topography_quoted_phrase":"located at the summit of Chora","religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"2332":{"id":2332,"site":"monastery","plat":"gmaps","rating":"5","text":"A beautiful monastery in the Padmos Hills. A must-see. A place for reflection and rest. You can walk up from the pier in about 45 minutes and down in about 30. If you have time, you can also visit the Cave of St. John (entrance fee 6 euros), where the last book of the Bible was written.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"walk up from the pier in about 45 minutes","religious_register":["conventional","doctrinal"],"mediation":"endorses","effort_valence":"neutral","worth_assessment":"worth_it","review_is_useful":1,"topography_register":1,"descent_mode":"walked"}},"2336":{"id":2336,"site":"cave","plat":"gmaps","rating":"5","text":"A place where you can draw spiritual strength.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2339":{"id":2339,"site":"cave","plat":"gmaps","rating":"1","text":"Make sure you know how to speak some Greek before you visit.\nThis is supposed to be a holy place, but like most holy places, this has been hijacked by religion.\nYou can't even take photos inside the cave.\nImagine Jesus saying, \"No photos, guys\"?\nIt just would not happen.\nFor what should be a place of celebration of faith, it has more of a morbid feel.\nTry to go when they are not having a service.","codes":{"religious_register":["conventional"],"tourist_mode":"tourist_consumer","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'hijacked by religion' but no first-person disavowal — leave self_id unspecified per v1.1"}},"2340":{"id":2340,"site":"cave","plat":"gmaps","rating":"3","text":"Well, if you want to be where John supposedly received the Revelation, you're welcome to do so. Otherwise, it's not exactly a major attraction.\n\nWhen cruise ships are around, you don't see much besides the crowds in the tiny church/cave.\n\nInteresting things are rather scarce.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","tourist_mode":"tourist_consumer","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"topography_register":1}},"2341":{"id":2341,"site":"cave","plat":"gmaps","rating":"3","text":"We came here to pray but priest kept talking loud with someone and when we asked him to speak quietly he started to show his anger, hitting his hat and acting crazy.\nWe really got scared of him. He frightened me and my family.\nTotal peace and good vibes are gone.\nDisrespect to our special prayer time is unbelievable.\nThe cave is very beautiful and you feel calm there.","codes":{"religious_register":["conventional","mystical"],"enclosure_exposure":"enclosed","tourist_mode":"institutional_aware","recognizes_active_institution":1,"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Pilgrim ('came to pray') frustrated by priest's loud talking; institutional_aware not consumer","devotional_participation":1,"topography_register":1,"on_site_movement":["posture_pause"]}},"2343":{"id":2343,"site":"cave","plat":"gmaps","rating":"4","text":"Patmos Island, Greece. St. John the Theologian lived in this cave. From a crack in the cave, he heard the word of God, his disciple wrote it down, and that's how it reached the people.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"topography_register":1}},"2345":{"id":2345,"site":"cave","plat":"gmaps","rating":"5","text":"A privileged location, no doubt.\nYou must ask permission to attend Mass, which is usually around 8 a.m.","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"2347":{"id":2347,"site":"cave","plat":"gmaps","rating":"5","text":"Very spiritual experience","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2348":{"id":2348,"site":"cave","plat":"gmaps","rating":"5","text":"We found Emesvto without any crowds because we were there outside the tourist season and it was an experience! On Sunday morning there is a liturgy by an Orthodox priest and free entry for the faithful. When it is crowded you really can't understand anything, so choose to visit early in the morning and outside the tourist season.","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"2349":{"id":2349,"site":"cave","plat":"gmaps","rating":"5","text":"A monument of the Orthodox faith that you should visit at least once.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"2350":{"id":2350,"site":"cave","plat":"gmaps","rating":"5","text":"Very mystical and very enriching, it invites you to want to know more about God","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"2351":{"id":2351,"site":"cave","plat":"gmaps","rating":"3","text":"There could be, if not someone to give a tour of the site, at least an inscription on the sacred cave in English and Greek to inform visitors.","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","tourist_mode":"tourist_consumer","facility_complaints":["signage"],"tone_toward_constraints":"frustrated","review_is_useful":1,"topography_register":1}},"2356":{"id":2356,"site":"monastery","plat":"gmaps","rating":"5","text":"Fantastic view and the monastery is simply magical!","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"2361":{"id":2361,"site":"monastery","plat":"gmaps","rating":"5","text":"The images of the Saints are moving.","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"review_is_useful":1}},"2374":{"id":2374,"site":"monastery","plat":"gmaps","rating":"5","text":"The bible is real. The revelation of Jesus Christ to the Apostle John is real","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'The bible is real... is real' — strong doctrinal endorsement but no first-person self-ID"}},"2378":{"id":2378,"site":"monastery","plat":"gmaps","rating":"5","text":"You can feel something different from normal church spiritually. In order to feel with some meditation, it would be better for you to arrive  there at least 1 hour earlier than closing time because they start to close 10min before closing from innerside and close gate at closing time.","codes":{"religious_register":["conventional","mystical"],"facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1}},"2380":{"id":2380,"site":"monastery","plat":"gmaps","rating":"5","text":"Located at the Aegean Sea, this is the most significant & sacred destination for true Christian disciples. The first building you'll notice is the monastery of St John the Divine / Evangelist. It crowns the hill of Hora. It looks like a Byzantine castle.","codes":{"elevation_mention":1,"topography_quoted_phrase":"It crowns the hill of Hora","religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"2384":{"id":2384,"site":"monastery","plat":"gmaps","rating":"5","text":"A very beautiful place, saturated with prayer. A monastic community operates here. I recommend it to everyone; you can't leave Patmos without visiting this place.","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'saturated with prayer' — quotable mystical/institutional phrase"}},"2385":{"id":2385,"site":"monastery","plat":"gmaps","rating":"5","text":"Beautiful monastery with a fantastic museum. Great views. Well worth the stop.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"2386":{"id":2386,"site":"monastery","plat":"gmaps","rating":"3","text":"The entrance is free, but the exterior is much more impressive than the interior. On the days when the monastery of St. John is open in the afternoon (see a photo of the current schedule attached) there is almost nothing to see inside, because the museum and the main church are both closed. It's better to visit it in the morning. A good photo of the monastery of St. John can be taken from the windmills.","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"facility_complaints":["access_hours"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"2389":{"id":2389,"site":"monastery","plat":"gmaps","rating":"5","text":"An experience beyond words","codes":{"religious_register":["mystical"],"review_is_useful":1}},"2391":{"id":2391,"site":"monastery","plat":"gmaps","rating":"5","text":"Interesting place to visit, and a good guidance by the Tour Guide. Quite different from churches in NZ, but mind-expanding and that is good.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"2396":{"id":2396,"site":"cave","plat":"gmaps","rating":"5","text":"The place has been renovated, making access easier without steps.\nThe opening hours are a bit strange because they don't keep them, in the winter I went. What is certain is that when there is a cruise ship it is open.\nIn the cave you can see the handle where Saint John used to get up and the place where his head rested. From above you can also see the split in the rock, where it was created by lightning - an earthquake. When you go you feel the energy of the place and above all the awe you are overcome when you are at the place where he wrote the revelation.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"specific cave features (handle, head-rest, split rock); 'energy of the place'","energy_register":1,"topography_register":1}},"2398":{"id":2398,"site":"cave","plat":"gmaps","rating":"5","text":"I feel very happy and fulfilled that I have succeeded and have set foot in the cave. If you go to Patmos at Easter, definitely go to the service, it is very beautiful.","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","motivation_religious":1,"review_is_useful":1,"topography_register":1}},"2406":{"id":2406,"site":"cave","plat":"gmaps","rating":"5","text":"It's impressive to know that you're standing in the place where our Lord appeared and spoke to John. John was imprisoned here for two years and received the revelations needed to write the Book of Revelation. You have to wait in a long line that moves quickly and costs 2 or 3 euros per person. An Orthodox church was built over the original cave, which has largely been preserved.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","recognizes_heritage_protection":1,"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"topography_register":1}},"2411":{"id":2411,"site":"cave","plat":"gmaps","rating":"5","text":"THE ORACLE OF THE END OF THE WORLD. The Cave of Patmos.\n\nSince ancient times (Neolithic), humankind has attempted to understand and control the energy emanating from these shelters and hollows. The first Neolithic shamans managed to establish a dialogue with the \"daemons\" of dreams during rituals inside caves, thanks to the shadows and the warmth of fires, along with the ingestion of plants, bark, and certain substances that altered their perception of reality. They later reproduced these dreams as a symbolic language, drawings on the rock walls. They sought to improve their hunting, to increase their chances of survival, that is, for their group to prevail over others. Knowledge is power, and it provided the group with new tools for connection, revitalizing their tribal unity. The evocative interplay of light, movement, and shamanic experiences bordering on magic, which permeated the place, made the group feel especially strong and empowered to hunt large mammals.\n\nThe search for balance and restoration of the energetic spectrum helped to harmonize health and emotions. Music has always been one of the shaman's primary tools for this purpose. Listening to rhythmic sounds like the sound of the sea and the conch shell, the rhythm of the drum or rattle, similar to raindrops, was key. Thanks to the power of the rhythmic drum, the shaman helps to cultivate awareness of both hemispheres of the brain. During concentration, the sound helps to achieve balance between the rational and the emotional. Other practices included dancing for extended periods, chanting, controlled breathing, fasting, vigils, sauna or sweat lodge sessions, vision quests, and the use of sacred or entheogenic plants. Trance, the foundation of shamanic practice, is an altered state of consciousness where the rules of rational thought are disrupted by forces and dynamics of the psyche that remain difficult to understand even today. The science of breath is the primary science of sharpening consciousness.\n\nJohn of Patmos, the religious figure who sought refuge on this island after being exiled by Emperor Domitian, longed for the message of the gods, an experience akin to shamanism, to hear and interpret the ancient Atlantean language that time and humankind had forgotten. In his experiences, acting as a priest-shaman master, he dictated to his student what he felt and saw in his oracular dreams. His experiences would create a set of mystical visions used for centuries by the Christian community. The germ of the community with a cabalistic number, seven, a number associated with the founding of empires, cities or sacred temples (According to legend he did not write it himself, but dictated it to Prochorus, a student who listened to the revelations of his master's oracular dream).","codes":{"religious_register":["mystical","doctrinal"],"mediation":"relays","sensory_modalities":["vision","sound"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"shamanic-comparative framing; treats cave as energy/oracle site, John as shaman-figure","acknowledges_historical_cultural":1,"energy_register":1,"topography_register":1}},"2416":{"id":2416,"site":"monastery","plat":"gmaps","rating":"5","text":"Awesome view","codes":{"review_is_useful":0,"view_centrality":"central"}},"2420":{"id":2420,"site":"monastery","plat":"gmaps","rating":"4","text":"The monastery is well-preserved and has a certain grandeur, but unfortunately, it doesn't offer a panoramic view.","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"sensory_modalities":["vision"],"recognizes_heritage_protection":1,"tone_toward_constraints":"frustrated","review_is_useful":1,"view_centrality":"mentioned"}},"2422":{"id":2422,"site":"monastery","plat":"gmaps","rating":"5","text":"A fantastic must-see attraction. Best combined with a visit to the Cave of the Apocalypse, located further down the mountain. At the end of the tour of the monastery, there are two charming, cozy Greek restaurants within the monastery walls with a million-dollar view.","codes":{"tourist_mode":"tourist_consumer","elevation_mention":1,"topography_quoted_phrase":"located further down the mountain","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"2428":{"id":2428,"site":"monastery","plat":"gmaps","rating":"5","text":"Beautiful monastery atop the picturesque island of Patmos. Taxis do a rotation from the tender port for $50 usd or Euro, visiting the cave of the apocalypse (30 min), the monastery (1 hr), before returning you to the port. Be warned that the climb is strenuous to the monastery. Finally, there are entrance fees at the cave 3€ and the monastery museum 5€ (not necessary to pay to see the monastery). Have fun. The views are worth it!","codes":{"trip_mode":"cruise_excursion","elevation_mention":1,"topography_quoted_phrase":"atop the picturesque island of Patmos","religious_register":["conventional"],"effort_valence":"negative","worth_assessment":"worth_it","sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","motivation_cruise_thing_to_see":1,"review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"motorized"}},"2430":{"id":2430,"site":"monastery","plat":"gmaps","rating":"2","text":"The hours did not match what was posted online. We finally got inside during open hours, but we were quickly ushered out by a gruff and unfriendly monk/priest.","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"recognizes_active_institution":1,"facility_complaints":["access_hours"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"2436":{"id":2436,"site":"monastery","plat":"gmaps","rating":"4","text":"The \"Monastery of St. John\", founded and built by the monk Cristoderos in the 11th century, is the most suitable place to overlook the \"Port of Skala\" on the top of this mountain.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"to overlook the Port of Skala on the top of this mountain","religious_register":["conventional","doctrinal"],"mediation":"relays","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"central"}},"2444":{"id":2444,"site":"monastery","plat":"gmaps","rating":"5","text":"Very nice monastery with lots of history. We came on a cruise ship and instead of doing the overprice cruise tour we took a cab from the port that drop us off at both the St. John cave and monastery and picked us up.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","religious_register":["conventional"],"motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"motorized"}},"2464":{"id":2464,"site":"cave","plat":"gmaps","rating":"5","text":"The visit to the cave was on a Sunday and due to the season there were not many tourists and there was no waiting. Photography and videography are prohibited inside the cave, which helps the sanctity of the moment for the faithful and does not turn the place into a museum. The employees at the entrance and the exhibition were very polite and if I met a group from Asia, they had a tour guide who spoke to them in English and what he said was excellent. The visit is worth it, preferring morning hours or at closing so that it is not too crowded","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"worth_assessment":"worth_it","enclosure_exposure":"enclosed","recognizes_active_institution":1,"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"non-self-IDing visitor endorses photo ban as preserving 'sanctity for the faithful'","topography_register":1}},"2468":{"id":2468,"site":"cave","plat":"gmaps","rating":"4","text":"Honestly, it's only worth it if you're a devout Christian (either catholic, orthodox, or protestant). If you're not religious at all you won't be pleased with the long queue and the fact that you can't take pictures inside it.\nIt's more of a place for self reflection and contemplation.","codes":{"tourist_mode":"mixed","religious_register":["conventional","mystical"],"worth_assessment":"mixed","enclosure_exposure":"enclosed","facility_complaints":["crowding","photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"frames worth-it as conditional on devout-Christian status; addresses-reader, not self-IDing"}},"2470":{"id":2470,"site":"cave","plat":"gmaps","rating":"5","text":"A very moving experience.  Loved being inside and imagining John writing Revelations.","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1}},"2472":{"id":2472,"site":"cave","plat":"gmaps","rating":"5","text":"I don't know how to describe the feeling... I've wanted to visit this place since my youth, and it never worked out, but I've always wanted to try it someday! And now this event has happened, so I'm speechless. It's the beauty and the uniqueness, the prayerfulness of centuries, the knowledge that you're in the place where everything was written, and on top of that, a dream come true! Overall, I'm happy with what's happened, and I'll be grateful to God for the rest of my life for this and for so much more! Dream on, be inspired, and make your dreams come true!","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"lifelong-dream + 'grateful to God' + 'prayerfulness of centuries'; non-cruise sought","acknowledges_historical_cultural":1}},"2474":{"id":2474,"site":"cave","plat":"gmaps","rating":"4","text":"It's the place where they say St. John received inspiration from God and wrote the Apocalypse in his testament. You can't take photos inside; it's a very simple place. The priest inside shared the cave's history with us, and he was very kind.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","austerity_register":"neutral","recognizes_active_institution":1,"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"2477":{"id":2477,"site":"monastery","plat":"gmaps","rating":"5","text":"Visiting in October, I really enjoyed exploring this holy place. The museum is definitely worth a visit for its unique and perfectly preserved pieces. The surrounding streets, especially the south side, are incredibly charming. The highlight is the splendid view of Scala Bay.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"central","on_site_movement":["walking_around"]}},"2481":{"id":2481,"site":"monastery","plat":"gmaps","rating":"5","text":"The tour was rated as \"moderate\" exertion, but it was much more.  Making it there, the monastery and museum were fantastic.","codes":{"elevation_mention":1,"religious_register":["conventional"],"effort_valence":"negative","review_is_useful":1,"sensory_modalities":["embodied"]}},"2484":{"id":2484,"site":"monastery","plat":"gmaps","rating":"5","text":"A magical place for Catholics. Worth it. Worth it. Worth it.","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"2496":{"id":2496,"site":"monastery","plat":"gmaps","rating":"5","text":"Even for non-believers, it's a place that gives you goosebumps.  Sadly there is no photography allowed, and there is good selection of postacards to buy either.  The museum is fantastic.","codes":{"religious_register":["mystical"],"sensory_modalities":["embodied"],"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"2498":{"id":2498,"site":"monastery","plat":"gmaps","rating":"5","text":"Magic...Reflection\nThe cave is beautiful..But one clarification, people will always be ungrateful:\nIn the monastery, the ropes were 2 euros\nWhile in the cave they were 4 euros, what's the difference? None\nSimply with such stupid moves they spoil the whole image Not only in the monastery but in general of the island.","codes":{"religious_register":["mystical"],"tourist_mode":"institutional_aware","facility_complaints":["prices","commerce"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'stupid moves spoil the whole image' — pricing critique from image-of-place stance","topography_register":1}},"2500":{"id":2500,"site":"monastery","plat":"gmaps","rating":"5","text":"It's best to visit the monastery very early, so you can look around in peace and enjoy the atmosphere. It's worth it.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1}},"2510":{"id":2510,"site":"monastery","plat":"gmaps","rating":"5","text":"A magical place. A feast for the eyes both inside and out. A must-see when visiting Patmos.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"2518":{"id":2518,"site":"cave","plat":"gmaps","rating":"5","text":"Absolutely don't miss this historic place, whether you are religious or not, you must go, full of spiritual energy","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","enclosure_exposure":"enclosed","review_is_useful":1,"acknowledges_historical_cultural":1,"energy_register":1}},"2521":{"id":2521,"site":"cave","plat":"gmaps","rating":"4","text":"Entrance costs 3 euros and allows immediate access to the cave. This place exudes a mystical atmosphere. The visit takes about 10 minutes, partly because, unfortunately, the signs are only in Greek or English and focus primarily on the cave's restoration process, with minimal references to the saint. A pleasant visit, albeit sparse.","codes":{"religious_register":["mystical"],"worth_assessment":"mixed","enclosure_exposure":"enclosed","facility_complaints":["signage"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"signage focuses on restoration not the saint — institutional-story vs visitor-need gap","atmospheric_register":1,"topography_register":1}},"2529":{"id":2529,"site":"cave","plat":"gmaps","rating":"5","text":"Here is the whole essence of Christianity. Here St. John wrote the Revelation, hearing the voice of God through the angels in the form of running, spring water.\nThe town of Patmos is a small Mykonos with many shops and fashion that only Mykonos has.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'essence of Christianity' + Patmos-as-small-Mykonos commerce framing","acknowledges_historical_cultural":1}},"2530":{"id":2530,"site":"cave","plat":"gmaps","rating":"5","text":"You feel a gentleness and calmness in a moment of devotion!","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"2534":{"id":2534,"site":"cave","plat":"gmaps","rating":"5","text":"Holy Cave of the Revelation in Patmos. ❤️ Excellent location with holiness in everything from the reception with the kind Father Isidoros to the exhibition rich in publications and photographic material about the  cave of the revelation of John the Theologian and all the areas. The point where he supported himself with his hand, the place of lying down and the triple tear in the upper part of the rock of the revelation.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"topographic relayed mimetic: hand-rest, lying-place, triple tear in rock","acknowledges_historical_cultural":1,"topography_register":1}},"2546":{"id":2546,"site":"monastery","plat":"gmaps","rating":"5","text":"A holy place. Not too much walking, in shade mostly.","codes":{"religious_register":["conventional"],"effort_valence":"positive","review_is_useful":1,"on_site_movement":["walking_around"]}},"2547":{"id":2547,"site":"monastery","plat":"gmaps","rating":"5","text":"One of the most important religious pilgrimages of Orthodoxy","codes":{"religious_register":["conventional","doctrinal"],"review_is_useful":1}},"2549":{"id":2549,"site":"monastery","plat":"gmaps","rating":"5","text":"There are no words, anyone who hasn't been there cannot understand the greatness of the vibrations they receive at this particular spot.","codes":{"religious_register":["mystical"],"review_is_useful":1,"energy_register":1}},"2558":{"id":2558,"site":"monastery","plat":"gmaps","rating":"5","text":"Incredible view of the entire area. Special architecture and atmosphere. Worth the visit.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosu
