all museum they have there. Just be wary of the opening times. It is open from 8:00am - 1:30pm every day but is closed in the afternoon on Sunday, Monday, Wednesday and Friday and open from 4pm - 6 or 7 pm on the other afternoons.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"high on the hill overlooking Skala","religious_register":["conventional"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"topography_register":1}},"937":{"id":937,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Lugar lleno de energía mística y con una vista increíble! \n A place full of mystical energy and with an incredible view! It's incredible how the passage of time has preserved this place and its mystical essence, making it a must-do excursion for those of us who enjoy places full of history.\nThe view from the Monastery is incredible!\nBefore boarding the ferry that took us back to the cruise ship, we had coffee with Mujeres x El Mundo! An excursion that leaves time for everything!","codes":{"trip_mode":"cruise_excursion","religious_register":["conventional","mystical"],"worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"energy_register":1,"view_centrality":"central"}},"940":{"id":940,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Hay que ir! \n You have to go! Incredible to be in the cave where Tradition says Saint John had his apocalyptic visions. Off-season there is almost no one there: an extraordinary and unique experience!","codes":{"visit_season":"off_peak_nov_mar","religious_register":["conventional","doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"coding_notes":"site=monastery; text reviews the cave","topography_register":1}},"941":{"id":941,"site":"monastery","plat":"tripadvisor","rating":"5","text":"History and religion in one \n History and religion in one This monastery is combining the history and the religion and is devoted to Saint John who wrote the apocalypse in the holy cave some km away from the monastery. The monastery is among the sites of World Heritage of UNESCO, and only for this it is worth visiting.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"942":{"id":942,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Meaningful experience \n Meaningful experience After walking a steep, strenuous distance from the parking lot (not for the faint-hearted!), we first saw the cave where John experienced and wrote about his Revelation. This was awe-inspiring. Afterwards, we visited the Katholikon, which is the main church of the monastery which is still active. The Monestary was established in 1088. It and the adjacent museum are filled with ancient religious artifacts. Walking back down to the parking lot, you can stop at some of the shops along the way. Beautiful views of the Mediterranean!","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"steep, strenuous distance from the parking lot","religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","effort_valence":"negative","worth_assessment":"worth_it","sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","mimetic":1,"mimetic_engagement":"relayed","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"walked","on_site_movement":["walking_around"]}},"944":{"id":944,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Superb Experience \n Superb Experience Wanted to visit the Monestery for a long time and did this as independent travellers last week. Used the bus service which was very reliable and great value. Walked around the walled town which was fantastic and went into the Monestery and Museum which were  top class. Lovely atmosphere and views to die for! Unlike many tourist places  the town and Monestery were not tacky and exploited . Highly recommended .","codes":{"ascent_mode":"motorized","tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'not tacky and exploited' — institutional_aware framing of authenticity","view_centrality":"mentioned","on_site_movement":["walking_around"]}},"945":{"id":945,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Luogo dello spirito \n A place of the spirit. Visiting the Cave of the Apocalypse and the Monastery of Saint John on the Island of Patmos is to enter a bubble outside of time, a place of the spirit where all inner noise falls silent, thoughts quiet down, and the heart waits in silence.\nOpening the Book of Revelation, written by Saint John during a vision he had in this place, one reads:\n\n \"And I saw a new heaven and a new earth: for the first heaven and the first earth had passed away and there was no more sea. And I saw the holy city, the new Jerusalem, coming down from heaven, from God, prepared as a bride adorned for her husband. Then I heard a powerful voice coming from the throne, saying:\n\n\"Behold, the dwelling of God is with men!\nHe will dwell with them\nand they shall be his people\nand he shall be God with them, their God.\nAnd he will wipe every tear from their eyes\nand there shall be no more death\nnor mourning nor crying nor pain,\nfor the former things have passed away.\"\n\nAnd the One seated on the throne said: \"Behold, I make all things new\" (...). And he said to me:\n\n\"Behold, it is done!\nI am the Alpha and the Omega,\nthe Beginning and the End.\nTo him who is thirsty\nI will give freely to drink\nfrom the fountain of the water of life.\"","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","sensory_modalities":["sound"],"enclosure_exposure":"both","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'place of the spirit'; quotes Rev 21 on-site","atmospheric_register":1,"topography_register":1}},"946":{"id":946,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Un monastero vista mare \n A monastery with a sea view. The monastery dominates the hill of Patmos and seems to watch over all its inhabitants from above. A winding road leads from the port all the way up to the monastery, offering a breathtaking panorama of the island. The white houses surrounding St John form a labyrinth around St. John and make your arrival at the monastery gates even more enjoyable. Perfectly preserved, the monastery houses a very beautiful museum of manuscripts, statues, paintings, documents, and ancient vestments. Absolutely worth visiting.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"dominates the hill of Patmos","religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"topography_register":1,"view_centrality":"central"}},"948":{"id":948,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Do the same walk \n Do the same walk Well worth the climb to the top of Chora (Hora) old town to see these amazing buildings, you will still see the priests going about their day.  Please be respectful and ensure appropriate dress is worn, women cover shoulders and below their knees.  £2 to enter the museum also worth checking out. After leaving take in the windmills, then follow the ancient path down to the grotto.  Also only £2 for entry.  However, ensure you visit between 830 and 1330 as these venues then shut.  I believe in summer opening hours are extended.\nThere is also a bus service to the monastery, which runs morning and evening. If you should catch a cab be warned they don't appear to use meters, so negotiate price before departing.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"climb to the top of Chora","religious_register":["conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"walked"}},"951":{"id":951,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Monastery in patmos \n Monastery in patmos Extremely interesting objects and books on display. The building is a delight to walk through. Very atmospheric. It is still operating as a monastery and school of theology. To walk up is quite a trek in hot weather. Better getting the bus or a taxi.","codes":{"elevation_mention":1,"religious_register":["conventional","doctrinal","mystical"],"effort_valence":"negative","sensory_modalities":["vision"],"recognizes_active_institution":1,"weather_complaints":["heat"],"tone_toward_constraints":"accepting","review_is_useful":1,"on_site_movement":["walking_around"]}},"952":{"id":952,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Monasterio historico \n Historic monastery. The ancient monastery of Saint John the Theologian, with its medieval fortress structure, is of great historical interest and offers excellent views over the island. Without crowds, it is a tranquil and magical place, with interesting paintings and icons on its walls.","codes":{"religious_register":["conventional","doctrinal","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"953":{"id":953,"site":"monastery","plat":"tripadvisor","rating":"4","text":"パトモス一番の観光地 \n The top tourist attraction in Patmos. It is located in the town of Chora. At first glance it looks like a castle, but it is a monastery. Admission is 4 euros, including the museum. Video and camera use are not permitted inside the monastery. The frescoes are beautifully preserved. The items housed in the museum include not only things from Patmos but also artifacts from other islands.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"review_is_useful":1,"topography_register":1}},"955":{"id":955,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Πρέπει να το δεις! \n You have to see it! Is it even possible to go to Patmos for Easter and not celebrate the Resurrection at the monastery?? Unique traditions and a magnificent landscape!","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","doctrinal"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"Easter at the monastery — implicit Greek/Orthodox but no first-person; held unspecified"}},"957":{"id":957,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Superbe par l'ancien chemin! \n Superb via the old path! Beautiful little monastery, very crowded when the cruise ships arrive. The view alone from the top of the hill makes it worth the trip. I strongly suggest using the old stone path through the mountain to get there: exhausting but so rewarding when you reach the very top! The journey takes about 45 minutes.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"old stone path through the mountain","religious_register":["conventional"],"effort_valence":"ambivalent","worth_assessment":"worth_it","enclosure_exposure":"exposed","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"sensory_modalities":["embodied"],"topography_register":1,"view_centrality":"central"}},"958":{"id":958,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Interesting to contemplate \n Interesting to contemplate This was a beautiful place and it was very interesting to contemplate John being in that area writing the Book of Revelations. The museum was interesting with I think the oldest bible ever...LOL, I don't know, but there can't be many much older! Very cool stuff! Beautiful ancient church.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'interesting to contemplate John being in that area writing'","acknowledges_historical_cultural":1}},"960":{"id":960,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Magnifica atmosfera \n Magnificent atmosphere. A walk uphill made pleasant by the ever-present meltemi in August leads to this evocative monastery, from which you can enjoy a magnificent view of the island. A long, steep staircase leading to the interior makes it feel even more like a fortress. The monastery was founded in 1088 by the Byzantine monk Christodoulos. With the help of Emperor Alexios I Komnenos, it was consecrated to Saint John the \"Theologian.\" It was later continued by the followers of Christodoulos and expanded in the fifteenth through seventeenth centuries.\nIn Roman times, Patmos was a place of exile, where the evangelist John is said to have written the Book of Revelation. Patmos is indeed mentioned in the work as the place where he would have had his visions. The cave where this is said to have occurred is considered one of the most important and sacred sites for the Greek Orthodox Church.","codes":{"ascent_mode":"walked","visit_season":"peak_may_aug","elevation_mention":1,"topography_quoted_phrase":"A walk uphill","religious_register":["conventional","doctrinal"],"mediation":"relays","effort_valence":"positive","sensory_modalities":["vision"],"wind_mention":1,"wind_register":"literal_atmospheric","enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'ever-present meltemi in August' — FIRST wind mention of the pass","nature_mention":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"963":{"id":963,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Нам понравилось \n We enjoyed it. We traveled to the island independently from Kos by catamaran, without tours. The monastery itself is visible from the foot of the hill and resembles a medieval castle. There is a bus from the port to Chora. Visiting the monastery took about 2 hours. We went without a guide. However, there are a large number of tours going around, and you can catch parts of the commentary in English, French, and even Russian. The monastery itself is an incredible place — we really loved the old chapel. In our opinion, the price of the Russian-language tour was greatly overpriced at all the tour agencies — about twice what it should be. After visiting the monastery, we headed down through the streets of Chora toward the cave. Along the way, there are a few souvenir shops and artists' stalls. The artwork itself is fairly primitive and resembles the Greek artists' works we had already seen. There are some interesting ceramic pieces, but the prices for the stylish items are sky-high.","codes":{"trip_mode":"day_trip_ferry","elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional"],"facility_complaints":["prices"],"tone_toward_constraints":"frustrated","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"walked"}},"964":{"id":964,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Das Kloster des Heiligen \n The Monastery of the Saint. There are several ways to get to the island. My favorite is to fly to Kos, spend two days there, and then take the Flying Dolphins in just under 1½ hours to reach the island of Patmos. The monastery in Patmos is simply overwhelming — it sits on a hill with massive walls and small churches. The view alone in good weather is indescribably beautiful.","codes":{"trip_mode":"day_trip_ferry","elevation_mention":1,"religious_register":["conventional","mystical"],"sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"central"}},"965":{"id":965,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Sérénité \n Serenity. A magnificent place, filled with mysticism and an atmosphere conducive to meditation. A superb view of the sea and a museum that is an absolute must-see. A very beautiful memory.","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"mentioned"}},"966":{"id":966,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Εξαιρετικό μνημείο αλλα εμπορικό \n Outstanding monument but commercial. Undoubtedly it is a magnificent monastery of exceptional architecture, like a castle at the top of Chora, with arches and a stunning view!!!! The monastery's museum is equally interesting! However, I did not feel the solemnity I was hoping for... I found the choir quite commercialized and the hieromonks quite unapproachable...","codes":{"tourist_mode":"institutional_aware","elevation_mention":1,"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_active_institution":1,"facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'did not feel the solemnity I was hoping for' — solemnity-disappointment cluster","topography_register":1,"view_centrality":"mentioned"}},"967":{"id":967,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Relíquia do séc. XI \n An 11th-century relic. This monastery is dedicated to Saint John the Evangelist, author of the Book of Revelation. The castle-shaped structure has towers and many arches. The monastery has 10 chapels, around 200 painted icons, and in its rooms a collection with numerous silver pieces and collections of jewelry. A detailed visit allows you to observe the details of this treasure and serves as a place for reflection for Christians. It is a place of extreme mystical significance. Staircases, climbs, descents, and wonderful views through arches make the visit fantastic.","codes":{"elevation_mention":1,"topography_quoted_phrase":"Staircases, climbs, descents, and wonderful views through arches","religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","effort_valence":"positive","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["stairs_down","stairs_up"]}},"971":{"id":971,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Local de fé. \n A place of faith. The Monastery is located on a hill full of staircases.\n The place exudes faith. The view is wonderful, just like everything in Greece/Turkey.","codes":{"elevation_mention":1,"topography_quoted_phrase":"located on a hill full of staircases","religious_register":["conventional","mystical"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"972":{"id":972,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Si erge come una fortezza \n It rises like a fortress\n\nSeen from below it appears magnificent, like a fortress. The path to reach it, only on foot, is easy, and thanks to the friendly breeze blowing across the island, you don't even arrive at the top hot and exhausted from the heat. Along the way someone will take photos of you, and at the exit you'll find the pleasant surprise of seeing your photos on a display panel offered for sale — you'll be pleased, and you'll leave thinking that those charming girls have found a nice gig as a summer job. This building is fascinating for its architecture both from the outside and from the entrance into the main courtyard. As you wander, you enter a series of intricate corridors and rooms that really feels like a labyrinth — it's a marvel of the architectural imagination of whoever designed it. In the chapel it is not possible to take photos, and the same applies to the museum, which is visitable with the same ticket as the main entrance. There are rare parchments kept in display cases, and many other sacred objects of rare beauty, such as superbly embroidered vestments with beautiful colors and gold. On the second floor of the museum, mainly paintings on canvas are on display.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"Seen from below it appears magnificent, like a fortress","religious_register":["conventional"],"effort_valence":"positive","sensory_modalities":["vision"],"wind_mention":1,"wind_register":"literal_atmospheric","enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"second wind mention of pass — 'friendly breeze blowing across the island' softens the climb","nature_mention":1,"topography_register":1,"on_site_movement":["walking_around"]}},"973":{"id":973,"site":"monastery","plat":"tripadvisor","rating":"4","text":"mágico \n magical\n\nWe took a taxi up to the monastery. I found it very interesting, plus there is a wonderful view. Endless going up and down staircases full of tourists, but it's worth it.","codes":{"ascent_mode":"motorized","elevation_mention":1,"topography_quoted_phrase":"Endless going up and down staircases full of tourists","religious_register":["conventional","mystical"],"effort_valence":"ambivalent","worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned","on_site_movement":["stairs_down","stairs_up"]}},"975":{"id":975,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Misticismo e arte \n Mysticism and art\n\nThe grandeur of the monastery strikes you to the heart and invites prayer. There is nothing I didn't like.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"976":{"id":976,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Não vale a pena \n Not worth it\n\nThe view is wonderful, but visiting the monastery is not worth it. Enormous lines to go up and down the staircases. In the height of summer, the heat is almost unbearable.","codes":{"elevation_mention":1,"topography_quoted_phrase":"Enormous lines to go up and down the staircases","tourist_mode":"tourist_consumer","visit_season":"peak_may_aug","religious_register":["conventional"],"effort_valence":"negative","worth_assessment":"not_worth_it","enclosure_exposure":"exposed","facility_complaints":["crowding"],"weather_complaints":["heat"],"tone_toward_constraints":"frustrated","review_is_useful":1,"view_centrality":"mentioned","on_site_movement":["stairs_down","stairs_up"]}},"977":{"id":977,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Show \n Awesome, it's incredible to see this place where the Bible tells us in Revelation about the visions of John of the end times, it's well preserved","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1}},"979":{"id":979,"site":"monastery","plat":"tripadvisor","rating":"4","text":"FÉ!!! \n FAITH!!!\n\nThe Monastery of Saint John is an Orthodox monastery located on the island of Patmos, an island considered the Jerusalem of the Aegean. A beautiful place with a fantastic view from up there. As you go down the stairs, the place conveys a lot of energy — I feel it because I focus deeply when I visit these places. And the day of the visit was August 26th, my birthday, so it moved me even more. I was with my daughter — it was the first island our cruise stopped at.\nThe Monastery has been included as a UNESCO World Heritage Site.","codes":{"trip_mode":"cruise_excursion","elevation_mention":1,"religious_register":["conventional","mystical"],"enclosure_exposure":"exposed","recognizes_heritage_protection":1,"motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"energy_register":1,"view_centrality":"mentioned","on_site_movement":["stairs_down"]}},"980":{"id":980,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Monastery and Town Worth a Visit \n Monastery and Town Worth a Visit We took a tour up to the Monastery and also had a wonderful walk through the back \"streets\" of the old town built around it.  Toured the inside of a house as well.  The Monastery was nice with a small, but interesting museum area.  Views were amazing as well.","codes":{"elevation_mention":1,"religious_register":["conventional"],"mediation":"relays","worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"on_site_movement":["walking_around"]}},"981":{"id":981,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Massive Monastery w/excellent Views \n Massive Monastery w/excellent Views This 11th century stone monastery was impressive even in the distance as we docked in port. At first it appears more like a massive Moorish fort sitting atop a high hill in Spain.  The museum inside the monastery has some very ancient relics, beautifully decorated old manuscripts and Byzantine frescos. There were panoramic views of Patmos, our ship docked in the harbor and other far islands from the monastery. We also got some very good photos of the three functioning Patmos windmills with their very distinctive sails from the monastery's front steps. St. John's Cave of the Apocalypse is close by.","codes":{"trip_mode":"cruise_excursion","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"massive Moorish fort sitting atop a high hill","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"983":{"id":983,"site":"monastery","plat":"tripadvisor","rating":"4","text":"A wonderful place to engage spirituality \n A wonderful place to engage spirituality We were the first through the doors and although not Christian, had a special experience. We tried very hard to show respect throughout, not venturing where prohibited and whispering always in hushed tones. The Russian women who arrived a half hour after us did not seem to  feel the same way and shouted to each other repeatedly across the property. I nearly confronted them for their arrogance. Of course, staff beat me to that. We would like to have reieved more respect from staff ourselves. They were vague when asked about liturgical services dates/times, despite the fact that we were renting a house from them. One male staffer on the main floor also mocked our efforts to document the property photographically, not realizing that we speak and understand a little Greek. Shame that both lookout vistas at the 'primahiolia' belfrey tower and also the museum terrace are now closed to visitors. They were once the amongst the very best sunrise points on patmos. Whatever. You will love this place especially if you come right at opening time. *The opening hours posted both on the large official poster just to the left of the entry and also reproduced in tourism pamphlets are incorrect. Perhaps this might be remedied by those in high places? *BTW, the 'Byzantine Icons' shop run by friendly Costas just at the bottom of the entry ramp sells top quality art reproduction souvenirs and more. His products include religious paintings done by actual monks themselves. Visitors may want to read Jeffrey Siger's 'Midnight in Patmos' crime novel beforehand. Take my advice and also give a listen to acoustic guitarist Don Ross' oh-so evocative masterpiece 'Patmos', from his CD 'Bearing Straight'. Genius. Also, know that the homes just behind the Monastery are the oldest quarter of Chora. Rumour has it that some very famous folks own holiday homes there, including Ziggy Stardust, Forrest Gump plus Erin Brokovich. I am done. The end.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","religious_self_id":"spiritual_not_religious","recognizes_active_institution":1,"facility_complaints":["area_access","access_hours","photography_restrictions"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'although not Christian' → spiritual_not_religious; lookout vistas + museum terrace closed → area_access","atmospheric_register":1}},"990":{"id":990,"site":"monastery","plat":"tripadvisor","rating":"4","text":"A place to see \n A place to see Walking through the narrow streets of Hora in the vicinity of the monastery. A wonderful view of the island from the top of the monastery.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"wonderful view of the island from the top of the monastery","religious_register":["conventional"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"991":{"id":991,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Святая Земля \n Holy Land\n\nWe arrived on Patmos by catamaran from the island of Kos. We booked a tour through a travel agency. You can go independently, and it will be almost twice as cheap. But we didn't regret it — they drove us by car to the hotel and to the Church, and we also had an excellent guide named Stepan, who told us about all the sights in great detail and in a very engaging way. As for the Church itself, you can already feel as you approach that this is truly a Holy place. Furthermore, there were no other visitors that day besides us — no one disturbed us from praying, reflecting, or simply enjoying the peace and grace of the Holy site. We visited the Church again the next day, but in the morning American tourists from a cruise ship arrived — very loud and, apparently, not understanding where they had come to. One middle-aged woman, in order to fix her shoe, leaned against the iconostasis as if it were just a wall! The view from the monastery over the island is magnificent — the panoramas are of extraordinary beauty; the monastery has beautiful frescoes, icons in the cave and in the church, as well as a museum. If you come — you won't regret it. It is better to come for two or three days, so you can look at everything in detail. You don't have to book a hotel in advance: as soon as you step ashore, at the exit from the port there is a row of touts from hotels and hostels for every taste and budget.","codes":{"trip_mode":"overnight","ascent_mode":"motorized","tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","motivation_religious":1,"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"leaned-against-iconostasis tourist anecdote; Russian visitor frames site as Holy","devotional_participation":1,"topography_register":1,"view_centrality":"mentioned"}},"992":{"id":992,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Must see \n Must see A visit to the monastery and surrounding village of Chora is definitely a must when visiting Patmos.  \nHiring a scooter is the best way to get there in the summer season as it's very hot walking up the hill.  The monastery is in it's original state, and it's museum has very old chalkies and artefacts dating centuries. A maze of narrow streets takes you through the surrounding village.  The views ate amazing. Look out over Patmos and the surrounding islands.","codes":{"ascent_mode":"motorized","elevation_mention":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","weather_complaints":["heat"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"993":{"id":993,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Christian or not, the Monastery & the Cave of the Apocalypse are unmissable. \n Christian or not, the Monastery & the Cave of the Apocalypse are unmissable. I suggest taking the bus from Skala up to Hora (1.5 euro) visiting the monastery and then taking the downhill 4 km. Byzantine pilgrim's trail back to Skala which passes St. John's Cave of the Apocalypse. Whether you're a Christian or not, both are unmissable, but keep in mind that you'll need to be reasonably fit.\n The fortified monastery allows spectacular views over the island and the museum library houses some truly beautiful and rare manuscripts/icons/liturgical robes/jewelled chalices and a great deal more.  The Cave of the Apocalypse, where St. John is reputed to have written the Book of Revelation, is downhill a kilometre or so and is a place of reverence and wonder - even for this atheist.  Entry to both is very reasonable and helps towards their maintenance. Tip: please respect the \"no photo\" request, The Cave of the Apocalypse is particularly vulnerable to flashlight and the noise of digital cameras.","codes":{"tourist_mode":"institutional_aware","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"the bus from Skala up to Hora","religious_register":["conventional","doctrinal"],"mediation":"hedges","effort_valence":"ambivalent","sensory_modalities":["vision"],"enclosure_exposure":"both","religious_self_id":"secular_atheist","mimetic":1,"mimetic_engagement":"relayed","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'place of reverence and wonder - even for this atheist' — joins atheist-but-felt-something cluster (406)","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"walked"}},"994":{"id":994,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Very Byzantine, Best Views of the Island \n Very Byzantine, Best Views of the Island If you're interested in everything Byzantine, you will love the Monastery of St. John. The church is magnificent and the views from any direction of the island  are just great.  Do not miss the opportunity to visit the museum that houses artifacts from the Byzantine era that are priceless.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"central"}},"995":{"id":995,"site":"monastery","plat":"tripadvisor","rating":"3","text":"απογοητευση.. \n disappointment..\n\nI really wanted to write something nice, but setting aside the walk through nature and the gorgeous view, nothing else attracted me and I felt no sense of reverence whatsoever — and not because I'm a Christian, but because I didn't hear or see anything related to Christianity. It's the second time I've visited Patmos and specifically the Monastery, but it feels more like a tourist attraction where, since we can't charge an entrance fee, we try to achieve that revenue through other means. There is a museum with a 4-euro admission if I remember correctly — nothing worth seeing, in my opinion.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"effort_valence":"positive","worth_assessment":"not_worth_it","enclosure_exposure":"exposed","religious_self_id":"christian_general","nature_mention":1,"nature_sub_codes":["natural_beauty_praise"],"austerity_register":"negative","facility_complaints":["commerce","prices"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'not because I'm a Christian, but because I didn't hear or see anything related to Christianity' — christian_general self-ID + solemnity-disappointment cluster (885, 831, 966)","view_centrality":"mentioned"}},"996":{"id":996,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Le poids de l’histoire règne ici ! Exceptionnel \n The weight of history reigns here! Exceptional\n\nWe won't recount the history of the monastery — guides do that much better! Let's just say it's the monastery that made Patmos famous, at a time (the 1960s and 70s) when most tourist activity consisted of cruise ship stopovers that dropped passengers off for this one visit. Well, back then, there were no coaches or traffic jams at the foot of Chora's first houses: cruise passengers would ride up from Skala on donkeys, taking the magnificent cobblestone path running along the hillside from Skala to Chora (it's still there! Recommended, especially for the descent if you're wary of the climb up. Though you won't have the view of Chora that way!).\nThe Monastery of Saint John is obviously unmissable, and having been coming to Patmos for nearly 45 years, there is no stay on the island without us visiting it again. It is a shame, however, that it is no longer possible, as it used to be, to walk on its terraces, which offered a 360° view of the island and the Aegean Sea. Due to a suicide — true story! You'll only get to see the photos taken in the early 70s to give you a sense of that exceptional panoramic view.\nDon't miss the monastery museum, which contains some magnificent ancient pieces.\nAnd if you're staying on the island, avoid coming when the cruise ships are there!","codes":{"trip_mode":"extended_stay","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"cobblestone path running along the hillside from Skala to Chora","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["area_access","crowding"],"tone_toward_constraints":"frustrated","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"45-year repeat visitor; terrace 360° view closed due to a suicide → area_access","acknowledges_historical_cultural":1,"view_centrality":"central","descent_mode":"walked"}},"998":{"id":998,"site":"monastery","plat":"tripadvisor","rating":"5","text":"An Historic and Sacred Place \n An Historic and Sacred Place We very much enjoyed touring this historic complex.  It houses some impressive treasures, but the best part of a trip here is witnessing the rituals and the lighting of candles (the only source of lighting in certain sanctuary areas.  Beware of the surly cat in the courtyard.  \n\nNote: Dress appropriately or you will be provided something to cover yourself.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"sensory_modalities":["vision"],"recognizes_active_institution":1,"facility_complaints":["dress_code"],"tone_toward_constraints":"accepting","review_is_useful":1,"devotional_participation":1,"acknowledges_historical_cultural":1,"on_site_movement":["walking_around"]}},"999":{"id":999,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Stunning \n Stunning What a fantastic imposing building and well worth the three hour boat trip from Kos. So serene with the quiet only broken by the ringing of the monastery bells. Stay and sit awhile and enjoy fantastic views over the wonderful island of Patmos. Would recommend that you take the bus from the harbour up to the top of the hill, visit the monastery, and then walk down to the cave where St John wrote Revelation. Truly felt the presence of God and will definitely go back again someday.","codes":{"ascent_mode":"motorized","elevation_mention":1,"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","sensory_modalities":["sound"],"enclosure_exposure":"exposed","mimetic":1,"mimetic_engagement":"relayed","worth_assessment":"worth_it","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Truly felt the presence of God' — embodied mystical at the monastery","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"walked","on_site_movement":["posture_pause"]}},"1001":{"id":1001,"site":"monastery","plat":"tripadvisor","rating":"4","text":"pace e serenità. \n peace and serenity.\n\nA monastery surrounded by Chora. It is a place of absolute peace that instills serenity. The church inside features truly remarkable decorations. The panorama at the entrance to the monastery is very beautiful and allows you to see Skala and the port as well. For foreign tourists the cost is 4 euros (entrance to the church and museum); for Greeks, the museum costs 2 euros.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"panorama at the entrance to the monastery... allows you to see Skala and the port","religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"1003":{"id":1003,"site":"monastery","plat":"tripadvisor","rating":"4","text":"κατάνυξη \n Reverence\n\nGrandeur within its simplicity, it stands out across the entire island. Exquisite architecture. A religious treasure of our country and beyond.","codes":{"religious_register":["conventional"],"austerity_register":"appreciative","review_is_useful":1,"coding_notes":"'religious treasure of our country' — implicit Greek/Orthodox; held to unspecified self-ID per v1.1","atmospheric_register":1}},"1004":{"id":1004,"site":"monastery","plat":"tripadvisor","rating":"5","text":"κατάνυξη και ηρεμία \n Reverence and tranquility\n\nThe setting and surroundings of the monastery, the church, and the view from the top. The information provided by the local monks and laypeople was very good. The atmosphere of respect and reverence evoked feelings in Orthodox Christians, Catholics, and people of other faiths alike.","codes":{"elevation_mention":1,"religious_register":["conventional","mystical"],"mediation":"relays","enclosure_exposure":"exposed","recognizes_active_institution":1,"review_is_useful":1,"atmospheric_register":1,"view_centrality":"mentioned"}},"1005":{"id":1005,"site":"monastery","plat":"tripadvisor","rating":"4","text":"vistas \n views\n\nIt is one of those cruise destinations that is worth visiting, for the views from above. It is recommended to rent a motorcycle for 20 euros and ride the 4 km up.","codes":{"trip_mode":"cruise_excursion","ascent_mode":"motorized","elevation_mention":1,"enclosure_exposure":"exposed","worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"view_centrality":"central"}},"1007":{"id":1007,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Da vedere \n A must-see\n\nYou find yourself immersed in an atmosphere of spirituality — a beautiful experience! Be sure to check the hours and closing day. You can visit and appreciate it, I believe, even without a guide.","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"1008":{"id":1008,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Απιστευτο \n Incredible\n\nIt is incredible. It is no coincidence that the monastery can be seen from almost everywhere on the island. Grandeur within its simplicity. One visit is not enough — you live the past in the present, and every time you see something different.","codes":{"elevation_mention":1,"topography_quoted_phrase":"the monastery can be seen from almost everywhere on the island","religious_register":["conventional"],"austerity_register":"appreciative","review_is_useful":1}},"1009":{"id":1009,"site":"monastery","plat":"tripadvisor","rating":"4","text":"interessante \n interesting\n\nA very enjoyable excursion up to Chora for the lovely walk and for the spectacle of the monastery with its beautiful rooms to visit.","codes":{"ascent_mode":"walked","elevation_mention":1,"religious_register":["conventional"],"effort_valence":"positive","review_is_useful":1}},"1010":{"id":1010,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Fulfilling \n Fulfilling A fantastic walk up the hill, stopping off a the cave on the way and being blessed with a service happening at that moment. The monastery was a wow fact in history","codes":{"ascent_mode":"walked","elevation_mention":1,"religious_register":["conventional"],"effort_valence":"positive","recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1012":{"id":1012,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Päiväretki Samokselta Patmokselle \n Day trip from Samos to Patmos\n\nA wonderful day trip for our family of 3 adults. About 2.5–3 hours by boat each way. You can enjoy the sea and the islands. The island of Patmos is much smaller than Samos — beautiful, peaceful, and well-maintained. The light and scenery on the island are truly impressive. We had a very good, highly multilingual local guide who knew how to lead us to see the essential things in a short amount of time. We visited the Cave of the Apocalypse and the monastery. In the cave, the monastery, and its museum there is so much beautiful to see — the atmosphere is moving.\nOnly light snacks are sold on the boat, so it is worth eating a hearty breakfast before the trip or packing food for the journey and having lunch on Patmos.","codes":{"trip_mode":"day_trip_ferry","religious_register":["conventional","mystical"],"mediation":"relays","sensory_modalities":["vision"],"enclosure_exposure":"both","nature_mention":1,"nature_sub_codes":["seascape"],"review_is_useful":1,"topography_register":1}},"1013":{"id":1013,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A Must see! \n A Must see! Regardless of being an Orthodox, or even a religious person, a visit in the Monastery of st John (and the Cave of the Apocalypse as well), is an absolute must when visiting Patmos.\n\nThe Monastery itself is so impressive and seductive when looking at it from the port, that it really invites you to visit it.\n\nIt is a beautiful, really interesting place to see, not only in terms of religious or historical value, but also as a construction and landscape. \n\nThe visit will last a couple of hours and it's really worth visiting the small museum as well. The price is minimal (2 euros)\n\nIt would be nice to read some information about the history of the place before going up for a visit.\n\nAlso, a breathtaking view from the top, the Aegean landscape at its best :)","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"looking at it from the port... view from the top","religious_register":["conventional","doctrinal"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"1014":{"id":1014,"site":"monastery","plat":"tripadvisor","rating":"4","text":"monastere \n Nice monastery, but we would have liked a thorough guided tour, which was not the case... there is a lack of explanation for all these magnificent icons, and despite our request no one was available to explain them to us.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"facility_complaints":["signage"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"1015":{"id":1015,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Klooster van Johannes \n Monastery of Saint John\n\nUpon entering (after a bit of a steep climb), you are enveloped by silence and calm. Beautiful monastery, friendly monks. Definitely worth a visit.\nAfterward, a bit lower on the mountain, you can visit the cave where John is said to have written the Book of Revelation.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"after a bit of a steep climb","religious_register":["conventional","doctrinal"],"mediation":"relays","effort_valence":"positive","sensory_modalities":["sound"],"recognizes_active_institution":1,"worth_assessment":"worth_it","review_is_useful":1,"atmospheric_register":1,"topography_register":1}},"1016":{"id":1016,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Δεος και επιβλητικοτητα \n Awe and grandeur\n\nAwe, grandeur, and reverence. The monastery constitutes the Holy Places of Greece. Stunning architecture and a view of the endless blue. It is worth visiting.","codes":{"religious_register":["conventional","mystical"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"atmospheric_register":1,"view_centrality":"mentioned"}},"1017":{"id":1017,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Patmos Highlights \n Patmos Highlights We visited the Cave of the Apocalypse and the Monastery.  I am soooo glad we decided to to use True Greece's suggestion to do a tour.  We had a private tour and it was so worth the money.  Nikolaus, our guide, was so very pleasant, informed, and made the trip so interesting.  There is an element you miss if you just visit these sites without a guide.  \n\nAnd the history and atmosphere of being in such a spiritual and historical place was a wonderful experience.  Don't miss seeing this on your visit.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1019":{"id":1019,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Волшебно \n Magical\n\nAn amazing place — I deeply regretted coming to the island for just one day. The frescoes are simply mesmerizing; I didn't even notice that I had spent a full 3 hours in the monastery. Keep in mind that the monastery and the Cave of the Apocalypse are only open in the morning, and if you don't hurry, you may not manage to visit both.","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1}},"1021":{"id":1021,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Absolutely a must see!! \n Absolutely a must see!! Wow, the views from up at the monastery are some of the best in Greece! Incredible to see this and of course the Cave of the Apocalypse which it surrounds.  To think that Revelations was inspired and written here! incredible!","codes":{"elevation_mention":1,"topography_quoted_phrase":"views from up at the monastery","religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"central"}},"1024":{"id":1024,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Δέος \n Awe\n\nAwe and reverence. We visited the site by walking from the port of Skala along a footpath. At the end of the beautiful route we arrived and descended into the cave to feel an intense sense of awe and religious emotion.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"walking from the port of Skala along a footpath","religious_register":["mystical","conventional"],"enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'descended into the cave to feel an intense sense of awe and religious emotion' — quotable embodied awe","atmospheric_register":1,"topography_register":1,"on_site_movement":["stairs_down"]}},"1026":{"id":1026,"site":"monastery","plat":"tripadvisor","rating":"4","text":"belo monasterio \n Beautiful monastery — like every Orthodox site, it's gorgeous. Worth visiting even if you're not religious. It alone makes the trip to Patmos worthwhile.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"1027":{"id":1027,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Un grand moment \n A great moment A great moment of history: the Monastery of Saint John is built on a high point of the island of Patmos, where Saint John is said to have written his gospel. It is also a great moment for tourism: from the monastery and the Chora that surrounds it, you can take in almost the entire island — the view is exceptional in every direction. It seems impossible to come to Patmos without going up to this beautiful monastery.","codes":{"elevation_mention":1,"topography_quoted_phrase":"built on a high point of the island","religious_register":["doctrinal"],"mediation":"relays","worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"central"}},"1028":{"id":1028,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Monestary - Monastics \n Monestary - Monastics A glimps into the ancient world of the monastics - Quite amazing! The religious art, fortress like architecture and  observing the monks performing Holy Week services was life changing.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"Holy Week services observed; life changing","devotional_participation":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1029":{"id":1029,"site":"monastery","plat":"tripadvisor","rating":"5","text":"un luogo di luce e di vento \n a place of light and wind — it is a special, wonderful place. Go very early in the morning; there are very convenient scheduled buses that take you to the foot of the monastery, the last stretch is uphill on foot. There is the cave where St. John wrote the Book of Revelation.","codes":{"ascent_mode":"mixed","elevation_mention":1,"topography_quoted_phrase":"the last stretch is uphill on foot","religious_register":["doctrinal"],"mediation":"endorses","wind_mention":1,"wind_register":"literal_atmospheric","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'a place of light and wind' — first wind=1 of the corpus pass; atmospheric register","nature_mention":1,"nature_sub_codes":["natural_beauty_praise"],"topography_register":1}},"1030":{"id":1030,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Κατάνυξη και Δέος \n Reverence and Awe It's worth visiting the monastery — wonderful historic religious relics, parchments, holy books. It's not just the interior of the Monastery but also the surrounding area that will make you want to stay a little longer. The tourist shops along the road to the monastery have good prices on the souvenirs they sell. If you find yourself in port for just a few hours (e.g., on a cruise ship visit), don't have your own car, or don't want to rent one, you can arrange with a taxi driver to take you first to the \"lower church\" of Saint John, wait for you, and then take you to the entrance point for the Monastery, and come back to pick you up in 1-2 hours. Especially for those visiting the island on a cruise ship, financially speaking, this approach is more economical than paying for the excursion through the ship.","codes":{"ascent_mode":"motorized","religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"descent_mode":"motorized"}},"1031":{"id":1031,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Superbe et à ne pas rater \n Superb and not to be missed You can also rent a car for the day for 20 euros and go visit this place. It's good to first stroll through the narrow streets and soak in the atmosphere and the spirituality. The visit can be done at your own pace. The chapel houses magnificent icons. The paintings in front of the chapel deserve more than a glance — you should try to decipher their meaning. The museum houses splendid objects. After the visit, you can enjoy a coffee looking out over the white town of Skala. Visiting this place outside of the crowds allows you to truly feel its atmosphere.","codes":{"ascent_mode":"motorized","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"looking out over the white town of Skala","religious_register":["mystical","conventional"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned","descent_mode":"motorized","on_site_movement":["walking_around"]}},"1032":{"id":1032,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Worth the Visit \n Worth the Visit Well worth the visit, interesting and inspiring, lots of relics, exquisite frescoes, religious art, the treasury and the museum are worth the visit.  Lots of steps as built as a fortress, yet worth the visit to be at the site where it is said St. John wrote the gospel and received the visions of the last book of the New Testament.","codes":{"elevation_mention":1,"topography_quoted_phrase":"Lots of steps as built as a fortress","religious_register":["conventional","doctrinal"],"mediation":"relays","effort_valence":"ambivalent","worth_assessment":"worth_it","sensory_modalities":["vision"],"mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["stairs_up"]}},"1033":{"id":1033,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Inspiring \n Inspiring For the Christian believer this is truly an inspiring place to visit. As is  the cave where St John received the revelation from God. Unforgettable experience!","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"'For the Christian believer' addresses reader, not self-ID","topography_register":1}},"1034":{"id":1034,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Stupendo! \n Stunning! Beautiful fortified monastery that towers over the small town of Chora.\nIn addition to the church, you can visit part of the cloisters.\nVery well maintained, well worth a visit!","codes":{"elevation_mention":1,"topography_quoted_phrase":"towers over the small town of Chora","religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"1035":{"id":1035,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Πολυ καλο. Εξαιρετικο το μουσειο της μονης. \n Very good. The monastery's museum is excellent. An active men's monastery, worth visiting. The church has an outstanding iconostasis and frescoes, and the monastery's museum is one of a kind.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1}},"1037":{"id":1037,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Επιβλητικη μονη \n Majestic monastery I was lucky enough to find myself on this beautiful island, and the first thing I read when I arrived at the port was a sign that said \"Welcome to our island. Respect our customs and traditions.\" And of course I couldn't do otherwise, as I looked up and saw this majestic monastery standing high above. When I visited it, I made a vow that I would return — and so I did. I was lucky enough to meet some of the monks and be welcomed as their guest for lunch. Is it even possible to go to Patmos and not visit the monastery? It's in a beautiful location with a magnificent view, but the most important thing is its interior and its exhibits. The following evening as we were traveling, seeing it lit up from the boat, I made a vow to go there for Easter...","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"this majestic monastery standing high above","religious_register":["mystical","conventional"],"sensory_modalities":["vision"],"recognizes_active_institution":1,"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"made a vow to return; lunch with monks; vow to return for Easter","view_centrality":"mentioned"}},"1038":{"id":1038,"site":"monastery","plat":"tripadvisor","rating":"4","text":"de pelgrimsplek \n the pilgrimage site The monastery is an oasis of calm. The monks have all the time in the world to talk with you and answer all your questions.","codes":{"religious_register":["mystical","conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"1039":{"id":1039,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A steep walk up to a beautiful place \n A steep walk up to a beautiful place We visited Patmos whilst we were on a cruise. The walk was graded 2 but should have been a 4 as there are lots of steps up to the monastery and its not easy for people who find walking hard. The monastery is very interesting and worth the walk. The museum is also worth a visit. The guide books are  very informative.","codes":{"trip_mode":"cruise_excursion","ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"lots of steps up to the monastery","effort_valence":"ambivalent","worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"on_site_movement":["accessibility_concern","stairs_up"]}},"1040":{"id":1040,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Monastery st. john in Chora \n Monastery of St. John in Chora As you sail into the harbor of Patmos, you can see the small town of Chora perched at the top of the big mountain. In the center, at the upper part of this town, stands the beautiful old monastery. It is a magnificent men's monastery, once built by the residents of Kampos (a bay on the other side of the island). In those ancient times, the men walked or took their small boats back and forth every day to do the construction. Later, the town was built around it.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"perched at the top of the big mountain","religious_register":["conventional"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1041":{"id":1041,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Mágico \n Magical At the moment I visited, a Mass was being celebrated — truly fantastic, it was a magical moment full of energy! Worth it and I recommend it. You climb quite high on the island and then go down many stairs to reach the site!","codes":{"elevation_mention":1,"topography_quoted_phrase":"climb quite high on the island and then go down many stairs","religious_register":["mystical","conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"Mass being celebrated — 'magical moment full of energy'","devotional_participation":1,"energy_register":1,"on_site_movement":["stairs_down"]}},"1042":{"id":1042,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A thousand photos later..... \n A thousand photos later..... Got the hire car and set off for the monastery and holy cave of St John. The road was very steep amd narrow. Went to the cave first and into the chapel inside it. Couldn't take pictures but bought postcards. Very large comfortable cave with a fairly small building over it. Amazing to think that this where St John dictated the book of Revelations. Great views of Patmos from here.\n\nThen drove even further up this steep road to the top where the monastery is. It's a beautiful building, all white washed walls, brilliant bougainvillea, and little courtyards. Took lots of photos, the view was even better here. The museum in the monastery has some very ancient books with beautiful decorations and pictures.\n\nThere are lots of shops on the steep narrow road that leads between old buildings from the car park to the monastery . We browsed in a few, and when we came down, stopped for lunch at a cafe overlooking the view, which was lovely. Had nice omelettes and a salad.","codes":{"ascent_mode":"motorized","elevation_mention":1,"topography_quoted_phrase":"steep road to the top where the monastery is","religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"both","mimetic":1,"mimetic_engagement":"enacted","nature_mention":1,"nature_sub_codes":["flora_fauna"],"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'Amazing to think that this where St John dictated' — enacted mimetic at cave","topography_register":1,"view_centrality":"mentioned","descent_mode":"mixed","on_site_movement":["walking_around"]}},"1044":{"id":1044,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Viver a história \n Living history Inside the monastery there is a museum (paid separately) that despite being small is fascinating — these are true religious relics, well worth it. There are quite a few stairs and there is only one bus that does the route; if you miss it, it's on foot. But the view from the top is fantastic.","codes":{"elevation_mention":1,"topography_quoted_phrase":"the view from the top is fantastic","religious_register":["conventional"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"1046":{"id":1046,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Worth a visit! \n Worth a visit! The monastery and the cave were the two main reasons we came to Patmos. The monastery was beautiful and had a nice museum.  While we were there, one of the priests stopped by and said to my wife:  \"You look very peaceful and happy.\"  She replied, \"I am.\" \n\nHe stayed talking with us for quite a while, telling us some about his past and about his philosophies.  Very interesting!","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"worth_assessment":"worth_it","motivation_religious":1,"review_is_useful":1,"coding_notes":"'monastery and the cave were the two main reasons we came to Patmos' — religious sites as primary draw + priest encounter","topography_register":1}},"1047":{"id":1047,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Lindo! \n Beautiful! Incredible view, but very windy so you have to be careful. The place is quite high up, with an incredible view of fira. Besides the historical aspect. A mountain with a trail, no charge. There's a very old little church of the Prophet Elias. The place gives off peace!","codes":{"elevation_mention":1,"topography_quoted_phrase":"place is quite high up, with an incredible view","religious_register":["conventional"],"wind_mention":1,"wind_register":"literal_nuisance","weather_complaints":["wind"],"enclosure_exposure":"exposed","review_is_useful":1,"coding_notes":"appears to describe Profitis Ilias hike+chapel rather than monastery; second wind=1 of batch","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"central"}},"1050":{"id":1050,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Almost magical! \n Almost magical! St. John's Monastery in Chora had somewhat of a magical feel to it.  The tour itself wasn't all that long and you couldn't see much of the Monastery, but there's such a calm and peaceful energy about this place.  You can walk around the town of Chora, visit some of the shops, check out the local artists (incredibly talented by the way), eat some fantastic food and drink some great wine, no matter where you are in Chora and around the Monastery, it's just peaceful.  There some pretty amazing views and the architecture is like none other.  We spent some time conversing with one of the monks as he blessed a prayer cloth for us.  People are amazingly friendly.  We met a local artist who produced phenomenal pieces.  She took us up the road a bit to a great restaurant with fantastic views with the nicest owners who talked to us about local history, etc.  It was honestly my favorite place on our honeymoon visit.","codes":{"religious_register":["mystical","conventional"],"recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"monk blessed a prayer cloth — under-coded as not devotional_contact (passive reception, not the listed acts)","energy_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"1053":{"id":1053,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Indescritível \n Indescribable Being in that place is something magical. You walk a lot to get there, but what you find there is indescribable. Sacred. It surpasses your expectations.","codes":{"ascent_mode":"walked","religious_register":["mystical","conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"1054":{"id":1054,"site":"monastery","plat":"tripadvisor","rating":"5","text":"un pezzo di storia e d'arte da vedere assolutamente \n a piece of history and art absolutely worth seeing The monastery was founded in 1088 by the Blessed Christodoulos on the island that hosted the apostle John for 2 years (95 and 96 AD), where he wrote the Book of Revelation. Since then the monastery has grown and become richer, and it is still alive today, welcoming tourists and pilgrims.\nGoing there just as it opens is a memorable experience: once you pass through the gate of what from the outside looks like a mighty and impregnable medieval fortress and arrive in the inner courtyard — where the intense light of the Greek sky is framed by 3 pointed arches — on your left you will find the fully frescoed outer narthex: step through the door and enter the inner narthex. Here, the silence and the semi-darkness lead you to the main church (Katholiko), a treasure chest of works of art, dominated by the gilded wooden iconostasis.\nAnd beside the Katholiko don't forget the 12th-century chapel of the Virgin Mary with the oldest frescoes in the complex, though greatly deteriorated, and finally the chapel containing the remains of the Blessed Christodoulos.\nAnd don't forget to visit the museum, which holds among other things manuscripts dating back to the 6th century (that alone would be worth a trip).","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","recognizes_active_institution":1,"sensory_modalities":["vision","sound"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"richly descriptive Italian review of narthex/Katholiko/Christodoulos chapel","motivation_historical_cultural":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"on_site_movement":["walking_around"]}},"1058":{"id":1058,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Nice views \n Nice views Monastery, but to be quite honest, nothing special. You are actually not able to see much of the monastery. Beautiful church, a museum, stunning views. In a beautiful white town Chora with a few shops, cafes and restaurants. View is here the thing.","codes":{"religious_register":["conventional"],"tourist_mode":"tourist_consumer","facility_complaints":["area_access"],"tone_toward_constraints":"frustrated","enclosure_exposure":"exposed","review_is_useful":1,"coding_notes":"'nothing special... view is here the thing' — attraction-frame disappointment","view_centrality":"central"}},"1059":{"id":1059,"site":"monastery","plat":"tripadvisor","rating":"4","text":"bello il monastero, meno il museo.. \n The monastery is beautiful, the museum less so.. We're not big fans of icons and statues, so the museum didn't excite us.\nThe monastery has a nice atmosphere and distinctive architecture, but we expected larger areas to explore.\nFor 4 euros per person though it's more than acceptable.\nThe town of Hora is worth a visit — with its maze of narrow alleyways that surrounds the monastery.","codes":{"religious_register":["conventional"],"tourist_mode":"tourist_consumer","facility_complaints":["area_access"],"tone_toward_constraints":"accepting","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'expected larger areas to explore' + 'not big fans of icons and statues' — consumer frame, not religious self-ID"}},"1062":{"id":1062,"site":"monastery","plat":"tripadvisor","rating":"4","text":"A holly monaster in Orthodox world \n A holly monaster in Orthodox world It is worth seeing. A lot of religion related groups coming all over the world to visit this monaster.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"1063":{"id":1063,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Monastero di rara bellezza \n Monastery of rare beauty The Monastery dominates the entire island of Patmos and has a sweeping view over the town of Skala. Equally splendid is the view from Skala of what looks like a castle on the peak of the mountain, but is actually the Monastery of St. John the Theologian. The interiors and frescoes are gorgeous. Unfortunately, photos inside the church are not permitted. The treasury room contains extremely valuable manuscripts, precious icons, paintings, incense burners, crosses, miters, and sacred vestments. I found it useful to purchase the Guide to the Holy Monastery to better remember this visit. An absolutely must-visit place.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"looks like a castle on the peak of the mountain","religious_register":["conventional"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"1064":{"id":1064,"site":"monastery","plat":"tripadvisor","rating":"5","text":"großartig \n outstanding The monastery is an incredibly spiritual place. The silence, the tranquility — it is easy to collect your thoughts and focus there. If you're not religious: you could become so there.\n\nAnd the museum in the monastery is a must-see, with many interesting exhibits, especially a depiction of Christ by El Greco.","codes":{"religious_register":["mystical"],"sensory_modalities":["sound","vision"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'silence and tranquility'; El Greco depiction; 'if you're not religious: you could become so' addresses reader","atmospheric_register":1}},"1067":{"id":1067,"site":"monastery","plat":"tripadvisor","rating":"5","text":"ΚΑΤΑΝΥΞΗ \n REVERENCE It is about 3.5 kilometers from the port, while Chora is about 1 kilometer away. All distances can be covered on foot, and the uphill paths are manageable.\nPhotography and video are prohibited (inside the cave), and there is no access for people in wheelchairs. The steps are accessible but become a bit steep at the end, while parking on the roadside outside is easy.\nRegardless of what faith you belong to, even if you're an atheist, this particular cave will enchant you. For Christians it is a Holy place. Not only for us who belong to the Eastern Orthodox Church, but for everyone. It inspires respect even in Muslims — notably, Mehmed II the Conqueror respected it (as did the other sultans).\nReverence, calm, anticipation, waiting, and anxiety are the feelings it evokes in you.\nThe icons are rare (there is a depiction of Christ at an old age) as are the markings in the cave.\nDon't hesitate to light a candle, even if you are not a Christian.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"uphill paths are manageable","religious_register":["conventional","doctrinal"],"effort_valence":"positive","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","religious_self_id":"orthodox","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'for us who belong to the Eastern Orthodox Church' → orthodox; metadata=monastery but text is cave","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"on_site_movement":["accessibility_concern","stairs_down"]}},"1068":{"id":1068,"site":"monastery","plat":"tripadvisor","rating":"5","text":"tipico monastero \n typical monastery The monastery looks more like a castle... its walls rise up and can be seen even from the sea... the atmosphere is typical of silence and prayer — you can tell you are in a place of prayer.","codes":{"elevation_mention":1,"topography_quoted_phrase":"walls rise up and can be seen even from the sea","religious_register":["conventional","mystical"],"sensory_modalities":["sound"],"review_is_useful":1,"atmospheric_register":1,"topography_register":1}},"1069":{"id":1069,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Peaceful \n Peaceful A very old, beautiful and picturesque monastery with an inside courtyard full of flower pots. It's situated on the top of a hill so you'll be needing comfortable flat shoes to reach the site. Make sure you visit by yourself and not as part of a noisy group in order to enjoy the peacefulness and beauty of the place, and make sure you find the time to visit the surrounding area, enjoy the view and take lots of pictures.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"situated on the top of a hill","religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","nature_mention":1,"nature_sub_codes":["flora_fauna"],"facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"1070":{"id":1070,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Beautiful place \n Beautiful place We travelled here from Samos.  Our holiday rep advised organising our own transport rather than taking the set tour and she was right.  We travelled by Flying Dolphin and arrived at Patmos at 9am.  The local bus met the boat and meant we reached the monastery as it was opening and so it was very quiet and peaceful and we had a chance to talk with one of the monks.\n\nWe strolled back down to the port by footpaths, stopping at the Cave of the Revelation on the way. This visit was one of the highlights of our holiday and we had no objections to paying the 4E entry fee, which included the museum containing the treasures of the monastery.","codes":{"ascent_mode":"motorized","trip_mode":"day_trip_ferry","religious_register":["conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"topography_register":1,"descent_mode":"walked"}},"1071":{"id":1071,"site":"monastery","plat":"tripadvisor","rating":"5","text":"St. John's cave (Revelation of God), Patmos \n St. John's cave (Revelation of God), Patmos We sailed via the Agean sea from Kusadasia to Samos and then took another ship to Patmos. Pythagoreion- Port in Samos has a difficult terrain and travelers should be aware of it. When travelling via ships and ferries it is better to limit your luggage as there are no trolleys in the ports. To visit St.John’s (Theologian) tomb it is better to go by taxi which will cost about Eur 5 oneway.\nIn Patmos we visited St. John's cave where he got the divine revelation.  Patmos island is indeed a unique ex
