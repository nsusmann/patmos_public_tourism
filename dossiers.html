eu o Apocalipse. \n Cave where Saint John wrote the Book of Revelation. According to scholars, this cave is the place where Saint John the Evangelist wrote the Book of Revelation. Access is difficult for people with disabilities and the elderly, as there are many stairs with very high and uneven steps on site. The cave is quite simple and it is not possible to take photos of its interior.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","worth_assessment":"worth_it","austerity_register":"appreciative","facility_complaints":["photography_restrictions","amenities"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'According to scholars' hedges; uneven steps for disabled = amenities","topography_register":1,"on_site_movement":["accessibility_concern"]}},"413":{"id":413,"site":"cave","plat":"tripadvisor","rating":"3","text":"Gruta simples sem muito para ver \n Simple cave with not much to see It is said that it was in this cave that John wrote the Book of Revelation.\nThe cave is simple, with not much to see.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","worth_assessment":"mixed","review_is_useful":1,"topography_register":1}},"414":{"id":414,"site":"cave","plat":"tripadvisor","rating":"5","text":"Il monastero dell'Apocalisse \n The Monastery of the Apocalypse Even though it doesn't seem particularly far, I strongly recommend taking the local bus that departs from the port of Skala to get there, as the road is very steep and tiring especially under the scorching sun. The monastery is built over the cave where Saint John received the divine revelation, and inside there is only the stone that the saint used as a pillow and the three crevices in the ceiling from which he heard the voice of God.","codes":{"ascent_mode":"motorized","visit_season":"peak_may_aug","elevation_mention":1,"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","weather_complaints":["heat","sun_exposure"],"review_is_useful":1,"sensory_modalities":["embodied"],"topography_register":1}},"421":{"id":421,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A monastery to visit \n A monastery to visit Patmos is a picturesque island offering breathtaking views. From the port, you can see the three mills and the monastery... A \"favorite\" destination. \n\nWe visited the monastery of Saint John the Theologian (the Evangelist) and its Byzantine frescoes. Founded in 1088, it is built as a medieval fortress. Here you can admire several frescoes and a richly decorated chapel. The library, which cannot be visited, contains several hundred rare manuscripts, including the famous Codex Purpureus. \n\nPlease note that the knees and shoulders must be covered for the visit. Photos are forbidden in several places.\n \nWe went there at the beginning of November. The weather was sunny with a temperature of about 20 °C. The place is very popular with travelers. Although we were out of season, several buses started arriving in the early morning, so we advise you to get there as soon as it opens so you can enjoy it to the fullest. \n\nThe terrain is very uneven. Allow about 3 hours for this tour.","codes":{"visit_season":"off_peak_nov_mar","religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision","embodied"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["photography_restrictions","area_access","crowding"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"Nov visit; 'library cannot be visited' = area_access","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["accessibility_concern"]}},"422":{"id":422,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Monatsery \n Monatsery interesting place to see as a Christian. alot of Christian history lies there like for example 6th era Syrian book of gospels by st Mark, if you have a deadline (for example you're from a cruise ship) coming back might be problematic and stressful, alot of people trying to get down waiting for buses or taxis, be ware","codes":{"trip_mode":"cruise_excursion","time_pressure":1,"religious_register":["doctrinal"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'deadline...stressful' = time_pressure; 6th era Syrian gospels specific","acknowledges_historical_cultural":1,"descent_mode":"motorized"}},"424":{"id":424,"site":"monastery","plat":"tripadvisor","rating":"5","text":"It is a pilgrimage that must be made, whoever visits the island. It is definitely worth walking from where the vehicles stop to the castle, where the monastery is located. There is a museum with important relics within the monastery, which the pilgrim deserves to visit.","codes":{"ascent_mode":"walked","elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'pilgrimage that must be made' generic-pilgrim addressing","topography_register":1}},"427":{"id":427,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Beautiful Monestary \n Beautiful Monestary We visited this monestary on a cruise ship tour so it got crowded with multiple overlapping tours. Definitely worth a visit to see the inside of the monastery and to browse through the historic (old) exhibits and icons of the adjoining museum. Photography is not allowed inside the monastery or museum.","codes":{"trip_mode":"cruise_excursion","worth_assessment":"worth_it","facility_complaints":["crowding","photography_restrictions"],"tone_toward_constraints":"accepting","motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1}},"431":{"id":431,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Gorgeous monastery, icons, frescos and views \n Gorgeous monastery, icons, frescos and views This is well worth the bus trip (or walk) up. The monastery of St John the Divine/Theologian/Evangelist is gorgeous with ancient Christian artefacts, frescos and gold leaf everywhere. Not too many crowds. The stairs are steep and narrow once you get there. Also, the path to the windmills is not clearly marked - it disappeared twice and we had to ask to find them. Couldn’t find the Cave of the Apocalypse on the walk down, but still a lovely (if steep) cobbled path. Highly recommend.","codes":{"elevation_mention":1,"religious_register":["conventional","doctrinal"],"effort_valence":"positive","sensory_modalities":["vision"],"worth_assessment":"worth_it","facility_complaints":["signage"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'gold leaf everywhere'; path 'not clearly marked'","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"walked","on_site_movement":["accessibility_concern"]}},"432":{"id":432,"site":"monastery","plat":"tripadvisor","rating":"4","text":"It's worth living it. \n It's worth living it. Too many coaches and people from many countries who come to worship and live this experience..\nView. Terrible peace and quiet as soon as you enter the entrance..","codes":{"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"atmospheric_register":1,"view_centrality":"mentioned"}},"436":{"id":436,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Greek Orthodox monastery of St John on the hilltop of Patmos \n Greek Orthodox monastery of St John on the hilltop of Patmos The Monastery of Saint John the Theologian has the village of Chora built around its fortifications. This Greek Orthodox monastery was founded in 1088 on the hilltop of the island of Patmos. The monastery became a UNESCO heritage site in 1999.\nThe Monastery was named after St. John of Patmos, the author of the Christian Book of Revelation. The cave where John received the revelation from Christ is lower down the hillside.\nMany people visit on excursions from the cruise boat tender port in Skala, but a short taxi ride from Skala is a less expensive way to visit. It is a long, steep hike on cobbled streets to make the journey by foot.\nThis is an active site of worship as well as a museum, so respectful dress and behaviour is expected. The museum has many ancient texts and bibles.\nThe site can be crowded when cruise boats are in port.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","recognizes_heritage_protection":1,"facility_complaints":["crowding"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"UNESCO 1999 explicit; encyclopedic tour-guide tone","acknowledges_historical_cultural":1,"topography_register":1}},"438":{"id":438,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Beautiful, but prepared for a hike, not a leisurely walk! \n Beautiful, but prepared for a hike, not a leisurely walk! We were on Patmos for a short day during a cruise. We decided to take the \"walk\" to the monestary. It is a steep hike, not a walk! It has a roughly-cobbled path up the hill. Several in our group turned back 1/2 way up the hill. The monestary is beautiful. Don't miss it. However, if anyone in your group is not up for a hike/strenuous walk, I recommend a taxi! We left the monestary as it closed. There were no more taxis running. It was a long, tough walk back down in the dark (no lighting on the path). We weren't prepared for a hike, so several of us struggled coming down the steep, rough paths w/o tennis shoes/hiking boots. Just wish We would have been prepared.","codes":{"ascent_mode":"walked","trip_mode":"cruise_excursion","elevation_mention":1,"town_hill_contrast":1,"effort_valence":"ambivalent","worth_assessment":"worth_it","facility_complaints":["amenities"],"tone_toward_constraints":"frustrated","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'no lighting on the path' coming back in dark = amenities","sensory_modalities":["embodied"],"topography_register":1,"descent_mode":"walked"}},"439":{"id":439,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Great Biblical history \n Great Biblical history John the Apostle is said to have written the Christian New Testament Book of Revelations in a cave here. The cave is open to the public and we saw a Greek Orthodox Priest performing some sort of ceremony when we were there. This is a most-see.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"440":{"id":440,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Great Monastery \n Great Monastery You cannot go to Patmos and not visit the monastery of the revelation! A monastery with a unique view, beyond its religious importance, it is a must-visit tourist destination!","codes":{"religious_register":["doctrinal"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"mentioned"}},"441":{"id":441,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Indescribable experience \n Indescribable experience The sanctity of the place and the impressive relics... The place where the Holy Monastery was created... Architectural uniqueness... negative fact that to visit the museum of the monastery you have to pay an entrance fee...","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","facility_complaints":["prices"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"442":{"id":442,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Teligious symbol of Patmos \n Teligious symbol of Patmos Beautiful monastery with a wonderful museum located in the Chora of Patmos. To access it you pay €5 per person, in the morning it closes at 1.30pm. We went on a day where there wasn't much confusion. Place known because St. John the Evangelist was confined, also worth visiting is the cave overlooking the sea where he dictated the apocalypse. At the exit you will find some\nlittle shop if you want to buy some\nReligious symbol.","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1}},"444":{"id":444,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Inspiring. More than a Monastery \n Inspiring. More than a Monastery The incredible survival of this monastery against raids and wars is impressive. The vision of its builder who did so much to develop Patmos as a whole for the benefit of all its inhabitants is the Gospel in action. Seeing how John the Apostle was persecuted for his faith in Jesus is an encouragement to all Christians today to persevere in loyalty to Jesus. Read at least Revelations chapter 1 before you come.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1,"coding_notes":"'Read Revelations chapter 1 before you come' = scriptural prep mimetic; 'Gospel in action' Protestant-flavored — held unspecified self-ID","acknowledges_historical_cultural":1}},"445":{"id":445,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Take it in. \n Take it in. Went on a NCL cruise and made a stop here. What a beautiful view from the top. Took about one hour, but I'm sure you could spend several hours here. Island seems quite and peaceful.","codes":{"trip_mode":"cruise_excursion","elevation_mention":1,"worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"view_centrality":"mentioned"}},"446":{"id":446,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Not impressive but rather cool and comforting. \n Not impressive but rather cool and comforting. The monetary is very cool and inviting on the inside.  Icons with images based on John’s writings.  The museum inside has interesting artifacts from around the 17th century.","codes":{"religious_register":["doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'icons with images based on John's writings' specific","acknowledges_historical_cultural":1}},"447":{"id":447,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Razoável \n Mediocre A castle from the Dark Ages, looks like a haunted mansion. Very large. There were few people in the Museum, which took over this former home of religious fanatics who, I'm not sure, may still live here at the expense of those who believe in their fairy tales.","codes":{"worth_assessment":"not_worth_it","religious_self_id":"dismissive","tone_toward_constraints":"dismissive","review_is_useful":1,"coding_notes":"'religious fanatics', 'fairy tales' scornful disavowal","acknowledges_historical_cultural":1}},"448":{"id":448,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Holy Silence \n Holy Silence Monastery of Saint John the Theologian in Patmos is perhaps the most important monastic complex in the Aegean Sea. Saint Christodoulos was the founder of the monastery (1088).Built on the top of a mountain, apparently on the site of the temple of Artemis and an early Christian basilica, the monastery is surrounded by an irregular rectangular defensive enclosure dating from the end of the 11th century. until the 17th century.\nThe monastery's richest Library and Collection of its relics, the most important examples of which can be admired in the visiting sacristy, are considered famous.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"Christodoulos founder explicit; encyclopedic frame","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1}},"449":{"id":449,"site":"monastery","plat":"tripadvisor","rating":"5","text":"An HONOR to visit this sacred monastery and much gratitude and love to the monks who kept this space for all to see \n An HONOR to visit this sacred monastery and much gratitude and love to the monks who kept this space for all to see Profound. Extraordinary. Thought-provoking. Heart wrenching. Sacred. Yet...ACCESSIBLE. And I am grateful. Having traveled from the United States, and actually staying on the island, I was in complete awe of this global treasure of humankind. I went twice, and I wish I would have went every day. Because the 17th and 11th century frescos / you could ponder them for weeks. The sacred messages in them hopefully to be aided by the theologians at  the monastery provides at its helm. Nikolas was the young man who spoke to my husband and myself about the Orthodox Church, the icons and frescos - and we were only able to ask a few questions of this young man studying to be a priest-  because of the volume of people visiting who wanted to talk to him as well. DO find out when the cruises come and go and big groups might be there, and perhaps plan to visit on days where you could be one of the few in that sacred space that day. DO choose a wise and kind and patient guide if you can- we had Carolyn and Tim from Astoria Travel and couldn't be more grateful. The very cool man (I don't think he was a priest but certainly looked like one with the long hair and beard....) sells monastery olive oil, liqueurs, music, and a Saint John's wort serum that I am excited to try (that's another story). DO go to the museum inside which hold perhaps some of the most sacred treasures - but I know upon reading one of the official guide books that the most sacred and ancient Christian holdings are in safekeeping by the monks in their private library. The most MOMENTOUS for me-was learning- and seeing for myself- the holy relic of St. Thomas' skull in the monastery narthex area. I could not and still cannot believe that one of the twelve Apostles remains resident here. Patmos is indeed a gift, and the monastery a treasure that will move you and hopefully take you closer to God. It really was all that for me. I am eternally grateful. Having been raised Orthodox, married to a Catholic, and being a very open minded Christian to all denominations - this sacred monumental space is ripe for the mind and soul hungry for connection to God and the joy of Christ. Give yourself as much time as you can here. I will be back myself.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","sensory_modalities":["vision"],"worth_assessment":"worth_it","religious_self_id":"orthodox","facility_complaints":["crowding","area_access"],"tone_toward_constraints":"accepting","motivation_religious":1,"recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Having been raised Orthodox' explicit first-person Orthodox self-ID; St Thomas skull specific vision; 2 visits","acknowledges_historical_cultural":1}},"452":{"id":452,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Interesting frescoes \n Interesting frescoes You cannot visit Patmos without visiting the famous Monastery of St John named after the theologian who wrote the Gospel according to St John in the nearby Cave of the Apocalypse. The monastery complex is perched on the top of a hill with incredible views and contains some beautiful frescoes and ancient religious artefacts.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["doctrinal"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"456":{"id":456,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μοναδικό. \n Unique. This is a magnificent monastery. Of unique religious and architectural value. Wonderful icons, beautiful spaces, a deeply moving and emotionally stirring atmosphere. You absolutely must visit it.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1}},"457":{"id":457,"site":"monastery","plat":"tripadvisor","rating":"5","text":"El emblema de la isla \n The emblem of the island The monastery is the emblem of the island, by virtue of its position as a great fortress, its views, and its interior that invites spirituality. Very beautiful frescoes and, like all monasteries in Greece, very well maintained. It deserves a visit.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"mentioned"}},"460":{"id":460,"site":"monastery","plat":"tripadvisor","rating":"4","text":"επιβλιτικό \n Impressive Beyond its religious significance, it is a must-visit tourist destination. It could welcome tourists year-round; unfortunately in summer it loses the essence of its sacredness. The museum is a treasure.","codes":{"tourist_mode":"mixed","religious_register":["conventional"],"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"summer tourism erodes sacredness — institutional+consumer mixed frame"}},"461":{"id":461,"site":"monastery","plat":"tripadvisor","rating":"1","text":"Αδαεις κ αυθαδεις υπάλληλοι - unsuitable staff \n Ignorant and insolent staff - unsuitable staff This review concerns the organization and not the pilgrimage site itself, which is top-tier and everyone should visit.\n\nOn the morning of 8/24/2021, the Monastery opened its doors almost one and a half hours AFTER the scheduled time. The 2 employees gave us no explanation, offered no apology, and were sarcastically saying 'go ahead and report us, haha!' Several tourists and pilgrims left due to the delay. Such nonsense is inappropriate for Orthodox Christians and Greeks. It is obviously also attributable to the lack of supervision and enforcement of regulations by those who hired such incompetent and insolent people. This is how we make fools of ourselves internationally. We have been coming to this pilgrimage site since 2010 and this kind of nonsense is unprecedented!\n\nThe review concerns the lack of organization, as certain members of staff do not adhere to the opening hours and professional conduct. The Monastery opened one and a half hour late. The staff were extremely rude to the guests, and didn't offer any explanation or apology.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"religious_self_id":"orthodox","facility_complaints":["access_hours","amenities"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"coding_notes":"first-person plural Greek/Orthodox 'we'; pilgrim returning since 2010"}},"463":{"id":463,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Entre ciel et terre \n Between heaven and earth The quintessential Orthodox site. Like a fortress, the monastery dominates Chora with all its might. The frescoes are magnificent, the small museum is worth the trip, and the monastery cat is as fat as can be!","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"dominates Chora with all its might","religious_register":["conventional","doctrinal"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1}},"464":{"id":464,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Impressionnant et émouvant \n Impressive and moving An impressive monastery dominating the town of Skala. As soon as you pass through the gate, you are filled with serenity and emotion. Remarkable frescoes, a very interesting museum presenting remarkable works.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"dominating the town of Skala","religious_register":["mystical"],"sensory_modalities":["vision"],"review_is_useful":1,"coding_notes":"reviewer wrote Skala but means Chora"}},"469":{"id":469,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Brave monk stays open despite COVID \n Brave monk stays open despite COVID I find this quite moving, that the head monk chose to stay open to tourists despite the threat of the virus to him and his elderly peers. Since they don’t charge admission, it’s not for the revenue. I’m grateful we could visit.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"COVID-era; head monk stayed open despite virus risk"}},"470":{"id":470,"site":"monastery","plat":"tripadvisor","rating":"4","text":"An awesome fortress monastery, still functioning \n An awesome fortress monastery, still functioning It really looks more like a fortress than a monastery from below the hill, but inside, you can see some wonderful frescoes and see that it's still very much a functioning monastery. This also means that you're not allowed to take photos in any indoor spaces, including the surprisingly extensive museum they have there. The views you get from the top all they way down the rest of Patmos and the sea are also wonderful. As always, make sure you are dressed modestly. There is a bus that takes you all the way up to Chora from Skala, but it still involves a bit of a walk. If you don't mind a bit more exercise and sweating profusely, you can also walk up from the Cave monastery, which was nice!","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"from below the hill","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_active_institution":1,"review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"474":{"id":474,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Προσκυνηματική επιλογη \n A pilgrimage-worthy choice Visiting Patmos without visiting the monastery is simply not an option.\nA walk is worth it both inside and outside the Holy Monastery.\nLet yourself wander through the alleyways day and night.\nA reminder to dress modestly ...","codes":{"religious_register":["conventional"],"effort_valence":"positive","worth_assessment":"worth_it","review_is_useful":1,"on_site_movement":["walking_around"]}},"476":{"id":476,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Ε Κ Π Λ Η Κ Τ Ι Κ Η \n A M A Z I N G One of the best experiences you could have in Patmos. The entire place exudes a sense of peace. You must visit the Museum located inside the Monastery. The ticket is 2€ but it will be more than worth it.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"477":{"id":477,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Unmissable, if you visit Patmos !!  Combine this with a visit to the cave. \n Unmissable, if you visit Patmos !!  Combine this with a visit to the cave. My wife and I were very happy that our ship, the MV Celestyal Olympia, visited Patmos, on a cruise around the Greek Islands.  As practising Catholics, we looked forward to seeing the cave where St. John wrote the Book of Revelation.  We took an optional tour (paid tour). The tour took us first to the cave,  then to this magnificent monastery on top of the hill.  While the cave had a lot religious significance, this monastery was a  real sightseeing gem.  Wonderful location, great views, and plenty of history. (it is 1000 years old, whereas St. John lived in the cave, in exile, over 1900 years ago).  There is a fantastic little museum, where you can see some very interesting church treasures, including the document signed by the Byzantine Emperor Alexis in 1088, establishing this monastery.  As we had taken a paid tour, we had an excellent guide, who gave us an enormous amount of information.  She also pointed out the best places to get photos.  The views are stunning.  One caution: your transport cannot take you right up to the entrance, it will need to park a fair way below.  So, there is some climbing involved.  If it is rainy, the cobblestones will be slippery and dangerous.  Not a place to take a stroller!","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"on top of the hill","religious_register":["conventional","doctrinal"],"mediation":"endorses","effort_valence":"negative","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","religious_self_id":"catholic","motivation_religious":1,"motivation_cruise_sought":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Catholic self-ID + 'looked forward to' cruise pilgrimage → cruise_sought","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["accessibility_concern"]}},"478":{"id":478,"site":"monastery","plat":"tripadvisor","rating":"5","text":"ΣΗΜΑ ΚΑΤΑΘΕΝ ΤΟΥ ΝΗΣΙΟΥ \n THE HALLMARK OF THE ISLAND This historic monastery is the hallmark of the island. You can see magnificent relics and icons inside. 2 kilometers before the monastery is also the cave. Nice view from the monastery.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"479":{"id":479,"site":"monastery","plat":"tripadvisor","rating":"5","text":"belle visite \n Beautiful visit A beautiful moment of contemplation. Magnificent monastery and a time of rest. Avoid the busy periods by going very early in the morning.","codes":{"religious_register":["mystical"],"facility_complaints":["crowding"],"review_is_useful":1}},"480":{"id":480,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Visite très intéressante. \n Very interesting visit. With many things to see. Very pleasant site. Just a note: the famous Cave of the Apocalypse is located further down the hill. As a general rule, keep in mind that religious sites are only open in the morning. So visit in the morning. The afternoon is for the beach and relaxing.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"further down the hill","religious_register":["conventional"],"facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1}},"484":{"id":484,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A truly magnificent place \n A truly magnificent place What a spectacular setting - right on topof a high hill on this special island. The chapel alone is worth the visit - so ornate. The refectory has a huge dining table. The bells are wonderful. Loved it!","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"right on top of a high hill","religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision","sound"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1}},"485":{"id":485,"site":"monastery","plat":"tripadvisor","rating":"5","text":"By cruise... \n By cruise... I was by Celestyal Olympia cruiser, do I spent just 4 hours on the island\nEnough to see, to feel piecfullnes at Monastery and museum.\n4€ and 2€ \nReally have to see. Taxi is 40€(30€) \nSo, 4 of us split..\nSuch a Top \"to do\" thing on Patmos\nI recommend deeply","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","time_pressure":1,"religious_register":["mystical"],"worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1}},"487":{"id":487,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Δέος \n Awe Definitely worth at least one visit, combined with the cave.\nReverence and awe. You feel like you are coming closer to God.","codes":{"religious_register":["mystical","conventional"],"worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"490":{"id":490,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Κατάνυξη \n Reverence A visit you must not miss if you find yourself on the island of Patmos. Reverence. Inner searching. Words are too few to describe the feelings that overwhelm you.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"491":{"id":491,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Im Jahr 1088 gegründet \n Founded in 1088 The Monastery of Saint John in Chora was built in 1088 high above the grotto on a hill 240 meters above sea level, and today it rises above the white houses of the village of Chora. The massive gray walls are 15 meters high. Due to attacks by the pirate Emir Tzacha, the complex was heavily fortified. By 1100, as many as 150 monks were already living in the monastery. From time to time, further attacks by pirates, Normans, and Crusaders took place. Over the centuries, the monastery managed to come to terms with the various rulers of the eastern Aegean.\n\nBehind the mighty wooden door, a four-meter-long passageway and a staircase lead up to the pebble-paved courtyard, which is adorned with arches. High above it rises the distinctive tower with five bells. The Katholikon is the old main church of the monastery, supplemented by ten chapels. Also old is the refectory with two long marble tables for dining. The library holds many treasures, including 33 pages from the Gospel of Mark from the 6th century. On my travel website toeightycountries.com you can find more about Ikaria, Patmos, and Samos.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"240 meters above sea level","religious_register":["conventional","doctrinal"],"mediation":"relays","sensory_modalities":["vision"],"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"492":{"id":492,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Saint John Monastery \n Saint John Monastery This place will leave you feeling at peace with yourself. Retrace the steps of Saint John’s journey on the island of Patmos will leave breathless. The monastery has many old artefacts and is located on top of a mountain. The best time to go is in the morning because it is not often open during the afternoon.","codes":{"elevation_mention":1,"topography_quoted_phrase":"on top of a mountain","religious_register":["mystical","conventional"],"sensory_modalities":["embodied"],"mimetic":1,"mimetic_engagement":"relayed","facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"493":{"id":493,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μνημείο Unesco ,υπέροχα έργα τέχνης , μοναδική κατανυκτική ατμόσφαιρα \n UNESCO monument, magnificent works of art, uniquely reverent atmosphere The Monastery of Saint John the Theologian on Patmos is a monastery-fortress that dominates the top of the hill of Chora. The monastery's Katholikon, the chapels, and the refectory have stunning frescoes. The museum has noteworthy relics. The atmosphere is reverent and the view toward the islands of Ikaria, Fournoi, Samos, Lipsi, and Leros is breathtaking.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"dominates the top of the hill of Chora","religious_register":["conventional","mystical","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"mentioned"}},"495":{"id":495,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Probably the highlight of Patmos \n Probably the highlight of Patmos We were in Patmos for just a half day from a cruise ship. We did a tour which took us on a short drive around the island, stopping at the Cave of the Apocalypse and St John's Monastery.\nThe Monastery sits in a prominent position in the middle of the island. There are good views looking up to the monastery and also good views looking down when you get up there. The monastery looks more like a castle.\nModest dress is requested in the monastery, so cover your knees and shoulders. You are not allowed to take photos inside the museum, which is full of interesting artifacts. There is a short climb up the path to get into the monastery from the road where the bus dropped us off.\nThere are currently 16 monks living here.\nInteresting place and definitely worth visiting.","codes":{"ascent_mode":"mixed","trip_mode":"cruise_excursion","time_pressure":1,"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"good views looking up to the monastery","religious_register":["conventional"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","recognizes_active_institution":1,"motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"499":{"id":499,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Beautiful Monastery \n Beautiful Monastery Beautiful location up on the hillside.  Lots to see.  The monastery itself was something very special and gave me goose bumps going round the various areas.","codes":{"elevation_mention":1,"religious_register":["mystical"],"review_is_useful":1,"topography_register":1,"on_site_movement":["walking_around"]}},"500":{"id":500,"site":"monastery","plat":"tripadvisor","rating":"1","text":"Commerciële toeristen fuik geworden \n Has become a commercial tourist trap The monastery has really become a commercial tourist trap. It costs €4 per person to enter the monastery, and then the inside is rather disappointing.\nOutside the monastery, photos are taken of you without asking, which you can buy on the way back for a \"friend's price.\"\nAround the monastery there are also many souvenir shops with ridiculous prices for trinkets.\n\nThe view is fantastic and the walk back down is also fun, but otherwise this is no longer what it once stood for: \"a Holly place of worship\".","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"effort_valence":"positive","worth_assessment":"mixed","enclosure_exposure":"exposed","facility_complaints":["commerce","prices"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"complains about commerce FROM reverent stance ('Holly place of worship') → institutional_aware","view_centrality":"mentioned","descent_mode":"walked"}},"501":{"id":501,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Beautiful place & informative museum \n Beautiful place & informative museum We checked which day there would be no cruise ship in the port at Patmos & chose this day as our day to visit so that it would be less busy; in September this day was Monday. We look a taxi from the port which was about 8 Euros & we arrived at the monastery at 9am, there were no other visitors when we arrived. Dress needs to be respectful; my dress had short sleeves & covered my knees; my husband was wearing a short sleeved shirt & longer shorts.  \nThe man at the ticket office gave us some helpful information & we had our own guide book which was useful for both the chapels & the museum. The museum is full of treasures; don't miss the top floor & the instructions to capture pirates! \nAfter leaving the monastery we walked to the windmills, stopped for a coffee & then followed the path of culture down the hill, through tress with some shade, to the Cave of the Apocalypse. After visiting the cave we continued following the path back down to Skala, this took about 20 minutes from the cave. I think we were back at the port at around 1.15pm.","codes":{"ascent_mode":"motorized","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"down the hill, through trees","religious_register":["conventional"],"sensory_modalities":["vision"],"review_is_useful":1,"topography_register":1,"descent_mode":"walked"}},"502":{"id":502,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μόνη Χώρα Πατμος \n Monastery Chora Patmos Incredible atmosphere and hospitality.\nA peaceful place with beautiful buildings and truly a treasure for the island.\nAs for the view, it is fantastic.!!!","codes":{"religious_register":["mystical"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"503":{"id":503,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Most popular \n Most popular Sits atop Chora Village. A must visit when on Patmos. Very interesting and to a degree a pilgrimage site for many. Ususually closes at 1.30pm","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"sits atop Chora Village","religious_register":["conventional"],"review_is_useful":1}},"504":{"id":504,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Λόγος να επισκεφτείς το νησί. \n A reason to visit the island. The main reason for my visit to the island. Amazing aura, incredible view, and very kind people.","codes":{"religious_register":["mystical"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"508":{"id":508,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Si vous n’en visitez qu’un... \n If you only visit one... During your visits to the islands, you will be tempted to visit monasteries. This one, which resembles a fortress, is particularly beautiful. You will be warmly welcomed (if you are dressed appropriately, that goes without saying), and the monastery's museum contains extremely interesting objects. The view from the top is also breathtaking.","codes":{"elevation_mention":1,"religious_register":["conventional"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"509":{"id":509,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Επιβλητικό και σαν κτίριο και σαν ατμόσφαιρα \n Impressive both as a building and as an atmosphere Words are unnecessary. It is a very beautiful place, very warm, and if you have eyes to see and your senses open to \"hear His voice\" you leave feeling full of peace. The visitor sees only a small part of the monastery, as the rest (which is still in active use) is not open to visitors.","codes":{"religious_register":["mystical","conventional"],"recognizes_active_institution":1,"facility_complaints":["area_access"],"tone_toward_constraints":"accepting","review_is_useful":1}},"513":{"id":513,"site":"monastery","plat":"tripadvisor","rating":"1","text":"Explotacion \n Exploitation Yes, there are things to see, but I don't think it's right that they charge you 4 euros to see the church's jewels and works of art, especially when there are so many people in the world who don't have a roof over their heads and are dying of hunger. It is my opinion that the church should not have so much gold and jewelry — it should help the poor..... it hurts a little to see how they profit by taking money from believers.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"facility_complaints":["prices","commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Ethics-of-church-wealth complaint from a believer-aware frame"}},"514":{"id":514,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Pensavo meglio \n I expected better Visited in the afternoon with the disembarkation of no fewer than 2 cruise ships — it didn't particularly impress me! €4.00 each! I imagined it to be larger and more elaborate! The museum is nice but I expected more from the whole complex!","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"worth_assessment":"mixed","facility_complaints":["crowding","prices"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"516":{"id":516,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Emouvant \n Moving I felt a great emotion upon discovering the frescoes on the outside of the chapel.\nThe visit is incredible. Of extraordinary beauty. The apostles on the Sea of Galilee moved me.\nAbsolutely a must.","codes":{"religious_register":["conventional","mystical","doctrinal"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'apostles on the Sea of Galilee moved me' — frescoes + embodied affect"}},"518":{"id":518,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Great place to visit \n Great place to visit Must see during your Patmos visit. The view from there is beautiful. The monastery is pretty too. They have a very proud cat.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"519":{"id":519,"site":"monastery","plat":"tripadvisor","rating":"5","text":"You must visit this place \n You must visit this place If you are in Patmos, even for just 1 day like us, you must visit the monastery. \n\nThe church is so beautiful with amazing frescos and icons and fantastic views from the outside. The museum is also very interesting.\n\nIt is worth having a tour guide who would explain everything in detail and you can learn a few things! \n\nDefinitely worth a visit.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"520":{"id":520,"site":"monastery","plat":"tripadvisor","rating":"5","text":"ΕΠΙΒΛΗΤΙΚΗ ΚΑΤΑΝΥΞΗ \n IMPOSING REVERENCE A very beautiful monastery, in a slightly otherworldly stillness — an imposing and deeply reverent church with stunning frescoes — despite the gold-embroidered iconostasis, which paradoxically doesn't bother you at all.\n\nDon't miss visiting the monastery's museum (admission €2).-\nIt has some truly remarkable exhibits.","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision","sound"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'otherworldly stillness... deeply reverent' — mystical + silence","atmospheric_register":1}},"522":{"id":522,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Klein aber fein \n Small but fine There is an entrance fee. I don't know how much because as a Greek I don't pay anything. The small church is beautiful. There is a dining hall where the monks used to eat, and a small museum. It is definitely worth a visit!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'as a Greek I don't pay' — national, not religious self-ID"}},"523":{"id":523,"site":"monastery","plat":"tripadvisor","rating":"5","text":"History, scenery and faith. \n History, scenery and faith. As you walk up the hill to the Monastery a photographer takes your photo and after your visit you can purchase the photo for 8 Euro each, quite a nice way to remember your visit.  Even looking up at the Monastery from Skala makes you realise how impressive it is, and also wonder how they built it.  Seeing it inside of course makes all the difference, we stopped at many points in the main monastery and specially enjoyed the museum which is the second part of the site.  In the museum you can see ancient manuscripts, icons, tapestries and much more, and it is not just about the religious side but deepens knowledge of the historical events of the time.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"looking up at the Monastery from Skala","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["walking_around"]}},"524":{"id":524,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Görülmeli mutlaka \n An absolute must-see An important monastery. I think it is necessary to see it. Getting there by taxi or rental car makes the most sense.","codes":{"ascent_mode":"motorized","religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"526":{"id":526,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Maravilhoso \n Wonderful Beyond offering a breathtaking view of the island of Patmos, visiting the Monastery is absolutely worth it.\nA unique place, with great peace. Beautiful and very well preserved, with stunning works of art.\nThe museum is simply gorgeous.","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"527":{"id":527,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Υπέροχο \n Wonderful Amazing place, incredible architecture. A monastery inside a castle, with mosaics, beautiful arches, a museum, chapels. Access isn't difficult, though it's very easy to get lost in the narrow streets of the island before you get there. There's a bus from the port. There's no admission fee for the monastery — I think there's only one for the museum. It would be a good idea to avoid Easter night if you happen to be on the island during Easter. The tourists, combined with the monks who want to impress the tourists, are quite annoying.","codes":{"ascent_mode":"motorized","religious_register":["conventional"],"sensory_modalities":["vision"],"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"528":{"id":528,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Imperdibile \n A Must-See If there's one thing in Patmos you can't miss, it's a visit to the magnificent Chora, finishing with a visit to the Monastery. There's also a small museum, but incredibly interesting. Everything is meticulously cared for. Incredibly, even Italians sense the sacredness of the place and lower their voices.\nThat alone would make a visit worthwhile!","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"sensory_modalities":["sound"],"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'sense the sacredness... lower their voices' — institutional_aware via decorum","atmospheric_register":1}},"529":{"id":529,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Fantastic crown on Patmos capital Chora \n Fantastic crown on Patmos capital Chora No vehicles are allowed in Chora. So, if you take a bus from the port, you'll walk enough uphill from the bus stop to the Monastery. If you have your own car, you must arrive very early to find a parking place on the hill, otherwise you'll be obliged to park your car very far away from the Monastery. Take care NOT to park on the bus parking area, otherwise you'll face a very big problem.\nYou must be decently dressed with shoulders and knees covered.\nFounded by St.Christodoulos in 1088, after the Byzantine Emperor Alexios I.Komninos gave him as a gift the whole island of Patmos, the monastery looks like a Byzantine castle. From that period only some pieces on the floor are authentic together with some pillars.\nThe monastery's height is 15m. Above the main entrance there is a small opening from where the monks poured hot oil or water on the pirates or other intruders. It's called \"the murderer\"!\nThe inner courtyard is covered with pebbles and stones. Next to it the main church, where no photos are allowed. The highlight is a wooden iconostasis since 1820, hand made by 12 sculptors from Chios island.\nOutside the church there is a stone wine basin and four arches above the courtyard. There are 7 different chapels inside the monastery area and another 3 outside its walls. On first floor what's left from an old stone oven and a wooden trough for the bread dough. Next to the oven there is a museum with a collection of old icons, original Bible manuscripts, priests robes, etc. Photographs are allowed in the Museum.\nThe view towards the port and generally Patmos island is really unforgettable.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["dress_code","photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"530":{"id":530,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Stunning \n Stunning Just 4 euros, and the monastery is well worth it. Spectacular views also, as it is on the highest point on the island. A \" must see \" is the museum. Artefacts from centuries ago, beautifully displayed. One tip, if driving, car parking can be a problem. Skala bus takes you there in a few minutes. Taxi 8 euros.","codes":{"ascent_mode":"motorized","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"it is on the highest point on the island","religious_register":["conventional"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"531":{"id":531,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Superb \n Superb We were very fortunate to get to the monastery on a day when it was quiet. The church is vey beautiful and the side chapels with the skulls of St Thomas and St Philippos very moving. The museum is a must with amazing exhibits.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"Skulls of St Thomas and St Philippos 'very moving' — endorses + embodied"}},"534":{"id":534,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Görülmeli \n Must-See Admission is 4 euros per person. Appropriate attire is required at the entrance — very short shorts or bare-shoulder clothing is not allowed. For this reason, a shawl is available at the entrance, which you can get for free. Chora is the most impressive spot on the island, and since you're already there, the monastery is a must-visit.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","facility_complaints":["dress_code"],"tone_toward_constraints":"accepting","review_is_useful":1}},"537":{"id":537,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Prachtig klooster \n Beautiful Monastery We visited this monastery during a day trip from Samos. As you approach Patmos, you can already clearly see the monastery on top of the mountain.\nIt has a prominent presence and looks very impressive.\nThe monastery itself is fantastic and well worth the visit.","codes":{"trip_mode":"day_trip_ferry","elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1}},"540":{"id":540,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Awesome view \n Awesome view Go early to avoid the crowds at this wonderful inspirational place with the most fantastic views. The museum is worth a visit Xmas the town of Chora is charming with plenty of decent shops and Tavernas.","codes":{"worth_assessment":"worth_it","enclosure_exposure":"exposed","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"view_centrality":"central"}},"541":{"id":541,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Experiência de fé \n An Experience of Faith It was wonderful to have visited the Monastery of Saint John.\nIt is a holy place, though it bears the marks of the Orthodox Church. That doesn't change one's faith and admiration for the Apostle John!\nIn addition to the monastery, there is also a large museum with various sacred objects.\nThere are several paintings as well — a lot of beautiful art.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Non-Orthodox Christian framing implied but never first-person; self-ID omitted per v1.1"}},"543":{"id":543,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Quite a nice place, seen much better \n Quite a nice place, seen much better Architecture and ikones quite interesting. The place it was initially built as a fortress at the top of the island's highest rock, makes it more interesting. Beautiful views.","codes":{"elevation_mention":1,"tourist_mode":"tourist_consumer","religious_register":["conventional"],"worth_assessment":"mixed","enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"544":{"id":544,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A must see \n A must see Visiting patmos without going to this sacred place is meaningless. The church is a jewel by itself and the stunning part of the monastery is the museum rich in icons  frescos and many other church items.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"review_is_useful":1}},"545":{"id":545,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Still a monastery where Monks live \n Still a monastery where Monks live It is a working monastery. There are priest that still live there and an area where there are ancient pieces and scripts. They said a script of Mark but Greeks have a story for everything. it is interesting.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"doubts","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Greeks have a story for everything' — mild dismissive doubts on script-of-Mark claim","acknowledges_historical_cultural":1}},"546":{"id":546,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Old world religion \n Old world religion A great experience and must visit place. Just incredible to see the extensive collection of religious artifacts not to mention the building and altars. They are exquisite. Allow a couple of hours to take it all in. One of the key reasons to visit Patmos.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"review_is_useful":1}},"547":{"id":547,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Nella quiete del tardo pomeriggio \n In the Quiet of Late Afternoon I had already been there twice on organized tours, and a guide is really worthwhile. This year we went to the monastery with friends, in the late afternoon, when the crowds had gone elsewhere, which allowed us to breathe the more authentic and mystical atmosphere of one of the most elevated places Greece can offer tourists, in terms of art, history, and religion. The emotion wasn't what it was the first time, but it was still an exceptional moment. So, if at all possible, I'd recommend everyone to avoid the crowds.","codes":{"elevation_mention":1,"religious_register":["conventional","mystical"],"sensory_modalities":["sound"],"facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'breathe the more authentic and mystical atmosphere' in late-afternoon quiet","acknowledges_historical_cultural":1,"atmospheric_register":1}},"548":{"id":548,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Grandioso! \n Grandiose! This Orthodox monastery was added as a UNESCO World Heritage Site in 1999. Its construction of gray stones gives it the look of a medieval castle, with walls over 15 meters high. It was built to protect the monastery and its treasures from pirate attacks and the Turks. On this same hill sits the monastery museum, described as the most grandiose in the Aegean, which holds a collection of Byzantine-era pieces: more than 200 icons, silver and gold objects, a valuable and beautiful collection of jewelry, ecclesiastical vestments, furniture, 82 rare manuscripts of the New Testament, part of the original Gospel of Saint Mark written on goatskin, the letter from Emperor Alexios I authorizing the construction of the monastery, and other historical objects.","codes":{"elevation_mention":1,"religious_register":["conventional","doctrinal"],"mediation":"relays","recognizes_heritage_protection":1,"sensory_modalities":["vision"],"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"549":{"id":549,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Worth seeing, esp. the Museum \n Worth seeing, esp. the Museum My wife and I were here on a Globus tour, and this was part of a 3-day cruise by Celestyal Cruise Olympia and tour is by the cruise ship, which included a trip to the Grotto (whoopeee!).  \n\nBy the time we got to the Monastery, it was almost 7pm, and don't forget that DST kicked in a week earlier, so ... yeah, we got a lot of terrific shots on the outside!  I am amazed at how a cruise ship DARES to charge people to visit the island 'attractions'.\nTo be honest, if I had known what the island's 2 attractions were, combined with the late hour of arrival to see the Grotto first (arrived there around 6:15pm) ,,, I would probably have skipped the whole tour from the cruise ship ... not worth the price.\n\nHowever ... \nIf I were to break up the Monastery and the Museum, the Monastery would be a 3 and the Museum would be a 5.  \nI don't remember if they allowed photography inside the Monastery, but I think it was NO photography.  \nTo us, the Museum -- Alert - no photography allowed!  -- was most interesting.  It had many items that were ... very intricate, very well done, and some were so small that you have to really look to see how well done and intricate the work really was. THAT to many of us on the tour was the highlight of the Monastery  Shame we were not allowed photography so we could walk away with memories to show others - and have good memories.","codes":{"trip_mode":"cruise_excursion","tourist_mode":"tourist_consumer","religious_register":["conventional"],"worth_assessment":"mixed","sensory_modalities":["vision"],"facility_complaints":["prices","photography_restrictions"],"tone_toward_constraints":"frustrated","motivation_cruise_thing_to_see":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Cruise consumer 'amazed at how a cruise ship DARES to charge'"}},"551":{"id":551,"site":"monastery","plat":"tripadvisor","rating":"5","text":"ΕΝΑ ΜΟΝΑΣΤΗΡΙ ΜΕΣΑ ΣΕ ΚΑΣΤΡΟ! \n A MONASTERY INSIDE A CASTLE! A wonderful monastery in a unique location! AFTER PAYING YOUR RESPECTS, THE MUSEUM IS ALSO WORTH A VISIT!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"552":{"id":552,"site":"monastery","plat":"tripadvisor","rating":"4","text":"very impressive \n very impressive This is the place to be seen for sure. The whole place is full of wonderful points. The only problem is the visiting hours. They are very limited by the day and time.","codes":{"religious_register":["conventional"],"facility_complaints":["access_hours"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"553":{"id":553,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Amazing and inspiring \n Amazing and inspiring How do you rate a monastery like this established in the late 11th Century? Amazing. We prayed here and had a good time of reflection in this serene place. As an aside, I personally appreciated patting the monastery cat.","codes":{"religious_register":["conventional","mystical"],"motivation_religious":1,"review_is_useful":1,"coding_notes":"'We prayed here' — religious motivation, but no physical contact ⇒ devotional_contact omitted","devotional_participation":1,"acknowledges_historical_cultural":1,"on_site_movement":["posture_pause"]}},"555":{"id":555,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Great site \n Great site Plenty to see at site and in museum. Lots of steps up but worth the climb. Take the time to see the chapel and church.","codes":{"elevation_mention":1,"religious_register":["conventional"],"effort_valence":"ambivalent","worth_assessment":"worth_it","review_is_useful":1,"on_site_movement":["stairs_up"]}},"556":{"id":556,"site":"monastery","plat":"tripadvisor","rating":"5","text":"époustouflant \n Breathtaking Words fail to express the intense feeling that visiting this place gives you. Every corner is wonderful. This world-class monument is, in itself, worth a trip to Greece.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"557":{"id":557,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Το καστρομοναστηρο σε καθηλώνει με την θεα του \n The castle-monastery captivates you with its view Patmos isn't a particularly large island, and from Skala you can quickly and easily get to the monastery\nFrom a distance it impresses you, and the moment you step through its gate you're captivated\nYou shouldn't miss the visit to the museum either, which displays significant religious exhibits\nI consider it inappropriate to say more about the monastery, which stands as a pillar of Christianity","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"atmospheric_register":1}},"558":{"id":558,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Absolutely Wonderful \n Absolutely Wonderful The Monastery is visable from anywhere on the Island.  A very Holy place.  They have an incredible museum.  A must visit.","codes":{"elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"559":{"id":559,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Interesting museum. \n Interesting museum. The monastery is very nice to walk around and the small museum is very interesting especially the El Greco painting.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"review_is_useful":1,"on_site_movement":["walking_around"]}},"561":{"id":561,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Awesome \n Awesome We visited the cave where St. John received the Book of Revelation in the Bible.  Whether you're a believer or not, one can't help but be moved by the location and the story told by the tour guide.  Then you go up to the monastery and see the ancient frescoes and the attached museum.  And as you walk down the hill after the visit there are cafes and shops to meander in. Truly a wonderful afternoon.","codes":{"elevation_mention":1,"religious_register":["conventional","mystical","doctrinal"],"mediation":"relays","worth_assessment":"worth_it","sensory_modalities":["vision"],"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"walked"}},"562":{"id":562,"site":"monastery","plat":"tripadvisor","rating":"5","text":"πρεπει να το επισκεφτεις \n you need to visit it Besides the Apocalypse, you need to go to the monastery too, 5 km from Chora, and there's a bus that goes by the port and takes you there.","codes":{"religious_register":["doctrinal"],"review_is_useful":1}},"563":{"id":563,"site":"monastery","plat":"tripadvisor","rating":"2","text":"Bezoek klooster viel tegen \n Visit to the Monastery Was Disappointing We rode to the monastery ourselves on a quad. We paid 4 euros per person but honestly it wasn't worth it. We are not religious, for what it's worth. Only a very small portion of it can be visited.","codes":{"ascent_mode":"motorized","tourist_mode":"tourist_consumer","worth_assessment":"not_worth_it","religious_self_id":"spiritual_not_religious","facility_complaints":["area_access"],"tone_toward_constraints":"dismissive","review_is_useful":1}},"564":{"id":564,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Fascinating museum \n Fascinating museum Situated on top of a hill in the old town, a really interesting old building, church with ancient frescoes and a museum.\nOnly 4 euros entrance fee and lots to see, some really interesting things.  Also very worth while walking round the old town outside for really quaint little narrow streets.","codes":{"elevation_mention":1,"topography_quoted_phrase":"Situated on top of a hill in the old town","religious_register":["conventional"],"sensory_modalities":["vision"],"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["walking_around"]}},"565":{"id":565,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Δεν περιγράφεται . \n Words can't describe it. What an exceptional experience visiting the Monastery.\nUnique frescoes and the kindest of Monks\nwho gave us a proper guided tour\nthrough its interior.","codes":{"religious_register":["conventional"],"mediation":"relays","sensory_modalities":["vision"],"recognizes_active_institution":1,"review_is_useful":1,"on_site_movement":["walking_around"]}},"567":{"id":567,"site":"monastery","plat":"tripadvisor","rating":"4","text":"wonderful visit; a little cozy place to see and relax \n wonderful visit; a little cozy place to see and relax it takes 30' to visit it, but you feel like you're getting into a serenity bubble\nlittle, cozy and very nice. \nfurthermore for a very cheap ticket","codes":{"religious_register":["mystical"],"review_is_useful":1}},"568":{"id":568,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Patmos mistica \n Mystical Patmos In the morning we headed to the monastery on scooters. Walking through Chora is already very interesting. When you enter the monastery, you don't expect to find those colors, those frescoes, and icons.\nWe had a short visit and didn't see the museum. \n\nVery pleasant and interesting","codes":{"ascent_mode":"motorized","time_pressure":1,"religious_register":["mystical"],"sensory_modalities":["vision"],"review_is_useful":1,"on_site_movement":["walking_around"]}},"569":{"id":569,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Momento de fé \n A Moment of Faith Beautiful and well-preserved monastery with a lovely chapel and a small museum with works from followers of Saint John. In addition, the location has a stunning view from the top of Chora.","codes":{"elevation_mention":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_heritage_protection":1,"review_is_useful":1,"view_centrality":"mentioned"}},"570":{"id":570,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Beau lieu mais où le mélange religion et tourisme est douteux \n Beautiful place but where the mix of religion and tourism is questionable What can be said of the faith of the monks who pace like caged lions watching for any tourist who might photograph the icons?\nThis place mixes faith and tourism, and the two are hardly compatible","codes":{"tourist_mode":"mixed","religious_register":["conventional"],"recognizes_active_institution":1,"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"monks 'caged lions' photo enforcement; faith/tourism mix questioned"}},"576":{"id":576,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Impresionante monasterio y museo valiosísimo \n Impressive Monastery and Priceless Museum The Monastery of Saint John offers an unmatched appeal from many different perspectives (historical, artistic, scenic, religious...). It has that atmosphere you perceive in very few places — for some it will carry a religious character, for others a sense of spirituality, or simply of inner and outer peace. Don't miss the monastery museum, with genuine gems of every kind: sculptures, paintings, and manuscripts of incalculable value.","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"religious/spiritual/inner-peace spectrum framing for different visitors","acknowledges_historical_cultural":1,"atmospheric_register":1}},"577":{"id":577,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Impresionante! \n Impressive! It was one of my life goals to visit the Island of Patmos and of course the Cave of the Apocalypse and the Monastery of Saint John. It is truly impressive to visit; the atmosphere of the Island fills you with that sense of holiness that many of us recognize in specific places, and why not here — this was the home of one of the most notable visitors and residents the Island has ever had, who to this day is held with an affection and respect unlike any other. To visit the Greek Islands and skip Patmos is to miss out on a great blessing!","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","worth_assessment":"worth_it","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'one of my life goals' + 'sense of holiness' — sought-language","atmospheric_register":1}},"578":{"id":578,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Mystical and historical place \n Mystical and historical place Before deciding to go there check if there is a cruise ship in the bay, if yes, it's better to choose another hour or day. You need peace and silence to feel the step of history and Christianity climbing the stairs until the Holy Monastery.\nThere are precious relics, marvelous icons and wood carved altars built during various centuries and each of them have survived through occupations and plunders.\nBeing in Patmos this is a must visit.","codes":{"elevation_mention":1,"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","sensory_modalities":["vision","sound"],"facility_complaints":["crowding"],"tone_toward_constraints":"accepting","recognizes_heritage_protection":1,"review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"atmospheric_register":1}},"579":{"id":579,"site":"monastery","plat":"tripadvisor","rating":"5","text":"值得参观 \n Worth visiting Located at the highest point of %*& Chora %*&, the grounds are not large, but the interior layout is exquisite and the museum's collection is rich. The murals and wooden liturgical items in the chapel are very beautiful and well worth a visit.","codes":{"elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"review_is_useful":1}},"580":{"id":580,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A place for contemplation \n A place for contemplation The monastery lies high upon Chora, dominating the island of Patmos. Last time we visited we walked up, the traditional ascent, this time we scootered. Although always busy with, by times, very irritating tourists we push you away to get their picture framed without you ‘spoiling’ it, it is still a place full of humanity. No matter what religion or not religious, it is a place to be quiet and think. Highly recommended.","codes":{"ascent_mode":"motorized","elevation_mention":1,"topography_quoted_phrase":"lies high upon __CHORA__, dominating the island","religious_register":["mystical"],"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"atmospheric_register":1}},"581":{"id":581,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Δέος \n Awe Anyone who comes to Patmos is obliged to visit it... The location, the imposing presence of the monastery, the feeling it gives you as you explore it... they all come together to create a delightful exhilaration...","codes":{"religious_register":["mystical"],"review_is_useful":1,"atmospheric_register":1,"on_site_movement":["walking_around"]}},"582":{"id":582,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Great monastery to visit \n Great monastery to visit A large monastery with a lot of stairs to climb to arrive to; great view from on top of the island; the family enjoyed the visit","codes":{"elevation_mention":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"584":{"id":584,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Η αύρα της Πάτμου \n The Aura of Patmos We visit the monastery every time we are on the island. Each time we discover something new, yet its mystical aura always envelops us!","codes":{"religious_register":["mystical"],"review_is_useful":1,"quotable_for_chapter":1,"atmospheric_register":1}},"585":{"id":585,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Trop beau \n So Beautiful Take a taxi up to the top of the village and walk the rest of the way — stunning views — excellent for a moment of rejuvenation — best done in the morning before the boats arrive and the heat sets in; you can then walk back down, stopping at the Cave of the Apocalypse before heading back to the port","codes":{"ascent_mode":"mixed","elevation_mention":1,"religious_register":["doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned","descent_mode":"walked"}},"586":{"id":586,"site":"monastery","plat":"tripadvisor","rating":"5","text":"ΠΙΟ ΚΟΝΤΑ ΣΤΟΝ ΘΕΟ \n CLOSER TO GOD Whoever comes to the island should not miss a visit to the Monastery. You come closer to God and the view takes your breath away. Also, don't miss a visit to the Panagia Diasozousa, which is located within the grounds of the Monastery.","codes":{"religious_register":["conventional","mystical"],"mediation":"endorses","sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"588":{"id":588,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Un imperdibile pellegrinaggio \n A must-see pilgrimage I always return to visit the Byzantine monastery where Saint John once wrote the Book of Revelation. A very evocative spiritual place with a powerful sense of grace. The monks appear like icons of a world that has nearly vanished. I have always lit a candle to ask for a blessing","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"recognizes_active_institution":1,"devotional_contact":1,"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"candle-lighting; 'monks like icons of a vanished world'","devotional_participation":1,"acknowledges_historical_cultural":1}},"591":{"id":591,"site":"monastery","plat":"tripadvisor","rating":"2","text":"Toeristenfuik \n Tourist trap A religious trip. If you are not religious, you should not go on this trip. We visited a small religious cave. You can also light a candle
