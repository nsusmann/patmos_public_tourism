 where the apostle would have sat, as well as the crack in the rock from which he would have heard the divine voice.\n\nPlease note that proper attire is required for the visit: knees and shoulders must be covered. Photos are prohibited in several areas of the site.\n\nWe went there in early November. The weather was sunny and the temperature was around 20 °C. The place is very popular with tourists. We went there in the early morning and, although we are out of season, several buses started arriving. It is therefore advisable to go there from the opening to take full advantage of it.\n\nThere's a lot of elevation gain. Set aside an hour for this tour.","codes":{"visit_season":"off_peak_nov_mar","elevation_mention":1,"topography_quoted_phrase":"There's a lot of elevation gain","religious_register":["conventional","doctrinal"],"mediation":"hedges","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","facility_complaints":["dress_code","photography_restrictions","crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"3":{"id":3,"site":"cave","plat":"tripadvisor","rating":"5","text":"The Cave is halfway between the port and the castle, where the Holy Monastery is located. The visit to the Cave is definitely an integral part of the island tour. It's in a spot with a terrific view and you're scared when you go inside.","codes":{"visit_season":"peak_may_aug","elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","review_is_useful":1,"coding_notes":"'scared when you go inside' = embodied","topography_register":1,"view_centrality":"mentioned"}},"4":{"id":4,"site":"cave","plat":"tripadvisor","rating":"4","text":"Absolutely worth a visit! \n Absolutely worth a visit! Absolutely worth a visit to one of the most sacred places in Christianity. One might need to get a little bit into the history behind the cave to understand the significance of it as the cave itself is not very large and is unknown in quite a short time.","codes":{"visit_season":"peak_may_aug","religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"5":{"id":5,"site":"cave","plat":"tripadvisor","rating":"5","text":"Amazing really \n Amazing really A unique monastery inside a cave and only when you enter you feel fear and absolute respect. Beautifully shaped the space for a few years and you can learn the history.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional"],"enclosure_exposure":"enclosed","review_is_useful":1,"coding_notes":"'fear and absolute respect' on entering = embodied","acknowledges_historical_cultural":1,"topography_register":1}},"6":{"id":6,"site":"cave","plat":"tripadvisor","rating":"5","text":"Able to see and touch the cave walls where John supposedly received devine inspiration for the book of Revelations 10/26 \n Able to see and touch the cave walls where John supposedly received devine inspiration for the book of Revelations 10/26 We visited the Monastery first then came down the hill to this religious historic and holy place.\n\nWe saw and touched the cave walls where John was supposed to have received divine inspiration for the book of Revelations.\n\nThe pictures of the cave entrance I took. We were not allowed to take pictures inside but there are pictures available on the internet that show exactly what we saw (I was not able to attach the internet pictures).\n\nAfter the cave we walked back to Skala to return to the ship. An easy walk except for the very uneven “cobble stones” large cobble rocks really.","codes":{"trip_mode":"cruise_excursion","visit_season":"shoulder_apr_sep_oct","elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional","doctrinal"],"mediation":"hedges","effort_valence":"positive","sensory_modalities":["vision","touch_temperature"],"enclosure_exposure":"enclosed","devotional_contact":1,"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","motivation_cruise_thing_to_see":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'supposedly' hedges but touches cave walls reverently - devotional_contact tension","acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"walked"}},"7":{"id":7,"site":"cave","plat":"tripadvisor","rating":"3","text":"Where St John of Patmos received his visions \n Where St John of Patmos received his visions We saw the place where it is believed the author of the Book of the Revelation did his writings.  We also passed under the arch with the three-fold crack made by the voice of God according to religious followers.  No photography allowed inside the grotto.","codes":{"visit_season":"peak_may_aug","religious_register":["doctrinal"],"mediation":"relays","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'it is believed' / 'according to religious followers' = relays","topography_register":1}},"8":{"id":8,"site":"cave","plat":"tripadvisor","rating":"5","text":"Great view and tranquility \n Great view and tranquility There was a group from outside to worship and the queue was over 300 people. But when they left at 7 pm they closed and we were able to go to the cave the energy and the calm that you feel is unique.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","mystical"],"worth_assessment":"worth_it","enclosure_exposure":"enclosed","recognizes_active_institution":1,"facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'energy and calm you feel is unique' = mystical","energy_register":1,"topography_register":1,"view_centrality":"mentioned"}},"9":{"id":9,"site":"cave","plat":"tripadvisor","rating":"4","text":"Cave of the Apocalypse \n Cave of the Apocalypse This is where St. John told me about the future from God. If you go to Patmos Island, I think you should stop by. It's not that big. You can go on cruise ship excursions, but it's close to the harbor so you can get there on your own. It's cheaper that way. It's close, but it's a mountain, so you should at least take a taxi to get there. It was 10 euros one way. Cruise ships arrive until 7 p.m. It seems to close early on other days, so be careful.","codes":{"ascent_mode":"motorized","visit_season":"peak_may_aug","elevation_mention":1,"topography_quoted_phrase":"it's a mountain, so you should at least take a taxi","religious_register":["doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"10":{"id":10,"site":"cave","plat":"tripadvisor","rating":"4","text":"Holy pilgrimage \n Holy pilgrimage The sacred place exudes peace and tranquility. If there is the priest, he can tell you a few words about his story. Go early to avoid the crowd. The cave is very small and when they come group, it fills with suffocants. Many tourists do not respect the sanctity of the place and while it is forbidden, they constantly take photos with flash and video, disturbing those who come to worship.","codes":{"visit_season":"peak_may_aug","tourist_mode":"institutional_aware","religious_register":["conventional"],"mediation":"endorses","enclosure_exposure":"enclosed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Holy pilgrimage' title + 'those who come to worship' distinguished from photo-tourists","topography_register":1}},"12":{"id":12,"site":"cave","plat":"tripadvisor","rating":"4","text":"The 4 riders of the apocalypse were not at home when we were there. \n The 4 riders of the apocalypse were not at home when we were there. Interesting to take a look. It doesn't take you very long. The 4 riders of the apocalypse were not at home when we were there.","codes":{"visit_season":"peak_may_aug","religious_register":["doctrinal"],"mediation":"doubts","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'4 riders of Revelation were not at home' ironic doubt"}},"13":{"id":13,"site":"cave","plat":"tripadvisor","rating":"4","text":"Important Christian Site \n Important Christian Site The Cave of the Apocalypse is an important Christian site and is worth visiting. It is a special place and has a serene nature. It is a popular place to see.","codes":{"visit_season":"peak_may_aug","religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"14":{"id":14,"site":"cave","plat":"tripadvisor","rating":"5","text":"Cave of Apocalypse is a special holy place \n Cave of Apocalypse is a special holy place John was exiled by the Roman governor of Ephesus for promoting Christianity. He spent 18 months on the prison island of Patmos. He lived and prayed in a cave. Jesus appeared to John and asked John to write down the vision which described the ending of earth as we know it. This became the last book of the bible, the book of Revelation.\nThe cave was special. To be able to kneel and pray where John had prayed. The cave is now part of a complex of monastic buildings protected by UNESCO. \nThe Cave of Apocalypse is a couple of kilometres up hill from the port of Skala, where cruise ship tenders land. Walkable, but the Monastery of St John is further up the hillside and more of a hike. Steep paths and a maze of streets, so sat nav are sturdy footwear are helpful. An inexpensive taxi ride means one can avoid expensive cruise ship excursions. No commentary that way and there is little in the way of information at the sites.\nThere is a smooth path or rougher steps from the car park for Cave of Apocalypse. \nExcursion groups can fill the cave and lessen the experience so wait for a quiet time if you can. We dawdled at the back of a group to have some time of peace after others had left.","codes":{"visit_season":"off_peak_nov_mar","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"a couple of kilometres up hill from the port of __SKALA__","religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"enacted","recognizes_heritage_protection":1,"facility_complaints":["crowding","signage"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'kneel and pray where John had prayed' = enacted mimetic + devotional_contact","devotional_participation":1,"acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["posture_pause"]}},"15":{"id":15,"site":"cave","plat":"tripadvisor","rating":"2","text":"Shame on the visiting services and the workers, who work in the place. \n Shame on the visiting services and the workers, who work in the place. The personification of indifference to fellow man, lack of hospitality, very poor services during our visit.\nI went with my 90 year old mother who wanted to visit the cave of revelation. It had a no-car entrance and a spiral downhill ramp, long distance, leading to the church. An old man can walk down a path, but not up it. I assumed that the site is visited by global citizens of all ages, and that they would have provided a way for the elderly and disabled. At the entrance, the gentleman who sells ecclesiastical items, when I asked him about the difficulty of our return, due to the big uphill, he answered me indifferently and rudely: go back the way you came. So did a gentleman who was cleaning the place, cleaning the windows, he told me do as you think. I asked if there is a wheelchair, they said no. I asked about the abbot, was he helping us, and I was told he was resting, it was 11.30-12. in the morning, they told me, you will see him when he comes down, when? we do not know. Investigating the surroundings of the church, next to the building, there are 30 very steep stairs, with access to a car, however, violating the prohibition. My mother became suffocated and her life was in danger because of her age. Leaving the compound, I saw behind the main entrance, an abandoned wheelchair. I asked a local taxi driver what it was, and he said they have it there for people who have trouble walking. The taxi driver knew it, the two working gentlemen at the monastery did not. Shame on these 2 gentlemen workers, they insult the sacred space, when they themselves have inhuman behavior. A sacred space must choose the people who surround it! Also, a place with a lot of traffic must have accessibility for the elderly and people with mobility problems!","codes":{"visit_season":"shoulder_apr_sep_oct","tourist_mode":"institutional_aware","elevation_mention":1,"topography_quoted_phrase":"30 very steep stairs... big uphill","religious_register":["conventional"],"mediation":"endorses","effort_valence":"negative","enclosure_exposure":"enclosed","recognizes_active_institution":1,"facility_complaints":["amenities","area_access"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"elderly mother accessibility complaint; 'sacred space' institutional frame","topography_register":1,"on_site_movement":["accessibility_concern"]}},"16":{"id":16,"site":"cave","plat":"tripadvisor","rating":"5","text":"PATMOS 2023 \n PATMOS 2023 A SPECIAL PLACE WHERE YOU CAN CALM AND RELAX. WITH A FANTASTIC VIEW...\nSHOCKING MOMENT WHEN ANTONI'S NAME WAS READ AT THE SERVICE... WE CRIED... ALL OF US","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'SHOCKING MOMENT... WE CRIED' = mystical embodied; service with name read","devotional_participation":1,"view_centrality":"mentioned"}},"17":{"id":17,"site":"cave","plat":"tripadvisor","rating":"5","text":"Incredible dedication of soul \n Incredible dedication of soul Nothing testifies from the entrance to the Cave of the Apocalypse what the visitor will see... From the story of the old man to the rock where John prayed there is an incredible energy attraction to the Divine... The fact that you are walking on the spot where Jesus first walked after His Ascension is enough to make you see from another angle the correctness of His Word...","codes":{"visit_season":"peak_may_aug","religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'walking on the spot where Jesus first walked after His Ascension' = enacted","energy_register":1,"topography_register":1}},"18":{"id":18,"site":"cave","plat":"tripadvisor","rating":"5","text":"A symbolic religious place of Patmos \n A symbolic religious place of Patmos When traveling around the island of Patmos you cannot help but visit the cave of San Giovanni, which is evocative and beautiful from a historical point of view, the only flaw is the hordes of tourists who are taken off the ships, so watch out on the day choose because you risk being crushed, the ticket costs €3 per person, so you end the visit and can buy souvenirs.","codes":{"visit_season":"peak_may_aug","religious_register":["conventional"],"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'hordes of tourists taken off the ships' = crowding frustration","acknowledges_historical_cultural":1,"topography_register":1}},"19":{"id":19,"site":"cave","plat":"tripadvisor","rating":"5","text":"Visit to the Cave of the Apocalypse. \n Visit to the Cave of the Apocalypse. The place is worth a visit, believers or not. It represents the focal point of an island marked and culturally shaped by religiosity. I have visited and spent holidays in other Greek islands, the sea, the food, the landscapes, the beaches are still there, but the Monastery on the top of the Hora, the silence that accompanies the walk through the white streets, reminds us of history at all times anthropic nature of this island, making it certainly different from all the others.","codes":{"visit_season":"peak_may_aug","elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision","sound"],"motivation_authentic_greek":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"contrasts Patmos with other Greek islands as authentically different","acknowledges_historical_cultural":1,"atmospheric_register":1,"on_site_movement":["walking_around"]}},"20":{"id":20,"site":"cave","plat":"tripadvisor","rating":"5","text":"Taxi Option is Easy \n Taxi Option is Easy We took a taxi from cruise ship tender landing for 20 euros.  Driver returned in 30 minutes. Very easy walk with ramp from parking lot.  Taxi drivers also have option to take with further up the hill to the monastery, you can skip the expensive ships tours.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","visit_season":"shoulder_apr_sep_oct","elevation_mention":1,"effort_valence":"positive","motivation_cruise_thing_to_see":1,"review_is_useful":1,"topography_register":1,"descent_mode":"motorized"}},"21":{"id":21,"site":"cave","plat":"tripadvisor","rating":"5","text":"The highlight of our trip to Patmos. \n The highlight of our trip to Patmos. Contemplating the persecution of John and his exile to Patmos is an encouragement to all Christians today as we live in an increasingly hostile world. I felt inspired to remain strong in faithfulness to Jesus as John the Apostle did, and as the island has done for 2000 years.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","religious_self_id":"christian_general","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'I felt inspired to remain strong in faithfulness to Jesus' explicit Christian self-ID","acknowledges_historical_cultural":1}},"22":{"id":22,"site":"cave","plat":"tripadvisor","rating":"4","text":"Another peaceful day. \n Another peaceful day. The problem is that when you're in a cruise group, there's a time schedule. Beautiful views  from the top. No pictures were allowed inside the cave, but you can feel the power of what happened thousands of years ago. Worth seeing.","codes":{"trip_mode":"cruise_excursion","time_pressure":1,"visit_season":"shoulder_apr_sep_oct","elevation_mention":1,"religious_register":["mystical"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'time schedule' explicit time_pressure; 'feel the power' = mystical embodied","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"23":{"id":23,"site":"cave","plat":"tripadvisor","rating":"5","text":"Apocalipsis.. \n Apocalipsis.. The cave of the Apocalypse is located approximately 2.2 km north of the village of Chora of Patmos (about halfway from the port of Skala to Chora), a little lower than the Monastery of Agios Ioannou the Theologus, near the Patmiada School.\nAccording to tradition, in it, the Evangelist John received the Apocalypse and dictated it to his disciple Prochorus. The original configuration of the area is attributed to Saint Christodoulos, founder of the Monastery of Agios Ioannou. Today it forms the cult core of the complex building complex known as the \"Monastery of the Apocalypse\".","codes":{"visit_season":"shoulder_apr_sep_oct","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"halfway from the port of __SKALA__ to __CHORA__","religious_register":["conventional","doctrinal"],"mediation":"relays","review_is_useful":1,"coding_notes":"encyclopedic; 'according to tradition' relays","topography_register":1}},"24":{"id":24,"site":"cave","plat":"tripadvisor","rating":"5","text":"One of a kind experience \n One of a kind experience Whether your're christian or not, this place exudes mystic and you feel like you're visiting something extraordinary, which absolutely is.\nDespite the presence of dozens of instagrammers who believe that a picture  inside the place will grant them eternal happiness, you  will find that your visit was worth 100% of your time. As I said, it's one of a kind","codes":{"visit_season":"peak_may_aug","tourist_mode":"institutional_aware","religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'exudes mystic'; 'instagrammers believing picture will grant eternal happiness' = institutional distancing"}},"25":{"id":25,"site":"cave","plat":"tripadvisor","rating":"4","text":"Small but perfectly formed. \n Small but perfectly formed. It was interesting to visit this small cave where John allegedly dictated the Gospel according to St John to a local scribe. Fascinating stuff. The cave itself is a bit on the small side but well worth a visit if on the island of Patmos.","codes":{"visit_season":"peak_may_aug","religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","enclosure_exposure":"enclosed","review_is_useful":1,"coding_notes":"'allegedly dictated' = hedges","topography_register":1}},"26":{"id":26,"site":"cave","plat":"tripadvisor","rating":"2","text":"Not worth it \n Not worth it Not much to see.   One small chapel and a small cave where the hermit John lived.  The monastery at Chora is much better.","codes":{"visit_season":"peak_may_aug","tourist_mode":"tourist_consumer","religious_register":["conventional"],"mediation":"endorses","worth_assessment":"not_worth_it","enclosure_exposure":"enclosed","review_is_useful":1,"coding_notes":"'Monastery at Chora much better' attraction-comparison frame","topography_register":1}},"27":{"id":27,"site":"cave","plat":"tripadvisor","rating":"4","text":"Very important & interesting religious site \n Very important & interesting religious site This is the cave where St John wrote his Gospel and Apocalypse as an old man, dictating to a scribe. You approach the cave either by lovely, old, irregular stairs or by a newer, easier ramp. A small building has been constructed around the cave entrance which detracts a bit from the experience. The cave itself is not very large, but a small shrine has been set up with candle lighting. Definitely have a guide point out the significant points of John's writing and life in the cave. The cave can feel quite crowded, as it did on out visit, which also takes away from the experience.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","facility_complaints":["commerce","crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'small building around entrance detracts' = commerce/amenities","topography_register":1}},"28":{"id":28,"site":"cave","plat":"tripadvisor","rating":"4","text":"A Must Do If Near Patmos, Greece \n A Must Do If Near Patmos, Greece A short taxi ride from the port. The Apostle John had traveled from Ephesus and stayed in and around this “cave” while he penned Revelations. Any time I can step where historical or biblical figures have, I try to do that. Only 3 Euro to go in. Just do it!","codes":{"ascent_mode":"motorized","visit_season":"peak_may_aug","religious_register":["doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Any time I can step where historical or biblical figures have, I try to do that' = explicit enacted mimetic","motivation_historical_cultural":1,"acknowledges_historical_cultural":1,"topography_register":1}},"29":{"id":29,"site":"cave","plat":"tripadvisor","rating":"3","text":"Neat to See \n Neat to See Nice walk up the hill.  Note, if you do walk there is an historic Cobblestone road most of the way.   If you aren't up for the hill, take the bus up, and walk down. \n\nIt's interesting to see where John was, but it's very Greek Orthodox religious now.  It was a little too much of a Shrine for my taste, but of course it is a religious place.","codes":{"ascent_mode":"walked","visit_season":"shoulder_apr_sep_oct","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"Nice walk up the hill","tourist_mode":"tourist_consumer","religious_register":["conventional"],"mediation":"endorses","effort_valence":"positive","tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'too much of a Shrine for my taste' = mild tourist-consumer distancing","acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"walked"}},"30":{"id":30,"site":"cave","plat":"tripadvisor","rating":"5","text":"Οπωσδήποτε. \n Definitely. A unique place with special energy and history. A beautiful and well-preserved Cave, with a Church and Museum, that you must visit. The monk who guides us and tells the story of the Cave is wonderful.","codes":{"visit_season":"peak_may_aug","religious_register":["mystical"],"mediation":"relays","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'special energy' = mystical; monk-guide tells story = relays; 'beautiful' generic, no specific vision content","acknowledges_historical_cultural":1,"energy_register":1,"topography_register":1}},"31":{"id":31,"site":"cave","plat":"tripadvisor","rating":"5","text":"Spiritual \n Spiritual Small site but amazing to see the place where the St. John had a his vision of Apocalypse. Evan for none religious it has some meaning.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"acknowledges_historical_cultural":1}},"32":{"id":32,"site":"cave","plat":"tripadvisor","rating":"3","text":"La santa grotta dell'Apocalisse \n The Holy Cave of the Apocalypse. A cave where John the Evangelist lived in 95 AD with his student and where he wrote the Book of Revelation. The rocks of the cave reveal the deepest layers of the Earth and are granite. Not recommended for atheists because it evokes no emotion.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Not recommended for atheists because it evokes no emotion'","acknowledges_historical_cultural":1,"topography_register":1}},"33":{"id":33,"site":"cave","plat":"tripadvisor","rating":"4","text":"must do \n A must-do — it's one of those places you have to visit on the island, whether you're a believer or not. I think it's the last link that connects us to our religion.","codes":{"visit_season":"peak_may_aug","religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"37":{"id":37,"site":"cave","plat":"tripadvisor","rating":"5","text":"Very cool place to see \n Very cool place to see Amazing to be in the room where it happened. The priest even came to give a talk. Brave in this time of COVID.","codes":{"visit_season":"peak_may_aug","religious_register":["conventional"],"mimetic":1,"mimetic_engagement":"relayed","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'room where it happened' = relayed positional"}},"38":{"id":38,"site":"cave","plat":"tripadvisor","rating":"4","text":"Quite a small site, but you get a sense of the spiritual significance \n Quite a small site, but you get a sense of the spiritual significance This the monastery built around the cave where St John is believed to written the Book of Revelations. As a functioning monastery and chapel, you get the spiritual significance of the place. There is not much to see, as the cave is quite small, but you can see some frescoes, and nice details like the niche in the rock which St John is supposed to have used when getting up from his prayers. We also managed to come at a time when they were having a Greek Orthodox service, which made the experience more special. It's not a big places, but an interesting historical place as well as place for quite prayer / contemplation.","codes":{"visit_season":"peak_may_aug","religious_register":["conventional","doctrinal"],"mediation":"hedges","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'supposed to have used' hedges; functioning monastery + Orthodox service = active","devotional_participation":1,"acknowledges_historical_cultural":1,"topography_register":1}},"41":{"id":41,"site":"cave","plat":"tripadvisor","rating":"4","text":"Αξιόλογο \n Noteworthy. It's a place you must visit if you go to Patmos. The place exudes tranquility. You'll be lucky if there's a divine liturgy as well.","codes":{"visit_season":"peak_may_aug","religious_register":["conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1}},"42":{"id":42,"site":"cave","plat":"tripadvisor","rating":"5","text":"Grotto of St. John on Patmos \n Grotto of St. John on Patmos The Grotto of St. John - The Cave of the Apocalypse - is reputedly where St. John wrote the Apocalypse in his later years while in exile on Patmos. This is a must see sight for anyone interested in ancient history, whether spiritually inclined, or not. But for those Pilgrims, in search of a spiritual and Biblical Highlight, a visit to the Grotto of St. John is almost on a level with a visit to the Holy Land itself.\nDefinitely, a Must-See experience!","codes":{"visit_season":"peak_may_aug","religious_register":["conventional","doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'almost on a level with a visit to the Holy Land itself'","acknowledges_historical_cultural":1,"topography_register":1}},"43":{"id":43,"site":"cave","plat":"tripadvisor","rating":"5","text":"Great for believers, but not for tourists. \n Great for believers, but not for tourists. As a practising Catholic, this was one of the sights my wife and I eagerly looked forward to seeing, on our cruise around the Greek Islands.  We took an optional tour (paid tour) from our ship MV Celestyal Olympia. Not cheap, but really worth it.  Please take the paid tour, like we did, if you are on any similar \"islands cruise\".  Ships stop at Patmos only for about four hours, it is nearly impossible to see this place and monastery further up the hill in such a short time, if you rely on public transport.  Also, it helps to have a guide. As we had taken a paid tour, we had an excellent guide, who gave us an enormous amount of information.  She also pointed out the best places to get photos.  The views are stunning.  As for the cave itself, it is somewhat underwhelming for non-believers, and for those who don't appreciate history.  It is really something for practising Christians, not for sightseeing tourists.  St. John the Divine lived in this cave for several years, in exile, and wrote the Book of Revelation, more than 1900 years ago!  There are a few steep steps to go down into the cave (and to climb up when you leave the cave!).  We went in May, and yet there were so many tourists, it was a real crush on the steps.  Single file up and down.  I shudder to think how unbearably crowded this place will be in high season, in July/August. I would love to go again to Patmos and stay there for a couple of days, and see this place without the crowds, and spend some time contemplating St. John the Divine.   Perhaps in winter.  It would be colder, but the crowds would not be there!","codes":{"trip_mode":"cruise_excursion","time_pressure":1,"visit_season":"peak_may_aug","elevation_mention":1,"religious_register":["conventional","doctrinal"],"mediation":"endorses","effort_valence":"negative","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","religious_self_id":"catholic","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","motivation_religious":1,"motivation_cruise_sought":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'As a practising Catholic' explicit self-ID; eagerly looked forward + paid tour = sought","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["stairs_down","stairs_up"]}},"44":{"id":44,"site":"cave","plat":"tripadvisor","rating":"5","text":"For people of faith, an amazing experience \n For people of faith, an amazing experience My wife and I visited this site in May 2019 as part of a 14-day tour retracing the footsteps of the apostles John and Paul in Asia Minor (modern day Greece and Turkey.) The inclusion of this attraction was a no-brainer: what biblical tour to this part of the world could possibly omit the place where the disciple John wrote the Book of Revelation? (By way of background, John was the only one of the original twelve disciples to escape execution and spent the last years of his life in exile on the island of Patmos. Exile was less harsh than the death penalty and would, the authorities hoped, impede John’s ability to spread the troublesome gospel of Jesus Christ.)\n\nMost of our travel group were people of faith and approached the entire tour as a spiritual pilgrimage rather than a sightseeing holiday. As a faith-growing experience, our visit to the cave did not disappoint. It was extraordinarily moving to see the cave where John witnessed the visions he described in the Book of Revelation, the last book of the bible. It was equally gut-wrenching to see the harsh cave conditions in which this elderly man laboured so faithfully in his old age to document the Word of God. To see the hole in the wall where he purportedly rested his head every night (a rock-hard pillow to be sure!) made me realize the kind of physical sacrifice he made to complete his work.\n\nI completely get the many lukewarm reviews of this attraction on TA. The cave is small, dark and cramped; the stairs down to it are uneven and difficult to navigate. From a secular sightseeing perspective, the cave is underwhelming. If you’re not a believer, I’m honestly not sure it’s worth your while to go. But for a person of faith, the Cave of Apocalypse is an amazing 5-star experience. Don’t miss it if you’re in the area.","codes":{"trip_mode":"extended_stay","visit_season":"peak_may_aug","elevation_mention":1,"religious_register":["conventional","doctrinal"],"mediation":"endorses","effort_valence":"ambivalent","worth_assessment":"worth_it","sensory_modalities":["vision","embodied"],"enclosure_exposure":"enclosed","religious_self_id":"christian_general","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'14-day tour retracing the footsteps' + 'as a person of faith' explicit self-ID","acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["accessibility_concern","stairs_down"]}},"45":{"id":45,"site":"cave","plat":"tripadvisor","rating":"4","text":"ΜΙΑ ΠΡΩΤΗ ΒΟΛΤΑ ΠΡΙΝ ΤΟ ΜΟΝΑΣΤΗΡΙ \n A First Stop Before the Monastery. A first visit before the Monastery of Saint John. A small cave where John wrote the Book of Revelation. The priest is kind and patiently explains the entire history of the monastery and answers any other questions you might have,","codes":{"visit_season":"peak_may_aug","religious_register":["doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"46":{"id":46,"site":"cave","plat":"tripadvisor","rating":"4","text":"Forcément. Si on vient à Patmos, on visite la grotte. C'est un lieu incontournable. \n Naturally. If you come to Patmos, you visit the cave. It's a must-see. The entry fee is modest. You get a sense of the place that inspired Saint John to write the Book of Revelation.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["doctrinal"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"47":{"id":47,"site":"cave","plat":"tripadvisor","rating":"3","text":"Historical site \n Historical site This is cool land mark historically but sadly it has been turned into a tourist destination. Worth seeing but sad to see the cave being \"worshipped\". It was a prison for the apostle John. It has been turned into a church/monastery for the Greek orthodox church. This has great views of the harbor. If you visit the island check it out.","codes":{"visit_season":"shoulder_apr_sep_oct","tourist_mode":"tourist_consumer","religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'sad to see the cave being worshipped' + tourist-destination frame","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"48":{"id":48,"site":"cave","plat":"tripadvisor","rating":"4","text":"Important place, especially for Christians \n Important place, especially for Christians Probably more geared to the religious, especially Christians interested in John and the writing of Revelations. Not too much to see, but it is interesting nevertheless. We caught a Greek Orthodox service in action that added to the atmosphere.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","doctrinal"],"recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1,"acknowledges_historical_cultural":1}},"49":{"id":49,"site":"cave","plat":"tripadvisor","rating":"5","text":"Amazing holy place \n Amazing holy place This is it - the place St. John wrote the Book of Revelation, the last book of the Bible. Get ther early and share a Greek orthodox communion service. Look out and imagine old John seeing the same view. Stop and pray and be blessed.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"mimetic":1,"mimetic_engagement":"enacted","recognizes_active_institution":1,"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"codebook example A","devotional_participation":1,"acknowledges_historical_cultural":1,"view_centrality":"mentioned","on_site_movement":["posture_pause"]}},"52":{"id":52,"site":"cave","plat":"tripadvisor","rating":"5","text":"Κορυφαίο \n Outstanding. The most important pilgrimage site after Jerusalem.\n\nUnfortunately, there was a group of French tourists in the pilgrimage area who tried to block other worshippers from venerating the icons in order to take photos and videos — which are NOT permitted!\n\nDid none of the staff explain to them the proper conduct and respect expected at the PILGRIMAGE SITE???","codes":{"visit_season":"shoulder_apr_sep_oct","tourist_mode":"institutional_aware","religious_register":["conventional"],"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'OTHER worshippers' places reviewer among worshippers; 'venerating the icons' = devotional_contact"}},"53":{"id":53,"site":"cave","plat":"tripadvisor","rating":"3","text":"Not a great deal to see really, but a significant site \n Not a great deal to see really, but a significant site This is reputedly the place where John had his visions and recorded the book of Revelation, so of great religious significance.\nYou are not allowed to take photos inside.\nOne can't help but feel a bit of imagination is required when the guide talks so much about one piece of rock being where John put his hand, another where he put his head...etc etc. Any evidence?\nNevertheless, an interesting short stop on our way up to see the monastery.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"mixed","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'reputedly' + 'Any evidence?' + guide-sowed skepticism → doubts","acknowledges_historical_cultural":1,"topography_register":1}},"54":{"id":54,"site":"cave","plat":"tripadvisor","rating":"5","text":"Imposante plaats \n An Impressive Place. Visited on foot today. It consists of a monastery with the place where the apostle, according to tradition, wrote his revelations incorporated within it. That alone is impressive; after all, a large part of the world as we know it today was shaped by this.\nThe rooms are filled with icons and descriptions, and we saw several deeply devout people kissing the icons, making the sign of the cross, and praying.\nThe atmosphere is imposing, and we were truly deeply moved.\nDefinitely a place you must visit!\nThe cave is open every day, admission €2 per person.","codes":{"ascent_mode":"walked","religious_register":["conventional","doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'according to tradition' hedges; observes others' devotion without joining","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1}},"55":{"id":55,"site":"cave","plat":"tripadvisor","rating":"4","text":"INTERESTING TO SEE WHERE ST JOHN HAD HIS REVELATION \n INTERESTING TO SEE WHERE ST JOHN HAD HIS REVELATION It is said that this is where St John had his revelation and as is fitting for such a holy site it is now a chapel with beautiful medieval murals.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"hedges","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","review_is_useful":1,"coding_notes":"'It is said' hedges; 'medieval murals' specific vision content","acknowledges_historical_cultural":1}},"58":{"id":58,"site":"cave","plat":"tripadvisor","rating":"2","text":"Nessun evangelista è mai stato qui! \n No Evangelist Was Ever Here! The place is obviously welcoming like the Vatican, San Giovanni Rotondo, or Medjugorje — in other words, anywhere money is made from superstition.\nThere's a convenient parking lot for buses and cars in front of it, though I didn't see anyone there.\nThe story goes that God Almighty \"in person\" dictated the chapter of the Book of Revelation to the alleged evangelist John through a crack in the rock in this cave, located between the town of Skala and the Chora of Patmos.\nThe Gospel of John was written in Greek, which at the time was the equivalent of today's English — meaning it was addressed to an audience that was absolutely neither Palestinian nor Jewish, and this is a strange matter, given that the author was supposedly one of the 12 apostles who spoke only Aramaic.\nAlso curious is the content of this gospel, which is in perfect Neoplatonic style. Let's remember that John was a man of the people, not a philosopher.\nI was asked to tone down these evidently thorny arguments in an earlier draft: I regret having to reiterate them here, but they are precisely the point.\nAll around the structure that covers the ancient Cave of the Revelation, there is a beautiful garden of centuries-old trees, cool and shady. I hope that this will be the convincing argument for curious visitors to come. Whatever mysticism one breathes here comes from within the visitor, not from the outside.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"not_worth_it","religious_self_id":"dismissive","nature_mention":1,"nature_sub_codes":["natural_beauty_praise","flora_fauna"],"facility_complaints":["commerce"],"tone_toward_constraints":"dismissive","tourist_mode":"tourist_consumer","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'alleged evangelist', 'superstition', scornful disavowal → dismissive self-ID; mysticism-from-within is rhetorical dismissal","acknowledges_historical_cultural":1,"topography_register":1}},"62":{"id":62,"site":"cave","plat":"tripadvisor","rating":"5","text":"Stunning Patmos and the Grotto of the Apocalypse \n Stunning Patmos and the Grotto of the Apocalypse We reached the Grotto from the port of Skala, passing through beautiful Hora with it's vibrant colours, labyrinthine streets and gorgeous shops. The Grotto was deep within the cave, so we passed many religious relics as we approached. There were few people there and we were able to sit quietly in this sacred place and contemplate how St John the Baptist lived here and wrote the Book of Revelations during his exile from Ephesus. No photos allowed in the Grotto itself. A must see, even if you have no religious affiliations.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'vibrant colours' specific vision; confuses John Baptist/Theologian but narrates assertively","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"on_site_movement":["posture_pause","walking_around"]}},"63":{"id":63,"site":"cave","plat":"tripadvisor","rating":"5","text":"Highly important landmark \n Highly important landmark Regarless of being a religious person or not, the cave where John, the favorate follower of Jesus lived, is a landmark of very high inportance in the history of mankind.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"64":{"id":64,"site":"cave","plat":"tripadvisor","rating":"4","text":"Interessante visita \n Interesting Visit. An interesting visit to a unique place in Greece. The Cave of the Apocalypse was moving when combined with a religious service.","codes":{"religious_register":["conventional"],"mediation":"endorses","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"attends religious service; 'moving' = embodied","devotional_participation":1,"topography_register":1}},"65":{"id":65,"site":"cave","plat":"tripadvisor","rating":"1","text":"Negocio \n Business. It pains me greatly to see how the church profits from everything — having so much gold and jewels while people are dying of hunger and without shelter.\nUnfortunately, contributing to that makes me feel bad, but I went to accompany my wife.","codes":{"religious_register":["conventional"],"worth_assessment":"not_worth_it","facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"moral critique of church wealth vs hunger; attends only to accompany wife"}},"66":{"id":66,"site":"cave","plat":"tripadvisor","rating":"5","text":"Grotta \n Cave. Just a kilometer and a half from the port, for those who love mysticism and contemplation, it's the right place. In the cave you feel the presence of John — heaven and earth merge together.","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'mysticism', 'heaven and earth merge', 'feel the presence of John'","topography_register":1}},"68":{"id":68,"site":"cave","plat":"tripadvisor","rating":"4","text":"Un lieu impressionnant \n An Impressive Place. For all believers, it's undoubtedly a powerful highlight of a visit to Patmos. There is an admission fee, but it's well worth it.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'for all believers' addresses Christians but not first-person self-ID"}},"69":{"id":69,"site":"cave","plat":"tripadvisor","rating":"5","text":"Mystical and Profound \n Mystical and Profound Heathens like me don’t know that John of Patmos wrote Revelations, or that he did so from a cave in the Greek Isles. The Cave of the Apocalypse is an amazing site for a couple of reasons, and only one of them concerns horsemen. The island of Patmos is beautiful, even for Dodecanese standards. The view from the cave is rolling hills, dotted with goats, surrounded by blue water. How did St. John’s terrifying visions come to such an idyllic place? I imagine a disciple in exile, decades after Gethsemane, bitterly portending the righteous return of Christ...and the violence with it.\n\nThe Cave itself is small—about 400sf, with ample head clearance, and a panoramic view of the bay. An otherwise nondescript corner of the cave has a small recess chiseled out of the rock. It is gilded in silver and protected from devout and other hands by a modest fence. Was this where John kept his writings, or laid his head at night? A Greek Orthodox priest explained it...in Greek, so I’m still in the dark, but even as a non-Christian, it was mystical to stand where one of the most important figures in the New Testament wrote its profound conclusion. \n\nUnlike other holy sites, the Cave of the Apocalypse was not crowded. Maybe a dozen people at any moment, rarely staying for more than five minutes. Beyond the cave, there’s not so much to see—some Byzantine artwork and the small church that was built around the site—so 45 minutes was plenty of time for our visit. Afterward, we cabbed to the monasteries up the hill, then finished with a light lunch, reflecting on the reverend sites of Patmos.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["mystical","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"both","religious_self_id":"spiritual_not_religious","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Heathens like me', 'non-Christian' explicit disavowal; specific vision content rolling hills/goats/blue water","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"70":{"id":70,"site":"cave","plat":"tripadvisor","rating":"5","text":"Μαγικό \n Magical. Serenity!!!\nAn exceptional place. It's definitely worth the effort to visit. It would be good to have appropriate attire in order to enter.","codes":{"religious_register":["mystical"],"effort_valence":"positive","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'magical' → mystical; dress-code mention is advisory not complaint"}},"71":{"id":71,"site":"cave","plat":"tripadvisor","rating":"4","text":"Θρησκευτική Ιστορία \n Religious History. You can't go to Patmos and not see the Cave of the Apocalypse! The cave itself doesn't say much on its own, but no matter how you look at it, it's a part of Christian history. The painting exhibition that was simultaneously on display in the monastery hall was worth seeing. The monk at the Cave was tireless and gave a separate presentation to each group of tourists, in Greek of course. Bravo!","codes":{"religious_register":["doctrinal"],"mediation":"relays","sensory_modalities":["vision"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'Christian history' doctrinal; monk-relays; painting exhibition = vision content","acknowledges_historical_cultural":1,"topography_register":1}},"73":{"id":73,"site":"cave","plat":"tripadvisor","rating":"4","text":"Spiritual place \n Spiritual place It is a spiritual place. Many christian orthodox people come there to pray. Otherwise it is not place for pictures.","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"74":{"id":74,"site":"cave","plat":"tripadvisor","rating":"5","text":"Serene and peaceful \n Serene and peaceful An outstanding experience!! Walked to the Cave of Apocalypse from the city center. Place is overall quiet and beautiful. I finished reading Revelation in a day! Returned back to the city center by bus. \nLovely churches around. Worth mentioning is that you can leave your belongings at the harbor, beside the Coast Guard station. We left our baggage for almost half a day unsupervised.","codes":{"ascent_mode":"walked","religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'finished reading Revelation in a day' embedded devotional reading","topography_register":1,"descent_mode":"motorized"}},"75":{"id":75,"site":"cave","plat":"tripadvisor","rating":"4","text":"ΜΗΝ ΠΑΡΑΛΕΙΨΕΤΕ ΝΑ ΕΠΙΣΚΕΦΘΕΙΤΕ ΤΟ ΣΠΗΛΑΙΟ \n DON'T MISS THE CAVE. A monk recounts the history of John the Theologian and the Book of Revelation.\nTorrent-like, with rich and substantive speech.\nFor the first time I heard that Patmos is referred to as the Jerusalem of the Aegean!\nThe atmosphere inside the Cave is truly solemn and devoutly otherworldly.","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"relays","enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'devoutly otherworldly' mystical; monk-relays history","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1}},"77":{"id":77,"site":"cave","plat":"tripadvisor","rating":"5","text":"Muito interessante \n Very Interesting. Beyond the calm of the place, the feeling of peace surprises you.\nThe cave, where according to history Saint John wrote the Book of Revelation, is very beautiful. The spot where he slept, the split in the ceiling of the cave. The artworks on display.\nA unique opportunity to visit a holy place.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'according to history' relays; 'split in the ceiling' specific vision","acknowledges_historical_cultural":1,"topography_register":1}},"79":{"id":79,"site":"cave","plat":"tripadvisor","rating":"4","text":"Απιστευτα \n Unbelievable. An indescribable feeling.\nThe cave site is an indescribably unique experience. The priest's vivid presentation is delightful, complementing the experience and ultimately explaining both the entire experience and the history.","codes":{"religious_register":["mystical"],"mediation":"relays","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'indescribable' edges toward mystical-ineffable; priest-relays","acknowledges_historical_cultural":1,"topography_register":1}},"80":{"id":80,"site":"cave","plat":"tripadvisor","rating":"5","text":"Gate to Heaven \n Gate to Heaven Evangelist John was the beloved pupil of Jesus Christ. The cave where he wrote the Apocalypse (Revelation) is therefore of unique significance to Christians and not only. Apocalypse is the only book of the New Testament with prophesy for the future. Evangelist John saw the rock of the cave crack in three points (Holy Trinity) and heard God's voice telling him to write down what he has seen in the past, what he was seeing that moment and what was going to happen in the future. The book is full of allegories and it's difficult for every researcher to interpret them.\nInside the cave there are a few holes on the rock, where the Evangelist put his hands to stand up. No photos are allowed inside the cave. The visitors must be decently dressed and have shoulders and knees covered.\nAbove the entrance there is a sign: This awesome place can't be anything else but God's home and this is the Gate to Heaven. These words affect the visitors spiritually and wake the need for purification of their souls. Positive energy covers the place offering the visitors peace of mind and a kind of optimism.\nSince 2006, the Cave together with the Monastery of St.John the Theologian, are part of the UNESCO Cultural Heritage.\nThe view from the Cave complex is stunning.","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_heritage_protection":1,"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"narrates Trinity rock split endorsed; 'positive energy' mystical; UNESCO fires","acknowledges_historical_cultural":1,"energy_register":1,"topography_register":1,"view_centrality":"mentioned"}},"82":{"id":82,"site":"cave","plat":"tripadvisor","rating":"5","text":"Soaked in prayer \n Soaked in prayer Holy place with a view to be seen. No better place to read Revelation. Try to miss busy times if you want spend some quiet time in reflection. There are Orthodox services held here. Like many of these places on the island there are candles to be lit for your intentions.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"view_centrality":"mentioned"}},"83":{"id":83,"site":"cave","plat":"tripadvisor","rating":"5","text":"Interesting historic place. \n Interesting historic place. We ambled uphill to this Cave on a beautiful sunny day. Well worth seeing.  There is a beautiful energy in this place.","codes":{"ascent_mode":"walked","elevation_mention":1,"religious_register":["mystical"],"effort_valence":"positive","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'beautiful energy' mystical; 'ambled uphill' walked","energy_register":1,"topography_register":1}},"84":{"id":84,"site":"cave","plat":"tripadvisor","rating":"5","text":"Αξίζει! Να το επισκεφθείτε οπωσδήποτε! \n Worth it! Definitely visit! I've visited the cave many times and attended the liturgy twice. It's worth going and coming back again. It exudes a special energy that you feel from the very first moment. I liked that no major interventions have been made to the site. I would like the people who run and care for the Monastery to maintain a more spiritual level. It's a shame for a Holy Place to be heavily commercialized (although it's the norm everywhere). I hope to visit the cave again soon.","codes":{"religious_register":["conventional","mystical"],"mediation":"endorses","worth_assessment":"worth_it","facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'special energy' mystical; attends liturgy; critiques commercialization from within","devotional_participation":1,"energy_register":1,"topography_register":1}},"85":{"id":85,"site":"cave","plat":"tripadvisor","rating":"3","text":"Beetje teleurstellend \n A Bit Disappointing. The cave itself is very special. A whole complex has been built around it, which is surely also worth seeing, but it's not open to visitors. The view outside is truly breathtaking. Definitely a beautiful spot to write the Book of Revelation in solitude.","codes":{"religious_register":["doctrinal"],"worth_assessment":"mixed","sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","facility_complaints":["area_access"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'complex...not open to visitors' = area_access (v1.1)","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"86":{"id":86,"site":"cave","plat":"tripadvisor","rating":"5","text":"Lieu chargé d'histoire \n A Place Full of History Entrance fee (€2). The monastery surrounding the cave is located halfway between the port and the monastery at the top. This is the cave where Saint John was dictated by God his gospel and the Book of Revelation during his deportation by the Romans on this isolated island of Patmos. You can see the crevice where he used to rest. Very calm and magical when there is no one around, as was the case for us. Pay attention to the visiting hours. Photography is forbidden inside the cave so as not to disturb the believers, which is why there is surveillance in place to make prayers and hordes of paparazzi coexist.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"halfway between the port and the monastery at the top","religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'calm and magical' mystical; photography rule narrated approvingly","acknowledges_historical_cultural":1,"topography_register":1}},"87":{"id":87,"site":"cave","plat":"tripadvisor","rating":"5","text":"standing on Holy Ground \n standing on Holy Ground After talking to local people,we decided to walk to the Holy Cave of the Apocalypse.\nWe left the hotel early at 7.00 a.m\nTaking the road that leads to the cave from Skala to Chora, half a mile down the road you can pick up a footpath\nthat leads to the entrance of the Cave.\nBeautiful views of Scala Harbour as you climb up the mountain, the walk takes about 30 minutes.\nFor me it is a pilgrimage I always wanted to do from young age, great excitement as we got closer to the Cave.\nClimb down the stairs to the Cave, we could hear chanting and the smell of scents and prayers.\nOnce inside we were over whelm, a sense you stand on Holy Ground.\nSilence and prayers a wonderful and a  beautiful way to start your day, exploring this charming island of Patmos\nDescribed by many as the \" Jerusalem of the Aegean\".\nOn our own with 2 monks chanting and praying , we lighted candles","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"Beautiful views of Scala Harbour as you climb up the mountain","religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","effort_valence":"positive","worth_assessment":"worth_it","sensory_modalities":["vision","sound","smell","embodied"],"enclosure_exposure":"both","mimetic":1,"mimetic_engagement":"enacted","devotional_contact":1,"recognizes_active_institution":1,"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'pilgrimage I always wanted' sought-language; chant+scent sensory; lighted candles=devotional_contact; prayer=enacted mimetic","devotional_participation":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["stairs_down"]}},"89":{"id":89,"site":"cave","plat":"tripadvisor","rating":"5","text":"Momento magnífico \n A Magnificent Moment The best thing to do in Patmos... the opportunity to visit the cave where the Apocalypse was revealed to the Apostle John is sensational.\nSeeing where he slept, where he prayed, where he lived — it's incredible to imagine how it all happened.\nThere's also a small chapel in the cave. These are moments of deep connection with God, and for us Catholics it is very important.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","religious_self_id":"catholic","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'for us Catholics' explicit first-person Catholic self-ID + 'deep connection with God'","acknowledges_historical_cultural":1,"topography_register":1}},"90":{"id":90,"site":"cave","plat":"tripadvisor","rating":"4","text":"Cave made into religious shrine. \n Cave made into religious shrine. This rock grotto is believed to be the location where John saw the visions that inspired him to write the Book of Revelation. It's a typically revered site for the Orthodox Christian world where even divots in the rock where John might have reached his hand or lain his head are outlined in silver. Seven lamps adorn the space, And several icons and other artworks as well. Our guide, Nicholas, had quite the eloquent presentation. Photos are actually not allowed in the shrine but you can see here that people have ignored that request.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"hedges","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'believed to be', 'might have' hedges; guide=eloquent; silver-divots specific vision","acknowledges_historical_cultural":1,"topography_register":1}},"91":{"id":91,"site":"cave","plat":"tripadvisor","rating":"5","text":"The Cave of the Revelation \n The Cave of the Revelation Yes, it was a very spiritual experience, one I've been waiting for for more than 20 years. I just wish it hadn't been touched and made into a financial opportunity. I could have lived without all the vendors. Regardless, it is where John received the Revelation and the spiritual overtook the natural.","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","worth_assessment":"worth_it","facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'been waiting for 20 years' sought-language; 'spiritual overtook the natural' mystical","acknowledges_historical_cultural":1,"topography_register":1}},"92":{"id":92,"site":"cave","plat":"tripadvisor","rating":"4","text":"Just an ordinary opening in the rock \n Just an ordinary opening in the rock Nothing special for people like me, who are not so religious. An opening in the rock, now under a church, where supposingly st. John heared a voice to write his apocalypse. Well, interesting place, not more.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"mixed","religious_self_id":"spiritual_not_religious","review_is_useful":1,"coding_notes":"'not so religious' first-person disavowal (v1.1); 'supposingly' doubts","acknowledges_historical_cultural":1,"topography_register":1}},"93":{"id":93,"site":"cave","plat":"tripadvisor","rating":"5","text":"Cave of Apocalypse \n Cave of Apocalypse Usually the sole reason to visit the island of Patmos, we were lucky to arrive in time for the service. Extra special history and offers a chance to get closer to some of our Christian heritage","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","motivation_religious":1,"recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'sole reason to visit', 'get closer to Christian heritage' = motivation; 'our Christian heritage' borderline self-ID held at unspecified per pilot discipline","devotional_participation":1,"acknowledges_historical_cultural":1}},"94":{"id":94,"site":"cave","plat":"tripadvisor","rating":"4","text":"Cave where John had his revelation \n Cave where John had his revelation A guided tour and as some say the Greeks have a story for everything. This cave was where John had his revelation and supposedly there is a crack in the inside of the cave where it happened. \nAs a prisoner he was able to roam around and it is amazing that you are where he was so many thousand of years ago.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","review_is_useful":1,"coding_notes":"'some say', 'supposedly' hedges; 'Greeks have a story for everything' meta-framing","acknowledges_historical_cultural":1,"topography_register":1}},"95":{"id":95,"site":"cave","plat":"tripadvisor","rating":"4","text":"A religious experience \n A religious experience Had seen this on a TV documentary but in reality it was different. A bit disappointed with the cave itself as it has been modernized and built around whereas I had expected a more primitive experience. None the less you do soak up a religious moment. Alos a must visit iconic place.","codes":{"religious_register":["conventional"],"worth_assessment":"mixed","review_is_useful":1,"coding_notes":"'modernized/built around' vs 'soak up religious moment' mixed","topography_register":1}},"96":{"id":96,"site":"cave","plat":"tripadvisor","rating":"3","text":"Too crowded to really feel any revelations \n Too crowded to really feel any revelations Our cruise stopped at Patmos and there really isn't much else to do here at night. The cruise excursion was overpriced for a trip to the monastery and cave, so we opted to share a taxi ride with another couple to visit the cave/grotto of apocalypse. It was so crowded in what is already a cramped space so it was not enjoyable and we arrived earlier than many of the other tour groups. By the time we left it was like the NY subway at rush hour inside and breathing was difficult. It was hard to hear the explanations given by the guides inside and we left not feeling inspired or spiritual. We did walk around the small town of Patmos before returning to the cruise ship and that was OK as well. Definitely my least favorite cruise stop.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","tourist_mode":"tourist_consumer","worth_assessment":"not_worth_it","sensory_modalities":["embodied"],"enclosure_exposure":"enclosed","facility_complaints":["crowding","prices"],"tone_toward_constraints":"frustrated","motivation_cruise_thing_to_see":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'NY subway at rush hour inside', 'least favorite cruise stop'; 'breathing difficult' = embodied","topography_register":1,"on_site_movement":["accessibility_concern","walking_around"]}},"97":{"id":97,"site":"cave","plat":"tripadvisor","rating":"4","text":"A quiet and reflective stop on Patmos \n A quiet and reflective stop on Patmos This cave is where St. John wrote Revelations. You can feel the spirit, even if you aren’t spiritual! Places that have survived through history seem to get an energy stamp from the inhabitants. You can spend longer here if you wish, but even a short stop can give you an idea of solitude experienced by St. John. \n\nIf you have any claustaphobic feelings, don’t enter - this is a small space, with low ceilings and many people!","codes":{"religious_register":["mystical"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'energy stamp' mystical; claustrophobia warning = crowding+enclosure","acknowledges_historical_cultural":1,"energy_register":1,"topography_register":1,"on_site_movement":["accessibility_concern"]}},"98":{"id":98,"site":"cave","plat":"tripadvisor","rating":"4","text":"Quando la folla si dirada \n When the Crowd Thins Out A guided visit is recommended, but you will appreciate the cave even better in its deep religious calling when the crowd has thinned out and only a few remain to admire it and pray; and besides, speaking plainly, the spaces are tight. So going to the cave with friends, during a quiet moment, let me appreciate it once again, in addition to the two previous times I had visited it with an organized group.","codes":{"religious_register":["conventional"],"mediation":"relays","enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"sensory_modalities":["embodied"],"topography_register":1,"on_site_movement":["accessibility_concern"]}},"99":{"id":99,"site":"cave","plat":"tripadvisor","rating":"4","text":"Aspecto histórico e religioso. \n Historical and Religious Aspects For those who appreciate biblical history, this cave is one of the most attractive points on the Island of Patmos. The Cave of the Apocalypse, where, according to history and researchers, the Apostle Saint John dreamed and narrated the mysteries of the Book of Revelation. It is worth visiting (better when guided) and be prepared to face a line to enter the cave and an excess of tourists. The cave is inside the Orthodox Church of %*& Saint Anne %*& (dedicated to Mary). This church is inside a well-protected and fully walled structure. To get to the Cave of the Apocalypse, be prepared, as there are stairs to go down and the same ones to go back up. Inside, there is little lighting and no informational signs. Tradition says that in the cave, a rock was split into two parts and then into three, totaling 3 fissures, which symbolize the Holy Trinity (the part of the cave's ceiling divided into 3 parts is isolated with partitions decorated with icons and without direct lighting), and through these fissures God's voice dictated the Book of Revelation to Saint John, who wrote it on the ground and later, with the help of his disciple Prochorus, transcribed it. The place where Saint John rested his head to sleep and where he placed his hand to get up are covered in silver, and a kind of pulpit in the rock that reportedly served as support for his disciple to write can also be seen. All of these aspects make the visit an emotional experience.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"hedges","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["crowding","signage"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'according to history and researchers', 'Tradition says', 'reportedly' hedges; 'no informational signs' = signage","acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["stairs_down","stairs_up"]}},"101":{"id":101,"site":"cave","plat":"tripadvisor","rating":"5","text":"St. John Revelations \n St. John Revelations This was a great experience! Very spiritual and glad we decided to leave the ship to do this excursion","codes":{"trip_mode":"cruise_excursion","religious_register":["conventional"],"worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1}},"102":{"id":102,"site":"cave","plat":"tripadvisor","rating":"3","text":"So-so -- no big deal \n So-so -- no big deal My wife and I were here on a Globus tour, but this was part of Celestyal Cruise Olympia tour.  \nMy advice:  Save your money, and if you feel you MUST go there for a 10-minute visit, take a cab.  Much cheaper than what the cruise ship charges .. AND we got there after 6pm!  Think about it - with DST!  Nice going, Celestyal!  And the inside of it is so-so, and no big deal.  We were in and out within 10-15 min.  AND that included a short climb to/from the bus.\nYou are not allowed to take photos inside...  Someone talks briefly about the various articles inside the Grotto.\nIt's a cave in which one thinks of everything very spiritual.  This is where St. John of Patmos was said to have written the Book of Revelation.  It is fortresslike, 11th century monastery dedicated to the saint.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","tourist_mode":"tourist_consumer","time_pressure":1,"religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"not_worth_it","facility_complaints":["prices"],"tone_toward_constraints":"dismissive","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'in and out within 10-15 min' explicit brevity; 'save your money' + 'so-so no big deal' dismissive consumer","acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"motorized"}},"103":{"id":103,"site":"cave","plat":"tripadvisor","rating":"5","text":"ΙΕΡΟΣ ΤΟΠΟΣ! \n A SACRED PLACE! Worth the visit... We went to worship and were guided by a kind gentleman who works as a caretaker (probably). This is where John lived and wrote the Book of Revelation.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'we went to worship' = enacted mimetic + religious motivation","devotional_participation":1,"acknowledges_historical_cultural":1}},"104":{"id":104,"site":"cave","plat":"tripadvisor","rating":"1","text":"no comment horrible et anti pathique \n no comment horrible and unfriendly For me, the cave was a very bad experience because they are really very hostile toward visitors and religious people wanting to take a photo of the sacred site — they almost want to attack us. For me, if you charge an entry fee for visiting rights, it's not just to look, especially if you want to make money and profit off of people (foreign tourists and religious visitors). I was very interested in seeing a holy place like this one, but I felt bad vibes, like a feeling of being oppressed and having my heart in a knot. Anyway, it was not my revelation in that cave, given what certain people who live there have to say.","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"worth_assessment":"not_worth_it","facility_complaints":["photography_restrictions","prices"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"felt 'oppressed', 'heart in a knot' = embodied; entry-fee + photo-rule = consumer-frame","topography_register":1}},"105":{"id":105,"site":"cave","plat":"tripadvisor","rating":"3","text":"Worth stop \n Worth stop We visited Patmos during a cruise. After walking around the town for a little while we took a taxi up to the cave. While it's worth taking a look I would not call it a must see. The history of the events at the cave has been thrown into question. Many are not even sure which Saint John was present at the cave. If you go I would definitely read up before.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"mixed","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'history thrown into question'; 'not even sure which Saint John'","acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["walking_around"]}},"106":{"id":106,"site":"cave","plat":"tripadvisor","rating":"5","text":"A Must See \n A Must See Just visited the Grotto of St. John. The View,  the Cave, the Serenity  is humbling - It amazes me that in order to go in, YOU MUST BOW DOWN to pass through into the cave.When I visited the peaceful place, I was moved to look up at the sky thru the window and only imagine what it must have felt like. \n The sky, the sea, all the rock that are on Patmos, very little vegetation, I was moved in my heart.  Very humbling experience.","codes":{"religious_register":
