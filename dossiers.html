perience and good for relaxation.\nEspecially the Romeo hotel staff were very friendly (you feel like you are at home) and we had our daughter’s birthday celebrated in a wonderful day. Romeo hotel is a different style of rooms and is ideal for a summer vacation.\nWe arranged the whole tour from Turkey to Patmos and to Athens via Crossroads travels and would strongly recommend them for your tour as they are flexible and focused to meet customer’s expectations.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"Multi-stop itinerary (Kusadasi-Samos-Patmos); mostly travel logistics","topography_register":1}},"1072":{"id":1072,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Exquisite! \n Exquisite! The Monastery of Saint John the Theologian is a holy place. The atmosphere inside is remarkable. One must feel it by himself.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"1073":{"id":1073,"site":"monastery","plat":"tripadvisor","rating":"4","text":"The view is worth the climb up. \n The view is worth the climb up. We did a bike ride around the island, starting with an assent of the hill that the Monastery is on.  Since it was time for a break we decided to check it out; be warned that there is an admission charge (my receipt said 4E).  The views from the front are spectacular, followed by a set of steps into the Monastery.  Despite the foreboding posture like a fort at the top of the hill (since given when it was built everything needed to be built like a fort), it is actually pretty quaint inside.  Nice courtyard opening into different sections, with lots of contrasting shadows.","codes":{"ascent_mode":"motorized","elevation_mention":1,"topography_quoted_phrase":"ascent of the hill that the Monastery is on","effort_valence":"positive","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"coding_notes":"bike ride coded motorized — context suggests rental bike up hill","topography_register":1,"view_centrality":"central","on_site_movement":["stairs_up"]}},"1074":{"id":1074,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Great Monastery!! \n Great Monastery!! The Monastery is on the top of the hill,with amazing views ,worth seeing! Read the history about the St.John and the revelations before you go... The bus is only 1.50 euro and we walk back is downhill and enjoy taking pictures all the way to the  village.","codes":{"ascent_mode":"motorized","elevation_mention":1,"topography_quoted_phrase":"Monastery is on the top of the hill","effort_valence":"positive","worth_assessment":"worth_it","religious_register":["doctrinal"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"walked"}},"1075":{"id":1075,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Anticlimatic \n Anticlimatic We took the public bus up to the monastery. The view from outside the monastery and from the surrounding town was amazing. We liked that more than the monastery and that part was free. We were really disappointed because the chapel and courtyard are no longer free to enter. You have to pay to enter and now you get to see the Treasury in that price. The Treasury didn't really interest us and we thought we would get to see more of the monks and monastery itself but you don't. You only see the museum Treasury and the chapel. Not worth the money for us. The web site says modest dress required so I followed directions but there were people there wearing whatever and they didn't care (probably since they charge now).\n\nYou can walk on a very rocky foot path back down to town and it also leads you to the Cave of the Apocalyps. It was a pretty walk and all downhill.","codes":{"ascent_mode":"motorized","tourist_mode":"tourist_consumer","elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"not_worth_it","facility_complaints":["prices","area_access","dress_code"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Attraction-frame disappointment; expected to see monks, only got museum/chapel","topography_register":1,"view_centrality":"central","descent_mode":"walked"}},"1077":{"id":1077,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Monastery \n Monastery The Saint John Monastery has an important library; the museum is beautiful and very interesting (entry 6 euro). You can view some manuscripts of the first centuries of our era. The cave of the apocalypse also must be visited. The way to the monastery is not easy per pedes (the bus or taxi are recommended). Other monastery is  Zoodochos Pigi. \nMany restaurants in Mandraki.","codes":{"ascent_mode":"motorized","religious_register":["doctrinal"],"effort_valence":"negative","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1081":{"id":1081,"site":"monastery","plat":"tripadvisor","rating":"5","text":"worthwhile \n worthwhile I recently stopped here on a cruise and hiked from the port to the Monastery, down to the grotto of St John, and back to the port for lunch.  Low key island, good hike for reasonably fit people, great views, excellent attractions, very worthwhile stop in the Greek Islands.","codes":{"ascent_mode":"walked","trip_mode":"cruise_excursion","elevation_mention":1,"topography_quoted_phrase":"hiked from the port to the Monastery, down to the grotto","effort_valence":"positive","worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"walked"}},"1082":{"id":1082,"site":"monastery","plat":"tripadvisor","rating":"4","text":"The view from the top of the Island \n The view from the top of the Island If you are traveling to Patmos, it really is one of the main places you should visit including the Basilica of the Apocalypse (where John wrote the Book of Revelations around 90 AD).  The monastery can be seen from almost any place on the island.  Although this monastery did not exist when John was exiled to Patmos from Ephesus, it nonetheless will give you breath-taking views of the entire island.  Because they have some very ancient frescos and religious artifacts in the museum, it is also fairly educational.  It also was nice to actually see the monks going about their daily lives in spite of all the tourists coming through.  As others have noted there are some restored windmills, and interesting architecture to see as well.  Having a guide is not necessary, but a guide will provide you with more of the history if you don't research beforehand. Overall, a nice way to spend the morning!","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"view from the top of the Island","religious_register":["doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"central"}},"1083":{"id":1083,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A VERY SPECIAL PLACE \n A VERY SPECIAL PLACE The Monastery of St.John is definitely worth seeing IF you are a religious and or history buff. \n\nOf course, be sure to read about Patmos BEFORE embarking on your trip in order to get the most out of it. Do research. There's nothing worse than seeing these hugely historical sites and not understanding what you are seeing. Or, pay for a tour-guide. \n\nThe cave is the actual place where John of Patmos, wrote the book of the Revelation prior to 100 AD. You'll see a stone with a deep inlay where he wrote about his visions. Can you imagine the Voice of God coming to you coming to you from a rock?  How would John have felt about it alone in this cave? \n\nThe church came later.  So did the wall paintings and icons -- however, these are quite old from  the beginning of AD to the 1500s. These too are well worth the trip. \n\nThe island is in the Aegean and in the height of summer the sky is a deep hue of blue. \n\nOne thing I would highly recommend is having a full water bottle.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'How would John have felt about it alone in this cave?' + 'Voice of God from a rock' → enacted mimetic","motivation_historical_cultural":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1087":{"id":1087,"site":"monastery","plat":"tripadvisor","rating":"5","text":"a place to meditate \n a place to meditate the history of this place is wonderful.. .and we loved how the cave has turned into more beautiful buildings","codes":{"religious_register":["mystical"],"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1089":{"id":1089,"site":"monastery","plat":"tripadvisor","rating":"4","text":"monastère traditionnel orthodoxe \n Traditional Orthodox monastery. An interesting and educational visit, especially if you have the opportunity to be there on Orthodox Easter day.\nThe location at the top of a hill is superb and offers a magnificent view of the island of Patmos.","codes":{"elevation_mention":1,"religious_register":["conventional"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"1090":{"id":1090,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Excellent museum \n Excellent museum It's a very impressive building with an excellent museum.\nBus ride from Skala 1.50 Euro,\nIf doing the Cave of the Apocalypse as well, ride the bus here first, then walk down.\nOnly open mornings.","codes":{"ascent_mode":"motorized","religious_register":["doctrinal"],"review_is_useful":1,"topography_register":1,"descent_mode":"walked"}},"1091":{"id":1091,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Exceptionnel \n Exceptional. It's a small monastery but with incredible charm! The rooms are tiny, there are small staircases everywhere, the museum contains rare pieces, the view of the bay is breathtaking... Pure joy!","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"review_is_useful":1,"view_centrality":"mentioned"}},"1092":{"id":1092,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Much more than just.... a must \n Much more than just.... a must The Monastery of St.John stands above the village of Chora, like being the master of the island (which perhaps is). This Castle-Monastery has a unique architecture, offering breathtaking view to the whole island.\nInside you can visit the Holly Temple dated in the fifteen hundreads, enter the museum (ticket 2 euros) and see a magnificent collection of jeweled alices, crowns, Crosses, old writings dating back as far 1073, icons and religious paintings including an original El Greco.\nI had the chance to visit this monastery twice during my stay in Patmos. The first visit was to see all those treasures, enjoy the view and architecture and light a candle at the church. My second visit was on Good Saturday night for Resurrection, on a great devotion. Simply unforgetable","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"stands above the village of Chora, like being the master of the island","religious_register":["conventional","doctrinal"],"effort_valence":"positive","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","devotional_contact":1,"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Visited twice including Good Saturday Resurrection devotion + lit candle → motivation_religious + devotional_contact","devotional_participation":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"1093":{"id":1093,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Physically challenging but wouldn't have missed it. \n Physically challenging but wouldn't have missed it. As both a practicing Christian (Protestant) and a historian I had wanted for years to visit this site a millennium of pilgrims have regarded as sacred.  I wanted to wait till we were retired and so could be there for Holy Week, as Easter is Greece's most solemn and festive celebration.  Last week we finally did it and loved the experience.  \n\nThe monastery itself, with its Byzantine architecture, wonderful frescoes, impressive lanterns, crosses, censers, chalices and the like, and its sonorous bell peals was very moving, as was watching many locals and pilgrims from afar kissing the icons and lighting candles for loved ones.  The treasury/museum was impressive, with ancient manuscripts of Aristotle and Aristophanes as well as sacred documents, exquisite handmade liturgical vestments and icons including one said to be by El Greco.  The day we were there, high school boys from Skala were carrying the monastery's icons throughout the surrounding neighborhood, followed by a kindly papa (priest) blessing every person and building.  The central square was strewn with fragrant sprigs of Spanish lavender, which many of the locals and pilgrims took home bits of to hang in their homes or cars.\n\nI have to say that as a person with mobility and cardiac issues (I temporarily use a cane and am prone to lightheadedness during exertion), getting up to the monastery and exploring the delightful historic village of Chora which surrounds it were quite difficult for me and required frequent pauses to rest.  There are lots of steps and many uneven cobblestones.  We were so tuckered out after we left that we took a 3 hour nap (!!), and four days later I am still stiff and sore. I frankly don't know if/how a person in a wheelchair could manage it.  \n\nBut for us, the experience was more than worth it.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"getting up to the monastery... were quite difficult","religious_register":["conventional","doctrinal","mystical"],"effort_valence":"ambivalent","worth_assessment":"worth_it","sensory_modalities":["vision","sound","smell","embodied"],"religious_self_id":"christian_general","nature_mention":1,"nature_sub_codes":["flora_fauna"],"recognizes_active_institution":1,"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Practicing Christian (Protestant), historian, waited years for Holy Week — christian_general","motivation_historical_cultural":1,"devotional_participation":1,"acknowledges_historical_cultural":1,"on_site_movement":["accessibility_concern","posture_pause","walking_around"]}},"1095":{"id":1095,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Монастырь Святого Иоанна \n Monastery of Saint John. One of the most beautiful places on Earth! The breathtaking panorama that opens up from the foot of the monastery is awe-inspiring!\nThe monastery was founded in 1088 by the venerable Christodoulos. He became the first abbot of the monastery he founded and began its construction, which lasted 19 years. The monastery was built as a fortress with bastions and towers. Over the years of construction, a small settlement with pastures formed around it, giving rise to the town of Chora. The monastery was regularly subjected to pirate raids. Christodoulos left it and returned to Kos, where he died around 1111. Despite this, the monastery continued to exist; later, the relics of Christodoulos were transferred there, kept in a chapel bearing his name.\nIn 1770–1774, the island of Patmos was occupied by the Russian fleet under the command of Admirals Alexei and Fyodor Orlov. The dagger of one of them is kept in the monastery museum.\nCurrently, about 40 monks reside in the monastery, and services are held once a day from 3 to 6 in the morning. At the entrance to the monastery, there is a sign prohibiting photography and video recording; however, this does not stop the tourists who arrive here.\nThe town of Chora, adjacent to the monastery, is no less interesting as a historical landmark, and I think it deserves its own separate account. We dedicated an entire separate day to exploring it!","codes":{"elevation_mention":1,"topography_quoted_phrase":"panorama that opens up from the foot of the monastery","religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Detailed Christodoulos history; 40 monks, services 3-6am — institutional awareness","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"1098":{"id":1098,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Belo complexo medieval monástico. \n Beautiful medieval monastic complex. It was built between 1088 and 1091 on a hill in Patmos and can be seen from virtually every point on the island. The structure resembles a medieval fortress and houses several chapels, gardens, arcades, rooms, and courtyards inside.\n\nThe monastery exceeds expectations, especially the Main Chapel, always guarded by a Greek Orthodox monk. On the arcades above the entrance door are 17th-century paintings depicting various miracles of Saint John the Theologian (also known as John the Divine). The Chapel of the Apostles and the Chapel of the Virgin are also worth a visit. The Library holds ancient collections of manuscripts, approximately 1,000 codices, and more than 3,000 printed volumes, the earliest of which were catalogued from the year 1200. The \"Treasury\" holds rich works of sacred art (mainly ancient icons of the Greek Orthodox Church), some from the 12th century, and various New Testament manuscripts with beautiful illuminations. It is a small museum that deserves to be visited at a leisurely pace in order to appreciate all the pieces.\n\nAll the facilities are very well maintained and clean. The Treasury available for public visitation, despite being housed in small rooms, is very well organized. Basic information (on the labels) about the art objects is presented in English.\n\nThe monastery can be accessed by car or bus to the parking area. From there, you walk up a narrow, somewhat steep alley to the main entrance. Though a bit tiring, the climb is also worth it for the beautiful view of the island. A suggestion: save your souvenir shopping for the return trip!","codes":{"elevation_mention":1,"topography_quoted_phrase":"built between 1088 and 1091 on a hill","religious_register":["conventional","doctrinal"],"effort_valence":"ambivalent","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_active_institution":1,"review_is_useful":1,"nature_mention":1,"nature_sub_codes":["flora_fauna"],"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"1101":{"id":1101,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Bel panorama e atmosfera mistica \n Beautiful panorama and mystical atmosphere. From the monastery you can enjoy a splendid view of the entire island... The atmosphere is wonderful... I had the feeling of having traveled back in time... The museum, on the other hand, did not particularly impress me, but that is purely a matter of personal taste... Definitely worth seeing!","codes":{"elevation_mention":1,"topography_quoted_phrase":"splendid view of the entire island","religious_register":["mystical"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"1102":{"id":1102,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Magnifico il monastero, bellissima l'isola. \n The monastery is magnificent, the island is beautiful. We visited the Monastery of Saint John in Patmos... truly beautiful.\nWe set off early in the morning from the port of Kos by hydrofoil... the round-trip ticket cost €24.\nThe monastery, with its imposing and austere structure, towers over the island and contrasts with the small white houses in the lower part. The visit is truly interesting; inside the monastery there is a museum with unique historical pieces dating back to the Byzantine Empire — the mosaics and iconographic paintings are extremely interesting.\nWalking along the monastery walls you can enjoy breathtaking views.\nAbsolutely NOT TO BE MISSED!","codes":{"trip_mode":"day_trip_ferry","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"towers over the island and contrasts with the small white houses","religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","austerity_register":"appreciative","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'imposing and austere structure... contrasts with small white houses' → appreciative austerity + town/hill contrast","acknowledges_historical_cultural":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"1103":{"id":1103,"site":"monastery","plat":"tripadvisor","rating":"5","text":"So much history! \n So much history! Coaches and cars have to park at the bottom of the hill and you have to walk up steep, cobbledstoned roads and steps to the entrence.  It is not for the fainthearted!!\nOnce you get up to the monastery it is amazing.  There are so many rooms, chapels and the exhibition you could spend several hours there.  It does get very busy with day trippers from other islands, so get there early to beat the rush.","codes":{"ascent_mode":"mixed","elevation_mention":1,"topography_quoted_phrase":"park at the bottom of the hill and you have to walk up steep, cobblestoned roads","effort_valence":"ambivalent","worth_assessment":"worth_it","religious_register":["conventional"],"facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1,"on_site_movement":["accessibility_concern"]}},"1105":{"id":1105,"site":"monastery","plat":"tripadvisor","rating":"3","text":"The experience didn't meet expectations \n The experience didn't meet expectations The monastery is -- obviously -- a primary reason why many people travel to Patmos.  We happened to be there for a wedding and decided to go because of the history and uniqueness of it all.  It is interesting, don't get me wrong, and I know a lot of pilgrims and the very devout have wonderful experiences, but going as neither, I thought it was just OK.  \n\nThere is no opportunity to learn about the history of what happened, or the writings themselves.  It's a simple cave with some ancient artifacts and candles.  I would have loved to have learned ore.","codes":{"visit_season":"peak_may_aug","tourist_mode":"tourist_consumer","worth_assessment":"mixed","religious_self_id":"spiritual_not_religious","facility_complaints":["signage"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'going as neither pilgrim nor the very devout' explicit first-person disavowal (v1.1)","motivation_historical_cultural":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1107":{"id":1107,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Its locally known as The Abbey of St Ionnis the Theologian! \n Its locally known as The Abbey of St Ionnis the Theologian! Its a bit of a trek up the hill but there is a taverna to stop and have a drink! You have to park and walk, but be careful to not park in the bus area, apparently you will be fined.\n\nOn the way to the monastry there are two beautiful gift shops on the left selling really nice quality stuff, probably the nicest I have found in Patmos.\n\nThe Abbey is stunning, beautiful frescos, architecture etc, the museum, which is in the abbey is worth seeing too - keep your entrance tickets as you need to show them again here.  It is full of amazing artifacts, manuscripts, crosses, robes etc, fabulous, a real capture of history.\n\nThe view over Patmos from the Abbey is great too, you can see for miles!","codes":{"ascent_mode":"mixed","elevation_mention":1,"topography_quoted_phrase":"trek up the hill but there is a taverna to stop","effort_valence":"ambivalent","worth_assessment":"worth_it","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"1109":{"id":1109,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Mistico \n Mystical. Beautiful, very well maintained, with an intense atmosphere — the museum and the icons on display are truly interesting as well.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1110":{"id":1110,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Magnificent place, magnificent views \n Magnificent place, magnificent views Chora, the name of the village at the Monastery of St. John, is really the main attraction in Patmos.  A cab will take you to the base of the village and with good walking shoes, you walk up the streets to the monastery passing by wonderful shops and whitewashed homes and apartments.  The first afternoon we went  around 4 p.m.just to visit Chora.  The second day was to take the official tour of the Monastery and the Cave.  It was very quiet with hardly anyone around until sunset.  We meandered the winding, hilly small streets  in awe of the whitewashed homes and apartments.  The Monastery, itself,  was quite lovely and worth the visit especially if one is religious.  The view from the Monastery is outstanding and the best part of the first day was the sunset-overlooking Skala. That was as beautiful as the Oia Santorini sunset.","codes":{"ascent_mode":"mixed","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"walk up the streets to the monastery","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"central","on_site_movement":["walking_around"]}},"1112":{"id":1112,"site":"monastery","plat":"tripadvisor","rating":"5","text":"incontournable \n A must-see holy site along the way on vacation. An opportunity to dive back into the Bible and reread Revelation. Very impressive.","codes":{"religious_register":["conventional","doctrinal"],"worth_assessment":"worth_it","review_is_useful":1}},"1113":{"id":1113,"site":"monastery","plat":"tripadvisor","rating":"5","text":"interressant \n An interesting spot, a little magical, even if the reception is a bit cold — a definite must-see for its spiritual side.\nThe view is magnificent and the surrounding village is well preserved; the shops are chicer than most on the island, you feel good there, and there are several very pleasant terraces.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"1114":{"id":1114,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Monastery of St. John \n Monastery of St. John Great artifacts in the museum, wonderful view of the bay and humbling place to visit if you want some insight into where John was moved to write the Book of Revelation.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"exposed","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"view_centrality":"mentioned"}},"1116":{"id":1116,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Da visitare monastero e museo annesso \n Worth visiting: the monastery and its adjoining museum. Beautiful mosaics, a very interesting museum. There are still some monks there. I was not aware that this place is a destination for countless pilgrims.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"recognizes_active_institution":1,"review_is_useful":1}},"1117":{"id":1117,"site":"monastery","plat":"tripadvisor","rating":"3","text":"A nice place to spend some time \n A nice place to spend some time The Monastery of St. John sits on top of Chora and can be seen from many places in Patmos.  To get there obviously you have to get a ride to the top of the hill and then climb multiple steps from the parking lot.  Along the way you will encounter some vendors and even photographers that will have your mug shot printed by the time you descend the hill when you leave the monastery.  Right before the ticket booth, there is a great scenic spot (it is more noticeable when you are leaving the monestary) to your right and it is one of the best spots to take a picture at and have a great view of Patmos.  Inside the Monastery is a pretty chapel that is very decorative inside, hopefully you will have someone to walk you around the chapel to inform you about the interior and history of it as it is quite fascinating.  We also went inside the treasury in the monastery where you are able to view many valuable relics, sacred objects and garments, just watch your corners as you walk and make sure to watch your surroundings when using the stairs in the museum, since I got a doozy of a bruise hitting my shoulder.  After the museum, head outside and take in some great view with the bell tower.  Overall, a nice place to visit while in Patmos.","codes":{"ascent_mode":"mixed","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"sits on top of Chora and can be seen from many places in Patmos","religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["commerce"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"1118":{"id":1118,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Bel édifice \n A beautiful building. Like all the other religious sites of Patmos: an impression of calm, a natural serenity that is almost joyful.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1120":{"id":1120,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Incredible \n Incredible The location of the Monastery at the top of the hill looking down over the beautiful Sea is reason alone to go; however, the history of this place is incredible whether you are religious or not.  It kept 2 teenagers rapt - especially with the knowledgeable young Ms. Grillis' private tour (booked her through the owner @ the Skala Hotel).","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"top of the hill looking down over the beautiful Sea","enclosure_exposure":"exposed","sensory_modalities":["vision"],"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"central"}},"1121":{"id":1121,"site":"monastery","plat":"tripadvisor","rating":"5","text":"a really palce to visisted \n a really palce to visisted St Jones monastry is world known for the last holy book of St Jones Apokalypsis .the cave is also very important place to bevisited .musium is a place not to be missed .","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1,"topography_register":1}},"1123":{"id":1123,"site":"monastery","plat":"tripadvisor","rating":"5","text":"The fortress/Monastery of St. John of Patmos \n The fortress/Monastery of St. John of Patmos The Orthodox Monastery of St. John, built on the highest hill of the island Patmos, in the village of Chora, looks like a fortress from the outside. The history says that in 1088, the Byzantine Emperor Alexios Komnenos gave the island of Patmos to the soldier-priest Ioannis Khristodhoulos (\"the Blessed\") as a reward for his activity. The monastery was completed by Khristodhoulos in 3 years. UNESCO has declared it a World Heritage site. \nInside the monastery there's also a museum that worth a visit. \nOne other thing to mention is that the view from the hill toward Skala (the port from Patmos) is really stunning!\nThe monastery itself, the museum and the panoramic view are 3 very good reasons for an unmissable visit!","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"built on the highest hill of the island","religious_register":["doctrinal"],"mediation":"relays","enclosure_exposure":"exposed","sensory_modalities":["vision"],"recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"central"}},"1125":{"id":1125,"site":"monastery","plat":"tripadvisor","rating":"5","text":"beautiful \n beautiful Much small on the inside than it looks from the imposing walls viewed from the town of Skala below.  We walked up, but you can also catch a bus from the port.  Interesting museum and beautiful little church.  Friendly priests who will answer all your questions - my 7 year old wanted to know what kind of shoes St. John wore! Wander to your hearts content through the white washed streets and stop for a bite to eat at Jimmy's balcony on the road above the bus stop.  Great food and view.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"imposing walls viewed from the town of Skala below","religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"1127":{"id":1127,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Practical points \n Practical points This is a wonderful place to visit, as everyone has said and the little town of Hora is very attractive too with lovely views over the bay.\n\nWe came here on a cruise and were grateful to other Tripadvisors for tips.  We were here on a Sunday which meant that there weren't many buses, so we took a taxi up for 10 euros from the harbourfront and back down again from the point where all buses and taxis drop you off for 10 euros again. We could have taken a taxi tour visiting the Monastery and the Cave of the Apocalypse with visitng time included for 30 euros. We were very pleased with our choice, especially as the taxis were very clean and smart and the drivers friendly, helpful and adaptable. The tour seems good value too, compared with the price of similar tours by coach from the ship.","codes":{"trip_mode":"cruise_excursion","ascent_mode":"motorized","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"took a taxi up for 10 euros from the harbourfront","worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"motorized"}},"1129":{"id":1129,"site":"monastery","plat":"tripadvisor","rating":"4","text":"World Heritage Site for good reason \n World Heritage Site for good reason Built on the highest point in Patmos, this impressive monastery made for a beautiful albeit brief visit to Patmos.  We came here on a cruise, and we were very glad to have visited this monastery.  Home to a beautiful little chapel, excellent frescoes, and a small but important museum, we were have glad to have spent two hours here.  If you are going to be on Patmos or in vicinity on other Dodecanese islands, I would make the pilgrimage here.","codes":{"trip_mode":"cruise_excursion","tourist_mode":"institutional_aware","time_pressure":1,"visit_season":"shoulder_apr_sep_oct","elevation_mention":1,"topography_quoted_phrase":"Built on the highest point in __PATMOS__","religious_register":["conventional"],"effort_valence":"positive","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_heritage_protection":1,"motivation_cruise_thing_to_see":1,"review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1}},"1131":{"id":1131,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Bellissimo monastero e stupendo panorama \n A beautiful monastery and a stunning panorama. After arriving by sailboat at the port of Patmos, we rented some mopeds to explore the island. The road full of switchbacks separating the monastery and the upper town from the port is very pleasant and scenic. Once you arrive, the view of the Dodecanese islands is beautiful, and you can visit the monastery. I recommend going in the evening, when you can also enjoy a magnificent sunset.","codes":{"ascent_mode":"motorized","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"switchbacks separating the monastery and the upper town from the port","enclosure_exposure":"exposed","sensory_modalities":["vision"],"nature_mention":1,"nature_sub_codes":["natural_beauty_praise"],"review_is_useful":1,"view_centrality":"central","descent_mode":"motorized"}},"1132":{"id":1132,"site":"monastery","plat":"tripadvisor","rating":"5","text":"One of the most beautiful places in Greece \n One of the most beautiful places in Greece A breathtaking location in the main town of Patmos.  It's a long walk uphill from the harbour of Skala - motorised transport is recommended - and there are some steep steps at the entrance.  The fortress-like building has a serene interior courtyard.  The church is small, but with beautiful wall paintings and a spectacular iconostasis.  The museum (up some more steps) has some world-class exhibits - including documents, silverwork and textiles - covering more than a millennium.  No interior photographs permitted, but exterior photogenic","codes":{"visit_season":"off_peak_nov_mar","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"long walk uphill from the harbour of Skala","effort_valence":"negative","religious_register":["conventional"],"sensory_modalities":["vision","embodied"],"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"on_site_movement":["stairs_up"]}},"1133":{"id":1133,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A must visit \n A must visit The monastery is great, take the time and visit the museum,  there is limited else to do,  attend a service if possible","codes":{"recognizes_active_institution":1,"worth_assessment":"worth_it","review_is_useful":1,"devotional_participation":1}},"1134":{"id":1134,"site":"monastery","plat":"tripadvisor","rating":"5","text":"two-hour stay on the island \n two-hour stay on the island a monastery of St. John was unspeakable! the 11th century frescoes inside and panoramic view outside created unforgettable experience.  Traveling in May also added its advantage of wild flower blossoms in the region.\nThe island is surely the best if you want time alone. No parties in nighttime like Mykonos, for example. Yet, the island is fascinating! \nWe went to a harbor restaurant after visiting the sites, and had a great Mediterranean dinner. Highly recommend local catch:)","codes":{"time_pressure":1,"visit_season":"peak_may_aug","religious_register":["doctrinal"],"enclosure_exposure":"both","sensory_modalities":["vision"],"nature_mention":1,"nature_sub_codes":["flora_fauna"],"review_is_useful":1,"coding_notes":"'two-hour stay' is brevity-language anchor for time_pressure","acknowledges_historical_cultural":1,"view_centrality":"central"}},"1135":{"id":1135,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Spiritual experience on a beautiful Island \n Spiritual experience on a beautiful Island The essence of the Holy Spirit filled my heart and soul both times that I have visited this sacred site. The museum is a site to behold with a wonderful mixture of relics and icons.","codes":{"religious_register":["conventional","mystical"],"mediation":"endorses","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1}},"1138":{"id":1138,"site":"monastery","plat":"gmaps","rating":"5","text":"Revelation 1:1-3, 9-11, 19. ️❤️\n1 The revelation of Jesus Christ, which God gave Him to show His servants things which must shortly take place. And He sent it by His angel to His servant John,\n2 who bore witness to the word of God and the testimony of Jesus Christ, and to all that he saw.\n3 Blessed is he who reads and those who hear the words of this prophecy and keep those things which are written in it, for the time is at hand.\n\n9 I John, your brother and companion with you in the tribulation and in the kingdom and patience of Jesus Christ, was on the island that is called Patmos because of the word of God and the testimony of Jesus Christ.\n10 I was in the Spirit on the Lord's day, and I heard behind me a loud voice, as of a trumpet, saying, \"I am the Alpha and the Omega, the First and the Last.\" 11 What you see, write in a book and send it to the churches which are in Asia: to Ephesus, to Smyrna, to Pergamum, to Thyatira, to Sardis, to Philadelphia, and to Laodicea.\n\n19 Write therefore what you have seen, and what is, and what will happen hereafter. ️❤️.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Review is a verbatim quotation of Revelation 1:1-3,9-11,19 — devotional posting"}},"1139":{"id":1139,"site":"monastery","plat":"gmaps","rating":"5","text":"Very spiritual place of worship","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"1143":{"id":1143,"site":"monastery","plat":"gmaps","rating":"5","text":"My visit to the Holy Monastery of Agios Ioannis Theologians in Patmos was one of the most moving experiences of my life. The imposing castle-monastery, standing like a crown on the top of the Chora, is the first thing one sees upon arriving on the island and its image remains unforgettable.\nArchitecturally, the Monastery is a masterpiece, a true Byzantine castle dominating the Aegean. Its walls tell the story of centuries of history and protection from pirates and invaders. Hiking through the labyrinthine, cobblestone streets of the Chora to reach the Monastery adds to the sense of pilgrimage and discovery.\nInside, the atmosphere is eerie, full of holiness. The main church (Katholiko) and the chapels, such as that of the Virgin Mary, house incredible treasures, from 12th century hagiographies to the stunning, wood-carved iconostasis. The monastery museum is equally impressive, with rare icons, manuscripts and priceless ecclesiastical relics.\nWhether as a religious pilgrim or a lover of history and culture, a visit here is a must. The energy of the place, where Saint John the Theologian received the Revelation in the nearby Cave, is unique.\nI highly recommend this experience to any visitor to Patmos. It is a UNESCO World Heritage Site and is worth every minute of your time.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"standing like a crown on the top of the Chora","religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","sensory_modalities":["vision"],"recognizes_heritage_protection":1,"review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"energy_register":1,"topography_register":1}},"1150":{"id":1150,"site":"monastery","plat":"gmaps","rating":"5","text":"A beautiful monastery that resembles a fortified castle with extremely high walls.  It is said that John the beloved disciple of Jesus wrote the book of Revelation in the nearby cave. The monastery has a priceless museum that houses ancient books, manuscripts and a vast array of religious artifacts,  icons and religious relics.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","sensory_modalities":["vision"],"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1167":{"id":1167,"site":"monastery","plat":"gmaps","rating":"5","text":"Such a holy place....to visit where John was when he received the vision and words for Revelation.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"coding_notes":"site=monastery but text describes Cave (where John received vision); per codebook §9 trust metadata"}},"1169":{"id":1169,"site":"monastery","plat":"gmaps","rating":"4","text":"The church was overcrowded, total chaos. No effort was made to facilitate the flow of pilgrims (who should have priority) and tourists. The museum, on the other hand, was very peaceful.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"recognizes_active_institution":1,"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"1172":{"id":1172,"site":"monastery","plat":"gmaps","rating":"5","text":"A simply wonderful place, spiritual and mystical. A small museum inside displays valuable works.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1173":{"id":1173,"site":"monastery","plat":"gmaps","rating":"5","text":"A well-preserved religious and religious structure.","codes":{"religious_register":["conventional"],"recognizes_heritage_protection":1,"review_is_useful":1}},"1176":{"id":1176,"site":"monastery","plat":"gmaps","rating":"5","text":"A very surprising visit to the monastery, a very mystical place.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1180":{"id":1180,"site":"monastery","plat":"gmaps","rating":"5","text":"A truly ENCHANTING, EVOCATIVE, ELECTRIFYING, BEAUTIFUL place. In the evening, it fills up with tourists, even though it was September.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1182":{"id":1182,"site":"monastery","plat":"gmaps","rating":"5","text":"Absolutely do a lot of spirituality even if you are not a believer","codes":{"religious_register":["mystical"],"review_is_useful":1,"coding_notes":"'if you are not a believer' addresses reader; religious_self_id stays unspecified per v1.1"}},"1186":{"id":1186,"site":"monastery","plat":"gmaps","rating":"5","text":"Beautiful place, wonderful energy","codes":{"religious_register":["mystical"],"review_is_useful":1,"energy_register":1}},"1192":{"id":1192,"site":"monastery","plat":"gmaps","rating":"5","text":"A hallowed place!!","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1197":{"id":1197,"site":"monastery","plat":"gmaps","rating":"5","text":"Peaceful, sacred, beautiful experience (early in the morning)","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1,"atmospheric_register":1}},"1208":{"id":1208,"site":"monastery","plat":"gmaps","rating":"5","text":"A spiritual visit","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1210":{"id":1210,"site":"monastery","plat":"gmaps","rating":"5","text":"The best experience, the views are wonderful.\nThis is truly a special place, with a wonderful energy that fills you with calm.\nWe were there at noon and it was super refreshing; the wind is incredibly powerful here.","codes":{"religious_register":["mystical"],"wind_mention":1,"wind_register":"literal_atmospheric","enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"5th wind mention of pass; 'incredibly powerful' but refreshing → atmospheric, not nuisance","nature_mention":1,"energy_register":1,"view_centrality":"mentioned"}},"1215":{"id":1215,"site":"monastery","plat":"gmaps","rating":"5","text":"The Monastery is a unique jewel of Orthodoxy! A wonderful experience! The Monastery Museum is also amazing! It takes a lot of time to tour the Monastery and the Museum, at least 2-3 hours. The view of the entire island of Patmos from the Monastery is amazing.","codes":{"religious_register":["conventional","doctrinal"],"review_is_useful":1,"view_centrality":"mentioned"}},"1218":{"id":1218,"site":"monastery","plat":"gmaps","rating":"5","text":"Although only a small part of it can be visited, it is still an important place of worship and study of Orthodox faith. The museum inside houses icons, sacred objects, vestments, and interesting historical documents. Tickets cost €5, but they're worth it. The massive structure of this monastery/fortress, rising above the town of Cora, is a sight to behold.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"rising above the town of Cora","religious_register":["conventional","doctrinal"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"recognizes_active_institution":1,"facility_complaints":["area_access"],"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1225":{"id":1225,"site":"monastery","plat":"gmaps","rating":"4","text":"They have said it all in previous posts......\nWhat disappointed me is that while photography is prohibited in the museum...tourists were taking pictures UNDISTURBED.\nI mentioned it to the person in charge and his response disappointed me for the 2nd time.\nLet me remind you that you are there to protect the sacred relics and not just to take the 2€ per.....\"head\".","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"facility_complaints":["photography_restrictions","commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'there to protect sacred relics not just take 2€ per head' — clean institutional-aware commerce critique"}},"1240":{"id":1240,"site":"monastery","plat":"gmaps","rating":"5","text":"Took a cab from the stand in Skala, 8e to the top. Monestary was almost empty (unlike the cave nearby that had cruise boat patrons), so getting to see everything was a breeze. Amazing views, very interesting museum, nice caretakers inside the facility. Maranatha!","codes":{"ascent_mode":"motorized","elevation_mention":1,"topography_quoted_phrase":"8e to the top","religious_register":["conventional"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"1246":{"id":1246,"site":"monastery","plat":"gmaps","rating":"2","text":"A beautiful view from the top. However, this tourist attraction is probably only for those who believe in the fairy tale \"The Bible.\"","codes":{"religious_register":["doctrinal"],"mediation":"doubts","elevation_mention":1,"topography_quoted_phrase":"view from the top","enclosure_exposure":"exposed","religious_self_id":"dismissive","tourist_mode":"tourist_consumer","worth_assessment":"not_worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'fairy tale The Bible' -> dismissive self-id + doubts","view_centrality":"mentioned"}},"1252":{"id":1252,"site":"monastery","plat":"gmaps","rating":"5","text":"Beautiful spiritual and great views from heights! Also a nice museum.","codes":{"religious_register":["mystical"],"elevation_mention":1,"topography_quoted_phrase":"great views from heights","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"1258":{"id":1258,"site":"monastery","plat":"gmaps","rating":"5","text":"One word describes what I felt on both the previous visit and this one: Awe.","codes":{"religious_register":["mystical"],"review_is_useful":1,"quotable_for_chapter":1}},"1261":{"id":1261,"site":"monastery","plat":"gmaps","rating":"5","text":"A truly unforgettable experience. The Monastery of St. John the Theologian on Patmos is a place of immense spiritual and historical significance. The fortress-like exterior is impressive, but it's the serene atmosphere inside that truly captivates you. The panoramic views of the island from the top are simply breathtaking. A visit here is a must for anyone interested in history, art, or spirituality.","codes":{"religious_register":["mystical"],"elevation_mention":1,"topography_quoted_phrase":"panoramic views of the island from the top","enclosure_exposure":"exposed","sensory_modalities":["vision","embodied"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"central"}},"1276":{"id":1276,"site":"cave","plat":"gmaps","rating":"3","text":"If you are religious then this place will be evocative and magical for you. But if you are not, you enter and exit without understanding anything, as if you are not educated there is no magic.","codes":{"religious_register":["mystical"],"worth_assessment":"mixed","review_is_useful":1,"coding_notes":"'if you are not religious' addresses reader; held unspecified"}},"1278":{"id":1278,"site":"cave","plat":"gmaps","rating":"5","text":"The apostle John was sent and ended up on the island of Patmos \"Greece\".\n...The apostle John sat for the word of God and for the testimony of Jesus Christ...\nRevelation 1:2,9.\n...and of course I asked and asked the Lord, and also of course I wanted..., that if it was His will for it, that I could get there on Patmos, and if not, that there would be - (obstacles)... (\n(( of course not to rest and not to walk and not to live and not for my needs and wants... )) (( To share my testimony with whom and how I (here) on the island of Patmos could testify about the Lord Jesus Christ and about His disciple John, and of course there were many such opportunities and shared and testified, why I (came to Patmos)\nAnd truly the Lord blessed my journey and mine here and in other places in Athens, my stay, where I could share and tell about the Word of God, and why I came, and why I went and so on............\nGlory and Praise and Gratitude  to the One Lord Jesus Christ.\n...And for the Glory and for Praise and Gratitude and Glory, God the Father and for our Lord Jesus Christ, and above all to Him The only...))\n\nTo the only wise God, our Savior through Jesus Christ our Lord, be glory and majesty, power and authority before all ages, now and forever. Amen. Jude 25 verse.\n... And according to His Holy Scripture, read, study, Revelation and remember those events that also took place there (( here )) on the island of Patmos -2000 years ago. ...\n...The last book was written by the disciple of Jesus Christ ((here)) on the island of Patmos,..., what he heard and saw and what was revealed to him...\nRevelation 22 chapter.\n...and in chapter 1:2-3, 9-11, 19. All Glory to the Lord Jesus Christ for all... ❤️️","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","religious_self_id":"christian_general","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"scripture-witness review; first-person Christian testimony, asked Lord if it was His will to come"}},"1279":{"id":1279,"site":"cave","plat":"gmaps","rating":"5","text":"Deeply moving spiritual place","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1281":{"id":1281,"site":"cave","plat":"gmaps","rating":"5","text":"How awesome is this place! This is none other than the house of God; this is the gate of heaven.","codes":{"religious_register":["conventional","mystical"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'house of God; gate of heaven' (Gen 28:17 applied to cave)"}},"1282":{"id":1282,"site":"cave","plat":"gmaps","rating":"5","text":"Words are unnecessary for what you feel when you are in this place.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1283":{"id":1283,"site":"cave","plat":"gmaps","rating":"4","text":"The cave itself is powerful in its simplicity and silence. Being left alone to walk and reflect was the best part. Unfortunately, the atmosphere from those managing the site felt cold, more stares than welcome. Visit for the place, not the hospitality. No entrance fee.","codes":{"religious_register":["mystical"],"sensory_modalities":["sound"],"enclosure_exposure":"enclosed","austerity_register":"appreciative","tourist_mode":"institutional_aware","review_is_useful":1,"quotable_for_chapter":1,"atmospheric_register":1,"on_site_movement":["walking_around"]}},"1285":{"id":1285,"site":"cave","plat":"gmaps","rating":"5","text":"The Holy Cave of the Revelation on Patmos is a place of unparalleled spiritual and historical significance that inspires awe and devotion in every visitor. As a UNESCO World Heritage Site, it is one of the most important Christian pilgrimage sites in the world.\nThe atmosphere inside the cave is unique, full of peace and mysticism, inviting silence and contemplation. Here, according to tradition, Jesus' beloved disciple, John the Theologian, was exiled around 95 AD and received divine visions, dictating to his disciple Prochorus the last and prophetic book of the New Testament, the Apocalypse.\nDuring my visit, I was able to see the sacred sites preserved unchanged in the rock:\nThe triple crack in the ceiling, from where it is said that the voice of God was heard and three rays of light emerged, symbols of the Holy Trinity.\nThe hollow in the rock where the Saint rested his head to rest.\nThe point from which he grabbed hold to get up.\nThe cave, together with the imposing Holy Monastery of Saint John the Theologian and the medieval Chora, compose an unsurpassed religious and cultural landscape in the “Jerusalem of the Aegean”.\nA visit to the Holy Cave of the Revelation is not just a tour of a historical monument, but a real experience of life and spiritual upliftment.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","sensory_modalities":["vision"],"recognizes_heritage_protection":1,"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Jerusalem of the Aegean'; triple crack/Holy Trinity; relays via 'according to tradition' and 'it is said'","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1}},"1286":{"id":1286,"site":"cave","plat":"gmaps","rating":"5","text":"For a long time it was my dream to visit Patmos Island where St. John was exiled and there he wrote the book of  revelation  in the Bible. We went by ferry from Athens to Patmos which took nearly 8 hrs.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","motivation_religious":1,"review_is_useful":1,"coding_notes":"'For a long time it was my dream' non-cruise sought-pilgrimage; 8hr ferry from Athens"}},"1294":{"id":1294,"site":"cave","plat":"gmaps","rating":"4","text":"I like that there is a sign inside the cave that says photography is prohibited, but no one respects it. The priest gives the tour when he remembers, so let me tell you so you don’t have to wait for nothing.\nSaint John the Theologian was exiled from Ephesus to Patmos in 95 AD, which was then a place of exile. There he found this cave and settled. He would rest his head on the spot where the railing is located to sleep, while next to it, his hand to pray.\nOne day, God spoke to John (hence the “Theologian”). At that moment, the rock of the ceiling split into three, a symbol of the Holy Trinity. God said: “I am the A and the O” and His voice was heard like running water. Christ also appeared inside the cave.\nAfter the vision, John recounted what God had revealed to him to his disciple, who recorded it and thus the Apocalypse was written.\nIn 97 AD, when his sentence of exile ended, John returned to Ephesus, where, according to tradition, he died and was taken up, which is why his relics do not exist.\nIn 1088 AD, Emperor Alexios I Komnenos granted Patmos and the surrounding islands to Saint Christodoulos, who built the Monastery of Saint Anne above the Cave and later the Monastery of Saint John the Theologian. The monastery has the appearance of a castle, to protect it from pirate raids. The relic of the Apostle Thomas is also kept there.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","sensory_modalities":["vision"],"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"no-photo sign unenforced; retells full Patmos history (Christodoulos, 1088, Thomas relic)","acknowledges_historical_cultural":1,"topography_register":1}},"1297":{"id":1297,"site":"monastery","plat":"gmaps","rating":"5","text":"An integral part of Christianity!\nVery beautiful place!\nWonderful museum!","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1300":{"id":1300,"site":"monastery","plat":"gmaps","rating":"5","text":"Places considered sacred in the Christian religion","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1301":{"id":1301,"site":"monastery","plat":"gmaps","rating":"5","text":"The Monastery of St. John is the spiritual and cultural heart of Patmos. The entrance may seem a bit crowded during peak season, but simply entering the walls is a unique, timeless atmosphere. The internal churches house frescoes and icons of extraordinary beauty, with soft lighting that enhances the sense of contemplation. The museum is also very interesting, small but rich in manuscripts, icons, and sacred objects.\n\nI recommend comfortable shoes, as the narrow streets leading up to the monastery are steep and paved with stone. It's worth arriving early in the morning to avoid the crowds and enjoy the breathtaking views of the island and the Aegean Sea.","codes":{"religious_register":["conventional","mystical"],"elevation_mention":1,"topography_quoted_phrase":"narrow streets leading up to the monastery are steep","ascent_mode":"walked","enclosure_exposure":"both","sensory_modalities":["vision","embodied"],"facility_complaints":["crowding"],"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"mentioned"}},"1304":{"id":1304,"site":"monastery","plat":"gmaps","rating":"5","text":"A very beautiful experience and opportunity to visit the historic monastery with its serenity and history","codes":{"religious_register":["mystical"],"review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1}},"1315":{"id":1315,"site":"monastery","plat":"gmaps","rating":"5","text":"A sacred place. Calm, sacredness.\nIt is worth visiting for its history and for its exhibits (Kares Agion).\nImposing \"castle\" with a beautiful view.","codes":{"religious_register":["conventional","mystical"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"mentioned"}},"1334":{"id":1334,"site":"monastery","plat":"gmaps","rating":"5","text":"Patmos Monastery of John the Theologian!!! A unique experience and anyone who can get special permission to attend the service that starts at 4 am will feel the monastery's warmth and peace!!!","codes":{"religious_register":["conventional","mystical"],"recognizes_active_institution":1,"facility_complaints":["area_access"],"review_is_useful":1,"coding_notes":"4am service requires special permission to attend"}},"1341":{"id":1341,"site":"monastery","plat":"gmaps","rating":"5","text":"A very holy place","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1357":{"id":1357,"site":"cave","plat":"gmaps","rating":"5","text":"It's worth the climb from the port; it's a 30-minute uphill walk (you can also take a taxi). The views along the way are beautiful. At the top is the Grotto of the Apocalypse, where Saint John received divine revelation and wrote the last book of the Bible: the Book of Revelation. You can't take photos of the grotto itself, only of the small Byzantine church built in front of it. Admission costs €3, and I advise you to avoid entering behind a group; if you do, it's better to wait; the cave is small and loses its charm when it's so crowded. In the cave, you can see the place where Saint John dictated the text, the place where the manuscript appeared, and the split rock where God spoke to him. People touch it as they pass underneath and also light a candle to pray to the Lord. Breathtaking.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"30-minute uphill walk","religious_register":["conventional","doctrinal"],"mediation":"endorses","effort_valence":"positive","worth_assessment":"worth_it","sensory_modalities":["vision","embodied"],"enclosure_exposure":"enclosed","tourist_mode":"institutional_aware","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"devotional_contact":1,"devotional_participation":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"1358":{"id":1358,"site":"cave","plat":"gmaps","rating":"5","text":"Great place to visit, enjoy your time it is magical","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1359":{"id":1359,"site":"cave","plat":"gmaps","rating":"5","text":"A blessing to visit the cave where John received the vision for Revelation","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1}},"1361":{"id":1361,"site":"cave","plat":"gmaps","rating":"5","text":"Holy Holy.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1363":{"id":1363,"site":"cave","plat":"gmaps","rating":"5","text":"Very spiritual place.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1365":{"id":1365,"site":"cave","plat":"gmaps","rating":"3","text":"I'm deducting stars because we went with a group, we couldn't fit inside, they were constantly taking pictures, talking constantly, they had refreshments and food in their hands, some entered the church with their little breasts, they had sat on the pews and had started a conversation and all this with the tolerance and presence of the people of the cave and their tour guide. THE CAVE IS NOT A MUSEUM! RESPECT IT! And those in charge must make observations and recommendations!!! I've been so many times but this was like going to a museum or some other riot. I was very sad! I hope that every tourist reading my review respects a sacred space of the Greeks and Orthodox Christians, otherwise it's better not to go!!!","codes":{"religious_register":["conventional","doctrinal"],"tourist_mode":"institutional_aware","enclosure_exposure":"enclosed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"defends 'sacred space of Greeks/Orthodox' but no first-person self-ID"}},"1370":{"id":1370,"site":"cave","plat":"gmaps","rating":"4","text":"A place for believers where history mixes with fantasy","codes":{"religious_register":["doctrinal"],"mediation":"doubts","review_is_useful":1,"acknowledges_historical_cultural":1}},"1393":{"id":1393,"site":"monastery","plat":"gmaps","rating":"5","text":"After the Cave of the Apocalypse, another attraction you must visit in Patmos!!! It is no coincidence that all the groups and foreigners go up to the island of Patmos to visit this particular temple and the museum that is there!!!","codes":{"elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"1402":{"id":1402,"site":"monastery","plat":"gmaps","rating":"5","text":"Spectacular! Devotional","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1413":{"id":1413,"site":"monastery","plat":"gmaps","rating":"5","text":"One visit is not enough. Simply awe. And words are unnecessary. It is also worth a visit to the Museum, where the entrance fee is 2€","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"1418":{"id":1418,"site":"cave","plat":"gmaps","rating":"4","text":"Will return.\n\nIt’s beautiful.\n\nThe importance of Christianity …","codes":{"religious_register":["doctrinal"],"review_is_useful":1}},"1425":{"id":1425,"site":"cave","plat":"gmaps","rating":"5","text":"This site is the main reason to come to Patmos. Beautifully preserved with care, love and faith. Very powerful emotions when you’re inside the cave thinking how the book of revelations was transcribed and preserved for 2000 years. The cave is a reminder of the enduring presence of God in this world.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1426":{"id":1426,"site":"cave","plat":"gmaps","rating":"5","text":"At the crucifixion, Jesus entrusted his mother to his favorite disciple (apostle), John (St. John). They fled from Jerusalem to Ephesus. A house was built for the Virgin Mary in Ephesus, and after spending the last nine years of his life there, he ascended to heaven.\n\nJohn was exiled to the island of Patmos by the Roman government in Ephesus, where Jesus appeared to him in a cave. There, he wrote and completed the fourth and final chapter of the Gospel, known as the Apocalypse. Eighteen months passed in exile, and the Roman ruler Domician had been killed and amnesty had been granted. He returned to Ephesus, but his life was short, and he died in Ephesus at the age of nearly 100. His tomb is today in the Church of St. John.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"narrates John's biography in detail; minimal first-person content","acknowledges_historical_cultural":1,"topography_register":1}},"1427":{"id":1427,"site":"cave","plat":"gmaps","rating":"3","text":"Unfortunately, the sanctity of the space is being violated by some gentlemen who are considered to be the representatives of the Lord on earth.\nI do not want to elaborate further and if any of those responsible wish....they can find a way to communicate with me.","codes":{"religious_register":["conventional"],"tourist_mode":"institutional_aware","tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"complains clergy violate cave's sanctity; no facility complaint maps cleanly"}},"1430":{"id":1430,"site":"cave","plat":"gmaps","rating":"5","text":"It is a great blessing to visit the Cave of Revelation!","codes":{"religious_register":["conventional","doctrinal"],"review_is_useful":1,"topography_register":1}},"1433":{"id":1433,"site":"cave","plat":"gmaps","rating":"5","text":"A lovely, simple place steeped in history. Admission is €3, but cards are not accepted. Everything is explained in Greek, but the experience is very cool.","codes":{"austerity_register":"appreciative","review_is_useful":1,"acknowledges_historical_cultural":1}},"1434":{"id":1434,"site":"cave","plat":"gmaps","rating":"5","text":"It is a sacred place that must be seen when you come to the island. The entrance fee was 3 Euros per person.\n\nIt is a sacred place that must be seen when you come to the island. The entrance fee was 3 Euros per person.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"1437":{"id":1437,"site":"monastery","plat":"gmaps","rating":"5","text":"Stepping through the narrow stone streets into the monastery grounds, you're greeted by both a mystical atmosphere and impressive architecture. If you visit, don't forget to stop by Benetos Chora for a coffee afterwards — the view and tranquility continue there as well. ☕✨","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"review_is_useful":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"1457":{"id":1457,"site":"cave","plat":"gmaps","rating":"5","text":"A very special moment: arriving very early to avoid crowds and joining the mass being held. A beautiful meditative hour spent at such a holy place. Will never forget it.","codes":{"religious_register":["conventional","mystical"],"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"devotional_participation":1,"on_site_movement":["posture_pause"]}},"1460":{"id":1460,"site":"cave","plat":"gmaps","rating":"5","text":"Very special meaning for Christians ❤️","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1462":{"id":1462,"site":"cave","plat":"gmaps","rating":"5","text":"I'll be here one day!!!\n\nI'll be in Heaven too\n\nChrist is coming back!!!","codes":{"religious_register":["doctrinal"],"mediation":"endorses","religious_self_id":"christian_general","review_is_useful":1}},"1473":{"id":1473,"site":"cave","plat":"gmaps","rating":"5","text":"A moving and evocative place where, according to tradition, Saint John had his visions. The cave is accessed through the outdoor garden and then along a short museum tour. Inside, you can see the cleft in the rock and other signs venerated by the faithful.\n\nI recommend taking your time to visit, without expecting a large monumental complex: the strength of this place lies in its simplicity. Don't miss the views along the path connecting Chora to Skala. It's best to avoid peak cruise times, when the small space can fill up quickly.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"path connecting Chora to Skala","religious_register":["conventional","doctrinal"],"mediation":"relays","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","austerity_register":"appreciative","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"1475":{"id":1475,"site":"cave","plat":"gmaps","rating":"5","text":"Outstanding spiritual treasure!","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1480":{"id":1480,"site":"monastery","plat":"gmaps","rating":"5","text":"It was great. It was Pentecost Sunday the mass was great! The museums were amazing.  Well worth going.  The cave of John was breathtaking.","codes":{"religious_register":["conventional"],"enclosure_exposure":"both","recognizes_active_institution":1,"worth_assessment":"worth_it","review_is_useful":1,"sensory_modalities":["embodied"],"devotional_participation":1,"topography_register":1}},"1483":{"id":1483,"site":"monastery","plat":"gmaps","rating":"4","text":"From a distance it looks like a nice church.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1485":{"id":1485,"site":"monastery","plat":"gmaps","rating":"5","text":"Beautiful, moving.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1488":{"id":1488,"site":"monastery","plat":"gmaps","rating":"5","text":"A unique place where history and spirituality merge!\nIf you're on Patmos, be sure to visit the Monastery of St. John. With over 1,000 years of history, both its architecture and atmosphere are captivating. The icons, manuscripts, and Byzantine-era objects inside are truly impressive.\nThe road to the monastery is a bit steep, but the view and the tranquility it offers are worth it. I highly recommend a guided tour; seeing the cave where John wrote the Book of Revelation on this island was truly impressive.\n️ A must-see for those seeking a quiet, tranquil, and spiritual experience.\n\n⭐️⭐️⭐️⭐️⭐️","codes":{"elevation_mention":1,"topography_quoted_phrase":"road to the monastery is a bit steep","religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","effort_valence":"ambivalent","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"1489":{"id":1489,"site":"monastery","plat":"gmaps","rating":"5","text":"A mystical and beautiful place worth visiting.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"1491":{"id":1491,"site":"monastery","plat":"gmaps","rating":"5","text":"Very good pilgrimage for the work of John the Apostle: Revelation","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1}},"1496":{"id":1496,"site":"monastery","plat":"gmaps","rating":"5","text":"Simply a very spiritual, beautiful place that you should definitely take your time to visit. The highlight of Patmos!","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1501":{"id":1501,"site":"monastery","plat":"gmaps","rating":"5","text":"A beautiful place full of faith; we need to discover more places like this.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"1504":{"id":1504,"site":"monastery","plat":"gmaps","rating":"5","text":"It is impossible not to find peace and spirituality on an island like Patmos. It is a well-maintained monastery worth visiting. You will not find any garbage anywhere.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"1515":{"id":1515,"site":"monastery","plat":"gmaps","rating":"5","text":"A very spiritual place","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1516":{"id":1516,"site":"cave","plat":"gmaps","rating":"5","text":"A magical place, absolutely not to be missed if you visit Patmos!","codes":{"religious_register":["mystical"],"review_is_useful":1}},"1522":{"id":1522,"site":"cave","plat":"gmaps","rating":"5","text":"The feeling you get from this place is very powerful, whether you're a believer or not. So many emotions in such a small space (the cave itself). The museum nearby is well worth a visit.","codes":{"religious_register":["mystical"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"topography_register":1}},"1527":{"id":1527,"site":"cave","plat":"gmaps","rating":"5","text":"The Cave of the Apocalypse is impressive. One of the most important monuments of Orthodoxy.","codes":{"religious_register":["conventional","doctrinal"],"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"1553":{"id":1553,"site":"monastery","plat":"gmaps","rating":"5","text":"Exciting! Don't miss the relics of Saint Thomas and Saint Philip. Two apostles whose remains are kept there.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1}},"1563":{"id":1563,"site":"cave","plat":"gmaps","rating":"5","text":"We managed to have a service in the church. The aura of the place was unreal. It is a very beautiful place, very simple and without exaggerations.","codes":{"religious_register":["conventional","mystical"],"austerity_register":"appreciative","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"devotional_participation":1}},"1564":{"id":1564,"site":"cave","plat":"gmaps","rating":"5","text":"You immediately realize that you are in a sacred place.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1}},"1570":{"id":1570,"site":"cave","plat":"gmaps","rating":"5","text":"ALL Glory to GOD ☝️ For the eyes of the Lord are on the righte
