tion...","codes":{"religious_register":["mystical"],"review_is_useful":1}},"3862":{"id":3862,"site":"cave","plat":"gmaps","rating":"5","text":"It is one of the most difficult Christian New Testament holy sites to reach. The popular routes are round trips from Athens to Piraeus or to Samos Island, but ferry services to Piraeus do not run daily, and while there are daily services to Samos Island, they do not align with the Samos Airport schedule. You can also travel from Rhodes Island. I heard you can go from Kusadasi Port in Turkey, but currently, no ships are visible.","codes":{"religious_register":["conventional","doctrinal"],"review_is_useful":1,"coding_notes":"logistics-focused review on how to reach the cave"}},"3863":{"id":3863,"site":"cave","plat":"gmaps","rating":"5","text":"IT IS A HOLY, GOD-FATHERED PLACE.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1}},"3868":{"id":3868,"site":"cave","plat":"gmaps","rating":"5","text":"A general opinion on Patmos: I just experienced an idyllic interlude. Patmos allows you to be satiated on a spiritual and cultural level. Its completely different beaches, its shops open late at night, and its charming restaurants where your feet in the water make the days sweet and magical. I highly recommend it, although it's a long ferry ride from Athens (8 hours of crossing). I think a quad bike for two can be even better than a car, given the beauty of the landscapes along the way.\n\nI am nevertheless surprised by the lack of warmth of the established Orthodox community. We wanted to meet them as Catholics; instead, the service at the grotto (which we experienced) was an inquisitorial affair. The hunt for crossed legs or false Orthodox Christians, with authoritarian \"respect\" from two faithful who looked like they were part of the Gestapo, and the dark look of the pope on the lookout for the slightest formal error on our part. A Russian Orthodox man was publicly insulted at the end of the service by the two women in question for making the sign of the cross incorrectly...\nIt was embarrassing.\n\nWhere is St. John the Missionary, where is Christ in this deplorable welcome?\n\nAside from this drawback, Patmos is truly superb.","codes":{"trip_mode":"overnight","tourist_mode":"institutional_aware","religious_register":["conventional","doctrinal","mystical"],"religious_self_id":"catholic","recognizes_active_institution":1,"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Catholic self-ID 'we wanted to meet them as Catholics'; Orthodox clergy-decorum critique","devotional_participation":1}},"3880":{"id":3880,"site":"monastery","plat":"gmaps","rating":"5","text":"Amazing place very spiritual and uplifting lovely shops and little restaurants with wonderful views of Greek islands and Turkey","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"3882":{"id":3882,"site":"monastery","plat":"gmaps","rating":"5","text":"How to surrender the only life for the eternity future","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"review-as-religious-aphorism, no site description"}},"3905":{"id":3905,"site":"monastery","plat":"gmaps","rating":"5","text":"An impressive testament to human ingenuity. The winding alleys of Chora surrounding the monastery prepare you mentally for the experience. Inside, incredible treasures from every century await. Among them, particularly noteworthy—and definitely UNESCO World Heritage Sites—are several very old manuscripts. One is a fragment of the Gospel of Mark from the 6th century, written in gold and silver ink on parchment. The other is two complete books from the 9th and 10th centuries. I was incredibly impressed by how old these manuscripts are and how well preserved they are. Absolutely beautiful to behold. It was hard to tear myself away. The other treasures are truly amazing as well.","codes":{"tourist_mode":"institutional_aware","religious_register":["doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","recognizes_heritage_protection":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Gospel of Mark fragment 'gold and silver ink on parchment' — specific manuscript vision","acknowledges_historical_cultural":1}},"3918":{"id":3918,"site":"monastery","plat":"gmaps","rating":"5","text":"The ultimate mystical and spiritual place in Patmos. A steep walk up but fully worth it once you are there.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"steep walk up but fully worth it","religious_register":["mystical"],"effort_valence":"ambivalent","worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"3923":{"id":3923,"site":"monastery","plat":"gmaps","rating":"5","text":"Uau. Amazing. The place where Apostle John spend is last days and dictated gospel by St John and Apocalípse","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"Gospel-and-Apocalypse-dictated-here conflation; site/text mismatch"}},"3936":{"id":3936,"site":"cave","plat":"gmaps","rating":"5","text":"None of us can describe what we feel in the cave of the revelation of John the Theologian on Patmos ❤️❤️❤️","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"topography_register":1}},"3957":{"id":3957,"site":"monastery","plat":"gmaps","rating":"5","text":"everything is perfect, wonderful and devout... Very clean, alone with a beautiful view of the entire island of Patmos...","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"3970":{"id":3970,"site":"monastery","plat":"gmaps","rating":"5","text":"A highlight of the many teachings & Christianity footsteps St. John left us. Inspirational site that is a most see.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"coding_notes":"footsteps language; 'left us' generic-Christian, no first-person self-ID"}},"3973":{"id":3973,"site":"monastery","plat":"gmaps","rating":"5","text":"Hard to describe in words. Don't leave the island without visiting it. Exhibits of unparalleled beauty and value in the monastery museum. Must visit","codes":{"tourist_mode":"institutional_aware","religious_register":["mystical"],"worth_assessment":"worth_it","enclosure_exposure":"enclosed","review_is_useful":1}},"4019":{"id":4019,"site":"cave","plat":"gmaps","rating":"5","text":"The cave itself is worth visiting, even knowing that John didn't actually stay there; tradition created it as a pilgrimage route. But it's definitely worth seeing.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"worth_it","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"worth-it despite explicit 'John didn't actually stay there'; pilgrimage-as-tradition framing","acknowledges_historical_cultural":1,"topography_register":1}},"4026":{"id":4026,"site":"cave","plat":"gmaps","rating":"5","text":"Unique experience....a sense of awe...you must visit it...","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","enclosure_exposure":"enclosed","review_is_useful":1}},"4043":{"id":4043,"site":"monastery","plat":"gmaps","rating":"5","text":"The place where Saint John the Evangelist dreamed of the Apocalypse only strengthens our faith.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'strengthens our faith' first-person-plural held to unspecified per v1.1 (no denominational anchor)"}},"4044":{"id":4044,"site":"monastery","plat":"gmaps","rating":"5","text":"Very moving.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"4055":{"id":4055,"site":"monastery","plat":"gmaps","rating":"5","text":"Built on the top of Chora, the Monastery dominates the entire island and is reminiscent of a Byzantine castle. A unique monastery that even if you are not particularly close to religions, you should visit for the awesome view, the special architecture and its historicity. Be careful to enter, you must wear shorts and skirts below the knee, otherwise they will give you trousers there.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"Built on the top of Chora, the Monastery dominates the entire island","religious_register":["doctrinal"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'even if you are not particularly close to religions' addresses reader; held to unspecified","motivation_historical_cultural":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"central"}},"4069":{"id":4069,"site":"monastery","plat":"gmaps","rating":"5","text":"Unrepeatable moments of Orthodoxy.","codes":{"religious_register":["conventional","doctrinal"],"review_is_useful":1}},"4091":{"id":4091,"site":"monastery","plat":"gmaps","rating":"5","text":"A magnificent holy place that is definitely worth the detour","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"4092":{"id":4092,"site":"monastery","plat":"gmaps","rating":"5","text":"Besides the cave of the Apocalypse, one should also visit the Monastery of John the Theologian who wrote the \"Apocalypse\"..... there is also a museum with relics and ancient texts that one can visit....","codes":{"religious_register":["doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"4095":{"id":4095,"site":"monastery","plat":"gmaps","rating":"1","text":"We had a horrible tour guide who didn't explain much of the church structure well. Everything was the most important thing when she was speaking. The best part was the one shop we're I got these bells, and that's about it when you aren't Christian.","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"worth_assessment":"not_worth_it","tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'when you aren't Christian' implicit-non-Christian self-position; held to unspecified per v1.1"}},"4098":{"id":4098,"site":"cave","plat":"gmaps","rating":"5","text":"It's a place that truly moves us believers, a very special place of reflection, especially when you can place your fingers on the cracks in the stone where Juan carved them.\nIt's small, difficult to access for microbuses, but since we don't drive, it doesn't matter. A MUST-SEE!\n\nYou can follow me on Instagram at adolfotos55. Hope to see you there, thanks!","codes":{"religious_register":["conventional","mystical"],"mediation":"endorses","sensory_modalities":["touch_temperature"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","devotional_contact":1,"motivation_religious":1,"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'us believers' first-person-plural without denominational anchor; held to unspecified per v1.1; finger-on-cracks devotional_contact","topography_register":1}},"4102":{"id":4102,"site":"cave","plat":"gmaps","rating":"5","text":"We all need to visit these holy places at some point.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"4104":{"id":4104,"site":"cave","plat":"gmaps","rating":"5","text":"Being in a sacred place (and with considerable historical accuracy) where John wrote the Book of Revelation is thrilling!!","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1}},"4109":{"id":4109,"site":"cave","plat":"gmaps","rating":"5","text":"Was a very emotional place !","codes":{"religious_register":["mystical"],"enclosure_exposure":"enclosed","review_is_useful":1}},"4114":{"id":4114,"site":"cave","plat":"gmaps","rating":"5","text":"Not to be missed — it's a spiritual place","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","enclosure_exposure":"enclosed","review_is_useful":1}},"4120":{"id":4120,"site":"monastery","plat":"gmaps","rating":"5","text":"Being one of the most important places for the Christianity, the Cave of John Evangelist and the Monastery dedicated to his Memory, are just breathtaking. The Grace of God is in every single particle there.\nThe trip through the mountain is very easy to take, just take into consideration using sun block and taking water. The Monastery is open from 8:00 to 13:30.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"trip through the mountain is very easy to take","religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","effort_valence":"positive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Grace of God is in every single particle' clean first-person mystical-doctrinal endorsement","topography_register":1}},"4146":{"id":4146,"site":"monastery","plat":"gmaps","rating":"5","text":"Resurrection 2018!!!","codes":{"religious_register":["doctrinal"],"visit_season":"shoulder_apr_sep_oct","motivation_religious":1,"review_is_useful":1,"coding_notes":"'Resurrection 2018' = Easter visit; doctrinal anchor + feast attendance"}},"4151":{"id":4151,"site":"monastery","plat":"gmaps","rating":"5","text":"The monastery's mighty, high stone walls are impressive. It's almost 1,000 years old, and services there have never ceased! Blessed behold! The monastery's ancient library and museum are all very interesting. In the summer, there's a constant stream of tourists, and in the winter, it's quiet. And the monks chant. From the monastery walls, as if from a bird's eye view, you can admire the beautiful views of the islands and the emerald sea.","codes":{"elevation_mention":1,"topography_quoted_phrase":"from the monastery walls, as if from a bird's eye view","religious_register":["conventional","mystical"],"sensory_modalities":["sound","vision"],"enclosure_exposure":"exposed","nature_mention":1,"nature_sub_codes":["seascape"],"recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"central"}},"4157":{"id":4157,"site":"monastery","plat":"gmaps","rating":"4","text":"Perfect place to see the Patmos.","codes":{"review_is_useful":1,"view_centrality":"central"}},"4159":{"id":4159,"site":"monastery","plat":"gmaps","rating":"3","text":"Nice view from the outside, even further up the mountain.  Nice view.","codes":{"elevation_mention":1,"topography_quoted_phrase":"even further up the mountain","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"central"}},"4169":{"id":4169,"site":"monastery","plat":"gmaps","rating":"5","text":"A great blessing to visit the monastery. Wonderful location, amazing view.","codes":{"religious_register":["conventional"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"4181":{"id":4181,"site":"cave","plat":"gmaps","rating":"5","text":"Something like our Częstochowa.","codes":{"religious_register":["conventional"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'our Częstochowa' Polish-Catholic shrine comparison; held unspecified per v1.1"}},"4188":{"id":4188,"site":"cave","plat":"gmaps","rating":"3","text":"The historical value is interesting, but as far as I was able to find, not much of the story is confirmed though, the crypt it self has been modified to fit a chapel, so nothing seems original from the time of the apostles and there is nothing else around.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","tourist_mode":"tourist_consumer","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Doubts apostle-era authenticity; modified-crypt-as-chapel critique","acknowledges_historical_cultural":1}},"4197":{"id":4197,"site":"monastery","plat":"gmaps","rating":"5","text":"Amazing monastery with incredible sacred energy. The museum exhibits are rare and full of history.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1,"acknowledges_historical_cultural":1,"energy_register":1}},"4204":{"id":4204,"site":"monastery","plat":"gmaps","rating":"5","text":"It is considered \"The Jerusalem of Greece\"\nAwe inside the temple and magic of icons from the external location.","codes":{"religious_register":["conventional","mystical"],"mediation":"relays","sensory_modalities":["vision"],"enclosure_exposure":"both","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Jerusalem of Greece' relayed honorific; awe inside + icons external"}},"4205":{"id":4205,"site":"monastery","plat":"gmaps","rating":"5","text":"Every Christian should visit it","codes":{"religious_register":["conventional"],"review_is_useful":1,"coding_notes":"Addresses Christians; no first-person self-ID per v1.1"}},"4217":{"id":4217,"site":"monastery","plat":"gmaps","rating":"5","text":"A beautiful place, especially for its views. The monastery area is lined with small, narrow streets, dotted with local colors and boasting a mystical atmosphere. It's worth taking a taxi from the port, as the roads are winding and quite dangerous for pedestrians due to the narrow shoulders.","codes":{"ascent_mode":"motorized","religious_register":["mystical"],"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"the roads are winding and quite dangerous for pedestrians","enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Mystical atmosphere + taxi-from-port advisory","view_centrality":"central"}},"4222":{"id":4222,"site":"monastery","plat":"gmaps","rating":"5","text":"Definitely worth a visit, if only for the view over Patmos.","codes":{"worth_assessment":"worth_it","elevation_mention":1,"topography_quoted_phrase":"the view over Patmos","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central"}},"4224":{"id":4224,"site":"monastery","plat":"gmaps","rating":"1","text":"Once you enter the monastery of Saint John God is beside you","codes":{"religious_register":["conventional","mystical"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"1-star rating with reverent endorsement: 'God is beside you'"}},"4238":{"id":4238,"site":"monastery","plat":"gmaps","rating":"5","text":"I love god our father","codes":{"religious_register":["conventional"],"review_is_useful":0}},"4251":{"id":4251,"site":"cave","plat":"gmaps","rating":"5","text":"The Second Jerusalem, Thank God!!!","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Second Jerusalem' framing parallel to 'Jerusalem of Greece' (4204)"}},"4257":{"id":4257,"site":"cave","plat":"gmaps","rating":"3","text":"A very well-known attraction, and for many Christians one of the most important places. The cave is located near Skala, but due to the steep climb I recommend either a bus or a taxi unless you are in good shape and have good legs. Negotiate the price, it is only 1.5 km from the port.\nAround the cave itself there is a monastery and a fortress built over time. Entrance fee 10/2019 2 euros/person.\nAfter a fairly empty monastery section, you come to the cave itself, where there is an Orthodox church and a place made in the corner of the cave, in front of which people prayed. Photography is prohibited, so there are no pictures of the cave.\nA quick visit, 10-15 minutes is enough, unless you stay to celebrate a devotional service.","codes":{"religious_register":["conventional","doctrinal"],"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"due to the steep climb","enclosure_exposure":"enclosed","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"Descriptive guide-style; recommends bus/taxi; observes prayer at Orthodox church in cave","topography_register":1}},"4262":{"id":4262,"site":"cave","plat":"gmaps","rating":"5","text":"THE BEGINNING AND THE END... THE A AND THE Z","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Alpha-Omega (A-Z) Revelation 1:8/22:13 reference"}},"4271":{"id":4271,"site":"cave","plat":"gmaps","rating":"5","text":"Awe and emotion! The place where Saint John the Theologian wrote the divinely inspired book of Revelation.","codes":{"religious_register":["mystical","doctrinal"],"mediation":"endorses","motivation_religious":1,"review_is_useful":1,"acknowledges_historical_cultural":1}},"4272":{"id":4272,"site":"cave","plat":"gmaps","rating":"5","text":"In this sacred cave, Saint John the Theologian lived when he arrived on Patmos in exile from Ephesus in Asia Minor. It was there that the rock split in three and John heard the voice of God. After that, he wrote the \"Revelation of John\", which is still known today. Anyone who has visited this cave can understand the awe you feel when you are there.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Sacred-cave narrative + 'awe you feel' addressing reader; rock split in three","acknowledges_historical_cultural":1,"topography_register":1}},"4273":{"id":4273,"site":"cave","plat":"gmaps","rating":"5","text":"A sacred and holy place.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"4278":{"id":4278,"site":"cave","plat":"gmaps","rating":"5","text":"One of the most Holy and miraculous places in the whole world!","codes":{"religious_register":["conventional"],"review_is_useful":1}},"4282":{"id":4282,"site":"cave","plat":"gmaps","rating":"5","text":"A place that is very important for Christians.\nThe term Apocalypse, Apocalyptic events is named after the cave of the Apocalypse, because the book of revelation was written there, (Revelation of John, the last book of the New Testament) which speaks of the seven seals of the apocalypse (the first 4 seals represent the 4 horsemen of the apocalypse)","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"Encyclopedic explanation of 'Apocalypse' etymology + four horsemen; 'for Christians' addresses reader","acknowledges_historical_cultural":1,"topography_register":1}},"4288":{"id":4288,"site":"cave","plat":"gmaps","rating":"5","text":"Beautiful, peaceful contemplation, a great deal of serenity","codes":{"religious_register":["mystical"],"review_is_useful":1}},"4291":{"id":4291,"site":"cave","plat":"gmaps","rating":"5","text":"Great, holy place!","codes":{"religious_register":["conventional"],"review_is_useful":1}},"4296":{"id":4296,"site":"cave","plat":"gmaps","rating":"5","text":"The sacred place where John wrote the Apocalypse is a World Heritage Site. The priest's guided tour is important for the history of the cave. The place exudes great energy.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","recognizes_heritage_protection":1,"recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"World Heritage + priest's tour + 'great energy' mystical","acknowledges_historical_cultural":1,"energy_register":1,"topography_register":1}},"4307":{"id":4307,"site":"cave","plat":"gmaps","rating":"1","text":"Religious scam. It's completely unrelated, or rather, barely relevant. Nothing is explained, and they charge you.","codes":{"mediation":"doubts","tourist_mode":"tourist_consumer","worth_assessment":"not_worth_it","facility_complaints":["commerce","signage"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Religious scam... barely relevant... they charge you'; held religious_self_id unspecified — scam-frame targets the operation, not religion as such"}},"4311":{"id":4311,"site":"cave","plat":"gmaps","rating":"5","text":"Moving experience","codes":{"religious_register":["mystical"],"review_is_useful":1}},"4315":{"id":4315,"site":"cave","plat":"gmaps","rating":"5","text":"Evocative atmosphere and intense spirituality.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"4317":{"id":4317,"site":"cave","plat":"gmaps","rating":"5","text":"Unique religious experience!","codes":{"religious_register":["conventional"],"review_is_useful":1}},"4319":{"id":4319,"site":"cave","plat":"gmaps","rating":"2","text":"Knowing the history about gospels writing, it's hard to be moved by a place where third or fourth hand texts where registered. The most touching thing is the faith of people, but you can see it the same in other more interesting places in Greece.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"mixed","tourist_mode":"tourist_consumer","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Third or fourth hand texts' authorship doubt; appreciates 'faith of people' but prefers other Greek sites","acknowledges_historical_cultural":1}},"4320":{"id":4320,"site":"cave","plat":"gmaps","rating":"5","text":"Truly a beautiful and surreal experience. As one of the many Orthodox sites, highly recommended that everyone goes here.","codes":{"religious_register":["mystical"],"review_is_useful":1,"coding_notes":"'one of the many Orthodox sites' is descriptive, not first-person self-ID"}},"4329":{"id":4329,"site":"cave","plat":"gmaps","rating":"5","text":"Think of what bible says and what John experience d","codes":{"religious_register":["doctrinal"],"mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"coding_notes":"Imperative-to-reader to imagine John's experience; relayed (not enacted) per second-person framing"}},"4332":{"id":4332,"site":"cave","plat":"gmaps","rating":"5","text":"Great is His Grace!!!\nA great man, the hieromonk Isidoros in the cave-chapel of the revelation!!","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"Praise of named hieromonk Isidoros; 'His Grace' is endorsement, not first-person self-ID","topography_register":1}},"4335":{"id":4335,"site":"cave","plat":"gmaps","rating":"3","text":"I don’t know what to say- if is the cave of revelation or not- could be-..I didn’t feel something special like in the other places eg the cave in Pithagoreio.\nIf you go on foot to the the monastery exit a shortcut - stay inside in the garden go up you see like a open air theater on left continue straight to the top, then you left the theological school on left and continue the path. It’s about 1 km the short cut.","codes":{"elevation_mention":1,"religious_register":["doctrinal"],"mediation":"doubts","review_is_useful":1,"quotable_for_chapter":1,"topography_quoted_phrase":"go on foot to the the monastery exit a shortcut","coding_notes":"'if is the cave of revelation or not- could be' — explicit authenticity doubt; comparative disappointment vs Pithagoreio cave","topography_register":1}},"4336":{"id":4336,"site":"cave","plat":"gmaps","rating":"5","text":"The fourth most important place for Christianity...","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"Doctrinal-superlative ranking ('fourth most important'); cf. 1671"}},"4342":{"id":4342,"site":"cave","plat":"gmaps","rating":"5","text":"A good experience. It's small, but if you're a believer and aware of what it meant for John to receive the revelation of the Apocalypse directly from God and to write it down in Greek (when he had a better command of Hebrew and Aramaic), it's exciting.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'if you're a believer' addresses reader → religious_self_id unspecified per v1.1; doctrinal Hebrew/Aramaic tangent","acknowledges_historical_cultural":1}},"4347":{"id":4347,"site":"cave","plat":"gmaps","rating":"5","text":"We went up the mountain, the climb was a little difficult but it was worth it: a church built inside a cave, we were welcomed by a monk named Abdkan who didn't say a word (probably because of a vow of silence). The church was small and quite crowded, but it was interesting to see how they managed to build a church of any kind inside a cave.","codes":{"ascent_mode":"walked","elevation_mention":1,"religious_register":["conventional"],"effort_valence":"ambivalent","worth_assessment":"worth_it","sensory_modalities":["sound"],"enclosure_exposure":"enclosed","recognizes_active_institution":1,"facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"topography_quoted_phrase":"We went up the mountain, the climb was a little difficult","coding_notes":"Silent monk Abdkan + church-inside-cave architecture quotable; vow-of-silence anchors sound code","topography_register":1}},"4349":{"id":4349,"site":"cave","plat":"gmaps","rating":"5","text":"A must visit and follow the story of the father","codes":{"religious_register":["conventional"],"review_is_useful":1,"coding_notes":"'follow the story of the father' — gestures at narrative engagement but too thin for mimetic"}},"4352":{"id":4352,"site":"cave","plat":"gmaps","rating":"5","text":"If you visit Patmos you have to climb all the way up to see the small church in the rocks, the view from up there will more than make up for all the effort!","codes":{"ascent_mode":"walked","elevation_mention":1,"effort_valence":"ambivalent","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"both","review_is_useful":1,"topography_quoted_phrase":"climb all the way up to see the small church in the rocks","topography_register":1,"view_centrality":"central"}},"4356":{"id":4356,"site":"cave","plat":"gmaps","rating":"5","text":"Noteworthy and holy","codes":{"religious_register":["conventional"],"review_is_useful":1}},"4363":{"id":4363,"site":"cave","plat":"gmaps","rating":"4","text":"Visiting this holy place is something you should do when you are on Patmos.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"4365":{"id":4365,"site":"cave","plat":"gmaps","rating":"5","text":"The tour by the monk was one of the most beautiful I have ever experienced!\nHe \"illuminates\" with his words the way St. John wrote the Apocalypse and lived in the cave!\nYou feel moved and blessed to be in this Holy Place!","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Monk's tour 'illuminates' how John wrote → mediation relays per guide-source rule; 'feel moved and blessed' embodied-mystical","acknowledges_historical_cultural":1,"topography_register":1}},"4383":{"id":4383,"site":"cave","plat":"gmaps","rating":"5","text":"Beautiful site to say the least. UNFORTUNATELY THE \"TOUR GUIDES\" RUINED THE SITE. THEY HAVE NO RESPECT FOR THE SITE AND THEY WALK IN TALKING LOUDLY EXPLAINING THE HOLY PLACE WHILE PPL ARE TRYING TO PRAY. LISTEN YOU TOUR GUIDES, LEARN SOMETHING. TELL YOUR TOURIST ECERYTHING THEY NEED TO KKOW BEFORE OR AFTER VISITING. OR EVEN BETTER GOOGLE IT SO YOU CAN GO OUT OF BUISSNESS BEACUSE YOUR VOICE IS UNNECESSARY!\nTRY IF YOU CAN, to visit the site off tourist peak hrs so you can enjoy the silence, energy & history as we all deserve without disruption & disrespect.","codes":{"religious_register":["conventional","mystical"],"tourist_mode":"institutional_aware","sensory_modalities":["sound"],"recognizes_active_institution":1,"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"All-caps reverence-violation tirade against tour guides talking during prayer; 'silence, energy & history'","acknowledges_historical_cultural":1,"atmospheric_register":1,"energy_register":1}},"4392":{"id":4392,"site":"cave","plat":"gmaps","rating":"5","text":"The energy there is incredible.","codes":{"religious_register":["mystical"],"review_is_useful":1,"energy_register":1}},"4394":{"id":4394,"site":"cave","plat":"gmaps","rating":"5","text":"Don't miss out on being in operation\nA soothing environment and a sense of purification","codes":{"religious_register":["mystical"],"review_is_useful":1,"coding_notes":"Translation artifact 'in operation'; 'soothing... purification' mystical"}},"4401":{"id":4401,"site":"cave","plat":"gmaps","rating":"1","text":"A lucrative business has sprung up around a cave where they claim Saint John the Evangelist wrote the Book of Revelation. First of all, according to legend, he didn't write it himself; someone else did. We don't know if it was because he couldn't write, or because he was so \"inspired\" that he needed someone else to write down what he said. Paying to see a cave with practically nothing.\n\nOf course, now there are a lot of buildings around it (churches, houses, etc.). Presumably, these were paid for by those of us who pay to see the cave.\n\nThe guy who takes away the candles that people light (and leave donations) is despicable. As soon as the customers leave, he throws the whole candles in the recycling bin.\n\nThe whole thing is lamentable surrounding a religious practice that they themselves should respect.\n\nA lucrative business has sprung up around a cave where they claim Saint John the Evangelist wrote the Book of Revelation. The first thing is that, according to legend, he didn't write it himself; someone else did. We do not know if because he did not know how to write, or because he was so \"inspired\", that he needed someone to write what he said. Pay to see a cave with nothing.\nOf course, now there are a lot of buildings around (churches, houses, etc). Presumably, paid for by those who pay to see the cave.\n\nThe type that removes the candles that people light (and leaves donations) is unpresentable. As soon as customers are seen, throw the whole candles in the recycling bin.\n\nAll unfortunate around a cult that they should respect themselves","codes":{"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"not_worth_it","tourist_mode":"tourist_consumer","facility_complaints":["commerce","prices"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Skeptic + commerce + candle-disposal critique. 'lucrative business... they themselves should respect.'","acknowledges_historical_cultural":1,"topography_register":1}},"4402":{"id":4402,"site":"cave","plat":"gmaps","rating":"5","text":"The Revelation in the sacred cave...","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1,"topography_register":1}},"4405":{"id":4405,"site":"cave","plat":"gmaps","rating":"5","text":"This is a holy place, a place all Christians should try to visit once in their lifetime.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"4409":{"id":4409,"site":"cave","plat":"gmaps","rating":"5","text":"I have no words. You feel awe.","codes":{"religious_register":["mystical"],"review_is_useful":1}},"4416":{"id":4416,"site":"cave","plat":"gmaps","rating":"5","text":"Excellent tour, sacred place full of energy.","codes":{"religious_register":["conventional","mystical"],"review_is_useful":1,"energy_register":1}},"4425":{"id":4425,"site":"cave","plat":"gmaps","rating":"3","text":"Rather disappointing; in my opinion, the trip alone isn't worth it. It appears to be just a chapel/church with little to no information.","codes":{"tourist_mode":"tourist_consumer","worth_assessment":"not_worth_it","religious_register":["conventional"],"facility_complaints":["signage"],"tone_toward_constraints":"dismissive","review_is_useful":1}},"4433":{"id":4433,"site":"cave","plat":"gmaps","rating":"5","text":"All Christians should visit this cave","codes":{"religious_register":["conventional"],"review_is_useful":1,"topography_register":1}},"4437":{"id":4437,"site":"cave","plat":"gmaps","rating":"4","text":"Don't expect to find anything but a place of ☮️ and tranquility. It's a special place and worth visiting.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"4450":{"id":4450,"site":"cave","plat":"gmaps","rating":"5","text":"Spiritual place when not overrun by hords of tourists and pilgrims.","codes":{"religious_register":["mystical"],"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"4455":{"id":4455,"site":"cave","plat":"gmaps","rating":"5","text":"Touch the future from the ancient. Biblical.","codes":{"religious_register":["doctrinal"],"review_is_useful":1}},"4459":{"id":4459,"site":"cave","plat":"gmaps","rating":"5","text":"A place of worship of my Triune God. Wonderful environment, exudes positive energy, inspires awe, humility and inspires love...","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","religious_self_id":"christian_general","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'my Triune God' fires christian_general per v1.1 first-person possessive","energy_register":1}},"4460":{"id":4460,"site":"cave","plat":"gmaps","rating":"5","text":"A sacred place. The liturgy here is experienced with great poignancy. Open daily from 8:00 a.m. to 1:00 p.m. and occasionally in the evening.","codes":{"religious_register":["conventional","mystical"],"recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1}},"4463":{"id":4463,"site":"cave","plat":"gmaps","rating":"3","text":"I guess I had too high expectations. In the end, it was simply a rather (disfiguringly) converted cave, adorned from top to bottom with gold and silver, now a church. Anyone expecting a vision of the apocalypse should steer clear. Instead, it's packed with tourists, even off-season. The view of Patmos from one of the windows, however, is not to be underestimated. And the paintings and carvings inside are very impressive, clearly demonstrating an incredible amount of effort and craftsmanship. The ever-present scent of incense and other burning incense also lends the place a special atmosphere.","codes":{"tourist_mode":"tourist_consumer","worth_assessment":"mixed","religious_register":["conventional","doctrinal"],"sensory_modalities":["vision","smell"],"enclosure_exposure":"enclosed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"ambivalent: 'disfiguringly converted... craftsmanship... scent of incense'","topography_register":1,"view_centrality":"mentioned"}},"4465":{"id":4465,"site":"cave","plat":"gmaps","rating":"5","text":"We know that Bible says apostle Jhon was in Patmos, wether or not he was in this cave, that's debatable, but is interesting nevertheless","codes":{"religious_register":["doctrinal"],"mediation":"hedges","review_is_useful":1,"topography_register":1}},"4478":{"id":4478,"site":"cave","plat":"gmaps","rating":"3","text":"I don't believe the whole story this place is based on, but there are some nice views.","codes":{"mediation":"doubts","tourist_mode":"tourist_consumer","sensory_modalities":["vision"],"review_is_useful":1,"coding_notes":"'I don't believe the whole story' — held to unspecified self-id (story-narrow disavowal)","view_centrality":"mentioned"}},"4487":{"id":4487,"site":"cave","plat":"gmaps","rating":"5","text":"The cave where Saint John lived and where God presented him with the Apocalypse!\nYou will see the places where he rested, the places on the rocks where his head rested and the carving in the rock that we use to be able to stand up. The splitting of the rock at the moment of the Apocalypse and the sanctuary that was built somewhere in 1086 AD?","codes":{"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","sensory_modalities":["vision"],"mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"topography_register":1}},"4490":{"id":4490,"site":"cave","plat":"gmaps","rating":"5","text":"A most see site. It enriches our Christianity's values. An unforgettable experience I will never forget.","codes":{"religious_register":["conventional"],"religious_self_id":"christian_general","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'our Christianity's values' fires christian_general per v1.1 first-person plural"}},"4497":{"id":4497,"site":"cave","plat":"gmaps","rating":"5","text":"It is difficult to describe the uniqueness of this place. Unforgettable impressions from an evocative sacred space. The cave hall captivates the visitor and takes him on a journey of thought through time. Every detail on the cave rock attracts the attention of the observer. Perched on a rock overlooking Patmos and the blue waters of the Aegean, it is worth visiting by everyone.","codes":{"religious_register":["conventional","mystical"],"elevation_mention":1,"topography_quoted_phrase":"Perched on a rock overlooking Patmos and the blue waters of the Aegean","sensory_modalities":["vision"],"enclosure_exposure":"both","nature_mention":1,"nature_sub_codes":["seascape"],"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"topography_register":1,"view_centrality":"mentioned"}},"4499":{"id":4499,"site":"cave","plat":"gmaps","rating":"5","text":"Every historical place deserves a visit. In Patmos, Greece, it is said that this place is where Saint John the Evangelist wrote the Book of Revelation. Just in case, touch the stone ceiling of the cave and see if you feel any vibration. When I went, I couldn't photograph the interior. The view is enchanting.","codes":{"religious_register":["doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","sensory_modalities":["vision"],"facility_complaints":["photography_restrictions"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'touch the stone ceiling... feel any vibration' — distinctive vibration-test reader-instruction","motivation_historical_cultural":1,"acknowledges_historical_cultural":1,"energy_register":1,"topography_register":1,"view_centrality":"mentioned"}},"4504":{"id":4504,"site":"cave","plat":"gmaps","rating":"5","text":"A reference point for Christianity worldwide and refuge of Jesus' beloved disciple, John, in 95 AD, when Domitian exiled him to Patmos for preaching the word of God. There is also the split rock with three slits that symbolizes the Holy Trinity, when the voice of God was heard, dictating the Holy Book of Revelation to John.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","sensory_modalities":["vision"],"mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"topography_register":1}},"4517":{"id":4517,"site":"cave","plat":"gmaps","rating":"5","text":"In this place the Apocalypse Revelation was revealed to the Apostle John the Theologian.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1}},"4519":{"id":4519,"site":"cave","plat":"gmaps","rating":"5","text":"Lovely place, God lives there","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1}},"4520":{"id":4520,"site":"cave","plat":"gmaps","rating":"5","text":"Just when you enter the cave you feel shivers and awe!","codes":{"religious_register":["mystical"],"enclosure_exposure":"enclosed","review_is_useful":1,"topography_register":1}},"4522":{"id":4522,"site":"cave","plat":"gmaps","rating":"5","text":"The destination of many trips/pilgrimages to Patmos, it is worth seeing","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"4528":{"id":4528,"site":"cave","plat":"gmaps","rating":"4","text":"To delve into the story of this prodigious revelation.","codes":{"religious_register":["doctrinal"],"review_is_useful":1}},"4535":{"id":4535,"site":"cave","plat":"gmaps","rating":"5","text":"Excellent ..... you feel a shiver of emotion with the idea that here the disciple of Christ John the Theologian wrote the Apocalypse and lived in this cave for two years in exile .... In this cave God appeared before him .... every Christian should visit this place which is also called \"Jerusalem of the Mediterranean\" .....","codes":{"religious_register":["doctrinal","mystical"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"quotable_for_chapter":1,"topography_register":1}},"4538":{"id":4538,"site":"cave","plat":"gmaps","rating":"5","text":"View of Patmos Island, from the Cave of the Apocalypse.","codes":{"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"central"}},"4539":{"id":4539,"site":"cave","plat":"gmaps","rating":"5","text":"A must visit for any Christian.","codes":{"religious_register":["conventional"],"review_is_useful":1}},"4543":{"id":4543,"site":"cave","plat":"gmaps","rating":"5","text":"A very wonderful and holy place!","codes":{"religious_register":["conventional"],"review_is_useful":1}},"4553":{"id":4553,"site":"cave","plat":"gmaps","rating":"5","text":"Simply wonderful, perfect environment.. Inside you feel an incredible energy on you... I didn't believe what I was hearing until the moment I set foot on the island which has a special atmosphere.","codes":{"religious_register":["mystical"],"review_is_useful":1,"quotable_for_chapter":1,"energy_register":1}},"4556":{"id":4556,"site":"cave","plat":"gmaps","rating":"5","text":"This Christian holy site is said to be where the final book of the New Testament, the Book of Revelation, was written.\nJohn was apparently exiled from the Roman Empire and lived on the island of Patmos at the time.\nFor some, it's a place of visions that occurred when someone went mad due to persecution,\nwhile for others, it's a power spot where they can feel the word of God.\nEither way, it's a tourist destination worth visiting for both atheists and evangelicals. There's also a beautiful view of the Aegean Sea (⌒▽⌒)","codes":{"religious_register":["conventional","doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'mad due to persecution / power spot' = hedges; 'atheists and evangelicals' framing","acknowledges_historical_cultural":1,"view_centrality":"mentioned"}},"4557":{"id":4557,"site":"cave","plat":"gmaps","rating":"5","text":"Another Unesco monument with unique energy and devotion","codes":{"religious_register":["conventional","mystical"],"recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"energy_register":1}},"4561":{"id":4561,"site":"cave","plat":"gmaps","rating":"3","text":"It was nice to see the cave but I really wish they had left everything as it was there and not changed it into an Orthodox Church.","codes":{"religious_register":["doctrinal"],"tourist_mode":"tourist_consumer","tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"wishes cave preserved natural, not 'changed into' Orthodox Church","topography_register":1}},"4564":{"id":4564,"site":"cave","plat":"gmaps","rating":"4","text":"Craziest cab driver ever, made it from the port up to top in record time. Small and crowded, yet very cool.  THis place gives you a different vibe.","codes":{"ascent_mode":"motorized","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"from the port up to top in record time","religious_register":["mystical"],"enclosure_exposure":"enclosed","review_is_useful":1,"quotable_for_chapter":1,"energy_register":1}},"4572":{"id":4572,"site":"cave","plat":"gmaps","rating":"4","text":"Beautiful views of Patmos. The grotto has little to offer.","codes":{"tourist_mode":"tourist_consumer","sensory_modalities":["vision"],"enclosure_exposure":"both","austerity_register":"negative","review_is_useful":1,"topography_register":1,"view_centrality":"central"}},"4576":{"id":4576,"site":"cave","plat":"gmaps","rating":"4","text":"A very beautiful place, with incredible views of Patmos Bay.\nWe got off the cruise ship and shared a taxi with another couple. The driver took us to the grotto (waiting for us for 30 minutes) and then to the monastery (waiting for us for an hour), all for €15 per couple. I recommend it because even though it's 4 km to the top (the monastery), it's all uphill and dangerous to walk.\nFor those with babies, it's advisable to leave the stroller at the taxi stand because there are many stairs to navigate with a stroller.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"all uphill and dangerous to walk","effort_valence":"negative","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","motivation_cruise_thing_to_see":1,"review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"motorized","on_site_movement":["accessibility_concern"]}},"4578":{"id":4578,"site":"cave","plat":"gmaps","rating":"5","text":"Divine service in the cave. A unique experience.","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1,"topography_register":1}},"4580":{"id":4580,"site":"cave","plat":"gmaps","rating":"5","text":"The second most important station of Orthodoxy","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1}},"4582":{"id":4582,"site":"cave","plat":"gmaps","rating":"5","text":"You have to be there, be aware of the schedule,there is a priest in certain hours that gives informations about this Holly place.\nI could not describe it,it was something like an out if body experience....Very peaceful there are buses to get you there from scala u don't have to get a taxi.","codes":{"ascent_mode":"motorized","religious_register":["conventional","mystical"],"recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1}},"4587":{"id":4587,"site":"cave","plat":"gmaps","rating":"5","text":"A place that, among other things, gives meaning to visiting Patmos. You simply have to see it and feel the atmosphere.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"4588":{"id":4588,"site":"cave","plat":"gmaps","rating":"5","text":"This place means a lot to me.. When I entered the cave, I sat down on the bench and closed my eyes and tried to imagine that Sunday morning when John saw the open sky... I am very glad that I was here... I love Patmos.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"topography_register":1,"on_site_movement":["posture_pause"]}},"4589":{"id":4589,"site":"cave","plat":"gmaps","rating":"5","text":"Great outdoor space.\nThe indoor space has incredible energy and if you are faithful you will receive it.\nPhotos are prohibited but keep them in your heart","codes":{"religious_register":["mystical"],"enclosure_exposure":"both","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"energy_register":1}},"4596":{"id":4596,"site":"cave","plat":"gmaps","rating":"5","text":"Hello: I really enjoyed being where Christian tradition places the writing of the last book of the Bible, the Book of Revelation. It was there that John received the revelation and dictated it to his assistant Prochorus. Apart from the bump I got in the cave, everything was perfect. Regards.","codes":{"religious_register":["doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","mimetic":1,"mimetic_engagement":"relayed","review_is_useful":1,"topography_register":1,"on_site_movement":["accessibility_concern"]}},"4597":{"id":4597,"site":"cave","plat":"gmaps","rating":"3","text":"A sacred place, worth visiting, you will be moved.. The only negative is the short visiting hours (especially noticeable in the summer, because there is a panic among visitors-pilgrims).","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","facility_complaints":["access_hours"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1}},"4598":{"id":4598,"site":"cave","plat":"gmaps","rating":"5","text":"A place mentioned in the Bible.","codes":{"religious_register":["doctrinal"],"review_is_useful":1}},"4622":{"id":4622,"site":"cave","plat":"gmaps","rating":"5","text":"I had returned to my birthplace Cyprus after 60 years in England. My friend, the bank Manager there, said to me we are making a cruise of the 5 main Greek islands, and it includes the island of Patmos where the Apostle John, beloved of Jesus, spent his last days and wrote the Apocalypse, the book of Revelation as brought to him by the Holy Angel. We visited the actual cave he had hidden in from the pirates who frequently raided the island, up in the mountain where there is the monastery that also has manuscripts written in his blood when he ran out of ink, and which I actually saw. The thing that struck me entering the cave, which is cracked in its ceiling in three deep grooves that look like a Y, was that this was indeed our Lord had blessed with His visit, and the writings of the prophesy in the final days we now live in, the Apocalypse, is indeed a blessing to me which I never thought would happen in my lifetime, but only materialised through the blessing of my Lord and Saviour who made it possible for me. No doubt in my mind that this was indeed a revelation. Go and visit it to understand how man can touch God, and be greatful through your faith for His great gift to us.","codes":{"trip_mode":"cruise_excursion","tourist_mode":"institutional_aware","elevation_mention":1,"topography_quoted_phrase":"up in the mountain where there is the monastery","religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","religious_self_id":"christian_general","mimetic":1,"mimetic_engagement":"relayed","motivation_religious":1,"motivation_cruise_sought":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Cypriot returning post-60yr, 'never thought would happen in my lifetime' + 'my Lord and Saviour' fires sought + christian_general","acknowledges_historical_cultural":1,"topography_register":1}},"4625":{"id":4625,"site":"cave","plat":"gmaps","rating":"5","text":"If you are religious, this is such an unique place to see. I felt very emotional of being in a place where an apostle lived!","codes":{"religious_register":["conventional"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"relayed","motivation_religious":1,"review_is_useful":1,"acknowledges_historical_cultural":1}},"4634":{"id":4634,"site":"cave","plat":"gmaps","rating":"3","text":"Cave where Saint John wrote the Apocalypse. Important library.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"4635":{"id":4635,"site":"cave","plat":"gmaps","rating":"5","text":"I really like the cave of the Apocalypse.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","review_is_useful":1,"topography_register":1}},"4640":{"id":4640,"site":"cave","plat":"gmaps","rating":"5","text":"The island of Patmos where the Apostle John wrote the revelation of Jesus Christ to the seven churches. He is coming soon it is our duty to spread the gospel of Jesus Christ.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","religious_self_id":"christian_general","mimetic":1,"mimetic_engagement":"relayed","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Review-as-witness form: 'our duty to spread the gospel'; joins 1138/1278/1599/1688 cluster","acknowledges_historical_cultural":1}},"4644":{"id":4644,"site":"cave","plat":"gmaps","rating":"5","text":"Very good place...John received visions from Jesus there...\nBeautiful...mysterious...wise...This place is ultra special for Christians. But is this the real place???","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"hedges","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'But is this the real place???' — clean hedge after endorsing language","acknowledges_historical_cultural":1}},"4647":{"id":4647,"site":"cave","plat":"gmaps","rating":"5","text":"St John pray God for us!!!","codes":{"religious_register":["conventional"],"motivation_religious":1,"review_is_useful":1,"coding_notes":"Review-as-prayer 'St John pray God for us'; 'us' intercessory-generic, no self-ID per 1688 precedent"}},"4649":{"id":4649,"site":"cave","plat":"gmaps","rating":"5","text":"A cave where st. John had his revelation. There is a small church inside the cave. Beautiful historic site and a place of worship for Christians.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}}},"meta":{"n_cohorts":16,"n_unique_reviews":1325}};
let activeCohort = DATA.cohorts[0].id;

function escHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderReview(nid, query){
  const r = DATA.reviews[nid];
  if(!r) return '';
  let text = r.text;
  if(query){
    const re = new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    text = text.replace(re, '<mark style="background:#fef08a;padding:0 2px">$1</mark>');
  } else {
    text = escHtml(text);
  }
  const codesJson = JSON.stringify(r.codes, null, 0);
  return '<div class="review" data-id="'+nid+'">' +
    '<div class="review-meta">' +
      '<span class="site-badge '+r.site+'">'+r.site+'</span>' +
      '<span class="review-id">nms_id='+r.id+'</span> · ' +
      '<span>'+escHtml(r.plat)+'</span> · ' +
      '<span>★'+escHtml(r.rating)+'</span> · ' +
      '<span class="review-codes-toggle">codes</span>' +
    '</div>' +
    '<div class="review-text">'+text+'</div>' +
    '<div class="review-codes">'+escHtml(codesJson)+'</div>' +
  '</div>';
}

function renderContent(){
  const cohort = DATA.cohorts.find(c => c.id === activeCohort);
  if(!cohort) return;
  document.getElementById('cohort-title').textContent = cohort.title;
  document.getElementById('cohort-blurb').textContent = cohort.blurb;

  const q = document.getElementById('search').value.toLowerCase().trim();
  let ids = cohort.ids;
  if(q){
    ids = ids.filter(nid => {
      const r = DATA.reviews[nid];
      if(!r) return false;
      if(r.text.toLowerCase().includes(q)) return true;
      if(JSON.stringify(r.codes).toLowerCase().includes(q)) return true;
      return false;
    });
  }
  document.getElementById('cohort-stats').textContent =
    (q ? ids.length+' matching of ' : '')+'n = '+cohort.ids.length+' reviews in cohort';
  document.getElementById('search-count').textContent =
    q ? (ids.length + ' matching') : (cohort.ids.length + ' total');
  const content = document.getElementById('content');
  if(ids.length === 0){
    content.innerHTML = '<div class="empty-msg">No matches.</div>';
    return;
  }
  let html = '';
  for(const nid of ids){
    html += renderReview(nid, q);
  }
  content.innerHTML = html;
  document.querySelectorAll('.review-codes-toggle').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const codes = el.closest('.review').querySelector('.review-codes');
      codes.classList.toggle('open');
    };
  });
}

function renderTOC(){
  const toc = document.getElementById('toc');
  let html = '';
  for(const c of DATA.cohorts){
    const cls = c.id === activeCohort ? 'active' : '';
    html += '<a data-id="'+c.id+'" class="'+cls+'">'+escHtml(c.title)+'<span class="count">'+c.ids.length+'</span></a>';
  }
  toc.innerHTML = html;
  toc.querySelectorAll('a').forEach(a => {
    a.onclick = () => {
      activeCohort = a.dataset.id;
      document.getElementById('search').value = '';
      renderTOC();
      renderContent();
      window.scrollTo({top: 0, behavior: 'smooth'});
    };
  });
}

let searchTimer;
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderContent, 180);
});

renderTOC();
renderContent();
</script>
</body></html>
