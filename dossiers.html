["conventional","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"both","worth_assessment":"worth_it","nature_mention":1,"nature_sub_codes":["seascape","flora_fauna"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'YOU MUST BOW DOWN' embodied; 'sky, sea, all the rock... very little vegetation' specific vision","topography_register":1,"view_centrality":"mentioned","on_site_movement":["accessibility_concern"]}},"107":{"id":107,"site":"cave","plat":"tripadvisor","rating":"3","text":"Not impressed. \n Not impressed. A little too touristy for us. Popular because of its apparent historic significance, the location of which can't be verified.  I suppose if you're on Patmos it's kind of a must see, especially if  the Christian Bible is your book of faith, as it is with us. Just set your expectations, which for us included \"skeptical\" before and more so after.","codes":{"tourist_mode":"tourist_consumer","religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"mixed","religious_self_id":"christian_general","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'the Christian Bible is your book of faith, AS IT IS WITH US' first-person plural Christian self-ID; 'skeptical' doubts","acknowledges_historical_cultural":1}},"109":{"id":109,"site":"cave","plat":"tripadvisor","rating":"5","text":"Amazing. \n Amazing. The cave where John The Divine (NOT John the Baptist) went into retreat to dictate the Book of Revelations.  Still a working church with services every morning.  Such great views and peaceful setting, one envies John a bit.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'still a working church with services every morning'","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"110":{"id":110,"site":"cave","plat":"tripadvisor","rating":"3","text":"Où est la grotte ? \n Where Is the Cave? Like other visitors at the same time, we spent about ten minutes walking around the site looking for the cave. Finally, a monk pointed out to us that it is located below the monastery inside a church. Entry is paid (€2) to access a pretty, richly decorated, and mystical place. It was only when we returned to the parking lot that we spotted the very discreet sign — in Greek only — indicating the path to take, without going through the main entrance of the site.","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","facility_complaints":["signage"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'mystical place'; 'very discreet sign in Greek only' = signage","topography_register":1,"on_site_movement":["walking_around"]}},"111":{"id":111,"site":"cave","plat":"tripadvisor","rating":"5","text":"Τόπος ιερος \n A Sacred Place In the cave, John lived and wrote the Book of Revelation.\nThere are visitors who worship and make sure to get photographed, and there are those who worship and pray with reverence.\nA sacred place does not allow for more comments.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"observes others worshipping with vs without reverence — institutional-implicit critique","acknowledges_historical_cultural":1,"topography_register":1}},"113":{"id":113,"site":"cave","plat":"tripadvisor","rating":"5","text":"Πρεπει να το επισκεφθείς!! \n You Have to Visit It!! The Cave of the Apocalypse exudes an aura of reverence. We saw the spot where the Book of Revelation was written, beneath the massive rock, the resting place of Saint John, the spot where the Evangelist rested his head to sleep, and a hollow from which he held on to get up.\nThe Cave of the Apocalypse is a place of reverence where the pilgrim experiences beauty, awe, silence, and prayer as they sense with their eyes the contact with God.","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'aura of reverence' mystical; specific vision content (massive rock, hollow); 'pilgrim experiences' framing","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1}},"114":{"id":114,"site":"cave","plat":"tripadvisor","rating":"5","text":"A holy place \n A holy place We were there twice, first on Saturday afternoon and then on Sunday morning for mass. Even though we didn't understand anything, there was a holy atmosphere. Completely different from when tourists are buzzing around.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1}},"115":{"id":115,"site":"cave","plat":"tripadvisor","rating":"5","text":"Peaceful and serene \n Peaceful and serene The cave and the surroundings buildings have been tastefully restored. There were only a few people there when we visited and they were either silently praying or meditating. It was peaceful and serene.","codes":{"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'only a few people' implicit appreciation of low crowding","atmospheric_register":1,"topography_register":1}},"116":{"id":116,"site":"cave","plat":"tripadvisor","rating":"4","text":"Πρεπει να το επισκεφτεις \n You Must Visit It It's one of the places you have to go — an entrance that leads you into a small church inside the rock, with a wonderful view amidst the forest.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","nature_mention":1,"nature_sub_codes":["flora_fauna"],"review_is_useful":1,"coding_notes":"'wonderful view amidst the forest' specific","topography_register":1,"view_centrality":"mentioned"}},"119":{"id":119,"site":"cave","plat":"tripadvisor","rating":"4","text":"A must if you are interested in the Revelation of John the Apostle \n A must if you are interested in the Revelation of John the Apostle This is a very special place but I like to imagine it without all the trappings and empty of people. It is interesting to see where it is thought John laid his head and the handhold to help him rise. It is also good to see the view from what is now a window. There are icons for those who are interested. Don’t forget the dress code if you visit this pace,","codes":{"religious_register":["doctrinal"],"mediation":"hedges","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'thought John laid his head' hedges; wishes empty-of-people = soft crowding","acknowledges_historical_cultural":1,"view_centrality":"mentioned"}},"121":{"id":121,"site":"cave","plat":"tripadvisor","rating":"5","text":"Emoção define! \n Emotion Defines It! Very emotional to have the opportunity to visit the cave where Saint John lived and wrote the Book of Revelation. The surroundings of the cave also have beautiful spaces to visit.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"124":{"id":124,"site":"cave","plat":"tripadvisor","rating":"5","text":"Don't miss it if you get to Patmos island \n Don't miss it if you get to Patmos island One of the greatest historical and religious monument of the world. The energy of the place is extraordinary! Dont miss it! Is just 20 minutes of your vacation time!","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'energy of the place is extraordinary'","acknowledges_historical_cultural":1,"energy_register":1}},"127":{"id":127,"site":"cave","plat":"tripadvisor","rating":"5","text":"Spiritually Moving \n Spiritually Moving It is said that St John lived out his days on Patmos, living simply in a cave, and it is here that he scribed the book of Revelations. Around the cave holy buildings have grown up, particularly an ecclesiastical school. The cave itself is simply that - a small cave - over the years it has been extended and is now a small church visited by the faithful. Anyone who holds the Christian faith cannot help but be moved - a real sense of devotion fills the place - as it should with such a history. \nThe cave is located half way between Skala and Chora (where the Monastery is perched on the hilltop) it is reached easily by the road (a bus passes by) or for those who like a challenge, take the old stone pathway from the edge of Skala (easily located and which goes on all the way to Chora). An extremely special place.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"Monastery is perched on the hilltop","religious_register":["conventional","doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'It is said' hedges; 'Anyone who holds the Christian faith' addresses but not first-person; ecclesiastical school = active institution","acknowledges_historical_cultural":1,"topography_register":1}},"128":{"id":128,"site":"cave","plat":"tripadvisor","rating":"5","text":"VACATION \n VACATION They call it THE JERUSALEM OF GREECE and it's not by chance! Patmos in general exudes an aura of reverence, let alone the Cave of the Apocalypse, where when we went, we stood in amazement!! The Holy Cave is about a quarter of an hour from Skala, roughly halfway along the route from the port to Chora. Going down forty-three steps, the sight of the rock split in three — when Saint John heard the voice of God and wrote the Holy and Prophetic Book of Revelation — fills you with awe!!! We saw the spot where the Book of Revelation was written, beneath the massive rock, the resting place of Saint John, the spot where the Evangelist rested his head to sleep, and a hollow from which he held on to get up. All of this was told to us by a remarkable Elder who was there, who also mentioned that in our time, a part of the Cave has been converted into a Church for the faithful who come, and also that throughout the centuries, the Cave was renovated as a place of worship by Saint Christodoulos, and it is visited not only by Christians but also by followers of all religions! When we came outside, we went and sat on an enormous terrace, having first gotten something to drink from the outdoor kiosk there, and we were stunned by the WONDERFUL VIEW!!! The green of the trees and the blue of the sea matched BEAUTIFULLY at that moment, and inspired us to make Patmos our vacation destination for next summer too!!! All of us, from Greece and from abroad, WE LOVE PATMOS!!! WE LOVE PATMOS!!! Thank you!!! Thank you so much!!!","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"relays","worth_assessment":"worth_it","sensory_modalities":["vision","embodied"],"enclosure_exposure":"both","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'aura of reverence', told by Elder = relays; 'green of the trees and blue of the sea' specific vision","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"central","on_site_movement":["posture_pause","stairs_down"]}},"129":{"id":129,"site":"cave","plat":"tripadvisor","rating":"4","text":"A must visit in Patmos \n A must visit in Patmos We enjoyed visiting the cave which interested us; the history was told to us by the people present; very religious meaning for those who have deeper faith","codes":{"religious_register":["conventional"],"mediation":"relays","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'for those who have deeper faith' soft disavowal — held to unspecified","acknowledges_historical_cultural":1,"topography_register":1}},"130":{"id":130,"site":"cave","plat":"tripadvisor","rating":"5","text":"A ne pas manquer \n Not to Be Missed A major religious site of Patmos — complement your visit with the monastery — the road up to the village is quite steep — take a taxi","codes":{"ascent_mode":"motorized","elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"132":{"id":132,"site":"cave","plat":"tripadvisor","rating":"5","text":"Εμπειρία \n Experience A unique experience and very powerful energy. Every Christian should visit at least once in their lifetime. Discreet sale of souvenirs, something very positive for the space.","codes":{"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'powerful energy' mystical; 'Every Christian' addresses but not first-person","energy_register":1}},"133":{"id":133,"site":"cave","plat":"tripadvisor","rating":"3","text":"\"Ενδιαφέρον\" \n \"Interesting\" The place has an aura of reverence and calm on its own.. \n The only thing that ruins it is that even before you enter there is a little shop for purchases, etc., and the priest who does the chore of saying a couple of words about the history of the cave! It's unacceptable that he tells us to save candle lighting for later, so as to rush through as many people as possible while reciting important and sacred things about this holy place, as if he were reciting a little poem in elementary school! If they can't be bothered, it would be better not to do it at all and simply write it down somewhere so that whoever wants to can read it!","codes":{"visit_season":"peak_may_aug","tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"sensory_modalities":["sound"],"enclosure_exposure":"enclosed","facility_complaints":["commerce","crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'aura of reverence' → mystical; complains about commerce/rushing FOR reverence reasons → institutional_aware not consumer","acknowledges_historical_cultural":1,"atmospheric_register":1}},"144":{"id":144,"site":"cave","plat":"tripadvisor","rating":"4","text":"Traditional Site Where the Apostle John Received Visions of Revelation \n Traditional Site Where the Apostle John Received Visions of Revelation Visiting Patmos as part of a Celestyal Cruise, we visited the traditional site where the apostle John received the revelations he recorded in the Book of Revelation. In Rev. 1:9, John states he was on the isle called Patmos. Photographs are not allowed in the cave area. The tour includes areas which tradition suggests are where John prayed, slept, and the area where he received the revelation. This site has been designated a UNESCO World Heritage site.","codes":{"trip_mode":"cruise_excursion","religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","recognizes_heritage_protection":1,"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'tradition suggests' hedges; UNESCO fires; quotes Rev 1:9","acknowledges_historical_cultural":1}},"146":{"id":146,"site":"cave","plat":"tripadvisor","rating":"4","text":"History, faith, and beyond... \n History, faith, and beyond... The Cave of the Apocalypse is a significant place in the map of the religious one. But also for the one that is interested in the history of the Christian church´s first years and of its formation. The Book of the Apocalypse (the last book of the christian canonical collection of books, namely the Bible) is a writing of the highest importance for the christian believer.  Therefore is this place of such reverence for many.  Here the roman era, the byzantine emperors set their stamp, here the religious orders and the many faithful have given this site the highest respect.\n\nThe site is easily visited, but can be difficult for those who have hard time going stairs and steep streets.   The Cave (and the monastery close by) is best visited by bus or with car.  Som walking is needed.  Photographing is not allowed.  Yet being a holy place - one can wear shorts and t-shirts.   \nGreat site of interest.","codes":{"ascent_mode":"motorized","religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'roman era, byzantine emperors set their stamp' historical-doctrinal frame","acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["accessibility_concern"]}},"148":{"id":148,"site":"cave","plat":"tripadvisor","rating":"5","text":"Amazing Experience \n Amazing Experience We took the excursion which was offered by Celestyal Cruises and this was wonderful. We were with friends, including 4 teenagers, all of whom loved the cave and the story shared about it. Amazing to go and worth the trip.","codes":{"trip_mode":"cruise_excursion","mediation":"relays","worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1}},"150":{"id":150,"site":"cave","plat":"tripadvisor","rating":"5","text":"Highly recommended for intetested in christianity \n Highly recommended for intetested in christianity The cave and entire complex is very calm, relaxing. There's Great view from it. Of course, as place of writting the last book od Bible, great place for those who are intetested in religion.","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"mentioned"}},"151":{"id":151,"site":"cave","plat":"tripadvisor","rating":"5","text":"a  Gruta (cova)  onde  São  João  escreveu  o   Apcalipse!!! \n The Grotto (cave) where Saint John wrote the Apocalypse!!! The island of Patmos is small and known as the place where the Apostle and Evangelist Saint John wrote the Apocalypse (Revelation). The Grotto was transformed into a small chapel, where there are paintings, icons, a hole where he would rest his head and another hole where he would rest his hands. For Christians, it is a holy place!!! The Orthodox caretakers of the site annoy everyone by not allowing photos.","codes":{"religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'paintings, icons, hole where he would rest his head' specific vision; 'annoy everyone' = frustrated","acknowledges_historical_cultural":1,"topography_register":1}},"153":{"id":153,"site":"cave","plat":"tripadvisor","rating":"5","text":"Religion overpowers the message \n Religion overpowers the message We were a bit unsettled by the religious spirit on the island of Patmos....we were not allowed to touch or photograph anything inside the monastery or at the cave where John received the revelation! Everything is declared \"holy\" by man even the island and then commercialised.....it misses the focus on the beautiful revelation that John received! A touching experience nevertheless as it makes Scripture more real when you see where John left his footprint: physical and spiritual.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","doctrinal"],"worth_assessment":"mixed","facility_complaints":["photography_restrictions","commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'religion overpowers the message' Protestant-flavored insider critique; reveres Scripture"}},"154":{"id":154,"site":"cave","plat":"tripadvisor","rating":"4","text":"Interessanter Ort \n Interesting Place The grotto is much smaller than I had expected. Nevertheless, it is a fascinating place that is especially highly regarded by locals. We were there at a time when a family celebration (probably a baptism?) was being prepared.","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"baptism preparation observed = active institution","topography_register":1}},"155":{"id":155,"site":"cave","plat":"tripadvisor","rating":"5","text":"Αποκάλυψη! \n Revelation! Externally very large and beautiful... there were many steps to climb. You had the opportunity to buy icons and also to light a candle. They would give you a little oil before you left (if you wanted). There were various old items such as the epitaphios, where they used to knead bread back in the day, etc. There was also a museum inside with a very small entry fee of 2€ that had the original icons of the three missions of Saint Catherine, Saint George, etc., gold-embroidered robes, golden chalices, etc. The only thing that disappointed me was that if you wanted to get water somewhere, there wasn't any... and with so many steps, you really need it!","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","effort_valence":"positive","worth_assessment":"worth_it","facility_complaints":["amenities"],"tone_toward_constraints":"frustrated","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"specific museum vision content; no water amenity complaint with steps","acknowledges_historical_cultural":1,"on_site_movement":["stairs_up"]}},"158":{"id":158,"site":"cave","plat":"tripadvisor","rating":"5","text":"ΔΕΟΣ ΣΤΗΝ ΑΠΟΚΑΛΥΨΗ \n AWE AT THE REVELATION Simply knowing that you are in the same place where the soaring eagle of Revelation, Saint John the Theologian, saw the vision of the Revelation, heard the voice of the Triune God, and saw Jesus Christ in another form, shakes you to your core. The hieromonk who guided our tour brought tears to our eyes. He truly transported us so vividly back to those times. Thank you on behalf of my 54 companions. Archimandrite Theocletus Raptis. 31-5-2018","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"relays","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'shakes you to your core', 'tears'; 'Triune God', 'soaring eagle of Revelation' = mystical/doctrinal; hieromonk relays"}},"160":{"id":160,"site":"cave","plat":"tripadvisor","rating":"4","text":"Humbling experience \n Humbling experience We are Christians, and I found it a place of simplicity and quiet which enabled deep thought. I found the experience humbling.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","religious_self_id":"christian_general","austerity_register":"appreciative","review_is_useful":1,"coding_notes":"'We are Christians' explicit first-person plural Christian self-ID; 'simplicity' = austerity appreciative","atmospheric_register":1}},"161":{"id":161,"site":"cave","plat":"tripadvisor","rating":"5","text":"Δέος \n Awe Just being in a place where a holy man who lived and touched Jesus existed fills you with awe.\nOtherwise, beautiful surroundings.","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","review_is_useful":1}},"163":{"id":163,"site":"cave","plat":"tripadvisor","rating":"4","text":"Sadly, They don't allow pictures inside the Cave! \n Sadly, They don't allow pictures inside the Cave! They say that this is the cave where John the Revelator wrote the Book of Revelation.  There is a fissure in the rock where three cracks come together which they represent the Holy Trinity.","codes":{"religious_register":["doctrinal"],"mediation":"relays","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'They say' relays; 'Sadly' frustrated about photo rule","topography_register":1}},"164":{"id":164,"site":"cave","plat":"tripadvisor","rating":"5","text":"Τριημερο του Αγίου Πνεύματος με γκρουπ \n Holy Spirit weekend with a group It is certain that when you go to Patmos, you will visit it!! You feel a deep sense of reverence..! I didn't enjoy it as much as a guided tour because at that time there was also a service going on, so there were a lot of people and the monk couldn't come over at the same time to speak..! Of course, you felt the psalms differently inside the cave! So it's a good idea to go at a time when there's no service! You'll enjoy it more!","codes":{"religious_register":["conventional"],"sensory_modalities":["sound"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'felt the psalms differently inside the cave' = sound modality","atmospheric_register":1}},"165":{"id":165,"site":"cave","plat":"tripadvisor","rating":"5","text":"Actual Site Where Apostle John Wrote the Book of Revelations \n Actual Site Where Apostle John Wrote the Book of Revelations Apostle John was exiled to Patmos in his old age - and spent his days in this cave. It was here, that John had a revelation - and where he dictated the Book of Revelations to his scribe. You can see the notch in the cave wall where the Book of Revelations was written - Holy and historic place. A monastery was built on tip of the site.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'notch in the cave wall where the Book...was written' specific vision","acknowledges_historical_cultural":1,"topography_register":1}},"167":{"id":167,"site":"cave","plat":"tripadvisor","rating":"5","text":"Setzen sie sich.... \n Sit down.... ...and let the grotto wash over you....\nOnly then can you truly grasp the magic of this place..\nHere too my usual recommendation....Early in the morning or late in the evening, that is, before or after the tourist crowds...","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'magic of this place' mystical; 'wash over you' embodied","topography_register":1,"on_site_movement":["posture_pause"]}},"169":{"id":169,"site":"cave","plat":"tripadvisor","rating":"4","text":"黙示録を書いた洞窟 \n The cave where the Book of Revelation was written This is the place where Saint John received divine revelation and wrote the Book of Revelation in the cave, located on a slope between the port and the Monastery of Saint John. The cave where John spent his time has been made into a small church. On the rock face, three cracks formed by the voice of God and the place where Saint John lay down remain.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"located on a slope between the port and the Monastery","religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","review_is_useful":1,"coding_notes":"'three cracks formed by the voice of God' narrated in own voice","topography_register":1}},"170":{"id":170,"site":"cave","plat":"tripadvisor","rating":"5","text":"Read/lire \n Read/lire A great place to read the first chapter of Revelation and be immerge in this grandiose vision!\nQuel bel endroit pour lire le premier chapitre de l'Apocalypse et s'immerger dans cette vision magnifique !","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1,"coding_notes":"reads Revelation in cave-of-Revelation = enacted scriptural reenactment"}},"171":{"id":171,"site":"cave","plat":"tripadvisor","rating":"5","text":"Indrukwekkend \n Impressive This is apparently where the revelations were written down by John the Theologian. The cave where he did this is original, but a kind of church has been built onto it. Admission was free and it was very quiet in April.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'apparently' hedges; April quiet"}},"172":{"id":172,"site":"cave","plat":"tripadvisor","rating":"5","text":"Wonderful \n Wonderful Such an experience, would highly recommend. There was a priest there who explained everything even. He also took items I bought as souvenir and blessed them with holy water. The cave was pretty easy to get to, and when I was there I was the only tourist.","codes":{"religious_register":["conventional"],"mediation":"relays","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"priest blesses souvenirs with holy water = active institution","devotional_participation":1}},"173":{"id":173,"site":"cave","plat":"tripadvisor","rating":"4","text":"Religioso \n Religious A cave where, according to the guides, the revelations of the Book of Revelation were revealed to the Apostle John. A cramped place, full of tourists and religious visitors from around the world, squeezing in to see where the apostle slept, rested his head, his arm, etc. For some, a pilgrimage; for others, just curiosity.","codes":{"religious_register":["doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'according to the guides' relays; 'For some, a pilgrimage; for others, just curiosity' meta-observation","sensory_modalities":["embodied"],"topography_register":1,"on_site_movement":["accessibility_concern"]}},"174":{"id":174,"site":"cave","plat":"tripadvisor","rating":"4","text":"Impressive although tarted up for tourists \n Impressive although tarted up for tourists You are gently herded through.  Hard to believe the story as presented but interesting to see.  You enter a building but then wind downward through the area St John supposedly occupied.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","enclosure_exposure":"enclosed","tourist_mode":"tourist_consumer","facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'supposedly' + 'hard to believe' + 'tarted up' → doubts/consumer (codebook example C)","on_site_movement":["walking_around"]}},"176":{"id":176,"site":"cave","plat":"tripadvisor","rating":"5","text":"Ευλογία \n Blessing It was a lifelong dream come true. It is a miracle what you feel when you walk down the steps to enter the cave. There are no words when you see where Saint John the Theologian slept, and from which point the rock split and the word of God was revealed to him. A symbol of faith and hope.","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'lifelong dream come true' sought-language; 'miracle what you feel'","topography_register":1,"on_site_movement":["stairs_down"]}},"178":{"id":178,"site":"cave","plat":"tripadvisor","rating":"5","text":"Βαθειά κατάνυξη... \n Deep reverence... Words are too poor to describe the experience... Awe and religious reverence overtake you as you enter the cave. It would be good to have read up on the basics beforehand. A priest does offer visitors the basic historical and religious information about Patmos, the cave, and the life of Saint John the Theologian on the island. It is perched on the mountainside below Chora and the Monastery and offers a beautiful view. Also wonderful is the walking historical trail through nature along the picturesque medieval path that connects Skala with Chora. A unique and unforgettable experience is visiting the Cave of the Apocalypse (except for atheists or those of other faiths).","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"perched on the mountainside below Chora and the Monastery","religious_register":["conventional","doctrinal"],"mediation":"relays","sensory_modalities":["vision"],"enclosure_exposure":"both","worth_assessment":"worth_it","nature_mention":1,"recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'except for atheists or those of other faiths' exclusionary insider stance — held to unspecified self-ID","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"mentioned"}},"180":{"id":180,"site":"cave","plat":"tripadvisor","rating":"5","text":"Holy and magical \n Holy and magical The irresistible magic of Patmos leave one with a feeling of “I love this place and want to come back, again”.  from the moment you come into the harbour - the stone architecture and white homes rising up the slopes and then the sight of the castle - wow.......\nExceptionally clean given thousands of tourists there daily.\nFollowing day hired a car from one of the port agents and drive up to Chora - to the castle.   Leave car below and take the many steps to the entrance - although very hot the sight that awaits is glorious - white washed walls - Aegean blue painted doors and windows, beautiful hand crotcheded curtains over windows \nAnd pots of basil on ledges and doorways.   Climb up more until we get to the top - hundreds of people wandering the courtyards and seeing the various exhibits, the view,\nthe bearded black robed priests/ monks and magnificent turrets and bells.   Too much to take in.......\nCastle lit up at night looks amazing as well\nLots of eclisiastical items for sale as well as jewellery, art and souvenirs \nExplore all the different tunnels the museum housing many religious artifacts - \nBeautifully maintained and definitely a jewel in the crown for Patmos\nPhotos don’t do the place enough justice-but stir up the desire to get there.\nafter time spent at Venetian castle - which I might add reminds me somewhat of Rhodes  - time to go down y to the Cave of the Apocalypse  - where the theologian wrote the book of revelations\nWe decided to walk the 4-5 km road down -  seemed like a good idea at the time - but stupidly had not taken bottled water so that by the time we got there we were quite dehydrated.\nCave is in a forested area - beautifully maintained grounds and on the day we could hear music coming from the amphitheatre close by.\nThe passage way to the cave - white and when at the actual spot where the remains of St John  - a place to light candle, pray, admire and contemplate as church service is broadcast through the speakers\nVery tight space but cool and so so quiet and peaceful\nSo glad I was fortunate enough to go to Patmos and see the wonders of orthodoxy.","codes":{"visit_season":"off_peak_nov_mar","elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"stone architecture and white homes rising up the slopes","religious_register":["conventional","mystical","doctrinal"],"effort_valence":"ambivalent","worth_assessment":"worth_it","sensory_modalities":["vision","sound","touch_temperature","embodied"],"enclosure_exposure":"both","nature_mention":1,"nature_sub_codes":["flora_fauna"],"mimetic":1,"mimetic_engagement":"enacted","recognizes_active_institution":1,"weather_complaints":["heat","sun_exposure"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'magical'/'magic' mystical; candle-lighting + prayer = devotional_contact; contemplates at sacred spot = enacted mimetic","devotional_participation":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"walked","on_site_movement":["accessibility_concern","posture_pause","stairs_up","walking_around"]}},"181":{"id":181,"site":"cave","plat":"tripadvisor","rating":"5","text":"Η καρδιά της Πάτμου \n The heart of Patmos In contrast to the Monastery of Saint John the Theologian, at the Cave we were welcomed by a truly humble and approachable monk, willing to speak and converse with us. The space built around the Cave is beautiful, and the Cave itself exudes a sense of awe and reverence. If you don't go there, you haven't truly been to Patmos.","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"contrast w/ Monastery monks via humble cave-monk = institutional-aware","atmospheric_register":1}},"182":{"id":182,"site":"cave","plat":"tripadvisor","rating":"4","text":"Interesting Historical Sight \n Interesting Historical Sight Historians now believe the person responsible for the works attributed to John never visited this cave, but that doesn't make it any less fascinating.\nYou can walk up here in under an hour, but it's steep, and in Summer hot, and the local taxi drivers do quite a good deal of 20 Euro a head (bargain them down when they are not as in demand as they were on the day our cruise visited.)\nThey will drive you to the cave, return 30 minutes later (all you need) and then take you to the monastery and Chora and return then when you request (we made it 90 minutes which was enough to see the monastery and enjoy a coffee nearby). They don't collect the fee until they have you back in Skala, so they won't leave you stranded.\nThe cave is tiny, and decorated as a small church - no photos inside, say the signs but it's interest to follow in the paths of so many pilgrims and gaze at the crack in the ceiling.\nThe cave is a strange mix of pilgrimmage and tourism - a priest conducting a service in the corner whilst tourists wander in and out, so you may have to wait if you want to have some time for a quiet prayer or moment of reflection.\nWell worth a visit, and there is a small shop at the entrance if you want postcards and more information.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","tourist_mode":"institutional_aware","visit_season":"peak_may_aug","religious_register":["doctrinal"],"mediation":"doubts","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","weather_complaints":["heat"],"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"motivation_cruise_thing_to_see":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Historians now believe...never visited' doubts; 'strange mix of pilgrimmage and tourism' meta-aware","acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"motorized"}},"183":{"id":183,"site":"cave","plat":"tripadvisor","rating":"5","text":"Humbling. \n Humbling. This is believed to be the cave to which St John had been exiled and where he wrote the book of Revelation.  It was for this reason that I came to Patmos.  On my one day here it was fortunate to be a Sunday and there was a service happening at the time.  Even though I couldn't understand what was being said it was a humbling experience to be present in such an historic and important site.  Photos inside were not permitted.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","motivation_religious":1,"recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'It was for this reason that I came to Patmos' first-person sought-language","devotional_participation":1,"acknowledges_historical_cultural":1}},"184":{"id":184,"site":"cave","plat":"tripadvisor","rating":"5","text":"요한의 동굴 \n Cave of John When you go inside the cave, it is the place where the Apostle John prayed and it is also related to the Book of Revelation.\nInside the cave there are chairs to sit on and explanations about the place are provided.\nIt is located below the Monastery of Saint John.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1}},"185":{"id":185,"site":"cave","plat":"tripadvisor","rating":"5","text":"Lugar sagrado \n Sacred place This is the cave where Saint John had the vision of the Book of Revelation, the Apocalypse. For those who profess the Catholic faith, both Orthodox and Roman, it is a unique feeling to be in the place where this extraordinary chapter occurred — one that was recorded as the last book of Holy Scripture.\nThe place is located at the lower part of the monastery; we went on a cruise tour and they took us by the monastery bus to the cave, so it's not that close. Some people were walking because coming from the monastery it's downhill.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'For those who profess the Catholic faith' addresses but not first-person — held unspecified","descent_mode":"motorized"}},"186":{"id":186,"site":"cave","plat":"tripadvisor","rating":"5","text":"Raccomando una guida \n I recommend a guide In Patmos, there are two monasteries that are a must-visit: the one of Saint John in Chora and the lower one known as the Apocalypse monastery, because according to tradition it was in the grotto incorporated within it that Saint John dictated to his disciple Prochoros the vision of the Apocalypse. To avoid half-disappointments or unanswered questions, it is strongly advisable to join an organized tour with a good local guide. I have been there twice, in 2004 and this year, and on the second occasion the emotions were perhaps even greater than the first! The place is cramped and if there are large groups, arm yourself with plenty of patience. Finally, let us never forget that we are in a sacred place, and indeed in 1983 the entire Patmos was declared a \"Sacred Island\" by the Greek Parliament.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"hedges","sensory_modalities":["embodied"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_heritage_protection":1,"facility_complaints":["crowding"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'according to tradition' hedges; 'Sacred Island' parliamentary declaration = formal heritage protection","acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["accessibility_concern"]}},"187":{"id":187,"site":"cave","plat":"tripadvisor","rating":"4","text":"Paul Wrote Revelation Here \n Paul Wrote Revelation Here This is where Paul supposedly had his dream and wrote the Revelation in this cave.  It's very touristy now and turned into a chapel as well but still worth a visit.","codes":{"tourist_mode":"tourist_consumer","religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"factual error: confuses Paul/John; 'supposedly' hedges; 'very touristy now' consumer-frame"}},"188":{"id":188,"site":"cave","plat":"tripadvisor","rating":"5","text":"simbólica \n symbolic a small grotto where, supposedly, the book of Revelation was revealed to Saint John the Evangelist. I recommend going with a guide, so we can enjoy all the interesting details. intense, emotionally and spiritually...","codes":{"religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'supposedly' hedges; 'intense, emotionally and spiritually' embodied","topography_register":1}},"189":{"id":189,"site":"cave","plat":"tripadvisor","rating":"5","text":"Must \n Must This is the most positive place in Greece. Is a gate. To paradise for the believers , to other dimensions for the spirituals. A place where your heart is open along with the skies.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'gate to paradise/other dimensions' mystical"}},"192":{"id":192,"site":"cave","plat":"tripadvisor","rating":"2","text":"Niente di che \n Nothing special Quite disappointing if you're not burning with mystical fire. A small cave with a very lovely view that must have at least delighted Saint John.\nThe visit might last only 5 minutes.\nYou pay 2 euros to see a cellar decorated with sacred icons.\nBut the guide speaks only Greek, so you won't learn anything that might make this attraction worthwhile. And if you happen to arrive when one of those cumbersome cruise tour groups rolls in — moving in hordes of 20 or 30 — the cave becomes overcrowded and not enjoyable at all.","codes":{"tourist_mode":"tourist_consumer","religious_register":["doctrinal"],"worth_assessment":"not_worth_it","enclosure_exposure":"enclosed","facility_complaints":["crowding","signage"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'not burning with mystical fire' implicit disavowal; '5 minute' duration; 'pay 2 euros to see a cellar' consumer-frame","view_centrality":"mentioned"}},"193":{"id":193,"site":"cave","plat":"tripadvisor","rating":"5","text":"Christian shrine \n Christian shrine A orthodox greek shrine, actually a christian shrine, in a beatiful location, half way to the monastery of St John. Silent and inspiring.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"atmospheric_register":1}},"196":{"id":196,"site":"cave","plat":"tripadvisor","rating":"3","text":"Not very Holy tourists \n Not very Holy tourists Beautiful Orthadox shrine,but typical of heavily touristed areas,it was busy,noisy(clicking annoying photograph bores).\nThe Orthadox priest was having a nightmare trying to control guided tourists.Definately not conducive to quiet reflection and contemplation in one of the most poignant sites in the whole of Christianity !!!.It was a great pity as I wanted to take in the enormity anf significance of this epochal place.All I could experience was people too busy bumping,whispering loudly, blocking,and being down right rude to appreciate this beautiful place.We came especially on boat and stayed a night to experience this place.","codes":{"trip_mode":"overnight","tourist_mode":"institutional_aware","religious_register":["conventional","doctrinal"],"worth_assessment":"mixed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","motivation_religious":1,"recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'came especially on boat and stayed a night to experience this' sought + overnight; 'whole of Christianity' insider stance","acknowledges_historical_cultural":1}},"197":{"id":197,"site":"cave","plat":"tripadvisor","rating":"5","text":"En toute simplicité... \n In all simplicity... The grotto is small and that's a good thing. It reflects the vow of poverty as well as the simple living conditions that should be those of all representatives of the Catholic Church. What disappoints me is the decadence of the Vatican with its sumptuous palaces (I use the word \"palaces\" because beneath their religious facade, that is ultimately what these buildings are). The Grotto of Saint John is the complete opposite and therefore all the more admirable. There is a feeling of serenity there. I recommend it to all sensitive souls, believer or not.","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","austerity_register":"appreciative","review_is_useful":1,"coding_notes":"'vow of poverty', 'simple living conditions' = austerity appreciative; criticizes Vatican from Catholic-implied stance — held unspecified","topography_register":1}},"198":{"id":198,"site":"cave","plat":"tripadvisor","rating":"4","text":"must see \n must see — you can't skip it. Come down via the Aporthianou Road from Chora toward Skala and you'll find it along the way. You're filled with awe just seeing how it has withstood the ravages of time. A well-maintained place, and there's a priest there who explains the event of the Revelation to visitors. The cave is literally inside the mountain and a small chapel has been built on top of it. Check the opening hours before you go.","codes":{"religious_register":["doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"199":{"id":199,"site":"cave","plat":"tripadvisor","rating":"5","text":"Beautiful \n Beautiful The Cave of the Apocalypse is such a moving and meaningful destination that must be seen.  The serenity and reverend space is calming and the history of the cave beautiful.  A must do- you can comfortably visit the Cave and Monastery together.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1}},"200":{"id":200,"site":"cave","plat":"tripadvisor","rating":"2","text":"Interesting \n Interesting Definitely an intere sting site but it was disappointing to see tht the empmoyess were taking the candles right after you lid thm and  make the wish . Thy put it out and put candles back on sale for next tourists. A holy spot whch became highly commercial.. pitty","codes":{"tourist_mode":"tourist_consumer","worth_assessment":"not_worth_it","devotional_contact":1,"facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'after you lid them and make the wish' = devotional_contact; candles 'put back on sale' = commerce/decorum offense"}},"201":{"id":201,"site":"cave","plat":"tripadvisor","rating":"5","text":"Incontournable à Patmos. \n A must-see in Patmos. Just to be able to say: I've been there. A mythical site of Christianity. The cave where the Apocalypse was written is absolutely a must-see in Patmos.","codes":{"tourist_mode":"tourist_consumer","religious_register":["doctrinal"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'Just to be able to say I've been there' consumer-checkmark frame"}},"206":{"id":206,"site":"cave","plat":"tripadvisor","rating":"5","text":"Σπήλαιο τής Αποκάλυψης \n Cave of the Apocalypse. The Cave of the Apocalypse, as it is called today, is one of the most historic and beautiful in Greece. It is located midway along the road that leads from Chora to Skala. In front of the entrance to the cave stands the Church of Saint Anne!! Inside, the cave shows us the spot where Saint John the Theologian was kept. It is worth visiting and hearing the story from the monks!!!","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1}},"208":{"id":208,"site":"cave","plat":"tripadvisor","rating":"4","text":"Un giretto \n A quick visit. If you're on Patmos, a visit to the cave is a must!!! Obviously if you're a believer... We went one early morning and had the luck of witnessing part of a mass!!!! A mystical place that captivates you!!!","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'mystical place'; mass attendance","devotional_participation":1}},"209":{"id":209,"site":"cave","plat":"tripadvisor","rating":"5","text":"Ανυπέρβλητο προσκύνημα... \n An unsurpassable pilgrimage... Emotion, chills, awe, love, jubilation — in a unique place of Divine Manifestation — reverence, veneration, prayer, blessings to all, and wishes that everyone may find themselves in this cave of holiness...","codes":{"religious_register":["conventional","doctrinal","mystical"],"worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'unsurpassable pilgrimage' = motivation; chills/awe/jubilation embodied; 'prayer, blessings to all' = enacted"}},"211":{"id":211,"site":"cave","plat":"tripadvisor","rating":"5","text":"Πολύ ωραίο ! \n Very nice! Worth the effort to visit. It's located just before the Monastery, going up from Skala. It is a small cave with frescoes inside, where John wrote the Book of Revelation.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["doctrinal"],"effort_valence":"positive","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","review_is_useful":1,"coding_notes":"'frescoes inside' specific vision"}},"214":{"id":214,"site":"cave","plat":"tripadvisor","rating":"3","text":"Une grotte sombre... \n A dark cave... This is where Saint John, exiled by the Roman emperor Domitian, is said to have written the Book of Revelation. The outline of the sanctuary and the entrance area with some beautiful icons are promising — alas, you only visit a cave, very poorly lit... Disappointing, especially for those who walk the path from Skala or Chora on foot...","codes":{"ascent_mode":"walked","religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"not_worth_it","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","facility_complaints":["amenities"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'is said to have' hedges; 'very poorly lit' = amenities","acknowledges_historical_cultural":1}},"215":{"id":215,"site":"cave","plat":"tripadvisor","rating":"5","text":"Magique \n Magical. We had the luck of being alone and the emotion is total. An absolute must to discover with no one else around.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'magical'; 'emotion is total'"}},"216":{"id":216,"site":"cave","plat":"tripadvisor","rating":"5","text":"Lieu de prière et d'énergie \n A place of prayer and energy. A place of peace.\nThis is where the Saint withdrew, heard the voice of God, and wrote the Book of Revelation (Bible).\nSaint John remained as a hermit for 16 months. This cave is now a chapel and has been listed along with the monastery as a UNESCO World Heritage Site since 1999.","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_heritage_protection":1,"review_is_useful":1,"coding_notes":"'place of energy' mystical; UNESCO 1999 explicit","acknowledges_historical_cultural":1,"energy_register":1}},"218":{"id":218,"site":"cave","plat":"tripadvisor","rating":"3","text":"Lieu sacré ⛪ \n Sacred place ⛪ If you are in Patmos, you can go visit the cave for just €2. The place has a calm and sacred atmosphere. The visit is quick and given the few monuments to visit in Patmos, it's interesting to go, but it's far from being a must-see.","codes":{"religious_register":["conventional"],"worth_assessment":"mixed","review_is_useful":1,"atmospheric_register":1}},"219":{"id":219,"site":"cave","plat":"tripadvisor","rating":"1","text":"Solo para devotos \n Only for the devout. €2 per ticket catering to cruise ship tourists. Taxi service — some drivers very rude — acts as a bus line going up and down for a supposed €30, plus €6 for tickets. I would advise negotiating a price just to go up (€10) and walking back down. We didn't go up to the monastery because it seemed like a bit of a rip-off.\nIf you're a devout believer it might be worthwhile, but only in that case.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","tourist_mode":"tourist_consumer","worth_assessment":"not_worth_it","facility_complaints":["prices"],"tone_toward_constraints":"dismissive","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'rip-off'; 'If you're a devout believer it might be worthwhile' soft disavowal — held unspecified","descent_mode":"walked"}},"221":{"id":221,"site":"cave","plat":"tripadvisor","rating":"4","text":"HISTORICO \n HISTORIC. It's halfway up the mountain on the way to the monastery. The entrance fee is 2 euros. It's a small cave adorned with religious objects, and you can walk through it in 30 minutes. It's a different kind of experience, since this is where the revelation of the Apocalypse is attributed to the apostle Saint John. The taxi charges 30 euros round trip for 4 people and includes a visit to the monastery.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"halfway up the mountain on the way to the monastery","religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'attributed to the apostle Saint John' hedges","topography_register":1,"descent_mode":"motorized"}},"222":{"id":222,"site":"cave","plat":"tripadvisor","rating":"4","text":"vacanze estive \n Summer vacation — spiritual and mystical.\nIn the church we found an Orthodox nun completely caught up in ecstasy and absolutely indifferent to the movement of visitors.\nA must-see.","codes":{"visit_season":"peak_may_aug","religious_register":["mystical"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"Orthodox nun in 'ecstasy' = mystical observation; summer vacation"}},"225":{"id":225,"site":"cave","plat":"tripadvisor","rating":"5","text":"Incredible Experience \n Incredible Experience This is a very unassuming Church.  If not for the UNESCO Heritage signs, the simple iron gates at the bend of a hairpin turn are easily missed.  \n\nWe attended an early morning festival prayer session.  The Cave is at the end of a wide and winding path, again through a modest entrance.  Once inside we had a beautiful service attended by the devoted local parishioners as part of their daily devotion.  The service is Greek Orthodox, and beautiful.\n\nThe Church itself is indeed built into the cave.  Reverence to the cave shelf where John slept as well as the opening in the rock where he heart the words of God are preserved virtually untouched.  Traditional alters and artwork are part of the charm, again preserving the reverence of the cave.  You can clearly see the soot left by centuries of burning torches and candles on the ceilings and walls.  The bare minimum has been done to allow safe religious services, as well as accommodating your groups.\n\nIn all, an excellent accommodation has been accomplished.  Unlike the Monastery, photos are allowed without flash.  Very pleasant experiences with the local parishioners and staff.  Holy water provided upon request.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"recognizes_heritage_protection":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"UNESCO Heritage signs explicit; 'soot left by centuries of burning torches' specific vision; festival prayer service","devotional_participation":1,"acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["posture_pause","walking_around"]}},"227":{"id":227,"site":"cave","plat":"tripadvisor","rating":"3","text":"Molto rinomato ma poco da vedere... \n Very renowned but not much to see... The sanctuary has been built over the cave; you can feel the mysticism, but I recommend it mainly to believers.","codes":{"religious_register":["mystical"],"worth_assessment":"mixed","review_is_useful":1,"coding_notes":"'feel the mysticism'; 'recommend mainly to believers' soft generic"}},"228":{"id":228,"site":"cave","plat":"tripadvisor","rating":"3","text":"黙示録とは？ \n What is the Book of Revelation? We visited as part of an Aegean cruise excursion on Patmos Island, bundled with a trip to the monastery.\n\nIt's in a location that seems nearly impossible to walk to from the port.\n\nThere's a cave said to be where Saint John lay down, and a hollow said to be where he rested his head, but it's hard to believe he actually slept with his head in such a place. It must be something legendary.\nSince non-Christians may not even know who Saint John is, I think it's a place that won't resonate much with Japanese visitors. I was more excited about being able to see our \"home\" (the ship) from the hillside path along the way.\n\nPerhaps it's the equivalent of the place where Kobo Daishi attained enlightenment?","codes":{"trip_mode":"cruise_excursion","elevation_mention":1,"town_hill_contrast":1,"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"mixed","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'hard to believe he actually slept', 'must be something legendary' doubts; ship-from-hillside more exciting","topography_register":1,"view_centrality":"mentioned"}},"229":{"id":229,"site":"cave","plat":"tripadvisor","rating":"5","text":"Vale a pena a caminhada \n Worth the walk. A place with an incredible view and a very important history for all of us. It is possible to walk from the port; however, it's good to know it is a steep and tiring climb. Photography is not allowed inside.","codes":{"ascent_mode":"walked","elevation_mention":1,"effort_valence":"positive","worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"sensory_modalities":["embodied"],"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"central"}},"230":{"id":230,"site":"cave","plat":"tripadvisor","rating":"5","text":"Για όσους πιστεύουν \n For those who believe. If you are not Christians, know that you are visiting a place of faith.\nIt is not a tourist attraction. It is not an impressive cave or anything like that.\nUse the ticket money to buy ice cream instead.\n\nIf you are a believer — Christian or not — go visit it.\n\nThe crowds don't help with the solemnity... Perhaps visit at a time of year with fewer people.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'If you are not Christians' addresses but not first-person — held unspecified"}},"231":{"id":231,"site":"cave","plat":"tripadvisor","rating":"5","text":"Κατάνυξη!!!! \n Solemnity!!!! In a beautiful setting roughly halfway along the route between Skala and Chora on Patmos lies the monastery with the Cave of the Apocalypse.\nSolemnity, inner peace, tranquility.","codes":{"town_hill_contrast":1,"worth_assessment":"worth_it","review_is_useful":1,"atmospheric_register":1}},"232":{"id":232,"site":"cave","plat":"tripadvisor","rating":"5","text":"Miracle....!!! \n Miracle....!!! A holy point with deep history that is worth seeing from near. It is considered to be a universal symbol of Christianity. The inside of it causes a deed. Also has beautiful view.. don't miss it","codes":{"religious_register":["doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"mentioned"}},"236":{"id":236,"site":"cave","plat":"tripadvisor","rating":"3","text":"Lieu sacré mais peu de choses à voir \n Sacred place but not much to see On our way back from our visit to the upper town of Hora via a pleasant trail, we stopped at the Cave of the Apocalypse ; €2.00 per person ; but we were a little disappointed because on one hand, you can only visit the lower part of the monastery, the chapels that are shown on a map at the entrance are inaccessible ; and on the other hand, the cave itself is only a small excavation, a small rocky shelter in which you can make out a kind of notch (which, according to tradition, and what the guide says, is the place where God spoke to Saint John) ; there is also a small hollow in the rock where that same Saint John rested his head ! Mystic or believer, it's hard to find it interesting. Only the cool air of the place, the silence, the quiet contemplation of a few worshippers, and two or three icons can justify a stop during a hike.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","sensory_modalities":["touch_temperature"],"enclosure_exposure":"enclosed","worth_assessment":"mixed","facility_complaints":["area_access"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'chapels...inaccessible' v1.1 area_access; 'cool air of the place' = touch_temperature","atmospheric_register":1,"topography_register":1,"descent_mode":"walked"}},"238":{"id":238,"site":"cave","plat":"tripadvisor","rating":"4","text":"Mistico \n Mystical For those who believe, it's a destination not to be missed. It's sad to see how the Orthodox priests who are custodians of the place have transformed it from a place of faith into a place to generate profit.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"240":{"id":240,"site":"cave","plat":"tripadvisor","rating":"3","text":"Para creyentes \n For believers It was one of the places we visited during the cruise stop on the island of Patmos; you can book the excursion on board but by taxi it's much more affordable (we paid 40 euros for 5 people round trip to the cave and the monastery).\nInside the cave you cannot take photos. It's a visit that believers should not miss. The entrance fee is 2 euros.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'visit that believers should not miss' addresses but not first-person","descent_mode":"motorized"}},"241":{"id":241,"site":"cave","plat":"tripadvisor","rating":"5","text":"The great cave of St John \n The great cave of St John The site where St John wrote Revelation is small and could be very crowded, but we were fortunate to be alone in a small group. The cave is under a seminary and there is a small chapel directly in front of it. The place where St John slept and where he dictated is marked well. There are seats to sit, observe, and meditate. It is near the Monastery of St John, so do two things in one visit.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'seminary' active institution; meditation seats described as affordance not action"}},"242":{"id":242,"site":"cave","plat":"tripadvisor","rating":"5","text":"Αφωνος \n Speechless Just the idea of the writing of the Book of Revelation lights up your entire soul. I have no words except that it is a must to go!!!","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","review_is_useful":1}},"243":{"id":243,"site":"cave","plat":"tripadvisor","rating":"3","text":"ギリシャ正教徒の聖地 \n A sacred site of Greek Orthodoxy I visited as part of a guided optional tour from an Aegean Sea cruise ship stopping at Patmos. It is combined with a visit to the Monastery of Saint John. Those not on an optional tour were using taxis. Since it sits on a small hill, you can enjoy a beautiful view of the sea with the cruise ship floating on it and the white houses below. Inside the cave was a sacred place where Saint John is said to have heard the voice of God.","codes":{"trip_mode":"cruise_excursion","elevation_mention":1,"town_hill_contrast":1,"religious_register":["doctrinal"],"mediation":"hedges","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'sea with the cruise ship floating on it and white houses below' specific vision","topography_register":1,"view_centrality":"mentioned"}},"245":{"id":245,"site":"cave","plat":"tripadvisor","rating":"3","text":"いい運動 \n Good exercise This is the cave where John is said to have received his revelation and written the Book of Revelation.\nUnfortunately, photography is not allowed inside.\nIt is quite small.\n\nIt's less than a 30-minute walk one way from the port, uphill.\nHowever, there are two shortcut footpaths, so using them on the way down took about 15 minutes.\nThose who went all the way up to the monastery said the round trip on foot takes about 2 hours.","codes":{"ascent_mode":"walked","elevation_mention":1,"religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","worth_assessment":"mixed","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"frustrated","review_is_useful":1,"topography_register":1,"descent_mode":"walked"}},"248":{"id":248,"site":"cave","plat":"tripadvisor","rating":"5","text":"Tranquil, Historic \n Tranquil, Historic When we visited  no crowds and one can take one's time to savour the history - not especially St John the Evangelist, but of the religious edifice that has built up around the cave: peaceful.","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1}},"249":{"id":249,"site":"cave","plat":"tripadvisor","rating":"4","text":"Step back in history \n Step back in history This was a surreal experience being in a place which was lived in by one of the apostles, St. John, while he wrote the Book of Revelations. It is only a small area but there are various historical items to look at, but unfortunately no photography is allowed.I can only assume this is as a revenue raising exercise in them hoping you will purchase a book from the gift shop. Entrance fee was only about €4. I believe there is also a chapel there, but closed when we visited.","codes":{"tourist_mode":"tourist_consumer","religious_register":["doctrinal"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["photography_restrictions","commerce","area_access"],"tone_toward_constraints":"dismissive","review_is_useful":1,"coding_notes":"'revenue raising exercise...purchase a book from gift shop' cynical-consumer reading; 'chapel...closed' = area_access","acknowledges_historical_cultural":1}},"250":{"id":250,"site":"cave","plat":"tripadvisor","rating":"4","text":"Impressive \n Impressive It is very special to feel that we have touched the story if the bible and the book of revelations.  Good visit","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","review_is_useful":1}},"251":{"id":251,"site":"cave","plat":"tripadvisor","rating":"5","text":"По стопам Святого. \n In the Footsteps of the Saint. It's hard to describe the spiritual elation mixed with historical fascination that arises when visiting the complex built over the cave of Saint John the Theologian. The crack in the rock and the hollows in the stone wall. You look and wonder — are you worthy to touch these sacred objects, or can you only look and let your imagination carry you back two thousand years.","codes":{"religious_register":["doctrinal","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'are you worthy to touch these sacred objects' worthiness-question; 'spiritual elation' mystical","acknowledges_historical_cultural":1,"topography_register":1}},"252":{"id":252,"site":"cave","plat":"tripadvisor","rating":"5","text":"Moving Experience \n Moving Experience Visiting the cave during a Sunday worship service was an exceptional experience.  Authentic or not, it was worth the time.","codes":{"mediation":"doubts","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'Authentic or not, it was worth the time' explicit doubt-but-worth","devotional_participation":1}},"253":{"id":253,"site":"cave","plat":"tripadvisor","rating":"5","text":"Sacred ground \n Sacred ground As is typical in Europe, a chapel/church (or several!)  is built over places of religious significance. We were on a tour, so the bus took us up to the cave.  Otherwise, it would be a long walk unless you arrange transportation.  However, the cave is very inspiring.  The religious icons intrude on its historical value, but it is still a hallowed place. There wasn't time to stop and meditate and take it all in, as they were moving people through fairly quickly.  No pictures are allowed, but the view from the cave is quite inspiring!  You are reminded many times to be quiet and you should do so. The people of the island treasure this religious spot. Dress appropriately as for entering a house of worship.  No shorts and you may be required to remove your hat.  Ladies too.","codes":{"ascent_mode":"motorized","time_pressure":1,"religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'There wasn't time...moving people through fairly quickly' explicit time pressure","acknowledges_historical_cultural":1,"atmospheric_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"255":{"id":255,"site":"cave","plat":"tripadvisor","rating":"5","text":"Γαλήνη \n Tranquility in a sacred place where God delivered His word and visions to humanity.\nA place that every person, regardless of religion, must visit.","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","review_is_useful":1,"atmospheric_register":1}},"256":{"id":256,"site":"cave","plat":"tripadvisor","rating":"5","text":"Emocionante \n Emotional This is the kind of place that, for some people, is more than just a visit: it's a pilgrimage. That was my case, and I prepared for the visit the way a Muslim prepares to visit Mecca once in their lifetime. Emotional. Don't be disappointed to find that, in addition to the religious aspect, there is also a gift shop which, in a certain sense, will be useful if you want to bring back a souvenir from the place. It's worth noting that inside the cave, photography and filming are not allowed, which I agree with. Don't be alarmed thinking that the cave is at the top of the mountain. It's actually much lower down, and if you don't mind a short walk, take the opportunity to go singing your favorite religious songs. A great place to think about the future and pray for yourself and your loved ones. Tip: if you want to rent a car, motorcycle, or ATV, don't forget to bring your driver's license.","codes":{"ascent_mode":"walked","religious_register":["conventional","doctrinal"],"worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'pilgrimage. That was my case' explicit; Mecca-comparison; 'singing your favorite religious songs', 'pray for yourself' = enacted","devotional_participation":1}},"257":{"id":257,"site":"cave","plat":"tripadvisor","rating":"4","text":"聖ヨハネの洞窟 \n Saint John's Cave You can get there by walking from the port of Patmos through the center and heading toward the hill to the right. For those who visited by cruise ship, this makes for good exercise given the lack of activity on board. In summer it gets hot, so don't forget water and bring sunglasses and a hat to protect yourself from the sun. The path alternates between cobblestones and a road, but if you keep climbing you'll reach the monastery. Whether or not John truly received his revelation here is uncertain, but it wouldn't be surprising to gain some kind of enlightenment or insight in this austere environment. I think it's enough to simply feel the solemn atmosphere while you're there.","codes":{"ascent_mode":"walked","trip_mode":"cruise_excursion","visit_season":"peak_may_aug","elevation_mention":1,"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"worth_it","weather_complaints":["heat","sun_exposure"],"austerity_register":"appreciative","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'whether John truly received...is uncertain' doubts; 'austere environment' appreciative","atmospheric_register":1,"topography_register":1}},"258":{"id":258,"site":"cave","plat":"tripadvisor","rating":"5","text":"Μοναδικό Χριστιανικό Μνημείο \n A Unique Christian Monument The Cave is a unique experience for visitors. It has a distinctly Christian atmosphere — the way it is built, as well as its interior, are both remarkable.","codes":{"religious_register":["conventional","doctrinal"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1}},"259":{"id":259,"site":"cave","plat":"tripadvisor","rating":"4","text":"Worth Seeing \n Worth Seeing A little walk, very quite and peaceful. This cave itself is worth seeing, the monastery i enjoyed as well. Halfway up, they stop traffic, this view alone is worth a look. You walk the rest of the hill, its not a hard walk but nice to look in a few local shops on the way.","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"effort_valence":"positive","worth_assessment":"worth_it","review_is_useful":1,"atmospheric_register":1,"view_centrality":"mentioned"}},"260":{"id":260,"site":"cave","plat":"tripadvisor","rating":"5","text":"Ορθόδοξη μυσταγωγία \n Orthodox mystical experience An especially solemn place of great religious significance to Christianity — here, over the course of two years, the last gospel was written, the Book of Revelation of Saint John the Theologian, who had been exiled to Patmos by the Romans","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'Orthodox mystical experience' frame; doctrinal narration","acknowledges_historical_cultural":1,"atmospheric_register":1}},"261":{"id":261,"site":"cave","plat":"tripadvisor","rating":"5","text":"Worth Seeing even for the Non-Religious \n Worth Seeing even for the Non-Religious This site is worth seeing even if you are non-religious.  it is a very sacred place so the atmosphere is very serious but it is a very interesting site to visit.  we enjoyed visiting this site built into the cave on the side of the hill.  very interesting.","codes":{"town_hill_contrast":1,"religious_register":["conventional"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"atmospheric_register":1,"topography_regis
