 for your loved ones.  However, I noticed that all the candles that had been lit were roughly removed and blown out. You are expected to show respect for their faith, but showing respect for your loved ones in this way is apparently out of the question..Afterwards we went to the monastery, which gave us an uneasy feeling. We then joined guide Ruud . We were rushed through the village in 10 minutes to a restaurant where we did eat well. We had expected more.  With all the extra costs added on, you end up spending 200 euros for 2 people.  This was the worst excursion we have ever done in Greece.","codes":{"tourist_mode":"tourist_consumer","visit_season":"peak_may_aug","religious_register":["conventional"],"mediation":"doubts","worth_assessment":"not_worth_it","facility_complaints":["crowding","commerce","prices"],"tone_toward_constraints":"dismissive","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'tourist trap'; candles 'roughly removed and blown out' = ritual practice read as offense","devotional_contact":1,"devotional_participation":1,"on_site_movement":["walking_around"]}},"592":{"id":592,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Το καστρομοναστήρι του Αιγαίου! \n The castle-monastery of the Aegean! A monastery dedicated to Saint John the Theologian. Located in Chora and stands out from every vantage point! Inside the castle are the monastery, the museum, and the monks' cells. It is worth a visit!","codes":{"elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1}},"593":{"id":593,"site":"monastery","plat":"tripadvisor","rating":"4","text":"キリスト教の聖地 \n A Christian holy site We stopped at the island of Patmos on an Aegean Sea cruise. The excursion tour guide was Dutch, speaking carefully and with passionate enthusiasm — I believe he was a devout Christian. There were many tour participants, but it was a calm and solemn sightseeing experience. On the bus back, a monk rode with us partway, which made me truly feel that we were in a Christian holy land.","codes":{"trip_mode":"cruise_excursion","ascent_mode":"motorized","religious_register":["conventional"],"mediation":"relays","recognizes_active_institution":1,"motivation_cruise_thing_to_see":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"monk rode the bus partway — 'felt we were in a Christian holy land'","descent_mode":"motorized"}},"595":{"id":595,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Η Ιερουσαλήμ του Αιγαίου \n The Jerusalem of the Aegean An imposing monastery that resembles a castle at the highest point of the village!  The décor is impressive and the view is magical!! Well worth a visit!!","codes":{"elevation_mention":1,"religious_register":["conventional","mystical"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"596":{"id":596,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Interesting Place \n Interesting Place The monastery is very nice and has a fantastic collection of religious artefacts. The chapel and frescoes are also very nice - it is well worth seeing when you’re on Patmos.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"review_is_useful":1}},"597":{"id":597,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Indrukwekkend \n Impressive A highlight of our most recent trip to Greece.\nThe realization that the last book of the Bible was written here.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","review_is_useful":1,"coding_notes":"asserts Bible's last book written at monastery (geog. wrong)"}},"598":{"id":598,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Visit in the morning - stunning monastry \n Visit in the morning - stunning monastry We got the 7.45 bus from Patmos to visit and arrived just as the monastry was being opened and had the place to ourselves.  It is a beautiful monastry and the views are so impressive.","codes":{"ascent_mode":"motorized","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"599":{"id":599,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Görülmeye Değer \n Worth Seeing It is located at a point that dominates Patmos from above. You can get quite close by car. There is a slight incline at the end. There is a church and a museum. There are souvenir shops.","codes":{"ascent_mode":"motorized","elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"601":{"id":601,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Partiellement visible \n Partially visible We went to visit the monastery. Unfortunately, the visible areas are few, and the museum was closed. We are a little disappointed, but the visit (free of charge) is still worth a look.","codes":{"religious_register":["conventional"],"worth_assessment":"mixed","facility_complaints":["area_access","access_hours"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"602":{"id":602,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Exotic place \n Exotic place The monastety is impressive with its architecture and has a great view to the island and nearby Islanda.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"603":{"id":603,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Um   Mosteiro  em  honra  do  Apóstolo  São  João!!! \n A   Monastery  in  honor  of  the  Apostle  Saint  John!!! Since    SAINT  JOHN  lived   in  exile   there   for   almost  two  years,   there  are  many   references   to  him ,  like  this   Monastery.  The  cave  where  he  lived  is  nearby!!!","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","review_is_useful":1}},"605":{"id":605,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Sehr schönes Kloster, wirklich beeindruckend. \n Very beautiful monastery, truly impressive. The monastery is truly imposing and offers a nice little museum to look around in. The fathers are constantly being asked by tourists for photos and the like, which I imagine must be annoying, but they seemed nice and patient.","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"607":{"id":607,"site":"monastery","plat":"tripadvisor","rating":"5","text":"La visite incontournable à faire à Patmos \n The must-see visit on Patmos This monastery, which dominates the island of Patmos and is visible from many places on the island, has the architecture of a true fortress. An interesting visit to the chapel museum and courtyards, and a breathtaking view of Skala Bay.\nOpen every day in the morning until 1:30 PM, and only 2 or 3 days a week (Tuesday and Saturday) in the late afternoon from 4 PM to 7 PM","codes":{"elevation_mention":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"608":{"id":608,"site":"monastery","plat":"tripadvisor","rating":"5","text":"ΟΙ ΑΓΙΟΙ ΤΟΠΟΙ ΤΟΥ ΑΙΓΑΙΟΥ \n THE HOLY SITES OF THE AEGEAN The experience of the pilgrimage to the castle-monastery of Saint John the Theologian is beyond words. We thank the fathers for the perfect guided tour of the Monastery and the Museum. A pilgrimage to Patmos is well worth it — it lifts one's religious spirit to the highest peak.\nGroup leader for 54 people from Thermo, Aetolia\nArchimandrite Theokletos Raptis","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"relays","worth_assessment":"worth_it","recognizes_active_institution":1,"religious_self_id":"orthodox","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Archimandrite-led group of 54 pilgrims from Aetolia; Orthodox 'we'"}},"609":{"id":609,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Indrukwekkend \n Impressive An impressive visit to the monastery with an authentic atmosphere. Ticket costs 4 euros per person. Beautiful chapel in its original condition!","codes":{"religious_register":["conventional"],"recognizes_heritage_protection":1,"review_is_useful":1}},"610":{"id":610,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Okay \n Okay A bit disappointing, in that one doesn't get to see much of the monastery itself.  However, the museum has some very interesting items, so that part was good, if you like history.","codes":{"religious_register":["conventional"],"worth_assessment":"mixed","facility_complaints":["area_access"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"611":{"id":611,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Καστρομονάστηρο \n Castle-Monastery At the top of the mountain, a massive construction for its time, especially given the lack of building infrastructure back then. As for the museum — amazing, based on what it has on display to the public","codes":{"elevation_mention":1,"religious_register":["conventional"],"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"612":{"id":612,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Beautiful \n Beautiful This is a beautiful monastery atop the hill in Patmos. The building itself is amazing. The views are stunning. We had a wonderful tour guide leading us through the monastery. She was very informative. The only downside was the number of people in the building. The other tourists were just plain rude. We even had a lady attempt to push a couple of us out of her way so she could get in to see something. We were a group and her group was behind our group. I’m not sure if the massive crowds are common or just when we were there. It did make it difficult to really soak up the atmosphere with so many people. Overall, it was a wonderful experience.","codes":{"elevation_mention":1,"topography_quoted_phrase":"atop the hill in Patmos","religious_register":["conventional"],"tourist_mode":"institutional_aware","enclosure_exposure":"exposed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"613":{"id":613,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Τριημερο του Αγίου Πνεύματος με γκρουπ \n Pentecost long weekend with a group May the Saint bless us! Very beautiful inside and out, with a wonderful view.. Clean, and the museum is worth visiting as it has many old religious objects..! The only thing that surprised all of us is that there is nothing to give out — no small bottle of holy oil or a little icon from the monastery, like for example at Panormitis.. There is a man downstairs but he sells them for 3€","codes":{"religious_register":["conventional"],"tourist_mode":"institutional_aware","worth_assessment":"worth_it","facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","motivation_religious":1,"review_is_useful":1,"coding_notes":"Pentecost group pilgrimage; mild commerce gripe (no free icon/oil to give out)","view_centrality":"mentioned"}},"616":{"id":616,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Δεν γίνεται να μην πας... \n You just have to go... It's a well-known place. That means groups and hordes of tourists. The museum is noteworthy. The only thing that's missing is a sense of solemnity and respect for the space — mainly from the local clergy!","codes":{"religious_register":["conventional"],"tourist_mode":"institutional_aware","worth_assessment":"worth_it","recognizes_active_institution":1,"facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"complaint that local clergy lack solemnity/respect — institutional-aware decorum gripe"}},"617":{"id":617,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μοναδική εμπειρία \n A unique experience Words are unnecessary. It is one of the must-sees of the island. Awe and devotion are the first feelings you experience. As for the view from the monastery....unique","codes":{"religious_register":["conventional","mystical"],"tourist_mode":"institutional_aware","worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"620":{"id":620,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Prachtig \n Beautiful A beautiful monastery at the top of the town of Chora.  Truly worth it if you enjoy frescoes and want to see religious architecture.","codes":{"elevation_mention":1,"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1}},"622":{"id":622,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Vista Maravilhosa da cidade \n Wonderful View of the Town A religious, Orthodox site built on a hill, offering a beautiful view of the island. It has a gorgeous museum with precious and historic pieces.","codes":{"elevation_mention":1,"religious_register":["conventional"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"central"}},"623":{"id":623,"site":"monastery","plat":"tripadvisor","rating":"5","text":"charming hill top monastery and museum \n charming hill top monastery and museum Very picturesque, great views.  Fascinating small museum.  We were there during services and were able to observe from the back the orthodox celebrations.  The museum is small but very interesting.","codes":{"religious_register":["conventional"],"enclosure_exposure":"exposed","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"observed Orthodox service from the back during visit","topography_register":1,"view_centrality":"mentioned"}},"624":{"id":624,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Κατάνυξη \n Devotion When you go to Patmos, especially for pilgrimages, there is no way you would neglect to visit the monastery, after the Cave of the Apocalypse. Peace, awe, and blessing. There is also the museum to see the exhibits. Go without hesitation. The road is accessible.","codes":{"religious_register":["conventional","mystical"],"tourist_mode":"institutional_aware","worth_assessment":"worth_it","motivation_religious":1,"review_is_useful":1}},"626":{"id":626,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Καστρομοναστήρι στην κορυφή της χώρας με πανοραμική θέα \n Castle-monastery at the top of Chora with panoramic views The landmark of Patmos. An exceptional, majestic, medieval castle-monastery with a rich history and religious spiritual significance. Located at the highest point of Chora, the view is unobstructed and breathtaking — looking out over the island of Patmos, the Aegean Sea, and the neighboring islands. You will admire the massive walls surrounding the monastery, the monastery's architecture, the church, the bell tower, the cells, and the priceless treasures kept in the museum. It is well worth visiting the museum too — the exhibits are amazing (including the Byzantine imperial chrysobull granting the island, vestments, Gospels, Byzantine relics, etc.) — and the price is nominal. A visit to the Monastery is a must for all visitors to Patmos, especially history enthusiasts and the devout faithful.","codes":{"elevation_mention":1,"topography_quoted_phrase":"the highest point of Chora, the view is unobstructed and breathtaking","religious_register":["conventional","doctrinal"],"tourist_mode":"institutional_aware","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"quotable_for_chapter":1,"acknowledges_historical_cultural":1,"view_centrality":"central"}},"627":{"id":627,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Αποκάλυψη! \n Revelation! We were on vacation on Samos. I made a day trip by speedboat to the sacred island of Patmos. From the harbor you can admire the magnificent scenery that unfolds before you. And up high, the monastery dominates the landscape. I would call it a castle-monastery. After a magical journey and a short walk, I arrived. What I saw and experienced was pure revelation. The monastery's catholicon is imposing. Devout solemnity! The visitors were very many. I made my way to the museum. A two-story space. The exhibits numerous, of inestimable value. Everything beautifully arranged. Special signs guide you. Ecclesiastical vessels, icons, manuscripts, sigils, chrysobulls of Byzantine emperors, firmans of the sultan...  Spirituality and awe. The interaction with the monks was very beneficial and enriching. Then I headed toward the Cave of the Apocalypse. The sight was breathtaking. Awe, devout solemnity! The crack in the rock — the spot where the disciple of love wrote the Book of Revelation! Emotion, prayer...","codes":{"trip_mode":"day_trip_ferry","tourist_mode":"institutional_aware","religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"both","mimetic":1,"mimetic_engagement":"enacted","recognizes_active_institution":1,"motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"speedboat day-trip pilgrim covering Monastery+Cave; prayer at the crack in the rock","devotional_participation":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"629":{"id":629,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Επιβλητικό \n Imposing It is an imposing building that becomes even more beautiful the further you go inside. The inner courtyard outside the catholicon offers an oasis of cool shade, while the catholicon itself is a masterpiece of Orthodox ecclesiastical art (especially its iconostasis). The only dark spot is the inappropriate behavior of the monks toward visitors... I am genuinely sorry, but when someone comes with joy and anticipation to see one of the most important monuments of Orthodoxy, the monks' behavior should be different....","codes":{"religious_register":["conventional","doctrinal"],"tourist_mode":"institutional_aware","sensory_modalities":["vision","touch_temperature"],"recognizes_active_institution":1,"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"monk-decorum gripe from reverent stance — institutional_aware not consumer"}},"631":{"id":631,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μαγια \n Magic I have been to many places combined with religion, but this place was magic.\nWhoever doesn't go will feel empty inside.","codes":{"religious_register":["conventional","mystical"],"tourist_mode":"institutional_aware","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Whoever doesn't go will feel empty inside' — concise religious-mystical recommendation"}},"633":{"id":633,"site":"monastery","plat":"tripadvisor","rating":"1","text":"beware of the priest and monk \n beware of the priest and monk We were followed around the entire time by the priest who was groping his gentiles and trying to lure us into a back room.  This is beautiful and holy place however all travelers should beware of this man.  I highly recommend visiting however keep a fair distance from this man. It was awkward and uncomfortable and a disgrace ,","codes":{"religious_register":["conventional"],"tourist_mode":"institutional_aware","worth_assessment":"worth_it","recognizes_active_institution":1,"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"1-star alleging clergy misconduct yet 'highly recommend visiting'; sensitive content"}},"636":{"id":636,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Worth the climb \n Worth the climb Whether you're a fan of the ornate church or not the views are absolutely worth the walk up the hill.  The town around the monastery is worth walking through to get a sense of simpler times and simpler lives.  Easy to see why their was immense effort to bring materials up to build the whole complex.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"absolutely worth the walk up the hill","effort_valence":"positive","worth_assessment":"worth_it","enclosure_exposure":"exposed","austerity_register":"appreciative","review_is_useful":1,"coding_notes":"valorizes 'simpler times and simpler lives' of the surrounding town","topography_register":1,"view_centrality":"central","on_site_movement":["walking_around"]}},"638":{"id":638,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Most Important Monastery \n Most Important Monastery Make the trek up the hill to see this monastery dedicated to St. John.  it has a very ornate orthodox church, a courtyard, monks quarters and stunning views of Patmos Island and the surrounding islands.  Get a guide because there is not other way to appreciate the importance of this place while walking through it","codes":{"ascent_mode":"walked","elevation_mention":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"639":{"id":639,"site":"monastery","plat":"tripadvisor","rating":"5","text":"excelente \n Excellent Excellent orthodox monastery built as if it were a fortress. Inside you feel all the beauty and spirituality of the place, right in its lovely courtyard. The interior, decorated with beautiful orthodox works of art, is gorgeous and breathtaking...","codes":{"religious_register":["conventional","mystical"],"tourist_mode":"institutional_aware","sensory_modalities":["vision","embodied"],"review_is_useful":1,"topography_register":1}},"640":{"id":640,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Atmosfera di raccoglimento \n An Atmosphere of Contemplation A visit that will leave you with a beautiful memory. Lose yourself admiring the frescoes in the church and wander through the corridors of the Monastery, discovering picturesque glimpses.","codes":{"religious_register":["conventional","mystical"],"tourist_mode":"institutional_aware","sensory_modalities":["vision"],"review_is_useful":1,"atmospheric_register":1,"on_site_movement":["walking_around"]}},"641":{"id":641,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Beau panorama \n Beautiful Panorama A nice little visit, with atypical architecture and a beautiful panorama.\nWe disembarked at the port and negotiated a taxi with 3 other Americans (so 5 in total) to make the trip: port => Cave of the Apocalypse => monastery => port. It cost us 30€ (negotiated down from 35€) for the whole trip, which works out to 6€ per person.\n\nEnjoy your visit!","codes":{"ascent_mode":"motorized","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"central","descent_mode":"motorized"}},"645":{"id":645,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A special spiritual place \n A special spiritual place The cave where the Apostle John is said to have written the Book of Revelation is set within a monastery about halfway up the hill from Skala to hilltop Hora. Don't go when a cruise ship is in!  Take the time to soak up the atmosphere.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"halfway up the hill from Skala to hilltop Hora","religious_register":["conventional","mystical","doctrinal"],"mediation":"relays","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"advises others not to go when cruise ship is in","topography_register":1}},"646":{"id":646,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Впечатляющий визит в святой монастырь. \n An Impressive Visit to the Holy Monastery. The visit to the monastery was very impressive. We went twice — once didn't seem like enough. While standing in the Chapel of Saint Christodoulos, you feel an incredible sense of admiration and reverence for the Saint. Very educational and enriching from every point of view. The place is unforgettably picturesque, with stunning views. We also visited the Cave of Saint John the Theologian. Impressive. You feel the urge to return again and again for inner balance and renewal.","codes":{"religious_register":["conventional","mystical","doctrinal"],"tourist_mode":"institutional_aware","worth_assessment":"worth_it","enclosure_exposure":"both","motivation_religious":1,"review_is_useful":1,"coding_notes":"returns repeatedly for 'inner balance and renewal'; reverence at Christodoulos chapel","topography_register":1,"view_centrality":"mentioned","on_site_movement":["posture_pause"]}},"648":{"id":648,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Tremendous experience, Amazing Mammoth Structure Dominates the Hilltop \n Tremendous experience, Amazing Mammoth Structure Dominates the Hilltop This is worth the climb and visit.  It sits on top of the hill, there are many shops and restaurants that have a great view of the port and sea, and it is simply a breathtaking and beautiful site with incredible architecture.  Visit the cave nearby where John wrote the book of Revelation.","codes":{"elevation_mention":1,"religious_register":["conventional","doctrinal"],"mediation":"endorses","effort_valence":"positive","worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"sensory_modalities":["embodied"],"topography_register":1,"view_centrality":"mentioned"}},"651":{"id":651,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Το στολίδι της Πατμου \n The Jewel of Patmos Imposing, the monastery sits at the top of the mountain and adorns the island of Patmos. Inside you will find ancient ecclesiastical items, icons, chalices, etc.","codes":{"elevation_mention":1,"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"653":{"id":653,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Stunning! \n Stunning! This is a must see if you are in Patmos!! Lovely temple allowing you to walk around among the priests in this stunning setting!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"on_site_movement":["walking_around"]}},"656":{"id":656,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Μοναστηρι-Καστρο! \n Monastery-Castle! If you make it to Patmos you simply must visit it. It is a beautiful castle that doesn't look like a monastery at all. It has a unique view of the sea and of Skala. The interior is also excellent, with arched passages, bougainvilleas, and a well in the middle. Flowers everywhere, and after visiting the sacred space and the museum (€2 entry), you climb up to its \"rooftop\" and admire the combination of the white roof with the blue of the sea.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"climb up to its 'rooftop' and admire the white roof with the blue of the sea","religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"both","nature_mention":1,"nature_sub_codes":["flora_fauna"],"review_is_useful":1,"quotable_for_chapter":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["stairs_up"]}},"660":{"id":660,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Un panorama superbe \n A Magnificent Panorama The monastery is a must-see, perched atop its hill in the center of Chora. A magnificent panorama lets you take in the entire bay of Patmos and beyond. A must-see.","codes":{"elevation_mention":1,"topography_quoted_phrase":"perched atop its hill in the center of Chora","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"central"}},"661":{"id":661,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Da vedere \n Worth Seeing Beautiful structure and beautiful feelings... !!!as soon as you arrive, a fantastic smell of incense !!!! Entry tickets €4 per person !!!!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","sensory_modalities":["smell"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"rare smell-of-incense coding on arrival"}},"663":{"id":663,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Πολύ ωραίο μοναστήρι..... \n Very Beautiful Monastery..... A beautiful and well-kept monastery. The church had amazing frescoes and it's great if you manage to find someone to give you a short tour. The museum had quite a few exhibits and the entry fee was quite affordable, so it's worth visiting. The view from the entrance of the monastery is amazing.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"664":{"id":664,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Topdag, een excursie van Samos naar Patmos \n A Great Day — An Excursion from Samos to Patmos By boat from Samos to Patmos — a fun boat trip in beautiful weather. On Patmos we were met by a Dutch guide, Ruud. First we visited the cave (Cave of the Apocalypse), where our guide gave a lot of explanations. Then we took the bus to the Monastery of Saint John. On the bus, the guide told us a lot about the history of Patmos, which was very enjoyable. The monastery is impressive and serene, and we had a wonderful guided tour with lots of information. Afterward we joined the suggested excursion through the medieval town of Chora led by our guide. We had a great lunch at a Greek restaurant with dancing and music. Back by bus to Skala where our boat was docked. Said goodbye to the guide. Excellent work. On the return trip we saw dolphins.\nA real must, this Samos–Patmos day.\nIsabelle de Goede","codes":{"trip_mode":"day_trip_ferry","religious_register":["conventional"],"mediation":"relays","review_is_useful":1,"nature_mention":1,"nature_sub_codes":["flora_fauna"],"acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"motorized","on_site_movement":["walking_around"]}},"665":{"id":665,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Da visitare \n Worth Visiting You cannot miss a visit to the Monastery if you are in Patmos. The theological references are obviously more meaningful at the Cave of the Apocalypse, while the Monastery is interesting not only from a historical point of view but also for the geometry of its architecture. Also visit the museum inside.","codes":{"religious_register":["conventional","doctrinal"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"666":{"id":666,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Υπέροχο \n Magnificent A stroll through the imposing castle-monastery of Saint John the Theologian is well worth it — the location is magnificent and its history is unique!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["walking_around"]}},"668":{"id":668,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μυσταγωγία στο Αιγαίο \n Mystery Rites in the Aegean Visiting Patmos and the Monastery is a captivating experience. Try to get a guided tour of the church, because only then can you truly understand many things. Don't miss the Museum, which holds incredible treasures.","codes":{"religious_register":["conventional","mystical"],"mediation":"relays","worth_assessment":"worth_it","review_is_useful":1}},"669":{"id":669,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Υπερσεβάσμιο προσκύνημα... \n A Most Venerable Pilgrimage... An imposing monastery dominates the top of the Chora like a castle, with amazing frescoes and icons from the 16th–17th centuries, a unique iconostasis, outstanding exhibits in the museum, beautiful well-tended spaces, a glorious history — a must-visit....","codes":{"religious_register":["conventional","doctrinal"],"elevation_mention":1,"topography_quoted_phrase":"dominates the top of the Chora like a castle","sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"670":{"id":670,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Bela vista sobre a ilha \n Beautiful View of the Island I took the bus up for about €2 and it took about 15 minutes. There are buses going up and down every 30 minutes. The place is beautiful and has a phenomenal view of the island. The monastery is quite unique but falls short by having many spaces closed to the public. The entry ticket is €6 if I'm not mistaken!","codes":{"ascent_mode":"motorized","elevation_mention":1,"sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["area_access"],"tone_toward_constraints":"frustrated","review_is_useful":1,"view_centrality":"central"}},"671":{"id":671,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μαγικό \n Magical Perhaps this, along with the Cave of the Apocalypse, is the reason Patmos is so popular and attracts tourists from all over the world. All of Chora of Patmos together with the Monastery are UNESCO-protected cultural heritage sites, and it is more than necessary to visit if you find yourself on the island. It is located within the Castle — the building spans many centuries and the view is breathtaking!","codes":{"religious_register":["conventional","mystical"],"recognizes_heritage_protection":1,"sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"672":{"id":672,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Επιβλητικό μοναστήρι \n Imposing monastery Although the spaces that one can visit are few, the atmosphere and the location are amazing. It's unthinkable to go to Patmos and not visit it.","codes":{"religious_register":["conventional","mystical"],"facility_complaints":["area_access"],"worth_assessment":"worth_it","review_is_useful":1}},"675":{"id":675,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Ότι και να πει κανεις ειναι λίγο ... \n Whatever you say isn't enough ... Its presence at the highest point of the island, at the top of Chora, is dominating. Built within a castle, it beckons us to visit. Its museum is amazing, with incredible relics preserved, and the view takes your breath away ...","codes":{"religious_register":["conventional"],"elevation_mention":1,"topography_quoted_phrase":"highest point of the island, at the top of Chora","sensory_modalities":["vision","embodied"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"677":{"id":677,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Ωραια ξεναγηση \n Nice tour The tour of the monastery grounds is conducted by a monk who explains the history, the architecture, etc. in simple terms. It is the highest point of Chora and the view is very beautiful.","codes":{"religious_register":["conventional"],"mediation":"relays","recognizes_active_institution":1,"elevation_mention":1,"topography_quoted_phrase":"highest point of Chora","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"678":{"id":678,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Extraordinário lugar \n Extraordinary place What a surprising visit. If you're on a cruise, don't miss it — you'll have a fabulous view, and it's a place of great spirituality. If you don't have a tour package, don't worry. The taxi drivers are well prepared and will take you there and bring you back with a proper itinerary.","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"mentioned","descent_mode":"motorized"}},"680":{"id":680,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Amazing view \n Amazing view We walked up the hill from narrow streets to the monastery. It was quite crowded but worth it.  They give you clothes if your clothing is not appropriate to enter the monastery.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"walked up the hill from narrow streets to the monastery","sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","facility_complaints":["crowding","dress_code"],"tone_toward_constraints":"accepting","review_is_useful":1,"topography_register":1,"view_centrality":"central"}},"683":{"id":683,"site":"monastery","plat":"tripadvisor","rating":"5","text":"εξαιρετικος χωρος \n exceptional place well-maintained place, very helpful staff, special aura and view. it is one of the places worth visiting","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"mentioned"}},"684":{"id":684,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Incontournable \n A must-see Sumptuous monastery, a fortress from the 11th century, magnificent frescoes and numerous relics including the skull of the Apostle Saint Thomas. The museum holds magnificent treasures, as does the library.","codes":{"religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"685":{"id":685,"site":"monastery","plat":"tripadvisor","rating":"3","text":"Carino \n Nice Admission to the monastery and the attached museum is paid. The visit to the monastery is relaxing. Few people. Every now and then you come across a priest (dressed in black with their hair tied in a ponytail) — quite austere.","codes":{"religious_register":["conventional"],"austerity_register":"neutral","recognizes_active_institution":1,"sensory_modalities":["vision"],"review_is_useful":1}},"686":{"id":686,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Le calme \n The calm The monastery itself is impressive with its dark color, which contrasts with the whiteness of the surrounding houses. \nCalm prevails there and the building is magnificent both inside and out. The view from up there is also worth seeing.\nThe price is €4 per person and includes the small monastery museum.","codes":{"religious_register":["conventional","mystical"],"elevation_mention":1,"topography_quoted_phrase":"view from up there","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"view_centrality":"mentioned"}},"688":{"id":688,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Gran Monasterio \n Great Monastery Located at the top of the mountain, this Orthodox monastery has a small religious museum. It's interesting to walk its corridors and see the murals and objects that adorn the main chapel. The taxi drops you off a few streets below since it can't drive all the way to the entrance. Up there is a small village with shops for tourists. The highlight is the views of the island, which are wonderful. If you take a taxi, it charges 30 euros for 4 people and includes a visit to the Cave of Saint John and the monastery. The entrance to the cave has an extra cost of 2 euros. You can explore it in an hour and a half.","codes":{"ascent_mode":"motorized","religious_register":["conventional","doctrinal"],"elevation_mention":1,"topography_quoted_phrase":"top of the mountain","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"central","descent_mode":"motorized","on_site_movement":["walking_around"]}},"689":{"id":689,"site":"monastery","plat":"tripadvisor","rating":"5","text":"vacanze estive \n summer vacation simply fantastic, climbing through the narrow alleys and reaching one of the most sacred places of the Orthodox church makes the effort of the climb worthwhile.\nabsolutely not to be missed","codes":{"ascent_mode":"walked","religious_register":["conventional","doctrinal"],"elevation_mention":1,"topography_quoted_phrase":"climbing through the narrow alleys and reaching","effort_valence":"ambivalent","worth_assessment":"worth_it","review_is_useful":1,"sensory_modalities":["embodied"]}},"690":{"id":690,"site":"monastery","plat":"tripadvisor","rating":"4","text":"αξεχαστο \n unforgettable definitely visit the Monastery of John the Theologian as well as the museum inside the monastery","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"692":{"id":692,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Incredible Experience \n Incredible Experience Dominating the peak of Patmos, the Monastery of Saint John is incredible.  On an island as small as Patmos, all roads lead to the Monastery.  Once you arrive, there is an excellent patio restaurant to the right, and the path to the Monastery to the left.  Ancient stone stairs lead the way to courtyards, small shops and a delicious bakery.  Homes surround the Monastery, accessed by stone paths are ancient and beautifully kept.\n\nThe Monastery has posted hours, strictly enforced as it is primarily a Monastery and secondarily a UNESCO Heritage Site.  Again as an active Monastery, monks live on the premises.  Appropriate dress and behavior are expected.  No photos are allowed in the Church or museum.  \n\nThat being said, it is an incredible experience.  Having weathered the political and international changes, the Monastery reflects the history of Greece as well as the Greek Orthodox faith.  It is advisable to read up on the history of Greece under the Turks, Venetians, the Ottoman Empire as well as other visitors to Greece to appreciate the Church and museums artifacts.\n\nTake your time, enjoy, and check the scheduled hours.","codes":{"religious_register":["conventional","doctrinal"],"tourist_mode":"institutional_aware","recognizes_active_institution":1,"recognizes_heritage_protection":1,"elevation_mention":1,"topography_quoted_phrase":"Dominating the peak of Patmos","sensory_modalities":["vision"],"tone_toward_constraints":"accepting","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'primarily a Monastery and secondarily a UNESCO Heritage Site' — clean institutional_aware framing","acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["stairs_up","walking_around"]}},"694":{"id":694,"site":"monastery","plat":"tripadvisor","rating":"4","text":"fab views, a must see, amazing \n fab views, a must see, amazing fab views across the windmills and around the island, a must see, amazing, moving experience, Patmos has not changed in 30yrs since my last visit","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","motivation_authentic_greek":1,"review_is_useful":1,"view_centrality":"central"}},"695":{"id":695,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Well worth the visit \n Well worth the visit Moderately steep climb from taxi rank. Beautiful, minimalist, Greek Island architecture. The museum displays an original El Greco.\n\nFrom Skala a public bus runs to Chora hourly: €2 per person one way. If there is a small group, I recommend a shared taxi from Skala port: Cave of the Apocalypse (30 minutes to explore), then the Monastery (1 hr to explore) and return to Skala. €40 per cab.","codes":{"ascent_mode":"motorized","religious_register":["conventional"],"elevation_mention":1,"topography_quoted_phrase":"Moderately steep climb from taxi rank","effort_valence":"positive","worth_assessment":"worth_it","sensory_modalities":["vision"],"austerity_register":"appreciative","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"motorized"}},"696":{"id":696,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Serene and cool admist the heat of the Aegean \n Serene and cool admist the heat of the Aegean Working monastery, cool and comforting, great architecture. You need to be respectful with clothing, cameras and manners. Small museum with some interesting pieces. Well worth 4 Euros","codes":{"religious_register":["conventional","mystical"],"recognizes_active_institution":1,"sensory_modalities":["touch_temperature"],"worth_assessment":"worth_it","tone_toward_constraints":"accepting","review_is_useful":1}},"697":{"id":697,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Austero ed imponente \n Austere and imposing Entering the monastery, beyond the spirituality, you also sense the power it once held over the entire surrounding area — an absolute must-see.","codes":{"religious_register":["conventional","mystical"],"austerity_register":"appreciative","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1}},"698":{"id":698,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Must go to the Monastery \n Must go to the Monastery The Monastery is a must to see and it is hard to miss.  It sits atop the Island of Patmos, where the story goes that John the Theologician wrote the Book of Revelations.  The Cave is important to see too.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","elevation_mention":1,"worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"699":{"id":699,"site":"monastery","plat":"tripadvisor","rating":"3","text":"聖ヨハネとは？ \n Who is Saint John? I visited as part of an Aegean Sea cruise excursion to the island of Patmos. We went by bus. It's not feasible to walk from the harbor. Since you climb quite a bit, the views from here and along the way are beautiful.\n\nI think it may not resonate much with non-Christians. When entering, there are rules typical of religious sites: no exposed shoulders or skin above the knees, remove your hat, and photography is prohibited.\n\nThe decorations and frescoes (?) of the facility are magnificent and give you a sense of history.\n\nThe museum in the second half of the visit was well worth seeing. Items spanning hundreds of years are on display.","codes":{"trip_mode":"cruise_excursion","ascent_mode":"motorized","religious_register":["conventional"],"elevation_mention":1,"sensory_modalities":["vision"],"enclosure_exposure":"exposed","motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"mentioned","descent_mode":"motorized"}},"702":{"id":702,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A beautiful monastery \n A beautiful monastery Has amazing view and totally worth a visit. Very peaceful place, offers the ultimate spiritual tranquility. Also church has a great architecture","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"mentioned"}},"704":{"id":704,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Περιμέναμε περισσότερα! \n We expected more! It is certainly a monument of religious devotion and faith. But, unfortunately, it seemed abandoned to us, or at least that was the impression it gave us. We went on a Sunday afternoon and didn't see a single monk. The usual laypeople, as in all monasteries, were running the show. We also visited the museum — with so many noteworthy exhibits, it showed signs of decline and deterioration. A shame.","codes":{"religious_register":["conventional","doctrinal"],"tourist_mode":"institutional_aware","recognizes_active_institution":1,"facility_complaints":["amenities"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"lament about deteriorating museum + absent monks; institutional_aware disappointment frame"}},"705":{"id":705,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Warto zobaczyć \n Worth seeing A thousand-year-old defensive monastery built on the site of a temple to Artemis. The magnificent monastery rooms and the museum organized within a part of them attract thousands of tourists. The monastery is listed on the UNESCO World Heritage List.","codes":{"religious_register":["conventional","doctrinal"],"recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"706":{"id":706,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Incredible Art and awesome views \n Incredible Art and awesome views The views from the monastery are absolutely fantastic, the artwork in the museum is amazing and well worth the visit.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"central"}},"707":{"id":707,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Πνευματικοτητα \n Spirituality Visiting this monastery gives you the opportunity to feel spirituality and humility. The monastery is wonderful with fantastic wood carvings and gold. Fantastic frescoes that have survived to this day. At the same time it gives you a sense of simplicity and unpretentiousness. You focus on the divine.","codes":{"religious_register":["conventional","mystical","doctrinal"],"sensory_modalities":["vision"],"austerity_register":"appreciative","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'simplicity and unpretentiousness... focus on the divine' — clean austerity-appreciation"}},"709":{"id":709,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Pour la vue \n For the view You do indeed have to climb many steps to get all the way to the top. The view of the island is truly magnificent. It is possible to go up by donkey. On the way back, you can get lost in the narrow alleys — don't hesitate to leave the main street full of shops to discover the more authentic side streets.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"many steps to get all the way to the top","effort_valence":"neutral","sensory_modalities":["vision"],"enclosure_exposure":"exposed","motivation_authentic_greek":1,"review_is_useful":1,"view_centrality":"central","descent_mode":"walked"}},"710":{"id":710,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Το στολίδι του νησιού! \n The jewel of the island! A very important religious monument for our church and our culture! It has a very interesting museum and a remarkable library! During the services there is a true sense of devotion, with the highlight being Easter during Holy Week!","codes":{"religious_register":["conventional","mystical","doctrinal"],"recognizes_active_institution":1,"religious_self_id":"orthodox","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'our church and our culture'... 'highlight is Easter Holy Week' — first-person plural Orthodox/Greek pilgrim self-ID, parallel to 461/608","acknowledges_historical_cultural":1}},"711":{"id":711,"site":"monastery","plat":"tripadvisor","rating":"5","text":"心から癒やされました。 \n I was truly moved and at peace. The exterior of the monastery built for Saint John looks just like a fortress, but inside, the sanctuary is adorned with beautiful frescoes and mosaics — it feels like another world. The view of the Aegean Sea from here is also magnificent. And there are adorable cat monks? Please note that the interior of the sanctuary is a sacred place and photography is prohibited! (There are people who take photos and post them online, but that is bad manners.) Also, revealing clothing or ripped jeans will be flagged at the entrance. Since it is a place of prayer, it is important to dress appropriately.","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","nature_mention":1,"nature_sub_codes":["flora_fauna"],"recognizes_active_institution":1,"tone_toward_constraints":"accepting","review_is_useful":1,"atmospheric_register":1,"topography_register":1,"view_centrality":"mentioned"}},"712":{"id":712,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Panoramico \n Panoramic Truly majestic, absolutely worth a visit. Too bad you have to pay an entrance fee to visit it.","codes":{"enclosure_exposure":"exposed","sensory_modalities":["vision"],"worth_assessment":"worth_it","facility_complaints":["prices"],"tone_toward_constraints":"frustrated","review_is_useful":1,"view_centrality":"central"}},"714":{"id":714,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Interesante \n Interesting We visited during the cruise stop at the island of Patmos. You can book an excursion on board, but by taxi it's much more economical (they charged us 40 euros for 5 people round trip to visit the cave and the monastery). To get there, you have to walk a few meters up a steep street and some steps. It has a small museum, a lovely courtyard with plants and flowers, and you can walk through its corridors and terraces. Outside there are beautiful views of the island. Admission costs 4 euros.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","elevation_mention":1,"topography_quoted_phrase":"walk a few meters up a steep street and some steps","sensory_modalities":["vision"],"enclosure_exposure":"exposed","nature_mention":1,"nature_sub_codes":["flora_fauna"],"motivation_cruise_thing_to_see":1,"review_is_useful":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"motorized","on_site_movement":["walking_around"]}},"715":{"id":715,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A must visit for any bucket list \n A must visit for any bucket list We were there with a small group, but there were many other groups there. Still we could see all if we were patient. The small chapel is full of paintings which are magnificent. The museum on the second level holds rare sacred scriptures, very impressive icons, and sacred items such as crosses, garments, and church vessels. It is a bit of a walk to get in, but you are rewarded with great views of the sea and the towns.","codes":{"elevation_mention":1,"topography_quoted_phrase":"a bit of a walk to get in","religious_register":["conventional"],"effort_valence":"positive","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"view_centrality":"mentioned"}},"716":{"id":716,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μονη \n Monastery A monastery with genuine devotion .....without prayer ropes, holy oils, or candles thrust at you. A pilgrimage for those who are looking for just that...!!","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Praises absence of pushy religious commerce ('without prayer ropes... thrust at you')"}},"718":{"id":718,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Awesome! \n Awesome! We were here over the Easter weekend, and joined in several of the celebrations. All a great combination of reverence and joy!","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1}},"719":{"id":719,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Historic \n Historic Another stop with the Gate 1 Travel group, we visited the Patmos cave where it's reported St. John wrote his book. We were the first group of the day & were fortunate to sit in the cave as the docent detailed the history associated with the cave and described the artifacts in the cave. No photography was allowed inside but my memory of the cave remains vivid.","codes":{"religious_register":["doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","sensory_modalities":["vision"],"review_is_useful":1,"coding_notes":"Site=monastery but text describes the Cave; docent-relayed history","acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["posture_pause"]}},"724":{"id":724,"site":"monastery","plat":"tripadvisor","rating":"4","text":"A fascinating contact with biblical history \n A fascinating contact with biblical history It is very special to feel that we have touched the story if the bible and the book of revelations.  Good visit","codes":{"religious_register":["doctrinal","mystical"],"mediation":"endorses","mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'feel that we have touched the story' = enacted mimetic via metaphorical contact","acknowledges_historical_cultural":1}},"725":{"id":725,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Превращение  туриста в паломника. \n Transformation from tourist to pilgrim - Only from a distance can you appreciate the grandeur, grace, and power of this monastery. Inside: narrow passages, small courtyards, bell towers, arches, and churches... The cathedral church inside seemed so tiny, as if designed for a personal meeting with God. Peace, calm, no hustle. And yet we arrived on a large ship on a tour! But everyone somehow faded away and disappeared. It was just us, icons, candles, beauty, and reverent awe. \nThere is also a museum — a must-visit, of course. On this Holy Island, everything is extraordinary. And with that feeling, we left.","codes":{"trip_mode":"cruise_excursion","tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"both","motivation_cruise_thing_to_see":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Title 'Transformation from tourist to pilgrim'; 'everyone faded away'","atmospheric_register":1,"on_site_movement":["accessibility_concern","walking_around"]}},"726":{"id":726,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μοναδική εμπειρία \n Unique experience - The experience at all the monasteries and abbeys of the country is incredible, but anything set within a natural landscape like caves is even more unique.","codes":{"religious_register":["conventional"],"review_is_useful":1,"topography_register":1}},"727":{"id":727,"site":"monastery","plat":"tripadvisor","rating":"5","text":"ΠΑΤΜΟΣ ΑΤΜΟΣΦΑΙΡΑ ΚΑΤΑΝΥΞΗΣ \n PATMOS — ATMOSPHERE OF REVERENCE - An ideal destination for the Easter holidays — a small and beautiful island with lots of greenery, short distances, great service, good prices, good food, and the site of the Cave of the Apocalypse lifts your religious spirit..","codes":{"religious_register":["conventional","mystical"],"nature_mention":1,"nature_sub_codes":["flora_fauna"],"review_is_useful":1,"atmospheric_register":1,"topography_register":1}},"728":{"id":728,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A beautiful place to visit \n A beautiful place to visit There is a bit of a walk up the hill and the ground is uneven, so be prepared to take your time and wear comfy shoes.  Monastery is stone, so can be a bit chilly inside, so you might want a jacket.  Visiting here gives new meaning to the word \"antique.\"  Many religious artifacts that are hundreds of years old.  Lots of places to walk around; many steps.  Great photo ops! Loved hearing about the old wall paintings (mural) that had even older paintings under them!","codes":{"elevation_mention":1,"topography_quoted_phrase":"a bit of a walk up the hill","religious_register":["conventional"],"effort_valence":"neutral","sensory_modalities":["vision","touch_temperature"],"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["accessibility_concern","walking_around"]}},"729":{"id":729,"site":"monastery","plat":"tripadvisor","rating":"5","text":"5 stelle! Le vale tutte \n 5 stars! Worth every one - After visiting the town I went all the way up to the monastery — something truly beautiful. I happened to be there on Holy Saturday and a religious rite had been performed shortly before my arrival. It's worth it — stunning even for non-believers.","codes":{"elevation_mention":1,"topography_quoted_phrase":"went all the way up to the __MONASTERY__","religious_register":["conventional"],"recognizes_active_institution":1,"worth_assessment":"worth_it","effort_valence":"positive","review_is_useful":1}},"731":{"id":731,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Denny's Oz Angels \n Denny's Oz Angels To walk through and see the Monastery on its glory, is priceless. The church within Monastery is breathtaking, the serenity within the walls of the Monastery is wonderful and the view from the roof top of the whole island is beautiful. Add to that the museum and the history and it is a must see attraction.","codes":{"elevation_mention":1,"topography_quoted_phrase":"view from the roof top of the whole island","religious_register":["conventional","mystical"],"worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"view_centrality":"mentioned","on_site_movement":["walking_around"]}},"733":{"id":733,"site":"monastery","plat":"tripadvisor","rating":"5","text":"ΕΞΑΙΡΕΤΙΚΟ \n EXCEPTIONAL - The Monastery of Saint John the Theologian is something beyond words — you have to go and experience it up close! The Monastery of Saint John the Theologian is considered the Jerusalem of Greece!!!","codes":{"religious_register":["conventional"],"review_is_useful":1}},"736":{"id":736,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Place(s) of Faith \n Place(s) of Faith Patmos is associated with St John, author or the Gospel and Epistles that bear his name and also of the Book of Revelation.  One need not be a believer to appreciate the Monastery - and the Cave where tradition has it he wrote Revelation.  Of the two, the Monastery is more profound.  High on a hill, it includes an ancient chapel decorated in the Orthodox style, with some of the oldest frescoes of their type int he world.  There is also a fine museum containing treasures of the Monastery.  As with many sites in Greece, it's best to read up before visiting to understand the historic significance of what you're seeing.","codes":{"elevation_mention":1,"topography_quoted_phrase":"High on a hill","religious_register":["conventional","doctrinal"],"mediation":"relays","sensory_modalities":["vision"],"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Of the two, the Monastery is more profound'; 'One need not be a believer to appreciate'","acknowledges_historical_cultural":1,"topography_register":1}},"737":{"id":737,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A wonderful monument \n A wonderful monument The monastery is one of the most beautiful monuments of Patmos. Has also a museum that you should defenetly visit for its wonderful masterpieces. You will notice though that despite its bulk, the monastery will give you limited access to its rooms. Most beautiful during easter, where you can enjoy the liturgy outside, under the sky.","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"facility_complaints":["area_access"],"review_is_useful":1,"devotional_participation":1}},"738":{"id":738,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Beautifully decorated chapels \n Beautifully decorated chapels We really enjoyed our visit, the interiors of the chapels were richly decorated & most impressive. It was a fascinating place to explore. Our guide gave us very good advice about taking photographs, don't even think about it inside chapels etc; but if you can see the sky above your head it is ok.","codes":{"religious_register":["conventional"],"mediation":"relays","sensory_modalities":["vision"],"facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1,"on_site_movement":["walking_around"]}},"740":{"id":740,"site":"monastery","plat":"tripadvisor","rating":"4","text":"A UNESCO World Heritage Site! \n A UNESCO World Heritage Site! I had never been to Patmos but after doing my research, noted that everything there was to see was within close proximity to where the ship tenders would drop us off. It's a small island (about 13 sq. mi.) with a population of about 3,000 people. We stop here because in 1999, the island's historic center Chora, along with the Eastern Orthodox Monastery of St. John and the adjacent caves of the Apocalypse were declared World Heritage Sites by UNESCO. It is believed that John, one of the 12 Apostles, was exiled to Patmos and this is where he wrote the Book of Revelations. He lived in a cave, the place where he received a Revelation from Jesus. Therefore, Patmos is an important Christian pilgrimage destination.","codes":{"trip_mode":"cruise_excursion","religious_register":["conventional","doctrinal"],"mediation":"relays","recognizes_heritage_protection":1,"motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"741":{"id":741,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Paradise on Earth \n Paradise on Earth It felt like i was taken back in time as we went off season it was quiet love the way it was all so well maintained, when you payed you felt the money was going to good use. This was un assuming but felt so in touch with my spiritual self the highlight of my visit well worth the visit.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'in touch with my spiritual self' = mystical register but not first-person religious self-ID"}},"742":{"id":742,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Beautiful Monastery \n Beautiful Monastery After visiting the grotto where St. John was said to receive visions that dictated the Book of Revelations, we next visited this monastery. There is a bit of a climb to reach it so comfortable shoes and modest dress are both requirements. It is well worth the climb as there are wonderful frescos and a beautiful courtyard to just sit and meditate. There are also beautiful views from this fortress which was built to protect it against marauding pirates.","codes":{"elevation_mention":1,"topography_quoted_phrase":"a bit of a climb to reach it","religious_register":["conventional","doctrinal"],"mediation":"relays","effort_valence":"positive","worth_assessment":"worth_it","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","on_site_movement":["posture_pause"]}},"745":{"id":745,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Beautiful mystical place \n Beautiful mystical place One of the most mystical monasteries I have seen. Beautiful.\nThere is the mainchurch, other chapels. the Museum. You must visit the Monastery of Saint John established by the monk Saint Christodoulos and of course the Apocalypse Cave where Saint John evangelist received the revelation.","codes":{"religious_register":["conventional","mystical","doctrinal"],"mediation":"endorses","review_is_useful":1,"topography_register":1}},"746":{"id":746,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Spettacolare \n Spectacular - Hora, Patmos - A fantastic monastery at the summit of this hill — sweeping panoramic views, built in stone with the whole town spread out below in contrast with all the white houses.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"summit of this hill — sweeping panoramic views","sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"topography_register":1,"view_centrality":"central"}},"747":{"id":747,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Visite incontournable \n A must-see visit - A place frequented by tourists as well as pilgrims. Out of curiosity or devotion. Sacred music festival in September.","codes":{"religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"748":{"id":748,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Amazing place \n Amazing place Very peaceful and beautiful Monastery. Definitely worth the visit and very peaceful to just sit in the courtyard after exploring the Monastery.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1,"on_site_movement":["posture_pause","walking_around"]}},"750":{"id":750,"site":"monastery","plat":"tripadvisor","rating":"5","text":"A MUST MONASTERY TO VISIT! \n A MUST MONASTERY TO VISIT! This monastery and the Cave where St. John wrote biblical accounts were fascinating to visit and see. The Greek Orthodox services at the cave are really  inspiring to see if you are lucky to be there at that time. The Monastery holds actual pages of his writings and this is a real inspiration for all Christians to view!","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","recognizes_active_institution":1,"sensory_modalities":["vision"],"review_is_useful":1,"topography_register":1}},"753":{"id":753,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Δέος \n Awe - A magically beautiful monastery, and the same goes for its location. Even if you're not a believer, it's worth going just to see the view from the upper part of the monastery, which looks like a painting. There is also a museum inside the monastery that you can visit for a fee if you wish.","codes":{"elevation_mention":1,"topography_quoted_phrase":"view from the upper part of the monastery","religious_register":["mystical"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"view_centrality":"central"}},"758":{"id":758,"site":"monastery","plat":"tripadvisor","rating":"5","text":"The newly built entrance makes visiting easier \n The newly built entrance makes visiting easier I've been here many times just to sit in the peace of the cave. A true piece of history that still has an impact on life today. Well worth a visit.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","enclosure_exposure":"enclosed","review_is_useful":1,"coding_notes":"site=monastery but text says 'peace of the cave'; multiple-visit reviewer","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1,"on_site_movement":["posture_pause"]}},"760":{"id":760,"site":"monastery","plat":"tripadvisor","rating":"5","text":"On the steps of St. Paul \n On the steps of St. Paul During a trip with a group we visited this marvelous monastery. The location is hilarious that provides a panoramic view of the island. The church of the monastery is in perfect condition.","codes":{"elevation_mention":1,"topography_quoted_phrase":"panoramic view of the island","religious_register":["conventional"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","review_is_useful":1,"coding_notes":"Title 'On the steps of St. Paul' — likely translation glitch (it's John)","view_centrality":"mentioned"}},"761":{"id":761,"site":"monastery","plat":"tripadvisor","rating":"4","text":"La storia silenziosa \n Silent history - A place steeped in history and spirituality, immersed in silence (from 8:30 to 10). The museum is richly stocked with manuscripts and precious icons; particularly moving is an icon depicting Christ on the way to the crucifixion by Dominikos Theotokopoulos (El Greco).","codes":{"religious_register":["conventional","mystical"],"sensory_modalities":["vision","sound"],"review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1}},"762":{"id":762,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Πανέμορφο \n Gorgeous - A monastery that everyone who comes to Patmos is obliged to visit. The monks are kind, the surroundings are clean, and visitors are not required to wear additional clothing — it is enough for the visitor to respect that they are entering a religious space.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"recognizes_active_institution":1,"review_is_useful":1}},"763":{"id":763,"site":"monastery","plat":"tripadvisor","rating":"4","text":"Αξίζει! \n Worth it! Worth seeing. Wonderful frescoes on the theme of Revelation. Quiet and clean. I didn't like the extra ticket required for the museum.","codes":{"religious_register":["doctrinal"],"sensory_modalities":["vision","sound"],"worth_assessment":"worth_it","facility_complaints":["prices"],"tone_toward_constraints":"frustrated","review_is_useful":1}},"764":{"id":764,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Meraviglioso \n Wonderful - Absolutely not to be missed (like the Cave of the Apocalypse). It rises above Patmos with breathtaking panoramas and a truly unique plunge into the past. The museum holds pieces of early Christianity. Go with appropriate clothing (if you don't have it, they provide it). Ticket: 4 euros for adults, 2 euros for children. Kids are free.","codes":{"elevation_mention":1,"topography_quoted_phrase":"rises above Patmos with breathtaking panoramas","religious_register":["doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"central"}},"765":{"id":765,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Μονη του Αγιου Ιωαννου \n Monastery of Saint John - A monastery built within the castle that is definitely worth visiting.. The feeling is unique!!!!","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"766":{"id":766,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Monastery of St. John / Patmos \n Monastery of St. John / Patmos Proud monastery sit enthroned on a hill in Patmos since 9 centurys, with a  fantastic landscape; The apostle Sant John lives here in exil and wrote the Apocalypse, his spirit revelation, duing 18 month; we visited his modest holy cave where he live; you must climb to the monastery, there is a nice white church with 5 bells overlooking the Agais.\nPatmos is Jerusalem of the Agais.\nThe cave is a half room, 3,5 m in the mountain, filling with superb icones and shining chandeliers; During an earthquake, when Sant John had his Vision, the rock ceiling, roof, was splitting.","codes":{"ascent_mode":"walked","elevation_mention":1,"topography_quoted_phrase":"sit enthroned on a hill in Patmos","religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"both","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"Patmos is Jerusalem of the Aegean; rock-split-during-vision endorsed","acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned"}},"767":{"id":767,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Υπέροχη θέα,ψυχική κατάνυξη........... \n Wonderful view, spiritual reverence........... The monastery is imposing — the first thing that draws your eye as soon as you arrive at the port. Wonderful view from the castle and a reverent atmosphere inside.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"first thing that draws your eye as soon as you arrive at the port","religious_register":["mystical"],"enclosure_exposure":"exposed","review_is_useful":1,"atmospheric_register":1,"view_centrality":"central"}},"769":{"id":769,"site":"monastery","plat":"tripadvisor","rating":"5","text":"μοναδικη!! \n unique!! atmospheric location, exceptional travel choice, I would go back at every opportunity, a beloved place!","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1}},"770":{"id":770,"site":"monastery","plat":"tripadvisor","rating":"5","text":"experience spirituelle \n Spiritual experience - This is the cave in which Saint John dictated the Book of Revelation to his disciple. Apocalypse means Revelation, not Catastrophe! It is a very spartan setup.","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","enclosure_exposure":"enclosed","austerity_register":"appreciative","review_is_useful":1,"coding_notes":"site=monastery but text describes the cave","topography_register":1}},"773":{"id":773,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Vista ,museo e storia. \n Views, museum and history. In Chora, the old town of Patmos, the monastery is imposing, almost a fortress. It also has a small museum — definitely worth visiting for the views, the mysticism, and the history you can feel in the air.","codes":{"elevation_mention":1,"religious_register":["mystical"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"view_centrality":"central"}},"774":{"id":774,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Incoutounable \n A Must-See — A pinnacle of Orthodoxy and the Christian world. A unique place, both for the whole experience and for the relics and the museum.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1}},"775":{"id":775,"site":"monastery","plat":"tripadvisor","rating":"5","text":"Veramente un bel Monastero \n A Truly Beautiful Monastery — We followed the advice of a guidebook and arrived very early to avoid the tourist buses — which was the right call, except that Greek punctuality runs about 20 minutes behind the opening time (the staff was comfortably inside having breakfast on the terrace, even though they had seen us looking up from below). Then, fortunately, the head of staff arrived and promptly called them to order. Getting back to the monastery: it is very beautiful and quite large. The museum section is wonderful and full of true masterpieces and treasures. It is an unmissable part of Patmos.","codes":{"religious_register":["conventional"],"sensory_modalities":["vision"],"facility_complaints":["access_hours"],"tone_toward_constraints":"frustrated","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"staff opened ~20min late; access_hours fired on Greek-punctuality complaint"}},"777":{"id":777,"site":"monastery","plat":"tripadvisor","rating":"2","text":"Che peccato! \n What a Shame! — In my opinion, the view from the t
