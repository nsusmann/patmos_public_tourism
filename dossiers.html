ter":1}},"262":{"id":262,"site":"cave","plat":"tripadvisor","rating":"5","text":"Do not miss \n Do not miss Half way up the hill, the location has a commanding view. The cave  has been subsumed - like so many Christian sites - by a chapel. Got there at opening time so very few people.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1,"topography_register":1,"view_centrality":"mentioned"}},"264":{"id":264,"site":"cave","plat":"tripadvisor","rating":"5","text":"A Moving Experience \n A Moving Experience From the approach to the cave their are lovely views, we were only able to pay a fairly short visit to the chapel as there was a service being held. There was a lovely atmosphere in the cave especially with the sound of chanting. It was amazing to stand where St John had lived all those centuries ago.","codes":{"time_pressure":1,"religious_register":["doctrinal"],"sensory_modalities":["sound"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'only able to pay a fairly short visit' = time_pressure; chanting = sound","acknowledges_historical_cultural":1,"view_centrality":"mentioned"}},"266":{"id":266,"site":"cave","plat":"tripadvisor","rating":"5","text":"Evangelist John \n Evangelist John John wrote the Book of Revelations in 95 AD.  Centuries later and pilgrimages from all over the world, the cave is still a popular stop over for thousands of people to feel the tranquility and devoutness it gives.  As an aside, I lost my passport on this Island and someone turned it in to the police.  I was on another Island a couple of days later when I discovered it missing.  The police sent it by ferry the next day with the captain.  A miracle, if there every was one.  So glad I lit the candles.","codes":{"religious_register":["doctrinal","mystical"],"worth_assessment":"worth_it","devotional_contact":1,"review_is_useful":1,"coding_notes":"'lit the candles' = devotional_contact; passport-return narrated as 'a miracle' = mystical","devotional_participation":1,"acknowledges_historical_cultural":1,"atmospheric_register":1}},"267":{"id":267,"site":"cave","plat":"tripadvisor","rating":"5","text":"Peaceful & Moving \n Peaceful & Moving This is the cave that St. John the Evangelist, one of Jesus' twelve apostles was exiled to. It is where it is said that he received his vision of fire and brimstone and dictated the Book of Revelation. The cracks in the cave are said to be caused by the voice of God. The spot where he rested his head and the place where he used his hand to pull himself up have been marked with silver. This is a beautiful place to just sit and meditate whether you are a believer or not. There is a feeling of peace in this grotto even though It is a popular place for tourist and pilgrims.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'is said' hedges; silver-marked spots specific vision","atmospheric_register":1,"topography_register":1}},"268":{"id":268,"site":"cave","plat":"tripadvisor","rating":"5","text":"Αιγαιοπελαγιτικη Ιεροτητα \n Aegean Holiness A symbol of Christianity. If nothing else, a visit to the place where Saint John wrote the Book of Revelation is a must.","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","review_is_useful":1}},"270":{"id":270,"site":"cave","plat":"tripadvisor","rating":"4","text":"Significant, but crowded \n Significant, but crowded Realizing that tourist 'attractions' can attract lots of people, we found ourselves wishing for a more 'peaceful and contemplative' time in this Holy place. The alleged place where John had a vision and thereafter wrote the book of Revelation was fairly small and several bus loads of tourists crowded in. \nStill, this was a remembrance of a significant event in Christian history.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"mixed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'alleged place where John had a vision' hedges","acknowledges_historical_cultural":1}},"271":{"id":271,"site":"cave","plat":"tripadvisor","rating":"5","text":"Saint John Apocalypse Cave \n Saint John Apocalypse Cave This is the place that pilgrims of all over the world come to visit.\nIts one of the only 3 places where God reveals himself.\nIts beautiful, highly emotional.\nThere is a new gate access to help people with limited mobility, yet is not the most easy place to visit, but improvement has been made.\nEvery person coming to Patmos should take time to visit the cave and the church of Saint Anna which is next to it.","codes":{"religious_register":["conventional","doctrinal","mystical"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'one of only 3 places where God reveals himself' mystical-claim","on_site_movement":["accessibility_concern"]}},"272":{"id":272,"site":"cave","plat":"tripadvisor","rating":"5","text":"Johanneksen Ilmestysluolassa kannattaa käydä \n Worth visiting John's Cave of the Apocalypse Take the bus from Skala to the Cave of the Apocalypse. A wonderful experience, walking down the stairs into the cave. The Apostle John wrote the Book of Revelation there.\nIn August and September, wonderful outdoor concerts are held outside the cave, free of charge. After the concerts, walk down the road to the town of Skala (a flashlight sometimes comes in handy). A wonderful experience.","codes":{"ascent_mode":"motorized","religious_register":["doctrinal"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"outdoor concerts = active institution","descent_mode":"walked","on_site_movement":["stairs_down"]}},"273":{"id":273,"site":"cave","plat":"tripadvisor","rating":"5","text":"A place of wonder \n A place of wonder It doesn't take many people to fill this small cave but there is a sense of peace and quiet which is timeless. Not hard to imagine St John taking refuge there from the Romans and producing words that have intrigued, baffled and comforted generations of Christian people.","codes":{"religious_register":["doctrinal"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1}},"274":{"id":274,"site":"cave","plat":"tripadvisor","rating":"5","text":"INSPIRING AND UNFORGETABLE! \n INSPIRING AND UNFORGETABLE! This is the cave where St. John wrote sections of his biblical gift to the world. Absolutely wonderful to see and behold! Worth a special effort for everyone especially those of the Christian faith!","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","doctrinal"],"effort_valence":"positive","worth_assessment":"worth_it","review_is_useful":1}},"275":{"id":275,"site":"cave","plat":"tripadvisor","rating":"5","text":"This is where Apostole Pavlos ..... \n This is where Apostole Pavlos ..... .... lived the last years of his life.\nIt is a monastery in within the rocks which has now been updated to accommodate the large number of visitors every year.\nThere is a priest who will act as a guide and talk to visitors about the history the Monastery.\nA holy place whichis very popular with locals and visitors.","codes":{"religious_register":["conventional"],"mediation":"relays","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"factual error: 'Apostole Pavlos' (confuses Paul/John); priest-as-guide","topography_register":1}},"277":{"id":277,"site":"cave","plat":"tripadvisor","rating":"5","text":"un luogo speciale \n A special place It is the cave where Saint John was imprisoned and where he witnessed the Apocalypse. A holy, powerful place — for Catholics, for the Orthodox, for everyone. To be visited without hurry (there is apparently little to see: a rock, monks guarding its memory, icons of Saint John; but that is the essence: to see with the heart, you must linger, have time and silence)","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","austerity_register":"appreciative","review_is_useful":1,"coding_notes":"'see with the heart' austerity-as-essence","atmospheric_register":1}},"278":{"id":278,"site":"cave","plat":"tripadvisor","rating":"5","text":"Μοναδικό!!! \n Unique!!! A deeply moving atmosphere... And the words of the elder flooded our souls... Reverence... Devotion... Emotion... Blessing...","codes":{"mediation":"relays","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'words of the elder flooded our souls'","atmospheric_register":1}},"279":{"id":279,"site":"cave","plat":"tripadvisor","rating":"5","text":"The newly built entrance makes it easier to visit. \n The newly built entrance makes it easier to visit. I've been here many times just to sit in the peace of the cave. A true piece of history that still has an impact on life today. Well worth a visit.","codes":{"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"on_site_movement":["posture_pause"]}},"280":{"id":280,"site":"cave","plat":"tripadvisor","rating":"5","text":"Δεν υπάρχουν λόγια \n There are no words Just the idea that in the very spot where you are praying, God appeared and dictated the Book of Revelation to Saint John, stops you in your tracks!!!","codes":{"religious_register":["doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1,"coding_notes":"'where you are praying' = enacted prayer at sacred site","devotional_participation":1}},"282":{"id":282,"site":"cave","plat":"tripadvisor","rating":"5","text":"Δεος \n Awe You feel unique, one-of-a-kind emotions the moment you find yourself in the place where one of the greatest Fathers of the Church lived and wrote illuminated, one-of-a-kind texts. Only awe can be felt by those who come into contact with this breathtaking place. You feel the greatness of the Almighty. No one should miss it. A unique experience.","codes":{"religious_register":["conventional","doctrinal","mystical"],"sensory_modalities":["embodied"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'greatness of the Almighty' mystical-doctrinal"}},"283":{"id":283,"site":"cave","plat":"tripadvisor","rating":"3","text":"κατανυξη \n Reverence Arriving at the site and descending the stairs that lead to the cave where John lived for a short time and wrote the Book of Revelation, you feel a deep reverence. The place is small, and if you happen to visit on a crowded day, the magic is lost.\nWe were lucky because at that moment we came across a group of Russians being given a tour by the monk in Greek with a translator, so we were able to listen to the entire story and how the Book of Revelation was written.","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"relays","enclosure_exposure":"enclosed","worth_assessment":"mixed","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'magic is lost' if crowded; monk-relays via translator","atmospheric_register":1,"on_site_movement":["stairs_down"]}},"284":{"id":284,"site":"cave","plat":"tripadvisor","rating":"3","text":"visita suggestiva ma scarna \n Evocative but sparse When in Patmos, you can't skip a visit to the place where — according to local tradition — the apostle John in exile is said to have written the Book of Revelation, later included in the Bible. The visit, however, is sparse and devoid of anything noteworthy beyond the \"spirituality\" of the legendary location.\nIt is a small structure on the promontory above Skala, ending in a small Orthodox chapel dedicated to Saint John. Worth seeing, but without excessive expectations","codes":{"elevation_mention":1,"religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"mixed","review_is_useful":1,"coding_notes":"'according to local tradition' hedges; 'spirituality' in scare quotes","topography_register":1}},"285":{"id":285,"site":"cave","plat":"tripadvisor","rating":"5","text":"Ιδιαίτερο \n Special A space that, with the help of the priest, transports you to another era. This sacred place is a must-visit whether you are a believer or not, to see with your own eyes all that is referred to in written texts.","codes":{"religious_register":["doctrinal"],"mediation":"relays","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1}},"286":{"id":286,"site":"cave","plat":"tripadvisor","rating":"5","text":"Εξαιρετικο \n Outstanding Awe, reverence, and emotion are the feelings it stirs in you.\nThe words of John at the entrance set your mind to thinking.\nCongratulations to the priest for the tour he gave us.","codes":{"religious_register":["doctrinal"],"mediation":"relays","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"atmospheric_register":1}},"287":{"id":287,"site":"cave","plat":"tripadvisor","rating":"2","text":"Mah \n Meh The entrance costs €2 per person. We went into the cave and it's nice in the sense that it's a very decorated but very small church. The guide only speaks Greek so we Italians, not understanding anything, walked out of the little church, but we realized there was nothing else to see. In my opinion they shouldn't charge an admission fee — it doesn't make sense....","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"worth_assessment":"not_worth_it","enclosure_exposure":"enclosed","facility_complaints":["signage","prices"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'shouldn't charge admission fee — doesn't make sense' = prices critique"}},"290":{"id":290,"site":"cave","plat":"tripadvisor","rating":"5","text":"Cave of Apocalypse \n Cave of Apocalypse The apostle Sant John lived here in this cave; it's a half room, 3,5 m deeply in the mountain, splendid icones are to admire and shinning chandeliers; Sant John had his Vision at this place, and during 18 month he wrote his Apocalyse in his modest, now holy cave.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","austerity_register":"appreciative","review_is_useful":1,"coding_notes":"'splendid icones', 'shinning chandeliers' specific vision; 'modest, now holy cave' austerity","topography_register":1}},"291":{"id":291,"site":"cave","plat":"tripadvisor","rating":"5","text":"Ανεπανάληπτο!!!!!!!!!!!!!!!!!!!!!!!!!! \n Unmatched!!!!!!!!!!!!!!!!!!!!!!!!!! I was blessed to walk the sacred ground that SAINT JOHN THE THEOLOGIAN himself walked upon. I felt awe inside the Cave of the Apocalypse and boundless emotion, especially when a monk recounted for us all the events that took place in that holy site. I would love to go back...........","codes":{"religious_register":["conventional","doctrinal"],"mediation":"relays","worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'walk the sacred ground that SAINT JOHN himself walked' = enacted footsteps mimetic","atmospheric_register":1}},"294":{"id":294,"site":"cave","plat":"tripadvisor","rating":"4","text":"Deeply religious very small opening in the rock \n Deeply religious very small opening in the rock Nothing more than a very small cave in the rocks. From the perspective of faith and religion off course all Christians (at least) should visit and see where Apocalypse was written.","codes":{"religious_register":["doctrinal"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'all Christians (at least) should visit' addresses but not first-person","topography_register":1}},"295":{"id":295,"site":"cave","plat":"tripadvisor","rating":"5","text":"Δέος \n Awe It is deeply moving to be able to attend the Cave of the Apocalypse where Christ himself appeared. I wish everyone in the world could come and worship.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'Christ himself appeared' narrated assertively","atmospheric_register":1}},"296":{"id":296,"site":"cave","plat":"tripadvisor","rating":"5","text":"Understand the future \n Understand the future This may be where John the apostle had a vision of the future from God. It is interesting and inspires you to read the book of Revelation, and to understand John better.  Don't miss it.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'This may be where' hedges"}},"297":{"id":297,"site":"cave","plat":"tripadvisor","rating":"5","text":"Σπήλαιο \n Cave Wonderful and clean space. The surroundings are being perfected and the interior is maintained in excellent condition. The space emits an aura of peace and tranquility!!!","codes":{"religious_register":["mystical"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'aura of peace and tranquility' mystical","atmospheric_register":1}},"298":{"id":298,"site":"cave","plat":"tripadvisor","rating":"5","text":"Il luogo Sacro di Patmos. \n The Sacred Place of Patmos. Beautiful — I have no words. \nWe entered this magical place very early and were lucky enough to attend Holy Mass. Fortunately, we were the only tourists among the locals; the cave is very small and after a short time the air ran out, even though it was early morning. \nI'm sorry to have seen negative reviews on this site. I certainly believe those reviews were written by people who were not suited for this and who would do well to avoid visiting certain places of worship.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"mediation":"endorses","sensory_modalities":["embodied"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'magical place'; 'air ran out'; dismisses skeptic-reviewers as 'not suited' = insider stance","devotional_participation":1,"topography_register":1}},"299":{"id":299,"site":"cave","plat":"tripadvisor","rating":"4","text":"Affascinante \n Fascinating Although the cave is a very small and cramped place with no particular attractions...staying in silence in this place and thinking about its historical significance gives you deep emotions and helps the spirit reconcile with the true meaning of the religious message. Definitely one of the places in Patmos not to be missed during your vacation","codes":{"religious_register":["doctrinal"],"sensory_modalities":["embodied"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1}},"301":{"id":301,"site":"cave","plat":"tripadvisor","rating":"2","text":"Deludente \n Disappointing My visit didn't even last twenty minutes: a room with icons, a small \"choir\" (as one would say for Catholic churches) or in any case a place of prayer, and a space that looked more like a crypt than a cave","codes":{"tourist_mode":"tourist_consumer","religious_register":["conventional"],"worth_assessment":"not_worth_it","enclosure_exposure":"enclosed","review_is_useful":1,"coding_notes":"'didn't even last twenty minutes... more like a crypt than a cave'"}},"302":{"id":302,"site":"cave","plat":"tripadvisor","rating":"5","text":"Incontournable \n A must-see The main attraction of the island. Not to be missed. Above all, a place for prayer and reflection. Come here to pray.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"coding_notes":"'Come here to pray' + 'place for prayer and reflection' = enacted"}},"303":{"id":303,"site":"cave","plat":"tripadvisor","rating":"4","text":"A reason to stop ... \n A reason to stop ... For religious people this is the main reason why to stop on this island. The church is original and always crowded.","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1}},"304":{"id":304,"site":"cave","plat":"tripadvisor","rating":"3","text":"Manastıra çıktıysanız uğrayın \n Stop by if you've gone up to the monastery It's located on the road as you come down from the monastery. It is believed that the last book of the Bible was written based on a revelation that came to St. John here. A small cave. 15–20 minutes is enough to visit.","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'It is believed' hedges","topography_register":1}},"305":{"id":305,"site":"cave","plat":"tripadvisor","rating":"4","text":"La grotta dell 'apocalisse \n The Cave of the Apocalypse The cave is still there, at least the original part; over the centuries they built part of a monastery around it. The chapel is inside the enlarged cave. And everything, apart from the religious vestments, is still as it was in 95 AD. Very moving!!","codes":{"religious_register":["doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1}},"306":{"id":306,"site":"cave","plat":"tripadvisor","rating":"5","text":"Moving place \n Moving place If you have any idea of the history of this Island you know about the Apostle John his memory and God's love for Mankind in showing Himself through the Bible writings. and his vision from God of the Last Book of New Testament - Revelation of Jesus CHrist. THis is possibly the place but if not still honors that memory.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"hedges","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'possibly the place but if not still honors that memory'","acknowledges_historical_cultural":1}},"307":{"id":307,"site":"cave","plat":"tripadvisor","rating":"5","text":"Suggestiva \n Evocative The Cave of the Apocalypse is truly evocative; the entrance ticket costs €2, and unfortunately you can't take photos inside. The visit is truly recommended!","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","review_is_useful":1}},"308":{"id":308,"site":"cave","plat":"tripadvisor","rating":"4","text":"A sacred destination \n A sacred destination The Cave of the Apocalypse (also known as the Holy Grotto of the Revelation), is situated about halfway up the mountain between the villages of Chora and Skala.\n\nIt is a very popular destination for tourists, pilgrims and locals.\n\nIt is within walking distance along the historic trail up from Skala (1.5km), or down from Chora (1.6km).\n\nThere is a regular bus service that takes you along the winding road and drops you close to the entrance, which is much easier.\n\nNo pictures are permitted within the sacred cave and church of Saint John the Divine, although it seems people did not respect this anyway.\n\nWell worth a visit and the views over the bay from here are stunning, especially in the late afternoon.","codes":{"elevation_mention":1,"town_hill_contrast":1,"topography_quoted_phrase":"halfway up the mountain between the villages of Chora and Skala","religious_register":["conventional","doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","facility_complaints":["photography_restrictions"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"view_centrality":"mentioned","descent_mode":"walked"}},"309":{"id":309,"site":"cave","plat":"tripadvisor","rating":"5","text":"World heritage monument \n World heritage monument One of the most holy places in the Mediterranean Sea, the place where the Apostole St. John wrote the last book of the new Tastement, the Revelation. On the rock you can see the very place where he put his head while he was lying and the very place he touched with his hand. Thousands of tourists and pilgrims visit this place and it is definitely worth it","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_heritage_protection":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"311":{"id":311,"site":"cave","plat":"tripadvisor","rating":"5","text":"Impressionnant \n Impressive To all those who believe or not, I recommend going to see this very impressive place with its intense energy. The icons are magnificent!","codes":{"religious_register":["mystical"],"sensory_modalities":["vision"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'intense energy' mystical; 'icons are magnificent' specific","energy_register":1}},"312":{"id":312,"site":"cave","plat":"tripadvisor","rating":"4","text":"Δέος και κατάνυξη! \n Awe and devotion! It is unthinkable to be in Patmos and not visit the cave. Whether you are a Christian or not, the awe that its history inspires is unique. Furthermore, the view from up above is breathtaking. The chants you hear soothe your soul and calm you! All faithful, come forth!","codes":{"elevation_mention":1,"religious_register":["conventional","doctrinal"],"sensory_modalities":["sound","embodied"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'chants you hear' = sound","acknowledges_historical_cultural":1,"atmospheric_register":1,"view_centrality":"mentioned"}},"313":{"id":313,"site":"cave","plat":"tripadvisor","rating":"4","text":"Таинственное место \n A mysterious place This Cave of the Apocalypse is located halfway between the port of Patmos in Skala and the town of Patmos. The place is also known as the Sacred Grotto. According to legend, Saint John took refuge in this cave during his exile by order of the Roman Emperor Domitian. Today, a monk sits in the cave and tells tourists stories of the Apocalypse and stories from the life of Saint John, showing the stones on which, according to tradition, he slept using them as a pillow. A quite interesting place, worth visiting.","codes":{"town_hill_contrast":1,"religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'According to legend', 'according to tradition' hedges","acknowledges_historical_cultural":1,"topography_register":1}},"314":{"id":314,"site":"cave","plat":"tripadvisor","rating":"4","text":"Da non perdere \n Not to be missed We were there first thing in the morning while a religious ceremony was underway. The place itself invites silence, but in this case the chanting and prayer did the rest","codes":{"sensory_modalities":["sound"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"atmospheric_register":1}},"316":{"id":316,"site":"cave","plat":"tripadvisor","rating":"5","text":"qui san giovanni \n it is said that Saint John wrote the Book of Revelation here, in this cave that has something sacred and magical about it. Very beautiful and touching for its spirituality.","codes":{"religious_register":["doctrinal","mystical"],"mediation":"hedges","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'magical' mystical; 'it is said' hedges"}},"318":{"id":318,"site":"cave","plat":"tripadvisor","rating":"5","text":"Il cuore mistico di Patmos, il Luogo Sacro per eccellenza \n The mystical heart of Patmos, the Sacred Place par excellence The experience in the Cave of the Apocalypse must be lived in silence and contemplation. The underground chamber is a sacred place, a return to origins. Go there only if you are able to show respect for the sacredness of this place; otherwise, show equal respect by staying out.","codes":{"religious_register":["conventional","doctrinal","mystical"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","austerity_register":"appreciative","review_is_useful":1,"coding_notes":"'mystical heart of Patmos'; 'show equal respect by staying out' insider gatekeeping","atmospheric_register":1,"topography_register":1}},"319":{"id":319,"site":"cave","plat":"tripadvisor","rating":"5","text":"Holy place for Christians \n Holy place for Christians If you are Christian this is an amazing place and full of peace. The Apostle John was exiled to Patmos and blinded according to history. He was in this cave when the lightning struck the cave and cracked the rock above his head. The amazing thing is that although he was blind physically he was given \"sight\" to see the heavenly vision recorded in his Acopolypse","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"relays","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'If you are Christian' addresses but not first-person","acknowledges_historical_cultural":1,"atmospheric_register":1,"topography_register":1}},"321":{"id":321,"site":"cave","plat":"tripadvisor","rating":"5","text":"Святое место \n A holy place It's hard to wrap your head around it. Saint John the Theologian himself lived here. The view from the cave is quite remarkable. It's strange that a person wrote such a dark story in a place like this.","codes":{"religious_register":["doctrinal"],"enclosure_exposure":"both","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'strange that a person wrote such a dark story in a place like this' juxtaposition observation","view_centrality":"mentioned"}},"323":{"id":323,"site":"cave","plat":"tripadvisor","rating":"5","text":"Impactante \n Impactful Regardless of your religion, if you're a history enthusiast and an avid reader, you will be moved to see this significant place. The cracked rock in the center of the cave that doesn't fall is impressive.","codes":{"religious_register":["doctrinal"],"sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'cracked rock that doesn't fall' specific vision","acknowledges_historical_cultural":1,"topography_register":1}},"325":{"id":325,"site":"cave","plat":"tripadvisor","rating":"3","text":"Bitter sweet experience \n Bitter sweet experience Being a Christian this was a main reason behind heading to Patmos island. Although the island itself is breathtaking we were a little disappointed by the way the cave had been developed. In my mind I had pictured a simple and somber place. It has now been changed into a church with seating, paintings etc. \n\nAlthough underwhelming it was still a moving experience.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"sensory_modalities":["embodied"],"worth_assessment":"mixed","religious_self_id":"christian_general","austerity_register":"appreciative","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Being a Christian this was a main reason' explicit Christian self-ID + motivation; austerity-disappointment with development"}},"326":{"id":326,"site":"cave","plat":"tripadvisor","rating":"5","text":"Dans le cœur de Saint Jean ... \n In the heart of Saint John ... The cult site of the island of Patmos, the cave where Saint John the Evangelist lived when he had the vision of the Apocalypse. \nThis place is now transformed into a chapel for prayers and wishes...WHERE icons and candles illuminate our hearts in the beauty of the Orthodox rite. Emotion.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'beauty of the Orthodox rite' = recognizes-active"}},"328":{"id":328,"site":"cave","plat":"tripadvisor","rating":"3","text":"Different \n Different When we were going to the cave people were praying. It was very interesting. The priest was speaking in greek so we were not able to understand anything.","codes":{"religious_register":["conventional"],"facility_complaints":["signage"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"worth_assessment":"worth_it","review_is_useful":1}},"329":{"id":329,"site":"cave","plat":"tripadvisor","rating":"5","text":"A Very Moving Personal Experience \n A Very Moving Personal Experience I was surprised by how much this site has been turned into what appears to be a bit of a pilgrimage site.  Somehow, I expected it to be in exactly the condition it was when John was exited here 20 centuries ago.  Nonetheless, once inside it was really worthwhile.  You can definitely get the feel of how it must have been for John.  After getting over my initial surprise, I personally found being in the cave a very moving experience.","codes":{"religious_register":["doctrinal"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1}},"330":{"id":330,"site":"cave","plat":"tripadvisor","rating":"4","text":"Biblical Site \n Biblical Site We visited the cave as part of a large busload of people from the cruise ship, our experience was hurried and crowded filing through.  Before entering, our guide did provide descriptions of the cave and showed pictures of the highlights.  That was helpful but it would better to visit in small groups with more time to reflect on the significance of this site.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","time_pressure":1,"mediation":"relays","worth_assessment":"mixed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'hurried and crowded filing through' explicit pressure"}},"331":{"id":331,"site":"cave","plat":"tripadvisor","rating":"5","text":"Δέος!!! \n Awe!!! A place that sends shivers down your spine and fills you with awe. The cracks symbolize the Holy Trinity, while tradition says that through them God dictated the text of Revelation to John. The interior is unique","codes":{"religious_register":["doctrinal"],"mediation":"relays","enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'tradition says' relays","topography_register":1}},"333":{"id":333,"site":"cave","plat":"tripadvisor","rating":"4","text":"Interesting historical site \n Interesting historical site The grotto itself is not a big attraction, but if you know that it's a place where The Book of Revelations was written by St. John, you could feel the spirit of ancient times. There is a nice path from the St. John Monastery to the cave, so don't be lazy to come here by foot, the place is worth a visit.","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"descent_mode":"walked"}},"334":{"id":334,"site":"cave","plat":"tripadvisor","rating":"5","text":"Αφεθείτε στην μαγεία!!!!!!! \n Let yourself be swept away by the magic!!!!!!! dear friends! When you visit the cave, let go and travel back in time to when Saint John the Theologian envisioned all those wondrous things he dictated to his disciple Prochorus and that are described in the Book of Revelation! simply let go and feel the sacredness of the place..","codes":{"religious_register":["doctrinal","mystical"],"worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'magic' + 'feel the sacredness'","topography_register":1}},"335":{"id":335,"site":"cave","plat":"tripadvisor","rating":"5","text":"Muy emocionante \n Very moving Even if the legend that Saint John wrote the Book of Revelation here were not true, the place is worth it. It has a very special atmosphere. It is carved into the rock and has a small attached church. Words don't do it justice.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'Even if the legend...were not true' doubts but worth-anyway","topography_register":1}},"337":{"id":337,"site":"cave","plat":"tripadvisor","rating":"5","text":"Very interesting \n Very interesting Well worth the visit you can either catch the bus from the town square or hike up if you are fit . It is a very interesting historic site where John wrote the book of revaluations . There are quite a few steep stairs to get down to the cave .","codes":{"elevation_mention":1,"religious_register":["doctrinal"],"effort_valence":"positive","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["stairs_down"]}},"338":{"id":338,"site":"cave","plat":"tripadvisor","rating":"5","text":"Indrukwekkend! \n Impressive! A truly wonderful experience, both for me and for my husband. I'm a believer, so for me it had an extra layer of meaning. My husband is not a believer, but he was also very impressed. Of course, a book was written there some 2000 years ago............the historical value alone was very impressive for both of us.","codes":{"religious_register":["conventional","doctrinal"],"worth_assessment":"worth_it","religious_self_id":"christian_general","review_is_useful":1,"coding_notes":"'I'm a believer' first-person Christian-implied self-ID","acknowledges_historical_cultural":1}},"342":{"id":342,"site":"cave","plat":"tripadvisor","rating":"5","text":"My knees buckled! \n My knees buckled! I cannot explain the feeling that came over me when I entered the cave. As a christian I had read of this place in the Bible. But as was my feeling in many places in Greece, I was struck with the awe of it actually being a real place, and I was standing there. I really think you have to be a christian or history buff to truly appreciate the Cave. \nI sat on one of the benches and could not speak for a while.  Tears welled up in my eyes and I could feel the history and the presence .\nIt was not crowded and people come and go as they please. You must dress appropriately to enter the cave so women should wear long skirts and carry a shawl to cover yourself with as is true for all churches in greece. I find it important to respect the customs when I am visiting a country...","codes":{"religious_register":["conventional","doctrinal","mystical"],"mediation":"endorses","sensory_modalities":["embodied"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","religious_self_id":"christian_general","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'As a christian' explicit; 'knees buckled', 'tears welled', 'feel the presence' embodied/mystical","acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["posture_pause"]}},"343":{"id":343,"site":"cave","plat":"tripadvisor","rating":"4","text":"An Important Glimpse into Early Christian History--St. John's Cave \n An Important Glimpse into Early Christian History--St. John's Cave After dark on 25 September, my party descended the ancient stone staircase to the \"apokalipsi,\" the site of the cave reputed to be St. John's place of refuge in his exile to Patmos by Roman authorities.  Joined to the cave is a tiny Byzantine chapel, and in these adjoining spaces a male choir chanted and the faithful and curious alike crowded to listen, to worship, to light a candle in anticipation of the celebration of St. John's resurrection on Sept 26, or just to watch and think about the ancient ritual and the tradition tied to this spot: John's dictating the New Testament Book of Revelation upon waking from a dream.  Given the influence of John's imaginings of heaven captured in Revelation--the horsemen of the apocalypse, the city on a hill, etc.--the experience of walking from the 21st c. into a cave that tied us directly to 95 CE was a quietly rich few moments.  It will not be everyone's cup of tea. But for those who welcome opportunities to witness a culture honoring its unique local tradition or to reflect on our links to the distant past, it was a very special evening.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional","doctrinal"],"mediation":"hedges","sensory_modalities":["sound"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'reputed' hedges; male choir chanting; St John's resurrection celebration anticipation","acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["stairs_down"]}},"344":{"id":344,"site":"cave","plat":"tripadvisor","rating":"5","text":"Intriguing \n Intriguing The Cave of the Apocalypse was an experience worth taking, in my opinion. I'm not a religious person, but the history and sacredness of it makes it special. There is a lot of walking up and down steep, uneven stairs so wear comfortable clothes and water. The walk takes more time than spending time in the actual cave. The cave is small and crowded so be aware of that.","codes":{"ascent_mode":"walked","religious_register":["doctrinal"],"effort_valence":"positive","enclosure_exposure":"enclosed","worth_assessment":"worth_it","religious_self_id":"spiritual_not_religious","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'I'm not a religious person' explicit first-person disavowal","acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["stairs_down","stairs_up"]}},"346":{"id":346,"site":"cave","plat":"tripadvisor","rating":"5","text":"special place \n special place It is a Biblical sight & you may not be your thing but id visit it just for the spectuclar views alone It was extra special as a child I learnt about John so had some knowledge and as our ship called there I couldn't miss it I wasn't disappointed Very busy & the Catholics who love to make Biblical there own if you past that its wonderful","codes":{"trip_mode":"cruise_excursion","religious_register":["conventional","doctrinal"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"dismissive","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"Protestant-flavored anti-Catholic jab; held unspecified self-ID","view_centrality":"central"}},"347":{"id":347,"site":"cave","plat":"tripadvisor","rating":"3","text":"修道院へ寄るならついでに観光できます \n Worth a detour if you're visiting the monastery. It's located on the way to the Monastery of Saint John, which sits atop a hill above the town of Chora. Getting there on foot is tough (especially in summer), so I'd recommend chartering a taxi. Since I wasn't particularly interested in Christianity, I personally didn't feel it was necessary to stop at Patmos just for this.","codes":{"ascent_mode":"motorized","visit_season":"peak_may_aug","elevation_mention":1,"town_hill_contrast":1,"worth_assessment":"not_worth_it","religious_self_id":"spiritual_not_religious","weather_complaints":["heat"],"tone_toward_constraints":"dismissive","review_is_useful":1,"coding_notes":"'I wasn't particularly interested in Christianity' first-person disavowal","topography_register":1}},"348":{"id":348,"site":"cave","plat":"tripadvisor","rating":"5","text":"In the steps of Apostle John \n In the steps of Apostle John It was nice to be in the grotto where the Apostle John wrote the Revelation. I sat there for a long time reading in the Bible.","codes":{"religious_register":["doctrinal"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1,"coding_notes":"reads Bible in cave-of-Revelation = enacted scriptural mimetic","topography_register":1,"on_site_movement":["posture_pause"]}},"349":{"id":349,"site":"cave","plat":"tripadvisor","rating":"5","text":"聖ヨハネが黙示録の啓示を受けた洞窟 \n The cave where Saint John received the revelation of the Book of Revelation. The whole complex has become a monastery, and you can still see sisters dressed in traditional habits. From the outside, the cave looks like a room within the monastery, and it is located at the very bottom after descending a flight of stairs. Inside, however, it is bare rock — a true cave (though some reinforcement and restoration work has presumably been done) — and it is not very tall or deep. In this cave, where Saint John stayed after being exiled to this island, you can still find the spot where he lay with his head resting (a slightly hollowed-out area) and the hollow in the rock where he placed his hand to stand up. On the walls are paintings depicting the scene when he received divine revelation, showing Christ accompanied by seven angels. Since Saint John was elderly at the time and could not write easily, he is said to have dictated to a disciple, and there is also a painting depicting that scene. The rock overhead — said to have cracked in the shape of a cross when the revelation was received — is just within arm's reach, and everyone was touching it. There is a small window to the left of the altar, through which you can still see the view of Patmos that Saint John must have looked upon.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"hedges","sensory_modalities":["vision"],"enclosure_exposure":"both","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'said to have' hedges; specific paintings of Christ+seven angels; 'everyone was touching it' observed but not explicit-self","topography_register":1,"view_centrality":"mentioned","on_site_movement":["stairs_down"]}},"350":{"id":350,"site":"cave","plat":"tripadvisor","rating":"5","text":"My spirit still soars! \n My spirit still soars! Attending part of a service in the cave simply stirred my spirit! What a wonderful experience. Would highly recommend this for anyone!","codes":{"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1,"topography_register":1}},"351":{"id":351,"site":"cave","plat":"tripadvisor","rating":"4","text":"haut lieu du christianisme ! \n A major Christian landmark! The cave of the 'Revelation' is a beautiful place now enclosed within built structures... and serves as a chapel where it's nice to rest after the climb from Skala...","codes":{"ascent_mode":"walked","elevation_mention":1,"town_hill_contrast":1,"religious_register":["doctrinal"],"effort_valence":"positive","enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"topography_register":1,"on_site_movement":["posture_pause"]}},"352":{"id":352,"site":"cave","plat":"tripadvisor","rating":"5","text":"Cave of Inspiration \n Cave of Inspiration It's worth visiting the cave where St. John allegedly received his vision for the book of revelation. A church chapel has been erected around it. A guide will show you where St. John leaned, where he placed his hands, etc... Leave it to the Greeks to fill in the gaps and weave a complete picture for you.\nI have to say though both my wife and I felt something when we first entered the cave.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"worth_it","tone_toward_constraints":"dismissive","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'allegedly', 'fill in the gaps and weave a complete picture' doubts; 'Leave it to the Greeks' dismissive","topography_register":1}},"353":{"id":353,"site":"cave","plat":"tripadvisor","rating":"3","text":"About what I expected. \n About what I expected. OK - it's a cave. The belief that Revelations was written there obviously gives it a special context, and most of my fellow visitors seemed to find it spiritually uplifting, with reverence and devotion much on display. Interesting to see if you are on Patmos (not a lot else) but not worth a special trip.","codes":{"religious_register":["doctrinal"],"worth_assessment":"not_worth_it","review_is_useful":1,"coding_notes":"observes others finding it spiritually uplifting from outside; 'OK - it's a cave'","topography_register":1}},"355":{"id":355,"site":"cave","plat":"tripadvisor","rating":"4","text":"Late season visit \n Late season visit Mid October trip to Patmos, first time, visited this on a quiet morning with only a few other Greeks. Understand it can get very busy in the summer, as the space only fits a certain number, but a unique atmosphere in this richly embellished cave/church. Only broken by the ? resident  priest delivering his spiel fast and bored by repetition in Greek to those others present...  But do brave all the steps down and up again to see this unique site.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["conventional"],"mediation":"relays","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'fast and bored by repetition' criticism of priest's affect","topography_register":1,"on_site_movement":["stairs_down","stairs_up"]}},"356":{"id":356,"site":"cave","plat":"tripadvisor","rating":"5","text":"One of the highlights of our trip \n One of the highlights of our trip It is believed to be the cave where John wrote the book of Revelation. It was a special place for me because of its simplicity. Only so many are allowed into this Holy Shrine so the experience becomes even more intimate. Our guide was excellent so the time spent was perfect. It is a little out of the way but well worth the visit.","codes":{"religious_register":["doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","worth_assessment":"worth_it","austerity_register":"appreciative","recognizes_active_institution":1,"review_is_useful":1,"topography_register":1}},"357":{"id":357,"site":"cave","plat":"tripadvisor","rating":"2","text":"Really Long line for a Small Cave \n Really Long line for a Small Cave In my personal opinion is not worth the wait, we waited more than an hour to go in to see only a very small cave where John of Patmos wrote the Book of Revelation for less than a minute.","codes":{"tourist_mode":"tourist_consumer","religious_register":["doctrinal"],"worth_assessment":"not_worth_it","enclosure_exposure":"enclosed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'waited more than an hour' for 'less than a minute' = consumer-frame","topography_register":1}},"358":{"id":358,"site":"cave","plat":"tripadvisor","rating":"5","text":"Extraordinaire \n Extraordinary. I went to visit Saint John's cave during my stay on Patmos. Simply wonderful! I went there 4 times because my wish was to read the Book of Revelation in the cave, the very place where God gave the revelation to John. \nHow enriching it was to be in this place in a spirit of prayer! Reading the Book of Revelation was wonderful! Being able to connect with the One who gave the revelation to John was, for me, a privileged moment.\nI encourage visitors not to merely visit a tourist attraction but to take the time, and seek the Lord Jesus, for John begins writing the book by saying \"the revelation of Jesus Christ\" and ultimately He is the author of the book!","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","doctrinal"],"mediation":"endorses","enclosure_exposure":"enclosed","worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"4 visits to read Revelation in cave = enacted scriptural mimetic + sought motivation","devotional_participation":1,"topography_register":1,"on_site_movement":["posture_pause"]}},"359":{"id":359,"site":"cave","plat":"tripadvisor","rating":"4","text":"Cool To See Short And Sweet Visit \n Cool To See Short And Sweet Visit It was very cool to see this cave and picture what went on there so many years ago.  It is really small and only takes a short time.  It is unique and a great piece of history that should be seen.","codes":{"religious_register":["doctrinal"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"360":{"id":360,"site":"cave","plat":"tripadvisor","rating":"4","text":"Interesting history \n Interesting history We walked down from the monastery and it was a hard walk because of all the uneven rocks along the path. We took a taxi back to the port. Visiting the cave was interesting but be very careful going down the steps. Someone in our group fell and had to have stitches on her face. It's a small building so won't take long to have a look. I'm glad we included it on our day trip from our cruise ship.","codes":{"trip_mode":"cruise_excursion","elevation_mention":1,"town_hill_contrast":1,"effort_valence":"ambivalent","enclosure_exposure":"enclosed","worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"topography_register":1,"descent_mode":"mixed","on_site_movement":["accessibility_concern","stairs_down"]}},"361":{"id":361,"site":"cave","plat":"tripadvisor","rating":"3","text":"Just worth a short detour \n Just worth a short detour If you're not a Christian and you can't grasp the historical and religious value of this place, it's just a cave with a monastery built around it. Lots of working men doing their construction renovation around the place.","codes":{"religious_register":["conventional"],"worth_assessment":"mixed","facility_complaints":["amenities"],"tone_toward_constraints":"dismissive","review_is_useful":1,"coding_notes":"'If you're not a Christian' soft generic; renovation noise","acknowledges_historical_cultural":1,"topography_register":1}},"362":{"id":362,"site":"cave","plat":"tripadvisor","rating":"3","text":"Curiosa... \n Curious... Honestly, I didn't observe the religious fervor that other people talk about — to me it just seemed like a curious place, nothing more.\n\nShortly after we passed through, they shut the place down in a very rude manner — there was a somewhat peculiar priest who I think threw a massive fit.\n\nSupposedly, this is where the Apocalypse of the Bible was dictated.\n\nThe taxi will charge you 40 euros to take you to the cave and the monastery — there isn't much else to do, so that's what you get at a cruise ship stop.\n\nYou pay two euros and there are stairs with a significant drop — a bit inconvenient for people with limited mobility.","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","tourist_mode":"tourist_consumer","religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"not_worth_it","facility_complaints":["prices","access_hours"],"tone_toward_constraints":"frustrated","motivation_cruise_thing_to_see":1,"review_is_useful":1,"coding_notes":"'Supposedly' doubts; 'shut down rudely' access; 'rude priest threw a fit'","topography_register":1,"on_site_movement":["accessibility_concern","stairs_down"]}},"363":{"id":363,"site":"cave","plat":"tripadvisor","rating":"5","text":"The book of Revelation was revealed right here! \n The book of Revelation was revealed right here! This is reputed to be the location where St. John the Divine received the apocalyptic vision, known to us in the Bible as the book of Revelation. Well worth the visit, but as with many such sights in Greece, a healthy amount of scepticism is not out of order! Nonetheless, it has a wonderful Spirit of Place.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"worth_it","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'reputed', 'healthy amount of scepticism'; 'wonderful Spirit of Place'"}},"364":{"id":364,"site":"cave","plat":"tripadvisor","rating":"2","text":"Een attractie voor gelovige mensen voor mij was het niet wat \n An attraction for religious people — for me it wasn't. The Cave of the Apocalypse is somewhat similar to Lourdes. It's a kind of pilgrimage site where tourists are bused in en masse.\nFor me personally it was just barely worth it, but I'll be honest — I have no connection to religion.","codes":{"worth_assessment":"mixed","religious_self_id":"spiritual_not_religious","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1,"coding_notes":"'I have no connection to religion' first-person disavowal","topography_register":1}},"365":{"id":365,"site":"cave","plat":"tripadvisor","rating":"4","text":"A voir si possible sans groupe \n A must-see if possible without a group. A required stop on the way up to the monastery, we were lucky enough to visit without a busload of cruise passengers invading it. We were alone in the company of St. John... moving...","codes":{"elevation_mention":1,"town_hill_contrast":1,"religious_register":["doctrinal"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"accepting","review_is_useful":1}},"366":{"id":366,"site":"cave","plat":"tripadvisor","rating":"4","text":"Aqui reza que São João escreveu o Apocalipse \n This is where it is said Saint John wrote the Apocalypse. In this cave, Saint John the Evangelist most likely wrote the Book of Revelation. The site can be reached by taxi from the port. The cave is accessed via a long staircase. On the site there is a Greek Orthodox church. The visit is worthwhile for its symbolism and the significance of such an important passage depicted in the Bible.","codes":{"ascent_mode":"motorized","religious_register":["conventional","doctrinal"],"mediation":"hedges","enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'most likely wrote' hedges","topography_register":1,"on_site_movement":["stairs_down"]}},"369":{"id":369,"site":"cave","plat":"tripadvisor","rating":"3","text":"Take in the atmosphere. \n Take in the atmosphere. On returning from Skala there is a different route from the monastery of St. John which doesn't use the twisting normal bus route but uses a cobbled rough track which after around 15 minutes brings you to the cave of the Apocalypse building.\nThis building  has been erected around the cave  that is reputed to be where St. John received the prophesies and visions from God to enable him to write Revelations now in the bible. The cave is around 40 steps below street level so although there are handrails to assist you there are areas where underfoot the worn stones are slippy. It is worth sitting and looking out the cave to take in this attraction's atmosphere before coming out into the outside heat and the short walk of about 5 minutes to where the bus will pick you up at the entrance gates.","codes":{"visit_season":"shoulder_apr_sep_oct","religious_register":["doctrinal"],"mediation":"hedges","sensory_modalities":["touch_temperature"],"enclosure_exposure":"enclosed","weather_complaints":["heat"],"review_is_useful":1,"coding_notes":"'reputed to be' → hedges; sits to take in atmosphere","topography_register":1,"descent_mode":"mixed","on_site_movement":["accessibility_concern","posture_pause","stairs_down"]}},"370":{"id":370,"site":"cave","plat":"tripadvisor","rating":"4","text":"Imperdible, aunque no seas creyente \n A must-see, even if you're not a believer. It's amazing to visit this cave, full of history, where you can see on the wall of the grotto a triple crack through which John heard God dictating the Apocalypse to him. There is also the spot where he slept — it's very interesting.","codes":{"religious_register":["doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'triple crack' specific vision","acknowledges_historical_cultural":1,"topography_register":1}},"373":{"id":373,"site":"cave","plat":"tripadvisor","rating":"4","text":"Fin opplevelse \n A great experience. I walked to the cave from Skala. I knew little about what awaited me. When I entered the cave itself, there were quite a few people there. Two men stood singing. A priest was holding a small service, ending with communion. I walked around the cave and looked at the spot where he rested his head, held his hand, etc. Well worth a visit, though I may have been lucky to experience a service.","codes":{"ascent_mode":"walked","religious_register":["conventional"],"sensory_modalities":["sound","vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"communion service witnessed; specific spots noted","topography_register":1,"on_site_movement":["walking_around"]}},"375":{"id":375,"site":"cave","plat":"tripadvisor","rating":"1","text":"Molto deludente \n Very disappointing. It's a small cave converted into a little chapel, accessed through the ancient monastery. Stifling heat, often made worse by tour groups bused in with a guide who pack the place and kill any atmosphere. The monastery it's part of — certainly more interesting — is undergoing restoration work. Perhaps my position as an agnostic is a bit biased, but it didn't give me the slightest emotion. For a believer it may be different, but it really takes a lot of faith (and imagination) to believe that the crack in the ceiling of the cave represents the Trinity....","codes":{"religious_register":["doctrinal"],"mediation":"doubts","enclosure_exposure":"enclosed","worth_assessment":"not_worth_it","religious_self_id":"spiritual_not_religious","weather_complaints":["heat"],"facility_complaints":["crowding"],"tone_toward_constraints":"dismissive","review_is_useful":1,"coding_notes":"'my position as an agnostic' explicit first-person; 'takes a lot of faith and imagination'","acknowledges_historical_cultural":1,"topography_register":1}},"377":{"id":377,"site":"cave","plat":"tripadvisor","rating":"5","text":"Toccante \n Touching. Too bad there is renovation work underway on the exterior wall of the church built over the cave of Saint John... you go down several steps... you enter the church, part cave part church...\n\nWorth a visit.","codes":{"religious_register":["conventional"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"topography_register":1,"on_site_movement":["stairs_down"]}},"378":{"id":378,"site":"cave","plat":"tripadvisor","rating":"4","text":"Da vedere se si visita Patmos \n Worth seeing if you visit Patmos. As always, the Church manages to turn everything into money-making machines. Not that the place where Saint John wrote the Apocalypse doesn't deserve a (guided) visit, but the simplicity of the cave has been overwhelmed by many added structures.","codes":{"tourist_mode":"institutional_aware","religious_register":["doctrinal"],"mediation":"relays","worth_assessment":"worth_it","austerity_register":"appreciative","facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'simplicity overwhelmed by added structures' = austerity loss","topography_register":1}},"379":{"id":379,"site":"cave","plat":"tripadvisor","rating":"3","text":"Okay for a 20 minute visit \n Okay for a 20 minute visit Very hot day and the cave itself although impressive was also quite warm in side. Check for opening times before you go as they close some days. History of the cave is quite interesting","codes":{"religious_register":["doctrinal"],"worth_assessment":"worth_it","weather_complaints":["heat"],"facility_complaints":["access_hours"],"tone_toward_constraints":"accepting","review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1}},"380":{"id":380,"site":"cave","plat":"tripadvisor","rating":"5","text":"In the footsteps of the beloved disciple John. \n In the footsteps of the beloved disciple John. How can one describe the feeling, when you sit on a rock in the forest below the cave?\nImagining that he might have been sitting on the same spot, reflecting over his life together with Jesus Christ. Maybe wondering which of the other twelve had been killed and where they went. I love to sit there in contemplation, and have done so since the turning of the Millennium, but have yet not been into the cave itself. Why? Because that would be like ending a long journey, a pilgrim reaching his goal. My journey is still in the beginning, and I will soon enough see the cave, but not in the nearest future.","codes":{"religious_register":["doctrinal","mystical"],"enclosure_exposure":"exposed","worth_assessment":"worth_it","nature_mention":1,"nature_sub_codes":["flora_fauna"],"mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"deferred-pilgrimage from outside cave; 'sit in contemplation since the Millennium'; reaches goal not yet","topography_register":1,"on_site_movement":["posture_pause"]}},"381":{"id":381,"site":"cave","plat":"tripadvisor","rating":"5","text":"orthodox religion!!! \n orthodox religion!!! It is the place where according to the ortodox religion God inspired st. John to write the Apocalypse...No words can tell...","codes":{"religious_register":["doctrinal"],"mediation":"relays","worth_assessment":"worth_it","review_is_useful":1,"coding_notes":"'according to the orthodox religion' relays"}},"383":{"id":383,"site":"cave","plat":"tripadvisor","rating":"4","text":"A must for Christians \n A must for Christians An interesting journey down to the cave. quite funny how its in the middle of homes. but great chapel for it and good to have time to spend praying or listening to God. the whole island feels Godly and this is a lovely place.","codes":{"religious_register":["conventional","doctrinal","mystical"],"worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","review_is_useful":1,"coding_notes":"'praying or listening to God'; 'whole island feels Godly'","devotional_participation":1,"topography_register":1}},"386":{"id":386,"site":"cave","plat":"tripadvisor","rating":"4","text":"Good cave \n Good cave We went to this place on our cruise trip to greece and turkey.There are regular cabs available for cave and monastery.You have to walk down few steps .Go with a proper guide as there are some history.Calm and peaceful.Must visit in potmos","codes":{"ascent_mode":"motorized","trip_mode":"cruise_excursion","mediation":"relays","worth_assessment":"worth_it","motivation_cruise_thing_to_see":1,"review_is_useful":1,"acknowledges_historical_cultural":1,"topography_register":1,"on_site_movement":["stairs_down"]}},"390":{"id":390,"site":"cave","plat":"tripadvisor","rating":"5","text":"Mistico \n Mystical. An extraordinary experience... wrapped in an atmosphere of another era... almost the feeling that the great Saint was there breathing alongside us... Unfortunately, the history of this cave was told by a friar only in Greek... so we had to educate ourselves by buying texts in Italian... This took away a bit of the magic of the visit!","codes":{"religious_register":["mystical"],"mediation":"relays","enclosure_exposure":"enclosed","worth_assessment":"mixed","facility_complaints":["signage"],"tone_toward_constraints":"frustrated","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"'magic of the visit' diminished by Greek-only friar","acknowledges_historical_cultural":1,"topography_register":1}},"391":{"id":391,"site":"cave","plat":"tripadvisor","rating":"4","text":"Sito in posizione panoramica ma artefatto in funzione del turismo religioso \n Site with a panoramic position but staged for religious tourism. The visit took place between one tour group and the next, allowing us a few minutes to appreciate the mystical-religious atmosphere for which it was set up over the centuries. The setting, however, appears rather minimal and not particularly interesting for those who are not very interested in the supposed origins of the site. The iconography also leaves something to be desired.","codes":{"tourist_mode":"tourist_consumer","religious_register":["mystical"],"mediation":"doubts","worth_assessment":"mixed","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'supposed origins'; 'staged for religious tourism'","acknowledges_historical_cultural":1,"view_centrality":"mentioned"}},"392":{"id":392,"site":"cave","plat":"tripadvisor","rating":"5","text":"Beautiful, breathtaking, mysterious \n Beautiful, breathtaking, mysterious I have visited this cave, known also as the cave of The Revelation about 6 times. It's a beautiful place to go and spend some time. I strongly recommend that you either do research on its history, buy a book or get the guide book with the complete history on the spot. There is a lot of controversy over the history of the age of the cave itself, and as to which St. John was in exile there. I can tell you now, it was not the apostle St. John. \n\nThe cave is now enclosed, However, when St. John was hiding in exile there, it was exposed to the elements.\nWhere as Patmos was a place of exile, it is now a holy island .\nPlease respect appropriate attire and for ladies, avoid skimpy tops and shorts. It's very disrespectful as this is a holy place. \n\nWear a light shawl. Also, \nRefrain from taking any photos until you are out of the cave itself. All the cruise liner tourists do this although it's written everywhere not to. It will also upset the priest who is always there to protect the cave from this and safe guard the holy scriptures that are inside. \nI strongly advise you to avoid going up there on a Tuesday, Thursday and Saturday afternoon. That's the cruise liner days which arrive with masses of tourists. You will be overcrowded, very hot, and will not see much. They are there from 4-8pm . Unfortunately, these are the only days it opens in the afternoon. Otherwise. Everyone morning between 8-2pm entry is €2 euros. It is truly fascinating and people come from all over the world to see this. After visiting the cave, you could make your way up to the Monastery in Hora","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","doctrinal"],"mediation":"doubts","enclosure_exposure":"enclosed","worth_assessment":"worth_it","weather_complaints":["heat"],"facility_complaints":["crowding","photography_restrictions"],"tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"6 visits; 'not the apostle St. John' explicit doubts; insider stance advising others","sensory_modalities":["embodied"],"acknowledges_historical_cultural":1,"topography_register":1}},"393":{"id":393,"site":"cave","plat":"tripadvisor","rating":"3","text":"Apocalisse \n Revelation. Worth stopping by for the sacredness of the place. It's a cave over which a monastery has been built over the centuries. An atmosphere of deep spirituality, as this is the place where the Book of Revelation was written.","codes":{"religious_register":["doctrinal"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","review_is_useful":1,"topography_register":1}},"394":{"id":394,"site":"cave","plat":"tripadvisor","rating":"3","text":"Il faut y croire... \n You have to believe... After the monastery, this visit offers little of interest: a crack in a rock through which Saint John supposedly heard God. In my opinion, unless you're deeply motivated, it can easily be skipped during a visit to Patmos.","codes":{"religious_register":["doctrinal"],"mediation":"doubts","worth_assessment":"not_worth_it","tone_toward_constraints":"dismissive","review_is_useful":1,"coding_notes":"'supposedly heard God'","topography_register":1}},"400":{"id":400,"site":"cave","plat":"tripadvisor","rating":"5","text":"Very moving place \n Very moving place We were touched by our visit to the cave. In fact, I left with two of the icons - something I never buy. We had an excellent guide which helped us understand the site. I cannot believe that I had never heard of this site and I am so glad that we went there. Do make an effort to see this cave if you are in the area.","codes":{"mediation":"relays","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"devotional_participation":1,"topography_register":1}},"402":{"id":402,"site":"cave","plat":"tripadvisor","rating":"5","text":"Un lieu chargé \n A place full of meaning After visiting the Monastery, come down and recharge in this place of prayer and meditation that leaves no one indifferent. I return every year.","codes":{"town_hill_contrast":1,"religious_register":["conventional"],"worth_assessment":"worth_it","mimetic":1,"mimetic_engagement":"enacted","motivation_religious":1,"review_is_useful":1,"coding_notes":"'I return every year'; 'place of prayer and meditation' enacted"}},"403":{"id":403,"site":"cave","plat":"tripadvisor","rating":"5","text":"You will not be disappointed. \n You will not be disappointed. If you see one thing on Patmos, let it be this. But please be respectful of local traditions. One woman removed a barrier and entered the altar during a service, horrifying the locals and priests who were deep in prayer.","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional"],"worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"coding_notes":"anecdote of woman violating altar = insider defense of locals"}},"404":{"id":404,"site":"cave","plat":"tripadvisor","rating":"5","text":"Aγιος Τόπος \n Holy Land Words are not enough to describe the experience at this place. It is simply metaphysical. A plea to the numerous tour guides: please conduct your tours outside the Cave. Let the faithful have a moment of the precious silence that worship requires. Don't let everything be flattened on the altar of tourism. Have mercy!","codes":{"tourist_mode":"institutional_aware","religious_register":["conventional","mystical"],"worth_assessment":"worth_it","facility_complaints":["crowding"],"tone_toward_constraints":"frustrated","review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'simply metaphysical'; pleads for tour-guide quiet","atmospheric_register":1,"topography_register":1}},"405":{"id":405,"site":"cave","plat":"tripadvisor","rating":"3","text":"Delusione \n Disappointment It could perhaps be more mystical. Instead I found it to be a tourist spot exploited by those who speculate on faith.","codes":{"tourist_mode":"tourist_consumer","religious_register":["mystical"],"worth_assessment":"not_worth_it","facility_complaints":["commerce"],"tone_toward_constraints":"frustrated","review_is_useful":1,"coding_notes":"'speculate on faith' = commerce critique; expected mystical"}},"406":{"id":406,"site":"cave","plat":"tripadvisor","rating":"5","text":"Enchanting and beautiful. \n Enchanting and beautiful. A very special place. Atheist as I am, I got a very mystical and beautiful vibe here, and I had the good fortune to be here early and witness a service in the grotto. Well worth it for anyone interested in myths, legends, or for true believers of course. \nI recommend showing respect and covering your knees and shoulders, even if that is not what you believe in, you are a visitor in a holy place.","codes":{"religious_register":["mystical"],"worth_assessment":"worth_it","religious_self_id":"secular_atheist","tone_toward_constraints":"accepting","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"'Atheist as I am' explicit first-person atheist self-ID; mystical-but-secular vibe","topography_register":1}},"407":{"id":407,"site":"cave","plat":"tripadvisor","rating":"4","text":"Si eres creyente te encantará visitar este lugar pues fué donde San Juan escribió La Apocalipsis. Tiene mágia, \n If you are a believer you will love visiting this place, as it was where Saint John wrote the Book of Revelation. It has a certain magic. A typical pilgrimage site for believers. The cave itself is very small and not very appealing; the spot where the apostle is said to have written the book lacks real interest. The attached Byzantine church has some interest. Since it is a UNESCO World Heritage Site, you should visit it, but don't expect to find something wonderful or very mystical.","codes":{"religious_register":["doctrinal","mystical"],"enclosure_exposure":"enclosed","worth_assessment":"mixed","recognizes_heritage_protection":1,"review_is_useful":1,"coding_notes":"'a certain magic' mystical; UNESCO explicit; 'don't expect wonderful or mystical'","acknowledges_historical_cultural":1,"topography_register":1}},"409":{"id":409,"site":"cave","plat":"tripadvisor","rating":"5","text":"Necessary viewing for all Christians \n Necessary viewing for all Christians The Cave of the Apocalypse is a holy site for all Christians, regardless of denomination. Go and see where Saint John the Theologian received the Revelation from God and where he dictated the same to Saint Prochorus. \nThings to look for: the place where Saint John rested his head; the place where he placed his hand to steady himself; the place where God's voice split the ceiling in three; the icon of the Apocalypse (a reading of Scriptures would be useful in understanding the icon); the icon of Saint John dictating his Revelation to Saint Prochorus. \nMen and women should try to cover up from shoulder to ankle, as this is a holy site. There are spare covers that tourists may wear before entering. \nAs this is a Greek Orthodox Church, you will see Eastern Orthodox pilgrims crossing themselves, lighting candles, kissing holy icons and the Gospels. Occasionally there is an Orthodox priest there, and you will notice Orthodox faithful showing respect by kissing his hand. While I was there, the priest gave a very quick tour (in Greek); he was preparing for a service that afternoon. \nIf you wish to light a candle in prayer, it is best to give a small donation for the candle.","codes":{"religious_register":["conventional","doctrinal"],"mediation":"endorses","sensory_modalities":["vision"],"enclosure_exposure":"enclosed","worth_assessment":"worth_it","recognizes_active_institution":1,"review_is_useful":1,"quotable_for_chapter":1,"coding_notes":"tour-guide-style description; observes Orthodox devotional acts; written in third-person voice — held unspecified self-ID","topography_register":1}},"410":{"id":410,"site":"cave","plat":"tripadvisor","rating":"5","text":"Δεος - Δεος... !!! \n Awe - Awe... !!! It is one of the places every Christian should visit. Truly, the site fills you with a sense of awe...","codes":{"religious_register":["conventional"],"worth_assessment":"worth_it","review_is_useful":1}},"411":{"id":411,"site":"cave","plat":"tripadvisor","rating":"3","text":"Caverna onde São João escrev
